    return panel;
  }

  /* A labelled count list with a proportional bar behind each row. */
  function summaryCard(title, note, rows, emptyLabel) {
    const card = el('div', { class: 'card summary-card' });
    card.appendChild(el('h3', { class: 'sub-title' }, [L(title)]));
    card.appendChild(el('div', { class: 'summary-note' }, [L(note)]));

    if (!rows.length) {
      card.appendChild(el('div', { class: 'summary-empty' }, [L(emptyLabel)]));
      return card;
    }
    const max = Math.max(...rows.map((r) => r.count));
    const list = el('div', { class: 'summary-list' });
    rows.forEach((r) => {
      list.appendChild(
        el('div', { class: 'summary-row' }, [
          el('span', { class: 'summary-label', text: T(r.label) }),
          el('span', { class: 'summary-meter' }, [
            el('span', { class: 'summary-fill', style: `width:${(r.count / max) * 100}%` }),
          ]),
          el('span', { class: 'summary-count', text: String(r.count) }),
        ])
      );
    });
    card.appendChild(list);
    return card;
  }

  /* ---------------- Bar chart ----------------
     Built from plain elements, not a library: each bar is a real
     button, so it is keyboard reachable and screen-reader readable,
     and a table view sits behind a toggle for anyone who would rather
     read the numbers.

     Series colours were validated with the dataviz palette checker
     (lightness band, chroma, colour-blind separation, contrast) for
     both themes — hence two different pairs rather than one flipped. */

  const SERIES = [
    { key: 'machines', label: { en: 'Machines', th: 'จำนวนเครื่อง' }, varName: '--series-1' },
    { key: 'services', label: { en: 'Service visits', th: 'ครั้งที่เข้าบริการ' }, varName: '--series-2' },
  ];

  function niceCeil(v) {
    if (v <= 5) return Math.max(v, 1);
    const pow = Math.pow(10, Math.floor(Math.log10(v)));
    return Math.ceil(v / (pow / 2)) * (pow / 2);
  }

  /* rows: [{ id, label, sub, values: {machines, services}, onClick }] */
  function barChart(rows, opts) {
    const options = opts || {};
    const series = options.series || SERIES;
    const box = el('div', { class: 'chart' });

    if (!rows.length) {
      box.appendChild(el('div', { class: 'empty' }, [L(options.emptyLabel || UI.noRecords)]));
      return box;
    }

    /* Legend — always present for two or more series */
    if (series.length > 1) {
      const legend = el('div', { class: 'legend' });
      series.forEach((sr) => {
        legend.appendChild(
          el('span', { class: 'legend-item' }, [
            el('span', { class: 'legend-swatch', style: `background:var(${sr.varName})` }),
            L(sr.label),
          ])
        );
      });
      box.appendChild(legend);
    }

    const max = niceCeil(Math.max(1, ...rows.map((r) => Math.max(...series.map((sr) => r.values[sr.key] || 0)))));
    const ticks = 4;

    const plot = el('div', { class: 'chart-plot' });

    /* Recessive gridlines with their value on the axis */
    const grid = el('div', { class: 'chart-grid' });
    for (let i = 0; i <= ticks; i++) {
      const v = Math.round((max / ticks) * i);
      grid.appendChild(
        el('div', { class: 'grid-line', style: `bottom:${(i / ticks) * 100}%` }, [
          el('span', { class: 'grid-label', text: String(v) }),
        ])
      );
    }
    plot.appendChild(grid);

    const tip = chartTip();

    const track = el('div', { class: 'chart-track' });
    rows.forEach((row) => {
      const group = el('button', {
        class: 'bar-group' + (options.onSelect ? ' is-clickable' : ''),
        type: 'button',
        'aria-label': `${row.label}: ` + series.map((sr) => `${T(sr.label)} ${row.values[sr.key] || 0}`).join(', '),
        onclick: () => { if (options.onSelect) options.onSelect(row); },
        onmouseenter: (e) => showTip(e, row),
        onmousemove: (e) => showTip(e, row),
        onmouseleave: hideChartTip,
        onfocus: (e) => showTip(e, row),
        onblur: hideChartTip,
      });

      const bars = el('div', { class: 'bars' });
      series.forEach((sr) => {
        const v = row.values[sr.key] || 0;
        const h = max ? (v / max) * 100 : 0;
        bars.appendChild(
          el('span', { class: 'bar-slot' }, [
            el('span', { class: 'bar-value', text: v ? String(v) : '' }),
            el('span', {
              class: 'bar',
              style: `height:${h}%;--bar:var(${sr.varName})`,
            }),
          ])
        );
      });
      group.appendChild(bars);
      group.appendChild(el('span', { class: 'bar-label', text: row.label, title: row.label }));
      if (row.sub) group.appendChild(el('span', { class: 'bar-sub', text: row.sub }));
      track.appendChild(group);
    });

    function showTip(e, row) {
      tip.innerHTML = '';
      tip.appendChild(el('div', { class: 'tip-title', text: row.label }));
      if (row.sub) tip.appendChild(el('div', { class: 'tip-sub', text: row.sub }));
      series.forEach((sr) => {
        tip.appendChild(
          el('div', { class: 'tip-row' }, [
            el('span', { class: 'legend-swatch', style: `background:var(${sr.varName})` }),
            el('span', { class: 'tip-key', text: T(sr.label) }),
            el('span', { class: 'tip-val', text: String(row.values[sr.key] || 0) }),
          ])
        );
      });
      placeChartTip(tip, e.currentTarget.getBoundingClientRect());
    }

    plot.appendChild(track);
    box.appendChild(plot);

    /* Table view — the numbers, for anyone who wants them straight */
    const table = el('div', { class: 'table-wrap chart-table', style: 'display:none;margin-top:14px' });
    const t = el('table');
    t.appendChild(el('thead', {}, el('tr', {}, [
      el('th', {}, [L(options.dimensionLabel || { en: 'Name', th: 'ชื่อ' })]),
      ...series.map((sr) => el('th', {}, [L(sr.label)])),
    ])));
    const tb = el('tbody');
    rows.forEach((row) => {
      tb.appendChild(el('tr', {}, [
        el('td', { text: row.label + (row.sub ? ' · ' + row.sub : '') }),
        ...series.map((sr) => el('td', { text: String(row.values[sr.key] || 0) })),
      ]));
    });
    t.appendChild(tb);
    table.appendChild(t);

    const toggle = el('button', {
      class: 'btn btn-sm no-print',
      style: 'margin-top:12px',
      onclick: () => {
        const shown = table.style.display !== 'none';
        table.style.display = shown ? 'none' : '';
        toggle.textContent = shown ? T({ en: 'Show numbers', th: 'ดูเป็นตัวเลข' }) : T({ en: 'Hide numbers', th: 'ซ่อนตัวเลข' });
      },
      text: T({ en: 'Show numbers', th: 'ดูเป็นตัวเลข' }),
    });
    box.appendChild(toggle);
    box.appendChild(table);

    return box;
  }

  function typeCards() {
    const wrap = el('div', { class: 'stage-stack' });

    FORM_STAGES.forEach((stage) => {
      const forms = FORM_TYPES.filter((d) => d.stage === stage.key);
      if (!forms.length) return;

      const group = el('section', { class: 'stage', style: `--accent:${stage.accent}` });
      group.appendChild(
        el('header', { class: 'stage-head' }, [
          el('span', { class: 'stage-dot' }),
          el('div', {}, [
            el('div', { class: 'stage-title' }, [
              el('span', { class: 'label-en', text: stage.title.en }),
              el('span', { class: 'label-th th', text: stage.title.th }),
            ]),
            el('div', { class: 'stage-note' }, [
              el('span', { class: 'label-en', text: stage.note.en }),
              el('span', { class: 'label-th th', text: stage.note.th }),
            ]),
          ]),
        ])
      );

      const grid = el('div', { class: 'type-grid' });
      forms.forEach((def) => {
        grid.appendChild(
          el('button', { class: 'type-card', style: `--accent:${def.accent}`, onclick: () => createAndOpen(def.type) }, [
            el('div', { class: 'tc-icon' }, [icon(def.icon, 26)]),
            el('div', { class: 'tc-code', text: def.code + ' · ' + def.prefix }),
            el('div', { class: 'tc-name', text: def.name.en }),
            el('div', { class: 'tc-name-th', text: def.name.th }),
            def.blurb ? el('div', { class: 'tc-blurb', text: T(def.blurb) }) : null,
          ])
        );
      });
      group.appendChild(grid);
      wrap.appendChild(group);
    });

    return wrap;
  }

  function createAndOpen(type, prefill) {
    const rec = newRecord(type);
    if (prefill) Object.assign(rec.fields, prefill);
    db.records.push(rec);
    saveDB();
    go('form', { recordId: rec.id });
  }

  /* ---------------- View: New form picker ---------------- */

  function viewNewForm(root) {
    root.appendChild(
      el('div', { class: 'page-head' }, [
        el('div', {}, [
          el('h1', { class: 'page-title' }, [L({ en: 'New Form', th: 'สร้างเอกสารใหม่' })]),
          el('div', { class: 'page-sub' }, [
            L({
              en: 'Machine lifecycle: Build → FAT → SAT → Service',
              th: 'วงจรชีวิตเครื่องจักร: ประกอบ → ทดสอบที่โรงงานเรา → ทดสอบที่หน้างาน → บริการ',
            }),
          ]),
        ]),
      ])
    );
    root.appendChild(typeCards());
  }

  /* ---------------- View: Records ---------------- */

  /* Records filter. Kept outside the view so drilling into a record and
     coming back does not throw away what you narrowed down to. */
  const recFilter = { customer: '', machine: '', type: '', sort: 'date-desc' };

  const SORTS = [
    { key: 'date-desc',  label: { en: 'Date — newest first', th: 'วันที่ — ใหม่สุดก่อน' } },
    { key: 'date-asc',   label: { en: 'Date — oldest first', th: 'วันที่ — เก่าสุดก่อน' } },
    { key: 'doc-asc',    label: { en: 'Document no. — A to Z', th: 'เลขที่เอกสาร — ก-ฮ' } },
    { key: 'doc-desc',   label: { en: 'Document no. — Z to A', th: 'เลขที่เอกสาร — ฮ-ก' } },
    { key: 'machine-asc',label: { en: 'Machine name — A to Z', th: 'ชื่อเครื่องจักร — ก-ฮ' } },
    { key: 'customer-asc',label:{ en: 'Customer — A to Z', th: 'ลูกค้า — ก-ฮ' } },
  ];

  function sortRecords(list, key) {
    const by = (f) => (a, b) => {
      const x = String(f(a) || '').toLowerCase(), y = String(f(b) || '').toLowerCase();
      return x < y ? -1 : x > y ? 1 : 0;
    };
    const copy = list.slice();
    switch (key) {
      case 'date-asc':    return copy.sort(by((r) => primaryDate(r)));
      case 'doc-asc':     return copy.sort(by((r) => r.docNo));
      case 'doc-desc':    return copy.sort(by((r) => r.docNo)).reverse();
      case 'machine-asc': return copy.sort(by((r) => r.fields.machineName || 'zzz'));
      case 'customer-asc':return copy.sort(by((r) => r.fields.customer || 'zzz'));
      default:            return copy.sort(by((r) => primaryDate(r))).reverse();
    }
  }

  function viewRecords(root) {
    root.appendChild(
      el('div', { class: 'page-head' }, [
        el('div', {}, [
          el('h1', { class: 'page-title' }, [L({ en: 'All Records', th: 'เอกสารทั้งหมด' })]),
          el('div', { class: 'page-sub', text: db.records.length + ' total' }),
        ]),
        el('input', {
          class: 'search-input',
          placeholder: T(UI.search),
          value: state.search,
          oninput: (e) => { state.search = e.target.value; refresh(); },
        }),
      ])
    );

    const bar = el('div', { class: 'filter-bar', id: 'recFilterBar' });
    root.appendChild(bar);
    const holder = el('div', { id: 'recordsHolder' });
    root.appendChild(holder);

    drawBar();
    drawList();

    /* The search box is a live input — rebuilding it under the cursor
       would drop focus mid-word, so only the list is redrawn there. */
    function refresh() { drawList(); }
    function refreshAll() { drawBar(); drawList(); }

    /* ---- which options each dropdown should offer ----
       A cascade, and strictly in that order: customer, then their
       machines, then the documents that exist for that machine. Each
       level narrows the one below it and nothing narrows the level
       above.

       The first version filtered every dropdown by every OTHER filter,
       which reads as symmetrical and sounds tidier. It was a trap:
       choosing a machine cut the customer list down to that machine's
       one owner, so there was no way to switch customer again without
       clearing everything. Its own test could not reach the third
       customer and timed out. */
    function optionsFor(field) {
      const seen = new Map();
      db.records.forEach((r) => {
        if (field !== 'customer' && recFilter.customer && r.fields.customer !== recFilter.customer) return;
        if (field === 'type' && recFilter.machine && r.fields.machineName !== recFilter.machine) return;
        const v = field === 'customer' ? r.fields.customer
                : field === 'machine'  ? r.fields.machineName
                : r.type;
        if (!v) return;
        seen.set(v, (seen.get(v) || 0) + 1);
      });
      return [...seen.entries()].sort((a, b) => (a[0] < b[0] ? -1 : 1));
    }

    function passes(r) {
      if (recFilter.customer && r.fields.customer !== recFilter.customer) return false;
      if (recFilter.machine  && r.fields.machineName !== recFilter.machine) return false;
      if (recFilter.type     && r.type !== recFilter.type) return false;
      return true;
    }

    function select(field, labelText, placeholder, opts, render) {
      const sel = el('select', { class: 'filter-select' });
      sel.appendChild(el('option', { value: '', text: T(placeholder) }));
      opts.forEach(([value, count]) => {
        const o = el('option', { value, text: render(value) + '  (' + count + ')' });
        if (recFilter[field] === value) o.selected = true;
        sel.appendChild(o);
      });
      sel.addEventListener('change', () => {
        recFilter[field] = sel.value;
        /* Moving up the cascade can strand what was chosen below it —
           another customer's machine, or a document type that machine
           has none of. Drop the stranded choice rather than leaving the
           technician staring at an empty list they cannot explain. */
        if (field === 'customer' && recFilter.machine) {
          const still = db.records.some((r) =>
            r.fields.machineName === recFilter.machine &&
            (!recFilter.customer || r.fields.customer === recFilter.customer));
          if (!still) recFilter.machine = '';
        }
        if ((field === 'customer' || field === 'machine') && recFilter.type) {
          if (!db.records.some((r) => r.type === recFilter.type
              && (!recFilter.customer || r.fields.customer === recFilter.customer)
              && (!recFilter.machine  || r.fields.machineName === recFilter.machine))) {
            recFilter.type = '';
          }
        }
        refreshAll();
      });
      return el('label', { class: 'filter-field' + (recFilter[field] ? ' is-set' : '') }, [
        el('span', { class: 'filter-label' }, [L(labelText)]),
        sel,
      ]);
    }

    function drawBar() {
      bar.innerHTML = '';

      bar.appendChild(select('customer',
        { en: 'Customer', th: 'ลูกค้า' },
        { en: 'All customers', th: 'ลูกค้าทั้งหมด' },
        optionsFor('customer'), (v) => v));

      bar.appendChild(select('machine',
        { en: 'Machine', th: 'เครื่องจักร' },
        { en: 'All machines', th: 'เครื่องจักรทั้งหมด' },
        optionsFor('machine'), (v) => v));

      bar.appendChild(select('type',
        { en: 'Document', th: 'ประเภทเอกสาร' },
        { en: 'All documents', th: 'เอกสารทุกประเภท' },
        optionsFor('type'),
        (v) => FORM_BY_TYPE[v] ? FORM_BY_TYPE[v].prefix + ' · ' + T(FORM_BY_TYPE[v].name) : v));

      const sortSel = el('select', { class: 'filter-select' });
      SORTS.forEach((s) => {
        const o = el('option', { value: s.key, text: T(s.label) });
        if (recFilter.sort === s.key) o.selected = true;
        sortSel.appendChild(o);
      });
      sortSel.addEventListener('change', () => { recFilter.sort = sortSel.value; drawList(); });
      bar.appendChild(el('label', { class: 'filter-field' }, [
        el('span', { class: 'filter-label' }, [L({ en: 'Sort by', th: 'เรียงตาม' })]),
        sortSel,
      ]));

      const active = !!(recFilter.customer || recFilter.machine || recFilter.type || state.search.trim());
      if (active) {
        bar.appendChild(el('button', {
          class: 'filter-clear',
          onclick: () => {
            recFilter.customer = recFilter.machine = recFilter.type = '';
            state.search = '';
            render();
          },
        }, [L({ en: 'Clear', th: 'ล้างตัวกรอง' })]));
      }
    }

    function currentList() {
      const q = state.search.trim().toLowerCase();
      let list = db.records.filter(passes);
      if (q) {
        list = list.filter((r) => {
          const hay = [r.docNo, r.fields.workNo, r.fields.serialNo, r.fields.customer,
                       r.fields.machineName, T(FORM_BY_TYPE[r.type] ? FORM_BY_TYPE[r.type].name : {})]
            .join(' ').toLowerCase();
          return hay.includes(q);
        });
      }
      return sortRecords(list, recFilter.sort);
    }

    function drawList() {
      const list = currentList();
      holder.innerHTML = '';

      const count = el('div', { class: 'filter-count' });
      if (list.length === db.records.length) {
        count.appendChild(L({ en: `Showing all ${list.length}`, th: `แสดงทั้งหมด ${list.length} รายการ` }));
      } else {
        count.appendChild(L({
          en: `Showing ${list.length} of ${db.records.length}`,
          th: `แสดง ${list.length} จาก ${db.records.length} รายการ`,
        }));
      }
      holder.appendChild(count);

      if (!list.length) {
        holder.appendChild(el('div', { class: 'empty' }, [
          L({ en: 'Nothing matches these filters.', th: 'ไม่พบเอกสารตามตัวกรองนี้' }),
        ]));
      } else {
        holder.appendChild(recordTable(list));
      }
      stampTableLabels(holder);
    }
  }

  function recordTable(list) {
    const wrap = el('div', { class: 'table-wrap' });
    const table = el('table');
    table.appendChild(
      el('thead', {}, el('tr', {}, [
        el('th', { text: 'Doc No.' }),
        el('th', { text: 'Type' }),
        el('th', { text: 'Work No.' }),
        el('th', { text: 'Machine / Customer' }),
        el('th', { text: 'Date' }),
        el('th', { text: 'Progress' }),
        el('th', { text: 'Status' }),
      ]))
    );
    const tbody = el('tbody');
    list.forEach((r) => {
      const def = FORM_BY_TYPE[r.type];
      if (!def) return;
      const p = recordProgress(r);
      const meta = resultMeta(r);
      tbody.appendChild(
        el('tr', { class: 'clickable', onclick: () => go('form', { recordId: r.id }) }, [
          el('td', { html: `<strong>${escapeHTML(r.docNo)}</strong>` }),
          el('td', {}, el('span', { class: 'type-badge', style: `--accent:${def.accent}` }, [icon(def.icon, 14), el('span', { text: def.prefix })])),
          el('td', { text: r.fields.workNo || '—' }),
          el('td', {
            html:
              escapeHTML(r.fields.machineName || '—') +
              `<div style="font-size:12px;color:var(--text-dim)">${escapeHTML(r.fields.customer || '')}</div>`,
          }),
          el('td', { text: fmtDate(primaryDate(r)) }),
          el('td', { html: p.total ? `${p.done}/${p.total}` : '—' }),
          el('td', {}, el('span', { class: 'pill ' + pillClassFor(r), text: meta ? T(meta.label) : T(UI.draft) })),
        ])
      );
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    return wrap;
  }

  function primaryDate(r) {
    const f = r.fields || {};
    /* createdAt has always been a string in practice, but a record that
       arrives missing it (a partial write, an older export, a stub that
       slipped through) must not take the whole Records page down over a
       date. Fall back to updatedAt, then to nothing. */
    return f.inspectionDate || f.serviceDate || f.commissionDate || f.buildDate
      || String(r.createdAt || r.updatedAt || '').slice(0, 10);
  }

  function escapeHTML(s) {
    return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, (c) => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
  }

  /* ---------------- View: Machines ---------------- */

  function viewMachines(root) {
    const all = machineList();

    /* Filters are plain selects on purpose: on a tablet a native
       picker is faster and more reliable than any custom dropdown. */
    const customers = Array.from(new Set(all.map((m) => m.customer || '—'))).sort();
    if (state.filterCustomer && !customers.includes(state.filterCustomer)) state.filterCustomer = null;

    const byCustomer = state.filterCustomer
      ? all.filter((m) => (m.customer || '—') === state.filterCustomer)
      : all;

    if (state.filterMachine && !byCustomer.some((m) => m.key === state.filterMachine)) state.filterMachine = null;

    root.appendChild(
      el('div', { class: 'page-head' }, [
        el('div', {}, [
          el('h1', { class: 'page-title' }, [L({ en: 'Machines', th: 'เครื่องจักร' })]),
          el('div', { class: 'page-sub' }, [
            L({ en: 'Pick a customer, then a machine. Tap any service count to see the visits behind it.',
                th: 'เลือกลูกค้า แล้วเลือกเครื่องจักร แตะที่จำนวนครั้งบริการเพื่อดูรายละเอียดการเข้าบริการ' }),
          ]),
        ]),
      ])
    );

    /* ---- filter bar ---- */
    const bar = el('div', { class: 'filter-bar' });

    const custSel = el('select', {
      class: 'filter-select',
      onchange: (e) => { state.filterCustomer = e.target.value || null; state.filterMachine = null; render(); },
    });
    custSel.appendChild(el('option', { value: '', text: T({ en: 'All customers', th: 'ลูกค้าทั้งหมด' }) }));
    customers.forEach((c) => {
      const count = all.filter((m) => (m.customer || '—') === c).length;
      const o = el('option', { value: c, text: `${c}  (${count})` });
      if (state.filterCustomer === c) o.selected = true;
      custSel.appendChild(o);
    });

    const machSel = el('select', {
      class: 'filter-select',
      onchange: (e) => { state.filterMachine = e.target.value || null; render(); },
    });
    machSel.appendChild(el('option', { value: '', text: T({ en: 'All machines', th: 'เครื่องจักรทั้งหมด' }) }));
    byCustomer.forEach((m) => {
      const o = el('option', { value: m.key, text: `${m.workNo || '—'} · ${m.machineName || m.serialNo || '—'}` });
      if (state.filterMachine === m.key) o.selected = true;
      machSel.appendChild(o);
    });

    bar.appendChild(el('label', { class: 'filter-field' }, [
      el('span', { class: 'filter-label' }, [L({ en: 'Customer', th: 'ลูกค้า' })]), custSel,
    ]));
    bar.appendChild(el('label', { class: 'filter-field' }, [
      el('span', { class: 'filter-label' }, [L({ en: 'Machine', th: 'เครื่องจักร' })]), machSel,
    ]));
    if (state.filterCustomer || state.filterMachine) {
      bar.appendChild(el('button', {
        class: 'btn btn-sm', style: 'align-self:flex-end',
        onclick: () => { state.filterCustomer = null; state.filterMachine = null; render(); },
      }, [L({ en: 'Clear', th: 'ล้างตัวกรอง' })]));
    }
    root.appendChild(bar);

    const shown = state.filterMachine ? byCustomer.filter((m) => m.key === state.filterMachine) : byCustomer;

    if (!shown.length) {
      root.appendChild(el('div', { class: 'empty' }, [
        L({ en: 'No machines match. Fill in Work No. and Serial No. on a form to register one.',
            th: 'ไม่พบเครื่องจักรที่ตรงกับตัวกรอง กรอกเลขที่งานและหมายเลขเครื่องในเอกสารเพื่อลงทะเบียน' }),
      ]));
      return;
    }

    /* One machine chosen — show it in full rather than as a table row */
    if (shown.length === 1 && state.filterMachine) {
      root.appendChild(machineDetailCard(shown[0]));
      return;

    const wrap = el('div', { class: 'table-wrap' });

  /* ---------------- Record manager (Developer) ----------------
     Direct control over the shared database from one place: see every
     record, open one to edit it, or delete any of them — including a
     stray record no normal screen will show. A delete here is the same
     tombstone the record menu makes, so it travels to every device. */
  let manageQuery = '';

  function recordManager() {
    const card = el('div', { class: 'card', style: 'margin-top:16px' });

    card.appendChild(el('h2', { style: 'font-size:16px;margin:0 0 4px' }, [
      L({ en: 'Manage records', th: 'จัดการข้อมูล' }),
    ]));
    card.appendChild(el('div', { class: 'page-sub', style: 'margin-bottom:14px' }, [
      L({
        en: 'Open any record to edit it, or delete it here. Deletes sync to every device.',
        th: 'เปิดเพื่อแก้ไข หรือลบได้ที่นี่ การลบจะซิงก์ไปทุกเครื่อง',
      }),
    ]));

    const search = el('input', {
      type: 'text',
      class: 'search-input',
      placeholder: T({ en: 'Search doc no, machine, customer…', th: 'ค้นหาเลขที่เอกสาร เครื่องจักร ลูกค้า…' }),
      value: manageQuery,
      style: 'width:100%;margin-bottom:12px',
    });
    search.addEventListener('input', () => {
      manageQuery = search.value;
      const body = card.querySelector('.manage-body');
      if (body) { body.innerHTML = ''; body.appendChild(manageList()); }
    });
    card.appendChild(search);

    const body = el('div', { class: 'manage-body' });
    body.appendChild(manageList());
    card.appendChild(body);
    return card;
  }

  function manageList() {
    const q = manageQuery.trim().toLowerCase();
    const all = db.records.slice().sort((a, b) => (primaryDate(b) > primaryDate(a) ? 1 : -1));
    const list = q ? all.filter((r) => {
      const def = FORM_BY_TYPE[r.type];
      const hay = [r.docNo, r.fields && r.fields.workNo, r.fields && r.fields.serialNo,
                   r.fields && r.fields.customer, r.fields && r.fields.machineName,
                   def ? T(def.name) : r.type].join(' ').toLowerCase();
      return hay.includes(q);
    }) : all;

    const wrap = el('div', {});
    wrap.appendChild(el('div', { class: 'filter-count', style: 'margin-bottom:8px' }, [
      L({ en: `${list.length} of ${all.length} records`, th: `${list.length} จาก ${all.length} รายการ` }),
    ]));

    if (!list.length) {
      wrap.appendChild(el('div', { class: 'empty' }, [L({ en: 'No records match.', th: 'ไม่พบรายการ' })]));
      return wrap;
    }

    const table = el('table');
    table.appendChild(el('thead', {}, el('tr', {}, [
      el('th', { text: T({ en: 'Doc No.', th: 'เลขที่' }) }),
      el('th', { text: T({ en: 'Machine / Customer', th: 'เครื่องจักร / ลูกค้า' }) }),
      el('th', { text: T({ en: 'Updated', th: 'แก้ไขล่าสุด' }) }),
      el('th', { text: '' }),
    ])));
    const tb = el('tbody');
    list.forEach((r) => {
      const def = FORM_BY_TYPE[r.type];
      /* Show a record even if its type is unknown — this panel is exactly
         where a stray record should be reachable so it can be removed. */
      const typeLabel = def ? def.prefix : (r.type || '?');
      const f = r.fields || {};
      const openBtn = el('button', { class: 'btn btn-sm', onclick: () => go('form', { recordId: r.id }) },
        [L({ en: 'Open', th: 'เปิด' })]);
      const delBtn = el('button', { class: 'btn btn-sm btn-danger', onclick: () => manageDelete(r) },
        [L({ en: 'Delete', th: 'ลบ' })]);
      tb.appendChild(el('tr', {}, [
        el('td', { html: `<strong>${escapeHTML(r.docNo || r.id)}</strong>`
          + `<div style="font-size:11px;color:var(--text-dim)">${escapeHTML(typeLabel)}</div>` }),
        el('td', {
          html: escapeHTML(f.machineName || '—')
            + `<div style="font-size:12px;color:var(--text-dim)">${escapeHTML(f.customer || '')}</div>`,
        }),
        el('td', { text: fmtDate(primaryDate(r)) }),
        el('td', {}, el('div', { style: 'display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap' }, [openBtn, delBtn])),
      ]));
    });
    table.appendChild(tb);
    wrap.appendChild(el('div', { class: 'table-wrap' }, [table]));
    return wrap;
  }

  function manageDelete(rec) {
    const msg = lang === 'th'
      ? ('ลบ ' + (rec.docNo || rec.id) + ' ออกจากทุกเครื่อง? การลบจะซิงก์ไปยังฐานข้อมูลกลาง')
      : ('Delete ' + (rec.docNo || rec.id) + ' from every device? This delete syncs to the shared database.');
    if (!confirm(msg)) return;
    tombstoneRecord(rec);
    toast((lang === 'th' ? 'ลบแล้ว ' : 'Deleted ') + (rec.docNo || rec.id));
    render();
  }

  function viewDataLocked(root) {
    root.appendChild(
      el('div', { class: 'page-head' }, [
        el('div', {}, [
          el('h1', { class: 'page-title' }, [L({ en: 'Backup & Restore', th: 'สำรองและกู้คืนข้อมูล' })]),
          el('div', { class: 'page-sub' }, [
            L({ en: 'Sign in to reach export, import and erase.', th: 'เข้าสู่ระบบเพื่อใช้งานส่งออก นำเข้า และลบข้อมูล' }),
          ]),
        ]),
      ])
    );

    const err = el('div', { class: 'alert-danger', style: 'display:none' });
    const userInput = el('input', { type: 'text', autocomplete: 'username', placeholder: 'Developer' });
    const passInput = el('input', { type: 'password', autocomplete: 'current-password', placeholder: '••••••••' });

    let busy = false;
    function attempt() {
      if (busy) return;
      const u = userInput.value || '';
      const p = passInput.value || '';
      if (!u || !p) return;
      busy = true;
      /* A short pause takes the speed out of guessing by hand */
      setTimeout(() => {
        busy = false;
        if (checkCredentials(u, p)) {
          setUnlocked(true);
          toast(lang === 'th' ? 'เข้าสู่ระบบแล้ว' : 'Unlocked');
          render();
        } else {
          err.style.display = '';
          err.textContent = lang === 'th'
            ? 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง'
            : 'Wrong user name or password.';
          passInput.value = '';
          passInput.focus();
        }
      }, 350);
    }

    [userInput, passInput].forEach((inp) => {
      inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') attempt(); });
    });

    root.appendChild(
      el('div', { class: 'lock-wrap' }, [
        el('div', { class: 'card lock-card' }, [
          el('div', { class: 'lock-icon', text: '🔒' }),
          el('h2', { class: 'lock-title' }, [L({ en: 'Developer access', th: 'สำหรับผู้ดูแลระบบ' })]),
          el('p', { class: 'lock-sub' }, [
            L({
              en: 'Backup, restore and erase act on the shared database — every tablet.',
              th: 'สำรอง กู้คืน และลบข้อมูล มีผลกับฐานข้อมูลกลาง — ทุกเครื่อง',
            }),
          ]),
          err,
          el('div', { class: 'field', style: 'margin-bottom:12px' }, [
            el('label', {}, [L({ en: 'User name', th: 'ชื่อผู้ใช้' })]),
            userInput,
          ]),
          el('div', { class: 'field', style: 'margin-bottom:16px' }, [
            el('label', {}, [L({ en: 'Password', th: 'รหัสผ่าน' })]),
            passInput,
          ]),
          el('button', { class: 'btn btn-primary lock-btn', onclick: attempt }, [
            L({ en: 'Unlock', th: 'ปลดล็อก' }),
          ]),
          el('p', { class: 'lock-note' }, [
            L({
              en: 'This gate prevents accidents. It is not security — anyone who can open the app can unlock it.',
              th: 'ระบบนี้ป้องกันการกดผิดพลาดเท่านั้น ไม่ใช่ระบบความปลอดภัย ใครที่เปิดแอปได้ก็ปลดล็อกได้',
            }),
          ]),
        ]),
      ])
    );
    setTimeout(() => userInput.focus(), 40);
  }

  function download(filename, content, mime) {
    const blob = new Blob([content], { type: mime || 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = el('a', { href: url, download: filename });
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }

  function exportJSON() {
    download(`fn-machine-care-backup-${todayISO()}.json`, JSON.stringify(db, null, 2), 'application/json');
    toast(lang === 'th' ? 'ส่งออกไฟล์สำรองแล้ว' : 'Backup exported');
  }

  function exportCSV() {
    const rows = [['Doc No', 'Type', 'Work No', 'Serial No', 'Machine', 'Customer', 'Date', 'Status', 'Result', 'Failed items']];
    db.records.forEach((r) => {
      const def = FORM_BY_TYPE[r.type];
      if (!def) return;
      const meta = resultMeta(r);
      rows.push([
        r.docNo, def.prefix, r.fields.workNo || '', r.fields.serialNo || '',
        r.fields.machineName || '', r.fields.customer || '', primaryDate(r), r.status,
        meta ? meta.label.en : '', failedItems(r).map((f) => f.item.code).join(' '),
      ]);
    });
    const csv = rows.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\r\n');
    download(`fn-machine-care-summary-${todayISO()}.csv`, '﻿' + csv, 'text/csv;charset=utf-8');
  }

  /* Apply a parsed backup to the database as a FORCE OVERWRITE.
     ────────────────────────────────────────────────────────────
     The backup is treated as the source of truth: every record in it
     overwrites the shared copy on EVERY device, whether or not a newer
     edit exists elsewhere. Nothing is deleted — records the file does not
     mention are left untouched.

     How the overwrite reaches the other tablets: sync decides who wins by
     updatedAt (newest wins). So to make the backup win everywhere, each
     restored record is stamped as freshly updated, right now. That single
     stamp is what lets a year-old backup push itself back over whatever is
     currently in the database. The record's own dates (inspection date,
     created date, …) are NOT touched — only the sync timestamp that
     settles conflicts. Returns the number of records written. */
  function restoreFromBackup(data) {
    if (!data || !Array.isArray(data.records)) throw new Error('bad format');
    const stamp = new Date().toISOString();
    const byId = new Map(db.records.map((r) => [r.id, r]));
    let written = 0;
    data.records.forEach((raw) => {
      /* A backup exported after a cloud round trip is missing the same
         empty containers Firebase dropped — normalise on the way in. */
      const rec = normaliseRecord(raw);
      if (!rec || !rec.id) return;

      rec.updatedAt = stamp;                         // assert authority (newest wins)

      /* A restored record outranks an earlier deletion — clear any
         tombstone so it comes back and stays back instead of being
         re-deleted a second later. */
      if (db.meta.tombstones && db.meta.tombstones[rec.id]) delete db.meta.tombstones[rec.id];

      const mine = byId.get(rec.id);
      if (mine) {
        /* Overwrite in place — an open form may hold this exact object,
           so replacing the reference would orphan its field handlers. */
        Object.keys(mine).forEach((k) => { if (!(k in rec)) delete mine[k]; });
        Object.assign(mine, rec);
      } else {
        db.records.push(rec);
        byId.set(rec.id, rec);
      }
      written++;
    });

    db.meta.peopleSeeded = false;   /* pick up names from the imported records */
    people();
    saveDB();                       // persists locally AND pushes every stamped record up
    return written;
  }

  function importJSON(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data || !Array.isArray(data.records)) throw new Error('bad format');
        const count = data.records.filter((r) => r && r.id).length;
        const warn = lang === 'th'
          ? ('กู้คืน ' + count + ' รายการจากไฟล์นี้ทับข้อมูลบนทุกเครื่อง? '
             + 'รายการที่ชื่อซ้ำจะถูกเขียนทับด้วยข้อมูลในไฟล์ (ไม่มีการลบรายการอื่น)')
          : ('Restore ' + count + ' records from this file and overwrite them on every device? '
             + 'Existing records with the same ID will be replaced by the file’s version. Nothing else is deleted.');
        if (!window.confirm(warn)) { e.target.value = ''; return; }
        const written = restoreFromBackup(data);
        toast((lang === 'th' ? 'กู้คืนแล้ว ' : 'Restored ') + written + (lang === 'th' ? ' รายการ' : ' records'));
        render();
      } catch (err) {
        toast(lang === 'th' ? 'ไฟล์ไม่ถูกต้อง' : 'Invalid backup file', true);
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  }

  function wipeAll() {
    const msg = lang === 'th'
      ? 'ลบข้อมูลทั้งหมดออกจากทุกเครื่องอย่างถาวร? ควรส่งออกไฟล์สำรองก่อน'
      : 'Permanently erase ALL data on EVERY device? Export a backup first.';
    if (!confirm(msg)) return;
    if (!confirm(lang === 'th'
      ? 'ยืนยันอีกครั้ง — ข้อมูลจะถูกลบจากทุกเครื่องและกู้คืนไม่ได้ (ยกเว้นมีไฟล์สำรอง)'
      : 'Confirm again — this erases every record on all tablets and cannot be undone (unless you have a backup file).')) return;

    /* An erase has to travel like a delete, or it does nothing and worse:
       clearing the records here leaves the shared database untouched, and
       the next snapshot pours every record straight back — the erase
       undoes itself, on this tablet too. So erase leaves a tombstone for
       EVERY record (the same marker a single delete makes), which is what
       carries the erase to every device and keeps the records from
       reappearing. A backup file is the only way back, which is why the
       confirmations push toward exporting one first. */
    const stamp = new Date().toISOString();
    db.meta = db.meta || { version: 1, counters: {} };
    db.meta.tombstones = db.meta.tombstones || {};
    db.records.forEach((r) => {
      if (r && r.id) db.meta.tombstones[r.id] = { type: r.type, docNo: r.docNo, updatedAt: stamp };
    });
    db.records = [];
    db.meta.people = [];
    db.meta.peopleSeeded = false;
    saveDB();   // pushes every tombstone up; other tablets drop their records
    toast(lang === 'th' ? 'ลบข้อมูลทั้งหมดแล้ว' : 'All data erased');
    go('dashboard');
  }

  function touch(rec) {
    rec.updatedAt = new Date().toISOString();
    saveDB();
  }

  /* Leave a marker, not a hole.

     Simply removing the record from the shared database tells the other
     tablets nothing: they are holding a copy that nothing ever
     contradicts, so it stays on their screen — and the next time one of
     them reconnects it uploads that copy again and the document comes
     back from the dead. A tablet that was switched off during the delete
     can only ever learn about it from something that is still there when
     it wakes up.

     So a deletion is a small record of its own — id, type, docNo and the
     moment it happened — which travels like any other change and is
     settled by the same last-write-wins rule. saveDB() pushes it. */
  function tombstoneRecord(rec) {
    db.meta.tombstones = db.meta.tombstones || {};
    db.meta.tombstones[rec.id] = {
      type: rec.type,
      docNo: rec.docNo,
      updatedAt: new Date().toISOString(),
    };
    db.records = db.records.filter((r) => r.id !== rec.id);
    saveDB();
  }

  function deleteRecord(rec) {
    if (!confirm(T(UI.confirmDelete))) return;
    tombstoneRecord(rec);
    go('records');
  }

  /* ---- Section dispatcher ---- */

  function renderSection(rec, def, section) {
    const box = el('section', { class: 'section' + (section.critical ? ' critical' : ''), id: 'sec-' + section.id });

    const head = el('header', {}, [
      el('div', { class: 'section-title' }, [
        el('div', { class: 'label-en', text: section.title.en }),
        el('div', { class: 'label-th th', text: section.title.th }),
      ]),
    ]);
    const prog = sectionProgress(rec, section);
    if (prog) {
      const bar = el('div', { class: 'progress-bar' }, el('div', {
        class: 'progress-fill',

      }));
      head.appendChild(el('div', { class: 'section-progress' }, [el('span', { text: `${prog.done}/${prog.total}` }), bar]));
    }
    box.appendChild(head);

    const body = el('div', { class: 'section-body' });
    if (section.hint) body.appendChild(el('div', { class: 'hint' }, [L(section.hint)]));

    const renderers = {
      fields: renderFields,
      checklist: renderChecklist,
      condition: renderChecklist,
      measurements: renderMeasurements,
      performance: renderPerformance,
      documents: renderDocuments,
      photos: renderPhotos,
      beforeafter: renderBeforeAfter,
      table: renderTable,
      costtable: renderCostTable,
      notes: renderNotes,
      problem: renderProblem,
      rootcause: renderRootCause,
      result: renderResult,
      signoff: renderSignoff,
    };

  /* ---- fields ---- */

  function renderFields(body, rec, def, section) {
    const grid = el('div', { class: 'field-grid' });
    section.fields.forEach((f) => {
      const wrap = el('div', { class: 'field', 'data-field': f.key });
      wrap.appendChild(el('label', {}, [
        L(f.label),
        f.required ? el('span', { class: 'req', text: ' *' }) : null,
        f.unit ? el('span', { class: 'unit', text: '(' + f.unit + ')' }) : null,
      ]));

      let input;

      if (f.type === 'person') {
        input = personField(rec, f, wrap);

      } else if (f.type === 'select') {
        input = el('select', {
          onchange: (e) => { rec.fields[f.key] = e.target.value; touch(rec); markField(wrap, rec, f); },
        });
        input.appendChild(el('option', { value: '', text: '—' }));
        f.options.forEach((o) => {
          const opt = el('option', { value: o.value, text: T(o.label) });
          if (rec.fields[f.key] === o.value) opt.selected = true;
          input.appendChild(opt);
        });

      } else if (f.type === 'date') {
        input = dateField({
          value: rec.fields[f.key] || '',
          onCommit: (iso) => {
            rec.fields[f.key] = iso;
            if (f.identity) autofillIdentity(rec, f.key, iso);
            touch(rec);
            markField(wrap, rec, f);
          },
        });

      } else {
        input = el('input', {
          type: f.type || 'text',
          placeholder: f.placeholder || '',
          value: rec.fields[f.key] || '',
          step: f.type === 'number' ? 'any' : null,
          oninput: (e) => { rec.fields[f.key] = e.target.value; markField(wrap, rec, f); },
          onchange: (e) => {
            rec.fields[f.key] = e.target.value;
            if (f.identity) autofillIdentity(rec, f.key, e.target.value);
            touch(rec);
            markField(wrap, rec, f);
          },
        });

        /* Suggestions from prior entries. A native <datalist> used to do
           this, but its dropdown does not show on iPhone/iPad and most
           mobile browsers — the technician got a plain box with no way to
           pick. This is a custom, touch-friendly picker instead; a
           brand-new value is still allowed. */
        if (f.suggest) {
          input = attachSuggest(input, wrap, rec, f);
        }
      }

      wrap.appendChild(input);
      markField(wrap, rec, f);
      grid.appendChild(wrap);
    });
    body.appendChild(grid);
  }

  /* Touch-friendly suggestion picker for text fields — replaces the native
     <datalist>, whose dropdown does not appear on phones and tablets. Tap
     the field (or its caret) to see values entered before, type to filter,
     tap one to fill it in; typing a brand-new value is always allowed.
     The list is hung on <body> (positioned like the chart tooltip) so the
     section card's overflow:hidden can't clip it. Returns a combobox
     wrapper, or the plain input when there is nothing to suggest yet. */
  function attachSuggest(input, wrap, rec, f) {
    const values = suggestionsFor(f.key);
    if (!values.length) return input;

    input.setAttribute('autocomplete', 'off');
    input.setAttribute('role', 'combobox');
    input.setAttribute('aria-autocomplete', 'list');
    input.setAttribute('aria-expanded', 'false');

    const combo = el('div', { class: 'combo' });
    const caret = el('button', {
      class: 'combo-caret', type: 'button', tabindex: '-1',
      'aria-label': T({ en: 'Show suggestions', th: 'แสดงรายการที่เคยกรอก' }),
    }, ['⌄']);
    const pop = el('div', { class: 'combo-pop', role: 'listbox' });

    let open = false;

    function reposition() {
      pop.style.width = input.offsetWidth + 'px';
      placeFloating(pop, input.getBoundingClientRect(), { below: true, align: 'start', gap: 5 });
    }
    const onScroll = () => close();
    function setOpen(v) {
      if (v === open) { if (v) reposition(); return; }
      open = v;
      input.setAttribute('aria-expanded', v ? 'true' : 'false');
      combo.classList.toggle('is-open', v);
      if (v) {
        document.body.appendChild(pop);
        reposition();
        window.addEventListener('scroll', onScroll, true);
        window.addEventListener('resize', onScroll);
      } else {
        if (pop.parentNode) pop.parentNode.removeChild(pop);
        window.removeEventListener('scroll', onScroll, true);
        window.removeEventListener('resize', onScroll);
      }
    }
    function close() { setOpen(false); }

    function choose(v) {
      input.value = v;
      rec.fields[f.key] = v;
      close();
      if (f.identity) autofillIdentity(rec, f.key, v);
      touch(rec);
      markField(wrap, rec, f);
    }

    function build() {
      const q = (input.value || '').trim().toLowerCase();
      const hasVal = (input.value || '').trim() !== '';
      /* Skip a match that is exactly what's already typed — no point. */
      const matches = values.filter((v) => (!q || v.toLowerCase().indexOf(q) !== -1) && v.toLowerCase() !== q);
      pop.innerHTML = '';

      /* A "None" row at the top clears the field back to empty — only
         worth showing when there is something to clear. mousedown +
         preventDefault (not click) keeps focus on the input so blur never
         fires before the pick is handled — the trick that makes this work
         the same on a touchscreen. */
      if (hasVal) {
        pop.appendChild(el('div', {
          class: 'combo-opt combo-clear', role: 'option',
          onmousedown: (e) => { e.preventDefault(); choose(''); },
        }, [T({ en: 'None (clear)', th: 'ไม่ระบุ (ล้างค่า)' })]));
      }

      matches.slice(0, 60).forEach((v) => {
        pop.appendChild(el('div', {
          class: 'combo-opt', role: 'option',
          onmousedown: (e) => { e.preventDefault(); choose(v); },
        }, [v]));
      });

      if (!pop.children.length) { close(); return; }
      setOpen(true);
    }

    input.addEventListener('focus', build);
    input.addEventListener('input', build);
    input.addEventListener('blur', () => setTimeout(close, 60));
    input.addEventListener('keydown', (e) => { if (e.key === 'Escape' && open) { e.stopPropagation(); close(); } });
    caret.addEventListener('mousedown', (e) => {
      e.preventDefault();
      if (open) { close(); return; }
      input.focus();
      build();
    });

    combo.appendChild(input);
    combo.appendChild(caret);
    return combo;
  }

  /* Choose a person, see their position, or add someone new. */
  function personField(rec, f, wrap) {

    const note = el('div', { class: 'person-note' });

      sel.innerHTML = '';

    refresh();

    holder.appendChild(note);

  /* Choosing one known identity value fills in the rest. */
  function autofillIdentity(rec, key, value) {
    const match = machineMatching(key, value, rec.id);
    if (!match) return;
    let filled = 0;
    IDENTITY_KEYS.forEach((k) => {
      if (k === key) return;
      const from = (match.fields[k] || '').trim();
      if (!from) return;
      if ((rec.fields[k] || '').trim() === from) return;
      rec.fields[k] = from;
      filled++;
    });
    if (filled) {
      touch(rec);
      toast(T({ en: 'Machine details filled in', th: 'เติมข้อมูลเครื่องจักรให้แล้ว' }));
      render();
    }
  }

  /* Green when satisfied, blinking red when the form has been
     submitted and this one is still empty. */
  /* ---- placing floating layers ----
     A popup fixed to the viewport has to reconcile two coordinate
     systems, and mixing them is silent and wrong.

       getBoundingClientRect()  VISUAL px — zoom already applied
       offsetWidth / style.left LAYOUT px — inside the zoomed <html>

     At --ui-scale 1.1 a tooltip clamped with innerWidth still painted
     67px past the right edge of a 1440px screen, because the clamp was
     done in one space and the write landed in the other. Convert once,
     here, and every popup in the app inherits the fix. */
  function uiScale() {
    const z = parseFloat(getComputedStyle(document.documentElement).zoom);
    return z && isFinite(z) && z > 0 ? z : 1;
  }

  function placeFloating(node, anchor, opts) {
    opts = opts || {};
    const s = uiScale();
    const w = node.offsetWidth * s;
    const h = node.offsetHeight * s;
    const gap = opts.gap == null ? 10 : opts.gap;
    const pad = 8;

    let left = opts.align === 'start'
      ? anchor.left
      : anchor.left + anchor.width / 2 - w / 2;
    left = Math.max(pad, Math.min(left, window.innerWidth - w - pad));

    /* Preferred side first, then flip, then clamp — so a popup taller
       than the space on either side still lands fully on screen. */
    let top = opts.below ? anchor.bottom + gap : anchor.top - h - gap;
    if (top < pad) top = anchor.bottom + gap;
    if (top + h > window.innerHeight - pad) top = anchor.top - h - gap;
    top = Math.max(pad, Math.min(top, window.innerHeight - h - pad));

    node.style.left = (left / s) + 'px';
    node.style.top = (top / s) + 'px';
  }

  /* ---- chart tooltip ----
     Lives on <body>, not inside the plot. As a child of the panel it was
     clipped by the panel's own rounded overflow, and the clamp bounded
     its CENTRE — so half of a 158px tooltip still hung over the edge on
     the last bar of the chart. Positioned against the viewport instead,
     measured after it has content, and flipped below the bar when there
     is no room above. */
  let chartTipEl = null;
  function chartTip() {
    if (!chartTipEl || !chartTipEl.isConnected) {
      chartTipEl = el('div', { class: 'chart-tip', role: 'status' });
      document.body.appendChild(chartTipEl);
    }
    return chartTipEl;
  }
  function hideChartTip() { if (chartTipEl) chartTipEl.classList.remove('show'); }
  function placeChartTip(tip, anchor) {
    tip.classList.add('measuring');
    placeFloating(tip, anchor, { gap: 10 });

  /* ---- photos ---- */

  function compressImage(file, maxDim, quality) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          const w = Math.round(img.width * scale);
          const h = Math.round(img.height * scale);
          const canvas = el('canvas');
          canvas.width = w;
          canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function photoSlot(rec, store, key, label, onRemove) {
    const slot = el('div', { class: 'photo-slot' });
    if (label) {
      slot.appendChild(el('div', { class: 'ps-head' }, [
        el('div', { class: 'label-en', text: label.en }),
        el('div', { class: 'label-th th', text: label.th }),
      ]));
    }

    const fileInput = el('input', {
      type: 'file',
      accept: 'image/*',
      capture: 'environment',
      style: 'display:none',
      onchange: async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        try {
          store[key] = await compressImage(file, 1200, 0.72);
          touch(rec);
          render();
        } catch (err) {
          toast(lang === 'th' ? 'อ่านรูปไม่สำเร็จ' : 'Could not read image', true);
        }
        e.target.value = '';
      },
    });
    slot.appendChild(fileInput);

    if (store[key]) {
      slot.appendChild(el('img', { src: store[key], alt: label ? label.en : 'photo' }));
      slot.appendChild(
        el('div', { class: 'photo-actions no-print' }, [
          el('button', { class: 'btn btn-sm', onclick: () => fileInput.click() }, [L({ en: 'Replace', th: 'เปลี่ยนรูป' })]),
          el('button', {
            class: 'btn btn-sm btn-danger',
            onclick: () => {
              if (onRemove) onRemove();
              else delete store[key];
              touch(rec);
              render();
            },
          }, [L(UI.remove)]),
        ])
      );
    } else {
      slot.appendChild(
        el('div', { class: 'photo-drop', onclick: () => fileInput.click() }, [
          el('div', {}, [
            el('div', { style: 'font-size:22px', text: '📷' }),
            el('div', { text: lang === 'th' ? 'แตะเพื่อถ่าย / เลือกรูป' : 'Tap to take / choose photo' }),
          ]),
        ])
      );
    }
    return slot;
  }
