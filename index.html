tr.detail-row:hover { background: var(--glass-sunken); }

.service-panel { padding: 16px 16px 4px; }
.service-panel-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.service-panel-sub { font-size: 12.5px; color: var(--text-dim); font-family: var(--font-mono); }
.service-panel-note { font-size: 13.5px; margin-bottom: 13px; }

/* ---------------- Panel ---------------- */

.panel {
  background: var(--glass);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border: 1px solid var(--edge);
  border-radius: var(--radius-window);
  box-shadow: var(--lift-1), var(--specular);
  overflow: hidden;
}
.panel-head {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 16px; flex-wrap: wrap;
  padding: 20px 22px 16px;
  border-bottom: 1px solid var(--hairline-soft);
}
.panel-title { margin: 0; font-size: 19px; font-weight: 650; letter-spacing: -.02em; }
.panel-sub { margin-top: 6px; font-size: 14px; color: var(--text-dim); line-height: 1.6; max-width: 62ch; }
.panel-body { padding: 20px 22px; }
.panel-body + .panel-body { border-top: 1px solid var(--hairline-soft); }
.sub-title { margin: 0 0 6px; font-size: 15px; font-weight: 650; letter-spacing: -.015em; }

/* ---------------- Bar chart ---------------- */

.chart { width: 100%; }

.legend { display: flex; flex-wrap: wrap; gap: 18px; margin-bottom: 18px; }
.legend-item { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--text-dim); }
.legend-swatch { width: 12px; height: 12px; border-radius: 3px; flex: 0 0 auto; }

.chart-plot { position: relative; padding: 22px 0 0 34px; }

.chart-grid { position: absolute; inset: 22px 0 46px 34px; pointer-events: none; }
.grid-line {
  position: absolute; left: 0; right: 0;
  border-top: 1px solid var(--hairline-soft);
}
.grid-label {
  position: absolute; right: 100%; top: -.62em;
  padding-right: 9px;
  font-size: 11.5px;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.chart-track {
  position: relative;
  display: flex;
  align-items: flex-end;
  gap: 10px;
  height: 236px;
  overflow-x: auto;
  overflow-y: hidden;
  padding-bottom: 46px;
}

.bar-group {
  flex: 1 1 0;
  min-width: 68px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: stretch;
  height: 100%;
  padding: 0 2px;
  background: transparent;
  border: none;
  border-radius: 10px;
  cursor: default;
  font: inherit;
  color: inherit;
  position: relative;
}
.bar-group.is-clickable { cursor: pointer; }
.bar-group:hover { background: var(--glass-hover); }
.bar-group:focus-visible { outline: 2.5px solid var(--accent-blue); outline-offset: 1px; }

.bars {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 2px;              /* the 2px surface gap between adjacent fills */
  height: 100%;
  padding-top: 18px;
}
/* A bottom-aligned column, so the value label rides directly on top of
   its bar instead of floating at the top of the plot. */
.bar-slot {
  flex: 1 1 0;
  max-width: 42px;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
}
.bar {
  --bar: var(--series-1);
  position: relative;
  display: block;
  width: 100%;
  min-height: 2px;
  border-radius: 4px 4px 0 0;   /* rounded data-end, square on the baseline */
  overflow: hidden;
  transition: filter .16s ease;
  /* Glossy vertical fill — bright crown, saturated body, deepened foot. */
  background:
    linear-gradient(180deg,
      color-mix(in srgb, var(--bar) 22%, #fff) 0%,
      color-mix(in srgb, var(--bar) 85%, #fff) 22%,
      var(--bar) 58%,
      color-mix(in srgb, var(--bar) 74%, #000) 100%);
  box-shadow:
    0 0 10px -1px color-mix(in srgb, var(--bar) 70%, transparent),
    0 0 2px color-mix(in srgb, var(--bar) 85%, transparent),
    inset 0 1.5px 0 rgba(255,255,255,.5);
}
/* Slow running sheen that travels up the bar — the "technology" idle. */
.bar::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg,
    transparent 0 6%,
    rgba(255,255,255,.55) 12%,
    color-mix(in srgb, var(--bar) 55%, #fff) 16%,
    transparent 24%);
  background-size: 100% 300%;
  mix-blend-mode: screen;
  animation: bar-run 5s linear infinite;
}
@keyframes bar-run { from { background-position: 0 130%; } to { background-position: 0 -170%; } }
.bar-group:hover .bar { filter: brightness(1.08); }

/* ---- Chart entrance ----
   When the dashboard arrives (or its filters change), the graph builds
   itself: gridlines sweep in from the left, then each company's bars
   rise from the baseline in turn, and the value lands on top of its bar
   a beat later. --gi is the group's index, set in barChart(). */
.chart { animation: chart-in .35s ease both; }
@keyframes chart-in { from { opacity: 0; } }
.chart-grid .grid-line {
  animation: grid-in .5s cubic-bezier(.3,0,.2,1) both;
  transform-origin: left center;
}
@keyframes grid-in { from { transform: scaleX(0); opacity: 0; } }
.bar {
  animation: bar-in .55s cubic-bezier(.3,1,.4,1) both;
  /* Base delay parks the bars until the page transition is nearly done,
     so the two animations never fight for frames on a phone. */
  animation-delay: calc(var(--gi, 0) * 60ms + 260ms);
  transform-origin: bottom center;
}
@keyframes bar-in { from { transform: scaleY(0); } }
.bar-value {
  animation: barval-in .4s ease both;
  animation-delay: calc(var(--gi, 0) * 60ms + 520ms);
}
@keyframes barval-in { from { opacity: 0; transform: translateY(5px); } }

@media (prefers-reduced-motion: reduce) {
  .bar::after { animation: none; }
  .chart, .chart-grid .grid-line, .bar, .bar-value { animation: none; }
}
.bar-value {
  font-size: 12px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--text-dim);
  line-height: 1;
  margin-bottom: 5px;
  pointer-events: none;
}

.bar-label {
  position: absolute;
  top: 100%; left: 0; right: 0;
  margin-top: 9px;
  font-size: 12.5px;
  color: var(--text);
  line-height: 1.3;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  text-align: center;
}
.bar-sub {
  position: absolute;
  top: 100%; left: 0; right: 0;
  margin-top: 26px;
  font-size: 11px;
  color: var(--text-faint);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  text-align: center;
}

.chart-tip {
  position: fixed;
  left: 0; top: 0;
  z-index: 88;
  transform: translateY(6px);
  min-width: 158px;
  padding: 10px 13px;
  background: var(--glass-bar);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border: 1px solid var(--edge);
  border-radius: var(--radius-ctl);
  box-shadow: var(--lift-2);
  opacity: 0;
  pointer-events: none;
  transition: opacity .16s ease, transform .16s ease;
  z-index: 5;
}
.chart-tip.show { opacity: 1; transform: translateY(0); }
/* Measured before it is shown: opacity 0 alone still lays out, but the
   transform would skew the numbers we clamp against. */
.chart-tip.measuring { transform: none; }
.tip-title { font-weight: 650; font-size: 13.5px; margin-bottom: 2px; }
.tip-sub { font-size: 11.5px; color: var(--text-faint); margin-bottom: 7px; }
.tip-row { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-top: 4px; }
.tip-key { color: var(--text-dim); flex: 1; }
.tip-val { font-weight: 650; font-variant-numeric: tabular-nums; }

/* ---------------- Summary cards ---------------- */

.summary-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 16px;
  padding: 20px 22px;
  border-top: 1px solid var(--hairline-soft);
}
.summary-card { padding: 18px; }
.summary-note { font-size: 13px; color: var(--text-dim); line-height: 1.55; margin-bottom: 14px; }
.summary-empty { font-size: 13.5px; color: var(--text-faint); padding: 10px 0; }
.summary-list { display: flex; flex-direction: column; gap: 10px; }
.summary-row { display: grid; grid-template-columns: minmax(96px, 40%) 1fr 30px; gap: 12px; align-items: center; }
.summary-label { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.summary-meter {
  height: 8px;
  background: var(--glass-sunken);
  border: 1px solid var(--hairline-soft);
  border-radius: 999px;
  overflow: hidden;
}
.summary-fill { display: block; height: 100%; background: var(--series-2); border-radius: 999px; }
.summary-count { font-size: 13.5px; font-weight: 650; text-align: right; font-variant-numeric: tabular-nums; }

.cause-chip {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 600;
  background: color-mix(in srgb, var(--series-2) 16%, transparent);
  color: var(--series-2);
  border: 1px solid color-mix(in srgb, var(--series-2) 34%, transparent);
}

/* ---------------- New-form stage groups ----------------
   Two questions, not four cards: is the machine still on our floor,
   or already at the customer's? */

.stage-stack { display: flex; flex-direction: column; gap: 26px; }

.stage {
  background: var(--glass-sunken);
  border: 1px solid var(--hairline-soft);
  border-radius: var(--radius-window);
  padding: 18px;
}
.stage-head {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 2px 4px 16px;
}
.stage-dot {
  width: 11px; height: 11px;
  margin-top: 6px;
  flex: 0 0 auto;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent);
}
.stage-title {
  font-size: 16.5px;
  font-weight: 650;
  letter-spacing: -.02em;
}
.stage-title .th { font-size: 14px; color: var(--text-dim); font-weight: 500; letter-spacing: 0; line-height: 1.45; }
.stage-note {
  margin-top: 7px;
  font-size: 14px;
  color: var(--text-dim);
  line-height: 1.62;
  max-width: 58ch;
}
.stage-note .th { color: var(--text-dim); margin-top: 2px; }

.type-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(238px, 1fr));
  gap: 15px;
}
.type-card {
  position: relative;
  overflow: hidden;
  background: var(--glass);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border: 1px solid var(--edge);
  border-radius: var(--radius-card);
  padding: 20px;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  box-shadow: var(--lift-1), var(--specular);
  transition: transform .2s cubic-bezier(.22,1,.36,1), box-shadow .2s ease, background .2s ease;
}
.type-card::before {
  content: '';
  position: absolute;
  left: 0; right: 0; top: 0;
  height: 3px;
  background: var(--accent, var(--accent-blue));
}
.type-card:hover {
  background: var(--glass-hover);
  transform: translateY(-4px) scale(1.012);
  box-shadow: var(--lift-3), var(--specular);
}
.type-card:active { transform: translateY(-1px) scale(.998); }
.type-card .tc-icon { color: var(--accent, var(--accent-blue)); display: flex; }
.type-card .tc-code {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-faint);
  letter-spacing: .1em;
  margin-top: 11px;
}
.type-card .tc-name { font-weight: 600; font-size: 15.5px; margin-top: 4px; letter-spacing: -.015em; }
.type-card .tc-name-th { font-size: 13.5px; color: var(--text-dim); margin-top: 3px; line-height: 1.45; }
/* Plain language under the acronym — nobody should have to guess what
   FAT or SAT stands for. */
.type-card .tc-blurb {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--hairline-soft);
  font-size: 13px;
  line-height: 1.55;
  color: var(--text-dim);
}

/* ---------------- Tables ---------------- */

.table-wrap {
  overflow-x: auto;
  background: var(--glass);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border: 1px solid var(--edge);
  border-radius: var(--radius-card);
  box-shadow: var(--lift-1), var(--specular);
}

table { width: 100%; border-collapse: collapse; font-size: 14px; }
thead th {
  background: var(--glass-sunken);
  text-align: left;
  padding: 12px 14px;
  font-size: 11px;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--text-faint);
  font-weight: 600;
  border-bottom: 1px solid var(--hairline);
  white-space: nowrap;
}
tbody td { padding: 11px 14px; border-bottom: 1px solid var(--hairline-soft); vertical-align: middle; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: var(--glass-hover); }
tbody tr.clickable { cursor: pointer; }

/* ---------------- Form sections ---------------- */

.form-shell { display: flex; flex-direction: column; gap: 16px; }

.section {
  background: var(--glass);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border: 1px solid var(--edge);
  border-radius: var(--radius-card);
  box-shadow: var(--lift-1), var(--specular);
  overflow: hidden;
}
.section > header {
  padding: 15px 19px;
  background: var(--glass-sunken);
  border-bottom: 1px solid var(--hairline-soft);
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.section-title { font-weight: 600; font-size: 15px; letter-spacing: -.015em; }
.section-title .th { font-size: 13.5px; color: var(--text-dim); font-weight: 400; letter-spacing: 0; line-height: 1.45; }
.section-body { padding: 18px 19px; }

.section.critical { border-color: color-mix(in srgb, var(--fail-fill) 34%, var(--edge)); }
.section.critical > header {
  background: color-mix(in srgb, var(--fail-fill) 11%, var(--glass-sunken));
  border-bottom-color: color-mix(in srgb, var(--fail-fill) 24%, transparent);
}

.hint {
  font-size: 13.5px;
  line-height: 1.55;
  color: var(--warn);
  background: color-mix(in srgb, var(--accent-yellow) 16%, transparent);
  border: 1px solid color-mix(in srgb, var(--accent-yellow) 34%, transparent);
  padding: 10px 13px;
  border-radius: var(--radius-ctl);
  margin-bottom: 15px;
}

.section-progress {
  font-size: 12px; color: var(--text-dim);
  display: flex; align-items: center; gap: 9px;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.progress-bar {
  width: 74px; height: 6px;
  background: var(--glass-sunken);
  border: 1px solid var(--hairline-soft);
  border-radius: var(--radius-pill);
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--pass-fill);
  border-radius: var(--radius-pill);
  transition: width .3s cubic-bezier(.22,1,.36,1);
}

/* ---- fields ---- */

.field-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(236px, 1fr)); gap: 14px; }
.field label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 7px; font-weight: 500; line-height: 1.45; }
.field label .req { color: var(--fail); }
.field input, .field select, .field textarea, .cell-input {
  width: 100%;
  padding: 10px 13px;
  background: var(--field);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-ctl);
  color: var(--text);
  outline: none;
  transition: background .16s ease, border-color .16s ease, box-shadow .16s ease;
}
.field input::placeholder, .field textarea::placeholder, .cell-input::placeholder { color: var(--text-faint); }
.field input:focus, .field select:focus, .field textarea:focus, .cell-input:focus {
  background: var(--field-focus);
  border-color: var(--accent-blue);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent-blue) 20%, transparent);
  outline: none;
}
.field textarea { min-height: 98px; resize: vertical; }
.field .unit { font-size: 11.5px; color: var(--text-faint); margin-left: 5px; }
.cell-input { padding: 8px 11px; border-radius: 10px; }

/* ---- Suggestion combobox (works on touch, unlike native <datalist>) ---- */
.combo { position: relative; width: 100%; }
.combo input { padding-right: 40px; }   /* room for the caret button */
.combo-caret {
  position: absolute; top: 0; right: 0; height: 100%; width: 38px;
  display: grid; place-items: center;
  background: none; border: none; padding: 0;
  color: var(--text-faint); font-size: 15px; line-height: 1; cursor: pointer;
  border-radius: 0 var(--radius-ctl) var(--radius-ctl) 0;
  transition: transform .2s ease, color .2s ease;
}
.combo-caret:hover { color: var(--text); }
.combo.is-open .combo-caret { transform: rotate(180deg); color: var(--accent-blue); }
/* Hung on <body>, positioned in JS, fixed to the viewport. */
.combo-pop {
  position: fixed; z-index: 90;
  max-height: 250px; overflow-y: auto; -webkit-overflow-scrolling: touch;
  background: var(--glass-raised, var(--field));
  -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border: 1px solid var(--edge);
  border-radius: 12px;
  box-shadow: var(--lift-3, var(--lift-2)), var(--specular);
  padding: 5px;
}
.combo-opt {
  padding: 11px 12px; border-radius: 8px;
  font-size: 14px; color: var(--text); cursor: pointer;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.combo-opt:hover, .combo-opt.is-active {
  background: color-mix(in srgb, var(--accent-blue) 16%, transparent);
}
/* The "None (clear)" row — muted, with a divider under it. */
.combo-opt.combo-clear {
  color: var(--text-faint); font-style: italic;
  border-bottom: 1px solid var(--hairline-soft); border-radius: 8px 8px 0 0; margin-bottom: 3px;
}
.combo-opt.combo-clear:hover { background: color-mix(in srgb, var(--fail) 14%, transparent); color: var(--text); }

/* ---- checklist rows ---- */

.check-row {
  display: grid;
  grid-template-columns: 62px 1fr auto 208px;
  gap: 13px;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--hairline-soft);
  border-radius: 10px;
  transition: background .16s ease;
}
.check-row:last-child { border-bottom: none; }
.check-code {
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--text-faint);
  font-weight: 500;
  letter-spacing: .04em;
}
.check-label { font-size: 14.5px; line-height: 1.45; }
.check-label .th { font-size: 13.5px; color: var(--text-dim); line-height: 1.45; }

/* --- THE VERDICT CONTROLS — opaque on purpose --- */
.pfn { display: flex; gap: 6px; }
.pfn button {
  min-width: 62px;
  padding: 9px 12px;
  border-radius: 11px;
  border: 1px solid var(--hairline);
  background: var(--field);
  color: var(--text-dim);
  cursor: pointer;
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: .02em;
  transition: transform .14s ease, box-shadow .14s ease, background .14s ease, color .14s ease;
}
.pfn button:hover { background: var(--field-focus); color: var(--text); }
.pfn button:active { transform: scale(.95); }

.pfn button.on[data-v="PASS"],
.pfn button.on[data-v="NORMAL"],
.pfn button.on[data-v="YES"] {
  background: var(--pass-fill); border-color: var(--pass-fill); color: var(--pass-ink);
  box-shadow: 0 4px 14px color-mix(in srgb, var(--pass-fill) 48%, transparent), inset 0 1px 0 rgba(255,255,255,.3);
}
.pfn button.on[data-v="FAIL"],
.pfn button.on[data-v="ABNORMAL"],
.pfn button.on[data-v="NO"] {
  background: var(--fail-fill); border-color: var(--fail-fill); color: #fff;
  box-shadow: 0 4px 14px color-mix(in srgb, var(--fail-fill) 50%, transparent), inset 0 1px 0 rgba(255,255,255,.28);
}
.pfn button.on[data-v="NA"] {
  background: var(--na-fill); border-color: var(--na-fill); color: #fff;
  box-shadow: 0 4px 12px color-mix(in srgb, var(--na-fill) 40%, transparent), inset 0 1px 0 rgba(255,255,255,.22);
}

.check-row.is-fail { background: color-mix(in srgb, var(--fail-fill) 9%, transparent); }

/* ---- measurements & performance ---- */

.measure-row { display: grid; grid-template-columns: 1fr 156px 92px; gap: 13px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--hairline-soft); }
.measure-row:last-child { border-bottom: none; }
.perf-row { display: grid; grid-template-columns: 1fr 138px 156px 96px; gap: 13px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--hairline-soft); }
.perf-row:last-child { border-bottom: none; }
.perf-target { font-size: 13px; color: var(--text-dim); font-variant-numeric: tabular-nums; font-family: var(--font-mono); }

.verdict {
  font-size: 12px; font-weight: 700; letter-spacing: .04em;
  padding: 6px 10px; border-radius: 9px; text-align: center;
}
.verdict.pass { background: var(--pass-fill); color: var(--pass-ink); box-shadow: inset 0 1px 0 rgba(255,255,255,.28); }
.verdict.fail { background: var(--fail-fill); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.24); }
.verdict.none { color: var(--text-faint); }

/* ---- documents / root cause chips ---- */

.doc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(262px, 1fr)); gap: 9px; }
.rc-grid  { display: grid; grid-template-columns: repeat(auto-fit, minmax(182px, 1fr)); gap: 8px; margin-bottom: 16px; }
.doc-item {
  display: flex; align-items: center; gap: 11px;
  padding: 10px 13px;
  background: var(--field);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-ctl);
  cursor: pointer;
  transition: background .16s ease, border-color .16s ease;
}
.doc-item:hover { background: var(--field-focus); }
.doc-item input { width: 19px; height: 19px; accent-color: var(--accent-blue); cursor: pointer; flex: 0 0 auto; }
.doc-item.on {
  border-color: color-mix(in srgb, var(--pass-fill) 55%, transparent);
  background: color-mix(in srgb, var(--pass-fill) 13%, var(--field));
}

/* ---- photos ---- */

.photo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(196px, 1fr)); gap: 14px; }
.photo-slot {
  border: 1px solid var(--hairline);
  border-radius: var(--radius-ctl);
  background: var(--field);
  overflow: hidden;
  display: flex; flex-direction: column;
}
.photo-slot .ps-head { padding: 10px 12px; font-size: 13px; line-height: 1.4; border-bottom: 1px solid var(--hairline-soft); }
.photo-slot .ps-head .th { color: var(--text-dim); font-size: 12px; }
.photo-drop {
  flex: 1; min-height: 136px;
  display: grid; place-items: center;
  cursor: pointer;
  color: var(--text-faint);
  font-size: 12.5px;
  text-align: center;
  padding: 12px;
  transition: background .16s ease, color .16s ease;
}
.photo-drop:hover { background: var(--glass-hover); color: var(--text-dim); }
.photo-slot img { width: 100%; display: block; max-height: 190px; object-fit: cover; }
.photo-actions { display: flex; gap: 7px; padding: 8px; border-top: 1px solid var(--hairline-soft); }

.ba-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.ba-col h4 { margin: 0 0 10px; font-size: 11px; letter-spacing: .1em; color: var(--text-faint); font-weight: 600; }

/* ---- priority ---- */

.priority-row { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 12px; }
.priority-row button {
  padding: 10px 17px;
  border-radius: var(--radius-ctl);
  border: 1px solid var(--hairline);
  background: var(--field);
  color: var(--text-dim);
  cursor: pointer;
  font-weight: 600;
  font-size: 13px;
  transition: transform .14s ease, box-shadow .14s ease;
}
.priority-row button:hover { background: var(--field-focus); }
.priority-row button.on { color: #fff; border-color: transparent; box-shadow: var(--lift-1), inset 0 1px 0 rgba(255,255,255,.26); }

/* ---- result ---- */

.result-row { display: flex; flex-direction: column; gap: 10px; }
.result-row button {
  display: flex; align-items: center; gap: 13px;
  padding: 16px 19px;
  border-radius: var(--radius-ctl);
  border: 1.5px solid var(--hairline);
  background: var(--field);
  color: var(--text-dim);
  cursor: pointer;
  font-weight: 600;
  font-size: 14.5px;
  text-align: left;
  letter-spacing: -.01em;
  transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
}
.result-row button:hover:not(.blocked) { background: var(--field-focus); transform: translateY(-1px); }
.result-row button .dot { width: 15px; height: 15px; border-radius: 50%; flex: 0 0 auto; box-shadow: inset 0 1px 0 rgba(255,255,255,.4); }
.result-row button.on { box-shadow: var(--lift-2), inset 0 1px 0 rgba(255,255,255,.24); }
.result-row button.blocked { opacity: .38; cursor: not-allowed; }

.alert-danger {
  background: color-mix(in srgb, var(--fail-fill) 14%, transparent);
  border: 1px solid color-mix(in srgb, var(--fail-fill) 42%, transparent);
  color: var(--fail);
  padding: 13px 16px;
  border-radius: var(--radius-ctl);
  font-size: 13.5px;
  margin-bottom: 15px;
  font-weight: 500;
}

/* ---- signatures ---- */

.sign-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(268px, 1fr)); gap: 16px; }
.sign-card {
  border: 1px solid var(--hairline);
  border-radius: var(--radius-ctl);
  overflow: hidden;
  background: var(--field);
}
.sign-card h4 { margin: 0; padding: 11px 13px; font-size: 13px; font-weight: 600; border-bottom: 1px solid var(--hairline-soft); }
.sign-card h4 .th { color: var(--text-dim); font-size: 12.5px; font-weight: 400; line-height: 1.4; }
.sign-pad { background: #fff; touch-action: none; display: block; width: 100%; height: 132px; cursor: crosshair; }
.sign-meta { display: grid; grid-template-columns: 1fr 136px; gap: 9px; padding: 10px 11px; }
.sign-foot { display: flex; justify-content: flex-end; padding: 0 11px 10px; }

/* ---- pills & badges ---- */

.pill {
  display: inline-block;
  padding: 4px 11px;
  border-radius: var(--radius-pill);
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: .01em;
  white-space: nowrap;
  border: 1px solid transparent;
}
.pill.draft  { background: var(--glass-sunken); color: var(--text-dim); border-color: var(--hairline); }
.pill.green  { background: var(--pass-fill); color: var(--pass-ink); }
.pill.yellow { background: var(--accent-yellow); color: #3d2f00; }
.pill.red    { background: var(--fail-fill); color: #fff; }

.type-badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 11px;
  border-radius: var(--radius-pill);
  font-size: 11.5px; font-weight: 600;
  background: color-mix(in srgb, var(--accent, var(--accent-blue)) 16%, transparent);
  color: var(--accent, var(--accent-blue));
  border: 1px solid color-mix(in srgb, var(--accent, var(--accent-blue)) 34%, transparent);
}

/* ---- toolbar: a floating glass bar ---- */

.toolbar {
  position: sticky; top: 8px; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  padding: 13px 18px;
  margin-bottom: 18px;
  flex-wrap: wrap;
  background: var(--glass-bar);
  -webkit-backdrop-filter: saturate(180%) blur(40px);
  backdrop-filter: saturate(180%) blur(40px);
  border: 1px solid var(--edge);
  border-radius: var(--radius-card);
  box-shadow: var(--lift-2), var(--specular);
}
.toolbar .tb-title {
  font-weight: 600;
  letter-spacing: -.015em;
  display: flex; align-items: center; gap: 9px;
  font-variant-numeric: tabular-nums;
}
.tb-ico { color: var(--accent, var(--accent-blue)); display: inline-flex; }
.toolbar .tb-sub { font-size: 13px; color: var(--text-dim); line-height: 1.45; }

.search-input {
  width: 100%; max-width: 390px;
  padding: 11px 16px;
  background: var(--glass);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border: 1px solid var(--edge);
  border-radius: var(--radius-pill);
  color: var(--text);
  outline: none;
  box-shadow: var(--lift-1);
}
.search-input:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent-blue) 18%, transparent); }

/* ---------------- Records filter bar ----------------
   Customer, then their machines, then the kind of document, then the
   order. Each dropdown offers only what the other three still allow,
   with a count beside every option, so a choice can never lead to an
   empty screen. */

.filter-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 12px;
  margin: 0 4px 18px;
  padding: 15px 17px;
  background: var(--glass);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border: 1px solid var(--edge);
  border-radius: var(--radius-window);
  box-shadow: var(--lift-1), var(--specular);
}

.filter-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex: 1 1 190px;
  min-width: 0;
}

.filter-label {
  font-size: 10.5px;
  font-weight: 650;
  letter-spacing: .075em;
  text-transform: uppercase;
  color: var(--text-faint);
  padding-left: 2px;
  transition: color .18s ease;
}
/* A set filter says so without shouting — the label picks up the accent
   rather than the control changing shape and shifting the row. */
.filter-field.is-set .filter-label { color: var(--accent-blue); }

.filter-select {
  width: 100%;
  padding: 10px 34px 10px 13px;
  background: var(--field);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-ctl);
  color: var(--text);
  font-size: 14px;
  outline: none;
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
  /* Chevron drawn in the box so it inherits the theme instead of the OS */
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%),
                    linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: right 16px center, right 11px center;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  transition: border-color .18s ease, box-shadow .18s ease, background-color .18s ease;
}
.filter-select:hover { background-color: var(--field-focus); }
.filter-select:focus {
  border-color: var(--accent-blue);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent-blue) 16%, transparent);
}
.filter-field.is-set .filter-select { border-color: color-mix(in srgb, var(--accent-blue) 45%, var(--hairline)); }

.filter-clear {
  flex: 0 0 auto;
  padding: 10px 16px;
  border: 1px solid var(--hairline);
  border-radius: var(--radius-ctl);
  background: var(--glass-soft);
  color: var(--text-dim);
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  transition: color .18s ease, background .18s ease, border-color .18s ease;
}
.filter-clear:hover { color: var(--fail); border-color: color-mix(in srgb, var(--fail) 45%, var(--hairline)); }
.filter-clear:active { transform: scale(.97); }

.filter-count {
  margin: 0 6px 10px;
  font-size: 12.5px;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

/* One filter per row on a phone: four half-width dropdowns side by side
   are unreadable and the labels wrap to two lines. */
@media (max-width: 660px) {
  .filter-bar { gap: 11px; padding: 13px 14px; }
  .filter-field { flex: 1 1 100%; }
  .filter-clear { width: 100%; }
}

@media print { .filter-bar, .filter-count { display: none !important; } }

.empty {
  padding: 52px 22px;
  text-align: center;
  color: var(--text-faint);
  background: var(--glass-sunken);
  border: 1px dashed var(--hairline);
  border-radius: var(--radius-card);
}

/* ---- timeline ---- */

.timeline { position: relative; padding-left: 28px; }
.timeline::before {
  content: ''; position: absolute; left: 7px; top: 8px; bottom: 8px;
  width: 2px; background: var(--hairline); border-radius: 2px;
}
.tl-item { position: relative; margin-bottom: 14px; }
.tl-item::before {
  content: ''; position: absolute; left: -25px; top: 20px;
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--accent, var(--accent-blue));
  box-shadow: 0 0 0 3px var(--env-2), 0 0 12px color-mix(in srgb, var(--accent, var(--accent-blue)) 60%, transparent);
}

/* ---- toast ---- */

.toast {
  position: fixed; bottom: 28px; left: 50%;
  transform: translateX(-50%) translateY(90px);
  background: var(--pass-fill);
  color: var(--pass-ink);
  padding: 12px 24px;
  border-radius: var(--radius-pill);
  font-weight: 600; font-size: 14px;
  box-shadow: var(--lift-3), inset 0 1px 0 rgba(255,255,255,.3);
  opacity: 0;
  transition: transform .28s cubic-bezier(.22,1,.36,1), opacity .22s ease;
  z-index: 100; pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.toast.err { background: var(--fail-fill); color: #fff; }

/* ---------------- Responsive ---------------- */

/* ---------------- Backup lock screen ---------------- */

.lock-wrap { display: flex; justify-content: center; padding-top: 12px; }
.lock-card {
  width: 100%;
  max-width: 420px;
  text-align: center;
  padding: 32px 28px 26px;
  border-radius: var(--radius-window);
}
.lock-icon {
  font-size: 30px;
  width: 62px; height: 62px;
  margin: 0 auto 16px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--glass-sunken);
  border: 1px solid var(--edge);
  box-shadow: var(--specular);
}
.lock-title { margin: 0 0 8px; font-size: 19px; font-weight: 600; letter-spacing: -.02em; }
.lock-sub { margin: 0 0 22px; font-size: 14px; color: var(--text-dim); line-height: 1.6; }
.lock-card .field { text-align: left; }
.lock-btn { width: 100%; justify-content: center; }
.lock-note {
  margin: 18px 0 0;
  font-size: 12.5px;
  line-height: 1.6;
  color: var(--text-dim);
  border-top: 1px solid var(--hairline-soft);
  padding-top: 14px;
}

/* ---------------- Small-screen chrome ----------------
   Hidden on desktop. On tablet and phone this bar owns the menu
   toggle and the app identity, and the sidebar becomes a drawer. */

.mobile-bar { display: none; }
.scrim { display: none; }

/* One button, shaped like a visionOS control: a circular pane of glass
   with a specular rim, that presses in when touched. */
.menu-toggle {
  position: relative;
  display: inline-flex;
  align-items: center; justify-content: center;
  width: 48px; height: 48px;
  flex: 0 0 auto;
  padding: 0;
  border: 1px solid var(--edge);
  border-radius: 50%;
  background: var(--glass-raised);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  color: var(--text);
  cursor: pointer;
  box-shadow:
    var(--lift-2),
    inset 0 1.5px 0 rgba(255, 255, 255, .55),
    inset 0 -2px 4px rgba(10, 20, 45, .06);
  transition: transform .2s cubic-bezier(.22,1,.36,1), background .2s ease, box-shadow .2s ease;
}
.menu-toggle::after {
  /* the halo that answers a press */
  content: '';
  position: absolute; inset: -4px;
  border-radius: 50%;
  box-shadow: 0 0 0 0 rgba(10, 132, 255, .34);
  transition: box-shadow .25s ease;
  pointer-events: none;
}
.menu-toggle:hover { background: var(--glass-hover); transform: scale(1.05); }
.menu-toggle:hover::after { box-shadow: 0 0 0 5px rgba(10, 132, 255, .16); }
.menu-toggle:active { transform: scale(.93); }
:root.nav-open .menu-toggle { background: var(--accent-blue); border-color: transparent; color: #fff; }
:root.nav-open .menu-toggle::after { box-shadow: 0 0 18px 3px rgba(10, 132, 255, .42); }

/* Two bars that fold into a cross — one glyph, one meaning */
.mt-glyph { position: relative; width: 18px; height: 12px; display: block; }
.mt-glyph span {
  position: absolute; left: 0;
  width: 100%; height: 2.2px;
  background: currentColor;
  border-radius: 2px;
  transition: transform .3s cubic-bezier(.22,1,.36,1);
}
.mt-glyph span:nth-child(1) { top: 1px; }
.mt-glyph span:nth-child(2) { top: 8.8px; }

:root.nav-open .mt-glyph span:nth-child(1) { transform: translateY(3.9px) rotate(45deg); }
:root.nav-open .mt-glyph span:nth-child(2) { transform: translateY(-3.9px) rotate(-45deg); }

/* The wordmark floats on its own pane, shrink-wrapped to the text —
   width comes from the glyphs, never from the container. */
.wm-plate {
  display: inline-flex;
  align-items: center;
  width: -moz-fit-content;
  width: fit-content;
  max-width: 100%;
  padding: 7px 15px;
  border-radius: var(--radius-pill);
  background: var(--glass);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border: 1px solid var(--edge);
  box-shadow: var(--lift-1), var(--specular);
  transition: transform .22s cubic-bezier(.22,1,.36,1), box-shadow .22s ease;
}
.wm-plate:hover { transform: translateY(-1px); box-shadow: var(--lift-2), var(--specular); }
.wm-plate-sm { padding: 6px 14px; }

/* Small home shortcut on the mobile bar — same glass language as the
   menu toggle, one size down, pinned to the far right of the bar. Lives
   inside .mobile-bar, so it only shows where that bar shows. */
.home-mini {
  margin-left: auto;          /* push to the right edge of the bar */
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center; justify-content: center;
  width: 42px; height: 42px;
  padding: 0;
  border: 1px solid var(--edge);
  border-radius: 50%;
  background: var(--glass-raised);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  color: var(--text);
  cursor: pointer;
  box-shadow:
    var(--lift-1),
    inset 0 1.5px 0 rgba(255, 255, 255, .5),
    inset 0 -2px 4px rgba(10, 20, 45, .06);
  transition: transform .2s cubic-bezier(.22,1,.36,1), background .2s ease, box-shadow .2s ease, color .2s ease;
}
.home-mini:hover { background: var(--glass-hover); transform: translateY(-1px); }
.home-mini:active { transform: scale(.92); }
.home-mini:focus-visible { outline: 2.5px solid var(--accent-blue); outline-offset: 2px; }
.home-mini svg { display: block; }

/* ---- Tablet & phone ------------------------------------------
   Navigation becomes a toggle drawer:

     bar     [☰]  FN Machine Care
     drawer  slides in from the left with the full menu,
             appearance and language — all with real labels,
             which the cramped icon strip could never show.

   The drawer, not the bar, is where settings live: it has room
   for bilingual labels, and nothing can be pushed off-screen.

   Width alone is the wrong question. A 1920x1080 PC running Windows
   at 150% display scaling reports a 1280px viewport at 100% browser
   zoom — a plain desktop that a width-only cut would hand the tablet
   layout, hiding the sidebar behind a hamburger for someone holding
   a mouse. Meanwhile an iPad Pro 12.9 in landscape reports 1366px
   and genuinely wants the drawer.

   So ask what is driving the screen, not how wide it is:

     under 1080px            always drawer — no room for a sidebar
     1080–1400 + coarse      drawer — a finger, so a tablet
     1080–1400 + fine        sidebar — a mouse, so a desktop
     over 1400px             always sidebar

   `pointer: coarse` reports the PRIMARY input. A touchscreen laptop
   still says `fine`, so it keeps the sidebar, which is right. */

@media (max-width: 1188px), (max-width: 1540px) and (pointer: coarse) {
  .app { flex-direction: column; padding: 10px; gap: 10px; }

  /* The bar outranks both the scrim and the drawer, so the toggle
     stays tappable while the menu is open — otherwise it morphs
     into a close button nobody can reach. */
  .mobile-bar {
    position: sticky;
    top: 0;
    z-index: 65;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    height: var(--bar-h);
    background: var(--glass-bar);
    -webkit-backdrop-filter: saturate(180%) blur(40px);
    backdrop-filter: saturate(180%) blur(40px);
    border-bottom: 1px solid var(--hairline-soft);
  }

  /* Off-canvas drawer, hung below the bar */
  .sidebar {
    position: fixed;
    top: var(--bar-h); left: 0; bottom: 0;
    z-index: 60;
    width: min(300px, calc(84vw / var(--ui-scale)));
    height: calc(100% - var(--bar-h));
    flex: none;
    border-radius: 0 var(--radius-window) var(--radius-window) 0;
    border-left: none;
    /* Near-opaque: a translucent drawer over a busy dashboard made
       the menu labels genuinely hard to read. */
    background: var(--glass-drawer);
    box-shadow: var(--lift-3), var(--specular);
    transform: translateX(-102%);
    transition: transform .34s cubic-bezier(.22,1,.36,1);
    overflow-y: auto;
    overscroll-behavior: contain;
    visibility: hidden;
  }
  :root.nav-open .sidebar { transform: translateX(0); visibility: visible; }

  /* The bar already carries the identity — no need to repeat it */
  .brand { display: none; }

  .scrim {
    display: block;
    position: fixed;
    top: var(--bar-h); right: 0; bottom: 0; left: 0;
    z-index: 55;
    background: rgba(6, 10, 20, .42);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s ease;
  }
  :root.nav-open .scrim { opacity: 1; pointer-events: auto; }
  :root.nav-open { overflow: hidden; }

  /* Inside the drawer everything gets its full label back */
  .nav { flex-direction: column; padding: 12px; margin-top: 4px; }
  .nav button { padding: 13px; }
  .sidebar-foot { margin-top: auto; }
  .seg-label { display: block; }
  .seg .seg-text { display: inline; }

  .main { padding: 0 2px 80px; }
  .toolbar { top: 4px; }
  .page-title { font-size: 25px; }

  .panel-head, .panel-body, .summary-grid { padding-left: 16px; padding-right: 16px; }
  .chart-track { gap: 8px; }
  .bar-group { min-width: 62px; }
  .check-row { grid-template-columns: 1fr; gap: 9px; }
  .perf-row, .measure-row { grid-template-columns: 1fr; }
  .ba-grid { grid-template-columns: 1fr; }

  /* Verdict buttons stretch full width — thumb targets, not chips */
  .pfn { width: 100%; }
  .pfn button { flex: 1 1 0; min-width: 0; }
}

/* ---------------- Data tables become cards ----------------
   Below 900px a wide table stops being a table. Seven columns squeezed
   into a phone put the date, progress and status off-screen behind a
   sideways scroll, so each row becomes a self-contained card with its
   column headings carried along by data-th (stamped in
   stampTableLabels). 900px catches phones and tablets in portrait;
   a tablet in landscape has the width for real columns and keeps them. */
@media (max-width: 900px) {
  .table-wrap { overflow-x: visible; }
  .table-wrap table { display: block; width: 100%; border-collapse: separate; }
  .table-wrap thead { display: none; }
  .table-wrap tbody { display: block; }

  .table-wrap tbody tr {
    display: block;
    margin: 0 0 10px;
    padding: 13px 15px;
    border: 1px solid var(--hairline);
    border-radius: var(--radius-ctl);
    background: var(--glass-soft);
  }
  .table-wrap tbody tr:last-child { margin-bottom: 0; }
  .table-wrap tbody tr.clickable:active { transform: scale(.995); }

  .table-wrap tbody td {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 14px;
    width: auto;
    padding: 5px 0;
    border: none;
    text-align: right;
  }
  .table-wrap tbody td::before {
    content: attr(data-th);
    flex: 0 0 auto;
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--text-faint);
    white-space: nowrap;
  }

  /* The first cell is the card's title — a document number does not
     need a label above it saying "Doc No." */
  .table-wrap tbody td[data-first] {
    display: block;
    text-align: left;
    padding: 0 0 8px;
    margin-bottom: 6px;
    border-bottom: 1px solid var(--hairline-soft);
    font-size: 16px;
  }
  .table-wrap tbody td[data-first]::before { content: none; }

  .table-wrap tbody td .td-val {
    flex: 1 1 auto;
    min-width: 0;              /* without this a flex item refuses to shrink */
    text-align: right;
    overflow-wrap: anywhere;
  }
  .table-wrap tbody td[data-first] .td-val { text-align: left; }
}

@media (max-width: 660px) {
  .wordmark-sm { font-size: 15px; }
  .field-grid { grid-template-columns: 1fr; }
  .sign-grid { grid-template-columns: 1fr; }
  .photo-grid { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
}

/* Touch devices: every control clears a comfortable tap target */
@media (pointer: coarse) {
  .seg button { min-height: 42px; }
  .nav button { min-height: 48px; }
  .pfn button { min-height: 48px; font-size: 13.5px; }
  .btn { min-height: 42px; }
  .doc-item { min-height: 48px; }
  .result-row button { min-height: 58px; }
  .field input, .field select, .field textarea, .cell-input { min-height: 42px; }
}

/* Glass is expensive on low-end tablets — drop the blur, keep the look */
@media (max-width: 616px) {
  .sidebar, .section, .card, .stat, .type-card, .toolbar, .table-wrap, .btn, .search-input {
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
  .orb { animation: none; }
}

/* iOS zooms the page in whenever a field with a font-size under 16px
   takes focus — and it does NOT zoom back out when the field is done.
   Tap one 15px input and the whole app is left at the wrong scale for
   the rest of the session, which reads exactly like "the scale broke".
   It judges on the computed CSS size, not what the viewport scaling
   makes it look like, so 15px still trips it.

   16px on every control a finger can land in. Nothing else changes:
   the desktop keeps 15px, where no such behaviour exists. */
@media (pointer: coarse) {
  input, select, textarea,
  .cell-input, .filter-select, .search-input, .date-text {
    font-size: 16px;
  }
}

/* ---------------- Print: paper is always light ---------------- */

@media print {
  @page { size: A4; margin: 12mm; }

  /* Paper has its own scale. Zooming here would push a full-page form
     onto two sheets and shrink the margins Chrome reserves for A4. */
  html { zoom: 1; }

  html, body {
    background: #fff !important;
    color: #000 !important;
    font-size: 10.5pt;
  }
  .modal-overlay, .chart-tip, .ambient, .sidebar, .toolbar, .no-print, .nav, .btn,
  .mobile-bar, .scrim, .menu-toggle,
  .photo-actions, .sign-foot { display: none !important; }

  .app { display: block; padding: 0; }
  .main { padding: 0; max-width: none; }

  .print-head { display: block !important; margin-bottom: 9mm; border-bottom: 2px solid #000; padding-bottom: 4mm; }

  /* Blur and translucency do not survive print — flatten everything */
  .section, .card, .stat, .table-wrap, .type-card, .photo-slot, .sign-card, .doc-item {
    background: #fff !important;
    -webkit-backdrop-filter: none !important;
    backdrop-filter: none !important;
    box-shadow: none !important;
    border: 1px solid #999 !important;
    border-radius: 4px !important;
  }

  /* ---- Pagination ----
     `break-inside: avoid` on .section was the reason a printed report ran
     to eight pages with a heading at the top of each and the rest blank.
     A section taller than the space left on the page cannot be kept whole,
     so the printer pushed the WHOLE thing to a fresh page and left the
     remainder empty. On a long checklist that happens over and over.

     Sections must be allowed to flow across a page break. What must stay
     whole is the small stuff — one check row, one signature, one photo —
     where a split genuinely loses meaning. */
  .section, .card { break-inside: auto; page-break-inside: auto; }

  .check-row, .measure-row, .perf-row, .field, .sign-card,
  .photo-slot, .doc-item, .stat, tr {
    break-inside: avoid;
    page-break-inside: avoid;
  }

  /* Never orphan a heading at the foot of a page */
  .section > header, .section-title, thead {
    break-after: avoid;
    page-break-after: avoid;
  }

  /* ---- Paper is not a phone ----
     Print media queries test the PAPER width, and A4 at 96dpi is about
     794px — narrower than the 1188px tablet cut. So every printed report,
     from any device, silently inherited the one-column phone layout:
     each check on four stacked lines, each field full width. That is what
     made the sections tall enough to trigger the pagination problem above.

     A4 has ~186mm of usable width. Give the paper back its columns. */
  .field-grid { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)) !important; }
  .check-row { grid-template-columns: 54px 1fr auto 150px !important; gap: 10px !important; }
  .measure-row { grid-template-columns: 1fr 120px 80px !important; }
  .perf-row { grid-template-columns: 1fr 110px 120px 80px !important; }
  .ba-grid { grid-template-columns: 1fr 1fr !important; }
  /* Paper is 794px wide, which trips the 900px card breakpoint. A
     printed report needs real columns, not a stack of cards. */
  .table-wrap { overflow: visible !important; }
  .table-wrap table { display: table !important; table-layout: auto !important; width: 100% !important; }
  .table-wrap thead { display: table-header-group !important; }
  .table-wrap tbody { display: table-row-group !important; }
  .table-wrap tbody tr { display: table-row !important; margin: 0 !important; padding: 0 !important; border: none !important; background: none !important; }
  .table-wrap tbody td { display: table-cell !important; text-align: left !important; }
  .table-wrap tbody td::before { content: none !important; }
  .table-wrap td, .table-wrap th { white-space: normal !important; word-break: break-word; }
  .pfn { display: flex !important; }
  .pfn button { width: auto !important; flex: 0 0 auto !important; }
  .section { margin-bottom: 5mm; }
  .section > header { background: #eee !important; border-bottom: 1px solid #999 !important; }
  .section-title, .check-label, .field label, .stat-label, .stat-value { color: #000 !important; }
  .label-th, .check-label .th, .section-title .th { color: #444 !important; }

  /* Swap every control for the wrapping span built in buildPrintValues().
     A control cannot wrap its own value; a span can, so nothing is cut. */
  .main input:not([type="checkbox"]):not([type="radio"]),
  .main select,
  .main textarea { display: none !important; }
  .date-open, .datecal { display: none !important; }
  .datefield { display: block !important; }

  .print-value {
    display: inline-block !important;
    width: 100%;
    min-height: 1.35em;
    padding: 2px 0 1px;
    border-bottom: 1px solid #666;
    color: #000 !important;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    line-height: 1.35;
  }
  .print-value.is-block { min-height: 3.2em; }
  .print-value.is-blank { min-height: 1.35em; }

  .field input, .field select, .field textarea, .cell-input {
    background: #fff !important; color: #000 !important;
    border: none !important; border-bottom: 1px solid #666 !important;
    border-radius: 0 !important; padding: 2px 3px !important;
    box-shadow: none !important;
  }
  .field textarea { border: 1px solid #666 !important; min-height: 60px; }

  thead th { background: #eee !important; color: #000 !important; }
  tbody td { border-bottom: 1px solid #ccc !important; }

  /* Only the selected answer prints */
  .pfn button { display: none !important; }
  .pfn button.on {
    display: inline-block !important;
    background: #fff !important; color: #000 !important;
    border: 1.5px solid #000 !important; box-shadow: none !important;
  }
  .check-row { border-bottom: 1px solid #ddd !important; padding: 4px 0; }
  .check-row.is-fail { background: #ffecec !important; }

  .result-row button { display: none !important; }
  .result-row button.on {
    display: flex !important;
    background: #fff !important; color: #000 !important;
    border: 2px solid #000 !important; box-shadow: none !important;
  }
  .priority-row button { display: none !important; }
  .priority-row button.on {
    display: inline-block !important; background: #fff !important;
    color: #000 !important; border: 1.5px solid #000 !important; box-shadow: none !important;
  }

  .sign-pad { border: 1px solid #666; }
  .photo-drop { display: none !important; }
  .hint { color: #000 !important; background: #fff !important; border: 1px solid #000 !important; }
  .verdict { background: #fff !important; border: 1px solid #000; color: #000 !important; box-shadow: none !important; }
  .pill, .type-badge { border: 1px solid #666 !important; color: #000 !important; background: #fff !important; }
  .stat::before, .type-card::before { display: none !important; }
  .timeline::before, .tl-item::before { background: #999 !important; box-shadow: none !important; }
}

.print-head { display: none; }
.print-head h1 { margin: 0 0 2mm; font-size: 16pt; }
.print-head .ph-meta { font-size: 9pt; color: #333; }

/* ============================================================
   PROJECT PHASE MODULE
   ============================================================ */

/* Main menu: two big workspace cards */
.home-grid-2 { grid-template-columns: repeat(2, 1fr); max-width: 760px; }
@media (max-width: 640px) { .home-grid-2 { grid-template-columns: 1fr; } }
.main-stats { display: flex; gap: 10px; align-items: center; justify-content: center; margin-top: 22px;
  font-size: 12.5px; color: var(--text-faint); font-weight: 600; letter-spacing: .02em; }
.main-stats-dot { opacity: .5; }

/* Sidebar "Main menu" back button — quieter than the module items */
.nav-back { margin-top: 8px; border-top: 1px solid var(--hairline-soft); padding-top: 12px !important; opacity: .82; }
.nav-back:hover { opacity: 1; }

/* Requirement list */
.req-list, .followup-list { display: flex; flex-direction: column; gap: 10px; }
.req-card, .fu-row {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  background: var(--glass); border: 1px solid var(--edge); border-radius: 14px;
  box-shadow: var(--lift-1); padding: 15px 17px; cursor: pointer; color: var(--text);
  transition: transform .2s cubic-bezier(.3,1.1,.4,1), box-shadow .2s, border-color .2s;
}
.req-card:hover, .fu-row:hover { transform: translateY(-2px); box-shadow: var(--lift-2); border-color: color-mix(in srgb, var(--accent-blue) 30%, var(--edge)); }
.req-card-main, .fu-main { flex: 1; min-width: 0; background: none; border: none; text-align: left; cursor: pointer; color: inherit; padding: 0; }
.req-card-top, .fu-top, .req-card-top { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
.req-no { font-family: var(--font-mono, ui-monospace, monospace); font-size: 12px; font-weight: 700; color: var(--text-dim); letter-spacing: .01em; }
.req-title { font-size: 15.5px; font-weight: 650; margin: 2px 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.req-meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-faint); }
.req-meta svg { width: 12px; height: 12px; vertical-align: -2px; }
.req-dot { opacity: .45; }
.req-arrow { color: var(--text-faint); font-size: 18px; flex: 0 0 auto; }

/* Stage badge */
.stage-badge { display: inline-flex; align-items: center; font-size: 11px; font-weight: 700; letter-spacing: .03em;
  padding: 3px 10px; border-radius: 999px; color: var(--sc, var(--accent-blue));
  background: color-mix(in srgb, var(--sc, var(--accent-blue)) 15%, transparent);
  border: 1px solid color-mix(in srgb, var(--sc, var(--accent-blue)) 40%, transparent); }

/* Requirement list: toolbar, status grouping, blinking status cards */
.req-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 4px 0 16px; }
.req-sort { display: inline-flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--surface); border: 1px solid var(--edge); }
.req-sort .seg-btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 9px; border: none; cursor: pointer;
  background: transparent; color: var(--text-faint); font-size: 12.5px; font-weight: 650; transition: background .16s, color .16s, box-shadow .16s; }
.req-sort .seg-btn svg { width: 14px; height: 14px; }
.req-sort .seg-btn:hover { color: var(--text); }
.req-sort .seg-btn.on { color: var(--text); background: var(--glass); box-shadow: var(--lift-1); }
.btn-ghost { background: transparent; border-color: color-mix(in srgb, var(--fail) 34%, var(--edge)); color: var(--fail); }
.btn-ghost:hover { background: color-mix(in srgb, var(--fail) 10%, transparent); }

/* Filter (Active/Won) + sort tabs sit together on the left */
.req-tabwrap { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.seg-count { font-size: 10.5px; font-weight: 800; line-height: 1; padding: 2px 6px; border-radius: 999px;
  background: color-mix(in srgb, var(--text-faint) 22%, transparent); color: var(--text-dim); }
.req-sort .seg-btn.on .seg-count { background: color-mix(in srgb, var(--accent-blue) 26%, transparent); color: var(--text); }

.req-group-head { display: flex; align-items: center; gap: 9px; margin: 22px 0 10px; }
.req-group-head:first-of-type { margin-top: 4px; }
.req-group-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--sc); flex: 0 0 auto;
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--sc) 22%, transparent); }
.req-group-head.is-blink .req-group-dot { animation: reqDot var(--blink-dur, 2s) ease-in-out infinite; }
.req-group-ico { display: inline-flex; color: var(--sc); }
.req-group-ico svg { width: 14px; height: 14px; }
.req-group-name { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--sc); }
.req-group-count { font-size: 11px; font-weight: 700; color: var(--text-faint); background: color-mix(in srgb, var(--sc) 14%, transparent);
  border: 1px solid color-mix(in srgb, var(--sc) 32%, transparent); border-radius: 999px; padding: 1px 8px; }
.req-group-head + .req-list { margin-bottom: 4px; }

/* Cards carry the colour of what they are waiting on. Blinking ones
   (a stage still to confirm) pulse the border at a speed set per stage;
   final ones (won / lost) hold a steady coloured border. */
.req-card { position: relative; overflow: hidden; padding: 0; gap: 0; align-items: stretch;
  border-color: color-mix(in srgb, var(--sc, var(--edge)) 42%, var(--edge));
  background: linear-gradient(90deg, color-mix(in srgb, var(--sc) 8%, transparent), transparent 42%), var(--glass); }
.req-card.is-blink { animation: reqPulse var(--blink-dur, 2.4s) ease-in-out infinite; }
.req-card.is-blink:hover { animation-play-state: paused; }
.req-card.is-final { box-shadow: var(--lift-1), 0 0 0 1px color-mix(in srgb, var(--sc) 40%, transparent); }
.req-card.status-won  { background: linear-gradient(90deg, color-mix(in srgb, var(--sc) 12%, transparent), transparent 46%), var(--glass); }
.req-card.status-lost { background: linear-gradient(90deg, color-mix(in srgb, var(--sc) 11%, transparent), transparent 46%), var(--glass); opacity: .9; }

/* ---- Compact single-line requirement row ---- */
.req-list { gap: 8px; }
.req-card.req-compact { display: flex; align-items: center; gap: 11px; padding: 0 16px 0 12px; min-height: 52px; overflow: visible; border-left: 4px solid var(--sc); }
.rc-status { display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto; min-width: 128px; color: var(--sc); }
.rc-status-ico { display: inline-flex; }
.rc-status-ico svg { width: 15px; height: 15px; }
.rc-status-name { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rc-no { font-family: var(--font-mono, ui-monospace, monospace); font-size: 11px; font-weight: 700; color: var(--text-faint); flex: 0 0 auto; }
.rc-title { font-size: 14px; font-weight: 650; color: var(--text); flex: 0 1 auto; min-width: 50px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rc-cust { font-size: 12.5px; color: var(--text-faint); flex: 0 1 auto; max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rc-cust::before { content: '· '; opacity: .5; }
.rc-spring { flex: 1 1 auto; min-width: 8px; }
.rc-needs { display: inline-flex; gap: 5px; flex: 0 0 auto; }
.rc-need { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 999px; font-size: 10.5px; font-weight: 750; white-space: nowrap;
  color: var(--nc); border: 1px solid color-mix(in srgb, var(--nc) 42%, var(--edge)); background: color-mix(in srgb, var(--nc) 9%, transparent); }
.rc-need.sent { color: #fff; background: var(--nc); border-color: transparent; }
.rc-people { display: inline-flex; gap: 6px; flex: 0 0 auto; }
.rc-person { position: relative; display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px;
  font-size: 11px; font-weight: 650; color: var(--text); background: color-mix(in srgb, var(--role) 8%, var(--surface));
  border: 1.5px solid color-mix(in srgb, var(--role) 48%, var(--edge)); white-space: nowrap; }
.rc-person-ico { display: inline-flex; color: var(--role); }
.rc-person-ico svg { width: 11px; height: 11px; }

/* --- Donut: arcs draw in, and a slice pops + previews in the centre --- */
