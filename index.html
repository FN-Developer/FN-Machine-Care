  function touch(rec) {
    rec.updatedAt = new Date().toISOString();
    saveDB();
  }

  /* Leave a marker, not a hole.

     Simply removing the record from the shared database tells the other
     tablets nothing: they are holding a copy that nothing ever
     contradicts, so it stays on their screen — and the next time one of
     them reconnects it uploads that copy again and the document comes
     back from the dead. A tablet that was switched off during the delete
     can only ever learn about it from something that is still there when
     it wakes up.

     So a deletion is a small record of its own — id, type, docNo and the
     moment it happened — which travels like any other change and is
     settled by the same last-write-wins rule. saveDB() pushes it. */
  function tombstoneRecord(rec) {
    db.meta.tombstones = db.meta.tombstones || {};
    db.meta.tombstones[rec.id] = {
      type: rec.type,
      docNo: rec.docNo,
      updatedAt: new Date().toISOString(),
    };
    db.records = db.records.filter((r) => r.id !== rec.id);
    saveDB();
  }

  function deleteRecord(rec) {
    if (!confirm(T(UI.confirmDelete))) return;
    tombstoneRecord(rec);
    go('records');
  }

  /* Wipe every entry on this form back to blank (the document itself is
     kept — use Delete to remove it entirely). Confirmed first, since it
     cannot be undone. */
  function clearForm(rec) {
    if (!confirm(T({
      en: 'Clear everything filled in on this form? The document is kept but all entries are removed.',
      th: 'ล้างข้อมูลที่กรอกทั้งหมดในเอกสารนี้หรือไม่? เอกสารยังอยู่ แต่ข้อมูลที่กรอกจะถูกลบทั้งหมด',
    }))) return;
    clearRecord(rec);
    render();
    toast(T({ en: 'Form cleared', th: 'ล้างข้อมูลแล้ว' }));
  }

  /* ---- Section dispatcher ---- */

  function renderSection(rec, def, section) {
    const box = el('section', { class: 'section' + (section.critical ? ' critical' : ''), id: 'sec-' + section.id });

    const head = el('header', {}, [
      el('div', { class: 'section-title' }, [
        el('div', { class: 'label-en', text: section.title.en }),
        el('div', { class: 'label-th th', text: section.title.th }),
      ]),
    ]);
    const prog = sectionProgress(rec, section);
    if (prog) {
      const bar = el('div', { class: 'progress-bar' }, el('div', {
        class: 'progress-fill',
        style: `width:${prog.total ? (prog.done / prog.total) * 100 : 0}%`,
      }));
      head.appendChild(el('div', { class: 'section-progress' }, [el('span', { text: `${prog.done}/${prog.total}` }), bar]));
    }
    box.appendChild(head);

    const body = el('div', { class: 'section-body' });
    if (section.hint) body.appendChild(el('div', { class: 'hint' }, [L(section.hint)]));

    const renderers = {
      fields: renderFields,
      checklist: renderChecklist,
      condition: renderChecklist,
      measurements: renderMeasurements,
      performance: renderPerformance,
      documents: renderDocuments,
      photos: renderPhotos,
      beforeafter: renderBeforeAfter,
      table: renderTable,
      costtable: renderCostTable,
      notes: renderNotes,
      problem: renderProblem,
      rootcause: renderRootCause,
      result: renderResult,
      signoff: renderSignoff,
    };
    (renderers[section.type] || renderNotes)(body, rec, def, section);
    box.appendChild(body);
    return box;
  }

  /* ---- fields ---- */

  function renderFields(body, rec, def, section) {
    const grid = el('div', { class: 'field-grid' });
    section.fields.forEach((f) => {
      const wrap = el('div', { class: 'field', 'data-field': f.key });
      wrap.appendChild(el('label', {}, [
        L(f.label),
        f.required ? el('span', { class: 'req', text: ' *' }) : null,
        f.unit ? el('span', { class: 'unit', text: '(' + f.unit + ')' }) : null,
      ]));

      let input;

      if (f.type === 'person') {
        input = personField(rec, f, wrap);

      } else if (f.type === 'select') {
        input = el('select', {
          onchange: (e) => { rec.fields[f.key] = e.target.value; touch(rec); markField(wrap, rec, f); },
        });
        input.appendChild(el('option', { value: '', text: '—' }));
        f.options.forEach((o) => {
          const opt = el('option', { value: o.value, text: T(o.label) });
          if (rec.fields[f.key] === o.value) opt.selected = true;
          input.appendChild(opt);
        });

      } else if (f.type === 'date') {
        input = dateField({
          value: rec.fields[f.key] || '',
          onCommit: (iso) => {
            rec.fields[f.key] = iso;
            if (f.identity) autofillIdentity(rec, f.key, iso);
            touch(rec);
            markField(wrap, rec, f);
          },
        });

      } else {
        input = el('input', {
          type: f.type || 'text',
          placeholder: f.placeholder || '',
          value: rec.fields[f.key] || '',
          step: f.type === 'number' ? 'any' : null,
          oninput: (e) => { rec.fields[f.key] = e.target.value; markField(wrap, rec, f); },
          onchange: (e) => {
            rec.fields[f.key] = e.target.value;
            /* No identity auto-fill — related values are offered by the
               suggestion dropdowns instead of written in unasked. */
            touch(rec);
            markField(wrap, rec, f);
          },
        });

        /* Suggestions from prior entries. A native <datalist> used to do
           this, but its dropdown does not show on iPhone/iPad and most
           mobile browsers — the technician got a plain box with no way to
           pick. This is a custom, touch-friendly picker instead; a
           brand-new value is still allowed. */
        if (f.suggest) {
          input = attachSuggest(input, wrap, rec, f);
        }
      }

      wrap.appendChild(input);
      markField(wrap, rec, f);
      grid.appendChild(wrap);
    });
    body.appendChild(grid);
  }

  /* Touch-friendly suggestion picker for text fields — replaces the native
     <datalist>, whose dropdown does not appear on phones and tablets. Tap
     the field (or its caret) to see values entered before, type to filter,
     tap one to fill it in; typing a brand-new value is always allowed.
     The list is hung on <body> (positioned like the chart tooltip) so the
     section card's overflow:hidden can't clip it. Returns a combobox
     wrapper, or the plain input when there is nothing to suggest yet. */
  function attachSuggest(input, wrap, rec, f) {
    /* Combo only if this field has ever had values at all; the list
       itself is rebuilt on every open, narrowed to what relates to the
       other fields already chosen (see suggestionsRelated). */
    if (!suggestionsFor(f.key).length) return input;

    input.setAttribute('autocomplete', 'off');
    input.setAttribute('role', 'combobox');
    input.setAttribute('aria-autocomplete', 'list');
    input.setAttribute('aria-expanded', 'false');

    const combo = el('div', { class: 'combo' });
    const caret = el('button', {
      class: 'combo-caret', type: 'button', tabindex: '-1',
      'aria-label': T({ en: 'Show suggestions', th: 'แสดงรายการที่เคยกรอก' }),
    }, ['⌄']);
    const pop = el('div', { class: 'combo-pop', role: 'listbox' });

    let open = false;

    function reposition() {
      pop.style.width = input.offsetWidth + 'px';
      placeFloating(pop, input.getBoundingClientRect(), { below: true, align: 'start', gap: 5 });
    }
    /* Scrolling INSIDE the list must not close it — only the page
       scrolling underneath does. And dragging the list's scrollbar blurs
       the input, so the blur-close is skipped while the pointer is over
       the list; an outside tap/click closes it instead. */
    let overPop = false;
    pop.addEventListener('pointerenter', () => { overPop = true; });
    pop.addEventListener('pointerleave', () => { overPop = false; });
    const onScroll = (e) => { if (e && e.target && pop.contains(e.target)) return; close(); };
    const onDocDown = (e) => {
      if (!pop.contains(e.target) && !combo.contains(e.target)) close();
    };
    function setOpen(v) {
      if (v === open) { if (v) reposition(); return; }
      open = v;
      input.setAttribute('aria-expanded', v ? 'true' : 'false');
      combo.classList.toggle('is-open', v);
      if (v) {
        document.body.appendChild(pop);
        reposition();
        window.addEventListener('scroll', onScroll, true);
        window.addEventListener('resize', onScroll);
        document.addEventListener('pointerdown', onDocDown, true);
      } else {
        overPop = false;
        if (pop.parentNode) pop.parentNode.removeChild(pop);
        window.removeEventListener('scroll', onScroll, true);
        window.removeEventListener('resize', onScroll);
        document.removeEventListener('pointerdown', onDocDown, true);
      }
    }
    function close() { setOpen(false); }

    function choose(v) {
      input.value = v;
      rec.fields[f.key] = v;
      close();
      /* Deliberately NO auto-fill of the other fields — picking a value
         here only narrows what the other dropdowns offer. */
      touch(rec);
      markField(wrap, rec, f);
    }

    function build() {
      const values = suggestionsRelated(rec, f.key);
      const q = (input.value || '').trim().toLowerCase();
      const hasVal = (input.value || '').trim() !== '';
      /* Skip a match that is exactly what's already typed — no point. */
      const matches = values.filter((v) => (!q || v.toLowerCase().indexOf(q) !== -1) && v.toLowerCase() !== q);
      pop.innerHTML = '';

      /* A "None" row at the top clears the field back to empty — only
         worth showing when there is something to clear. mousedown +
         preventDefault (not click) keeps focus on the input so blur never
         fires before the pick is handled — the trick that makes this work
         the same on a touchscreen. */
      if (hasVal) {
        pop.appendChild(el('div', {
          class: 'combo-opt combo-clear', role: 'option',
          onmousedown: (e) => { e.preventDefault(); choose(''); },
        }, [T({ en: 'None (clear)', th: 'ไม่ระบุ (ล้างค่า)' })]));
      }

      matches.slice(0, 60).forEach((v) => {
        pop.appendChild(el('div', {
          class: 'combo-opt', role: 'option',
          onmousedown: (e) => { e.preventDefault(); choose(v); },
        }, [v]));
      });

      if (!pop.children.length) { close(); return; }
      setOpen(true);
    }

    input.addEventListener('focus', build);
    input.addEventListener('input', build);
    input.addEventListener('blur', () => setTimeout(() => { if (!overPop) close(); }, 60));
    input.addEventListener('keydown', (e) => { if (e.key === 'Escape' && open) { e.stopPropagation(); close(); } });
    caret.addEventListener('mousedown', (e) => {
      e.preventDefault();
      if (open) { close(); return; }
      input.focus();
      build();
    });

    combo.appendChild(input);
    combo.appendChild(caret);
    return combo;
  }

  /* Choose a person, see their position, or add someone new. */
  function personField(rec, f, wrap) {
    const holder = el('div', { class: 'person-field' });

    const sel = el('select', {
      class: 'person-select',
      onchange: (e) => {
        const v = e.target.value;
        if (v === '__add') {
          e.target.value = rec.fields[f.key] || '';
          openAddPerson(rec, f, wrap, sel);
          return;
        }
        rec.fields[f.key] = v;
        const p = findPerson(v);
        rec.fields[f.key + '_pos'] = p ? p.position : '';
        touch(rec);
        refresh();
        markField(wrap, rec, f);
      },
    });

    const note = el('div', { class: 'person-note' });

    function refresh() {
      sel.innerHTML = '';
      sel.appendChild(el('option', { value: '', text: T({ en: '— select a person —', th: '— เลือกผู้รับผิดชอบ —' }) }));
      people().forEach((p) => {
        const o = el('option', { value: p.name, text: p.position ? `${p.name} — ${T(positionLabel(p.position))}` : p.name });
        if ((rec.fields[f.key] || '') === p.name) o.selected = true;
        sel.appendChild(o);
      });
      /* A name typed before this register existed still has to show */
      const current = rec.fields[f.key];
      if (current && !people().some((p) => p.name === current)) {
        const o = el('option', { value: current, text: current });
        o.selected = true;
        sel.appendChild(o);
      }
      sel.appendChild(el('option', { value: '__add', text: T({ en: '+ Add a person…', th: '+ เพิ่มรายชื่อ…' }) }));

      const pos = positionOf(rec, f.key);
      note.textContent = pos ? pos : '';
      note.style.display = pos ? '' : 'none';
    }

    refresh();
    holder.appendChild(sel);
    holder.appendChild(note);
    holder._refresh = refresh;
    return holder;
  }

  function openAddPerson(rec, f, wrap, sel) {
    const nameInput = el('input', { type: 'text', placeholder: T({ en: 'Full name', th: 'ชื่อ-นามสกุล' }) });
    const posSel = el('select', {});
    posSel.appendChild(el('option', { value: '', text: T({ en: '— position —', th: '— ตำแหน่ง —' }) }));
    POSITIONS.forEach((p) => posSel.appendChild(el('option', { value: p.value, text: T(p.label) })));

    const err = el('div', { class: 'modal-error', style: 'display:none' });

    modal({
      title: { en: 'Add a person', th: 'เพิ่มรายชื่อ' },
      note: { en: 'They will be available on every form from now on.',
              th: 'เมื่อเพิ่มแล้วจะเลือกได้ในทุกเอกสารต่อไป' },
      body: [
        err,
        el('div', { class: 'field' }, [el('label', {}, [L({ en: 'Name', th: 'ชื่อ' })]), nameInput]),
        el('div', { class: 'field' }, [el('label', {}, [L({ en: 'Position', th: 'ตำแหน่ง' })]), posSel]),
      ],
      confirmLabel: { en: 'Add', th: 'เพิ่ม' },
      onConfirm: () => {
        const name = nameInput.value.trim();
        if (!name) { err.style.display = ''; err.textContent = T({ en: 'Please type a name.', th: 'กรุณากรอกชื่อ' }); return false; }
        if (!posSel.value) { err.style.display = ''; err.textContent = T({ en: 'Please choose a position.', th: 'กรุณาเลือกตำแหน่ง' }); return false; }
        addPerson(name, posSel.value);
        rec.fields[f.key] = name;
        rec.fields[f.key + '_pos'] = posSel.value;
        touch(rec);
        if (sel.parentElement && sel.parentElement._refresh) sel.parentElement._refresh();
        markField(wrap, rec, f);
        toast(T({ en: 'Person added', th: 'เพิ่มรายชื่อแล้ว' }));
        return true;
      },
    });
    setTimeout(() => nameInput.focus(), 60);
  }

  /* Meeting participants: chips for who is coming, plus one dropdown that
     picks from the saved register, adds a fresh name (kept for reuse), or
     opens the manager to delete a wrong name. */
  function participantPicker(rec, mt) {
    mt.people = mt.people || [];
    const holder = el('div', { class: 'part-field' });

    function rebuild() {
      holder.innerHTML = '';

      const chips = el('div', { class: 'part-chips' });
      if (!mt.people.length) {
        chips.appendChild(el('span', { class: 'part-empty' }, [L({ en: 'No participants yet', th: 'ยังไม่มีผู้เข้าร่วม' })]));
      }
      mt.people.forEach((nm, i) => {
        const p = findPerson(nm);
        const label = p && p.position ? `${nm} · ${T(positionLabel(p.position))}` : nm;
        chips.appendChild(el('span', { class: 'part-chip' }, [
          el('span', { class: 'part-chip-name' }, [label]),
          el('button', {
            class: 'part-chip-x', type: 'button', 'aria-label': 'remove',
            onclick: () => { mt.people.splice(i, 1); touch(rec); rebuild(); },
          }, ['✕']),
        ]));
      });
      holder.appendChild(chips);

      const sel = el('select', { class: 'part-select' });
      sel.appendChild(el('option', { value: '', text: T({ en: '+ Add participant…', th: '+ เพิ่มผู้เข้าร่วม…' }) }));
      const avail = people().filter((p) => !mt.people.some((n) => n.toLowerCase() === p.name.toLowerCase()));
      if (avail.length) {
        const g = el('optgroup', { label: T({ en: 'Saved names', th: 'รายชื่อที่บันทึกไว้' }) });
        avail.forEach((p) => g.appendChild(el('option', { value: 'name:' + p.name, text: p.position ? `${p.name} — ${T(positionLabel(p.position))}` : p.name })));
        sel.appendChild(g);
      }
      sel.appendChild(el('option', { value: '__add', text: T({ en: '+ Add new name…', th: '+ เพิ่มรายชื่อใหม่…' }) }));
      sel.appendChild(el('option', { value: '__manage', text: T({ en: '⚙ Manage names…', th: '⚙ จัดการรายชื่อ…' }) }));
      sel.value = '';
      sel.addEventListener('change', () => {
        const v = sel.value;
        sel.value = '';
        if (v === '__add') { openAddParticipant(rec, mt, rebuild); return; }
        if (v === '__manage') { openManagePeople(rebuild); return; }
        if (v.startsWith('name:')) {
          const nm = v.slice(5);
          if (!mt.people.some((n) => n.toLowerCase() === nm.toLowerCase())) { mt.people.push(nm); touch(rec); rebuild(); }
        }
      });
      holder.appendChild(el('div', { class: 'part-add no-print' }, [sel]));
    }

    rebuild();
    return holder;
  }

  /* Add a name that is stored in the register and dropped straight into
     this meeting. */
  function openAddParticipant(rec, mt, done) {
    const nameInput = el('input', { type: 'text', placeholder: T({ en: 'Full name', th: 'ชื่อ-นามสกุล' }) });
    const posSel = el('select', {});
    posSel.appendChild(el('option', { value: '', text: T({ en: '— position (optional) —', th: '— ตำแหน่ง (ถ้ามี) —' }) }));
    POSITIONS.forEach((p) => posSel.appendChild(el('option', { value: p.value, text: T(p.label) })));
    const err = el('div', { class: 'modal-error', style: 'display:none' });

    modal({
      title: { en: 'Add a name', th: 'เพิ่มรายชื่อ' },
      note: { en: 'Saved to the list, so you can reuse it next time.', th: 'บันทึกไว้ในรายชื่อ เลือกใช้ซ้ำได้ครั้งต่อไป' },
      body: [
        err,
        el('div', { class: 'field' }, [el('label', {}, [L({ en: 'Name', th: 'ชื่อ' })]), nameInput]),
        el('div', { class: 'field' }, [el('label', {}, [L({ en: 'Position', th: 'ตำแหน่ง' })]), posSel]),
      ],
      confirmLabel: { en: 'Add', th: 'เพิ่ม' },
      onConfirm: () => {
        const name = nameInput.value.trim();

        return true;
      },
    });

    function rebuild() {
      holder.innerHTML = '';
      const sel = el('select', { class: 'part-select assignee-select' });
      sel.appendChild(el('option', { value: '', text: T(opts.placeholder || { en: '— unassigned —', th: '— ยังไม่มอบหมาย —' }) }));
      people().forEach((p) => sel.appendChild(el('option', { value: 'name:' + p.name, text: p.position ? `${p.name} — ${T(positionLabel(p.position))}` : p.name })));

        sel.appendChild(el('option', { value: 'name:' + opts.value, text: opts.value }));
      }
      sel.appendChild(el('option', { value: '__add', text: T({ en: '+ Add new name…', th: '+ เพิ่มรายชื่อใหม่…' }) }));
      sel.value = opts.value ? 'name:' + opts.value : '';

      holder.appendChild(sel);

  /* Choosing one known identity value fills in the rest. */
  function autofillIdentity(rec, key, value) {
    const match = machineMatching(key, value, rec.id);
    if (!match) return;
    let filled = 0;
    IDENTITY_KEYS.forEach((k) => {
      if (k === key) return;
      const from = (match.fields[k] || '').trim();
      if (!from) return;
      if ((rec.fields[k] || '').trim() === from) return;
      rec.fields[k] = from;
      filled++;
    });
    if (filled) {
      touch(rec);
      toast(T({ en: 'Machine details filled in', th: 'เติมข้อมูลเครื่องจักรให้แล้ว' }));

  }

  /* Green when satisfied, blinking red when the form has been
     submitted and this one is still empty. */
  /* ---- placing floating layers ----
     A popup fixed to the viewport has to reconcile two coordinate
     systems, and mixing them is silent and wrong.

       getBoundingClientRect()  VISUAL px — zoom already applied
       offsetWidth / style.left LAYOUT px — inside the zoomed <html>

     At --ui-scale 1.1 a tooltip clamped with innerWidth still painted
     67px past the right edge of a 1440px screen, because the clamp was
     done in one space and the write landed in the other. Convert once,
     here, and every popup in the app inherits the fix. */
  function uiScale() {
    const z = parseFloat(getComputedStyle(document.documentElement).zoom);
    return z && isFinite(z) && z > 0 ? z : 1;
  }

  function placeFloating(node, anchor, opts) {
    opts = opts || {};
    const s = uiScale();
    const w = node.offsetWidth * s;
    const h = node.offsetHeight * s;
    const gap = opts.gap == null ? 10 : opts.gap;
    const pad = 8;

    let left = opts.align === 'start'
      ? anchor.left
      : anchor.left + anchor.width / 2 - w / 2;
    left = Math.max(pad, Math.min(left, window.innerWidth - w - pad));

    /* Preferred side first, then flip, then clamp — so a popup taller
       than the space on either side still lands fully on screen. */
    let top = opts.below ? anchor.bottom + gap : anchor.top - h - gap;
    if (top < pad) top = anchor.bottom + gap;
    if (top + h > window.innerHeight - pad) top = anchor.top - h - gap;
    top = Math.max(pad, Math.min(top, window.innerHeight - h - pad));

    node.style.left = (left / s) + 'px';
    node.style.top = (top / s) + 'px';
  }

  /* ---- chart tooltip ----
     Lives on <body>, not inside the plot. As a child of the panel it was
     clipped by the panel's own rounded overflow, and the clamp bounded
     its CENTRE — so half of a 158px tooltip still hung over the edge on
     the last bar of the chart. Positioned against the viewport instead,
     measured after it has content, and flipped below the bar when there
     is no room above. */
  let chartTipEl = null;
  function chartTip() {
    if (!chartTipEl || !chartTipEl.isConnected) {
      chartTipEl = el('div', { class: 'chart-tip', role: 'status' });
      document.body.appendChild(chartTipEl);
    }
    return chartTipEl;
  }
  function hideChartTip() { if (chartTipEl) chartTipEl.classList.remove('show'); }
  function placeChartTip(tip, anchor) {
    tip.classList.add('measuring');
    placeFloating(tip, anchor, { gap: 10 });
    tip.classList.remove('measuring');
    tip.classList.add('show');
  }
  window.addEventListener('scroll', hideChartTip, true);
  window.addEventListener('resize', hideChartTip);

  function markField(wrap, rec, f) {
    if (!wrap) return;
    const filled = String(rec.fields[f.key] || '').trim() !== '';
    wrap.classList.toggle('is-ok', !!(f.required && filled));
    wrap.classList.toggle('is-missing', !!(f.required && !filled && rec._showErrors));
  }

  function renderPerformance(body, rec, def, section) {
    if (!rec.perf[section.id]) rec.perf[section.id] = {};
    const vals = rec.perf[section.id];

    body.appendChild(
      el('div', { class: 'perf-row', style: 'font-size:11.5px;letter-spacing:.5px;color:var(--text-faint);text-transform:uppercase' }, [
        el('div', { text: 'Test' }),
        el('div', { text: T(UI.target) }),
        el('div', { text: T(UI.actual) }),
        el('div', { text: T(UI.result) }),
      ])
    );

    section.items.forEach((p) => {
      const verdict = el('div', { class: 'verdict none', text: '—' });
      const updateVerdict = () => {
        const v = parseFloat(vals[p.key]);
        const limit = parseFloat(String(p.target).replace(/[^0-9.]/g, ''));
        if (isNaN(v) || isNaN(limit)) {
          verdict.className = 'verdict none';
          verdict.textContent = '—';
          return;
        }
        const ok = p.better === 'lower' ? v <= limit : v >= limit;
        verdict.className = 'verdict ' + (ok ? 'pass' : 'fail');
        verdict.textContent = ok ? T(UI.pass) : T(UI.fail);
      };

      body.appendChild(
        el('div', { class: 'perf-row' }, [

            el('div', { class: 'label-en', text: p.label.en }),
            el('div', { class: 'label-th th', text: p.label.th }),

  /* ---- photos ---- */

  function compressImage(file, maxDim, quality) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          const w = Math.round(img.width * scale);
          const h = Math.round(img.height * scale);
          const canvas = el('canvas');
          canvas.width = w;
          canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function photoSlot(rec, store, key, label, onRemove) {
    const slot = el('div', { class: 'photo-slot' });
    if (label) {
      slot.appendChild(el('div', { class: 'ps-head' }, [
        el('div', { class: 'label-en', text: label.en }),
        el('div', { class: 'label-th th', text: label.th }),
      ]));
    }

    const fileInput = el('input', {
      type: 'file',
      accept: 'image/*',
      capture: 'environment',
      style: 'display:none',
      onchange: async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        try {
          store[key] = await compressImage(file, 1200, 0.72);
          touch(rec);
          render();
        } catch (err) {
          toast(lang === 'th' ? 'อ่านรูปไม่สำเร็จ' : 'Could not read image', true);
        }
        e.target.value = '';
      },
    });
    slot.appendChild(fileInput);

    if (store[key]) {
      slot.appendChild(el('img', { src: store[key], alt: label ? label.en : 'photo' }));
      slot.appendChild(
        el('div', { class: 'photo-actions no-print' }, [
          el('button', { class: 'btn btn-sm', onclick: () => fileInput.click() }, [L({ en: 'Replace', th: 'เปลี่ยนรูป' })]),
          el('button', {
            class: 'btn btn-sm btn-danger',
            onclick: () => {
              if (onRemove) onRemove();
              else delete store[key];
              touch(rec);
              render();
            },
          }, [L(UI.remove)]),
        ])
      );
    } else {
      slot.appendChild(
        el('div', { class: 'photo-drop', onclick: () => fileInput.click() }, [
          el('div', {}, [
            el('div', { style: 'font-size:22px', text: '📷' }),
            el('div', { text: lang === 'th' ? 'แตะเพื่อถ่าย / เลือกรูป' : 'Tap to take / choose photo' }),
          ]),
        ])
      );
    }
    return slot;
  }

  /* ---- signatures ---- */

  function renderSignoff(body, rec, def, section) {
    const grid = el('div', { class: 'sign-grid' });
    section.roles.forEach((role) => {
      if (!rec.signatures[role.key]) rec.signatures[role.key] = { data: '', name: '', date: '' };
      const sig = rec.signatures[role.key];

      const canvas = el('canvas', { class: 'sign-pad', width: 520, height: 130 });
      const hasName = String(sig.name || '').trim() !== '';
      const card = el('div', {
        class: 'sign-card' + (hasName ? ' is-ok' : (rec._showErrors ? ' is-missing' : '')),
        'data-role': role.key,
      }, [
        el('h4', {}, [
          el('span', { class: 'label-en', text: role.label.en }),
          el('span', { class: 'label-th th', text: ' ' + role.label.th }),
        ]),
        canvas,
        el('div', { class: 'sign-meta' }, [
          el('input', {
            class: 'cell-input',
            placeholder: T(UI.name),
            value: sig.name || '',
            oninput: (e) => {
              sig.name = e.target.value;
              const ok = e.target.value.trim() !== '';
              card.classList.toggle('is-ok', ok);
              card.classList.toggle('is-missing', !ok && !!rec._showErrors);
            },
            onchange: (e) => { sig.name = e.target.value; touch(rec); },
          }),
          dateField({
            inputClass: 'cell-input',
            value: sig.date || '',
            onCommit: (iso) => { sig.date = iso; touch(rec); },
          }),
        ]),
        el('div', { class: 'sign-foot no-print' }, [
          el('button', {
            class: 'btn btn-sm',
            onclick: () => {
              sig.data = '';
              const ctx = canvas.getContext('2d');
              ctx.fillStyle = '#fff';
              ctx.fillRect(0, 0, canvas.width, canvas.height);
              touch(rec);
            },
          }, [L(UI.clear)]),
        ]),
      ]);
      grid.appendChild(card);
      setupSignaturePad(canvas, sig, rec);
    });
    body.appendChild(grid);
  }

  function setupSignaturePad(canvas, sig, rec) {
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#111';

    if (sig.data) {
      const img = new Image();
      img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      img.src = sig.data;
    }

    let drawing = false;

    function pos(e) {
      const rect = canvas.getBoundingClientRect();
      const point = e.touches ? e.touches[0] : e;
      return {
        x: (point.clientX - rect.left) * (canvas.width / rect.width),
        y: (point.clientY - rect.top) * (canvas.height / rect.height),
      };
    }

    function start(e) {
      e.preventDefault();
      drawing = true;
      const p = pos(e);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
    }
    function move(e) {
      if (!drawing) return;
      e.preventDefault();
      const p = pos(e);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }
    function end() {
      if (!drawing) return;
      drawing = false;
      sig.data = canvas.toDataURL('image/png');
      touch(rec);
    }

    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
    canvas.addEventListener('touchstart', start, { passive: false });
    canvas.addEventListener('touchmove', move, { passive: false });
    canvas.addEventListener('touchend', end);
  }

  /* ---------------- Cloud ----------------
     Optional. With no Firebase config the app is exactly what it has
     always been: one device, no network. With a config it also syncs
     to a database every tablet shares — but only for a signed-in user,
     because the app sits on a public URL. */

  function cloudLabel(st) {
    if (st.status === 'live') return { en: 'Synced', th: 'ซิงก์แล้ว' };
    if (st.status === 'connecting') return { en: 'Connecting…', th: 'กำลังเชื่อมต่อ…' };
    if (st.status === 'offline') return { en: 'This device only', th: 'เฉพาะเครื่องนี้' };
    if (st.status === 'unsent') return { en: 'Not uploaded yet', th: 'ยังไม่ได้อัปโหลด' };
    if (st.status === 'error') return { en: 'Sync problem', th: 'ซิงก์มีปัญหา' };
    return { en: 'This device only', th: 'เฉพาะเครื่องนี้' };
  }

  function renderCloudBadge() {
    const host = $('#cloudBadge');
    const st = (typeof FNCloud !== 'undefined') ? FNCloud.state : null;

    /* Mirror the sync state onto the collapsed settings button's little
       dot, so status shows even while the panel is folded away. */
    const dot = $('#footSyncDot');
    if (dot && st) {
      dot.className = 'ft-sync is-' + st.status;
      dot.title = T(cloudLabel(st));
    }

    if (!host) return;
    host.innerHTML = '';
    if (typeof FNCloud === 'undefined' || !FNCloud.configured()) { host.style.display = 'none'; return; }
    host.style.display = '';

    host.className = 'cloud-badge is-' + st.status;
    host.appendChild(el('span', { class: 'cloud-dot' }));
    host.appendChild(el('span', { class: 'cloud-text', text: T(cloudLabel(st)) }));

    /* A tablet has no hover, so a problem the badge only carries in its
       tooltip is a problem nobody sees. When the database has actually
       refused a save, show the reason in full, on screen, under the
       badge — that is the difference between "it just doesn't sync" and
       a message we can act on. */
    if ((st.status === 'error' || st.status === 'unsent') && st.message) {
      host.appendChild(el('span', { class: 'cloud-err', text: st.message }));
    }

    /* Sign-in is automatic, so the badge is a status light, not a
       control. Nothing here for a technician to press or get wrong. */
    host.title = T(cloudTitle(st));
  }

  function cloudTitle(st) {
    if (st.status === 'live') {
      return { en: 'Records are shared with the other tablets.',
               th: 'ข้อมูลถูกแชร์กับแท็บเล็ตเครื่องอื่นแล้ว' };

    }

               th: 'ฐานข้อมูลกลางปฏิเสธเครื่องนี้' };

    return { en: 'No connection. Your work is safe on this tablet and will sync when the signal returns.',
             th: 'ไม่มีการเชื่อมต่อ งานถูกเก็บไว้ในเครื่องนี้และจะซิงก์เมื่อสัญญาณกลับมา' };

  function stampBuild() {
    const note = document.querySelector('.foot-note span');
    if (note) note.textContent = note.textContent.replace(/^v[\d.]+/, 'v1.2 · ' + BUILD_ID);
  }

  /* An update arrived while someone was typing, and is waiting to be
     shown. Held here rather than dropped — the record objects already
     carry the new values, only the screen is behind. */
  let pendingRemote = false;

  function isTypingInForm() {
    const a = document.activeElement;
    if (!a || !a.closest) return false;
    if (!a.closest('.form-shell')) return false;
    return /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
  }

  /* A form can be a long page, and a technician half-way down a
     checklist should not be thrown back to the top just because another
     tablet saved something. */
  function redrawKeepingPlace() {
    const y = window.scrollY;
    render();
    window.scrollTo(0, y);
  }

  /* The moment they leave the field, catch the screen up. */
  document.addEventListener('focusout', () => {
    if (!pendingRemote) return;
    setTimeout(() => {
      /* A blur that just moves to the next box is not "finished" — only
         act once focus has genuinely left the form. */
      if (!pendingRemote || isTypingInForm()) return;
      pendingRemote = false;
      if (state.view === 'form') redrawKeepingPlace(); else render();
      toast(lang === 'th' ? 'แสดงการแก้ไขจากเครื่องอื่นแล้ว' : 'Updates from other devices are now shown');
    }, 150);
  }, true);

  function startCloud() {
    if (typeof FNCloud === 'undefined') return;
    FNCloud.onChange(() => { renderCloudBadge(); });
    FNCloud.init({
      getDB: () => db,
      setDB: (next) => {
        /* Records arriving from the cloud have had their empty containers
           stripped by Firebase. Put them back before anything renders. */
        db = normaliseDB(next);
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); } catch (e) { /* full */ }
      },
      onData: (n) => {
        /* An update has arrived from another device. The only thing that
           must never happen is rebuilding a form under a technician's
           finger: render() replaces the whole screen, so a half-typed
           value and the caret would go with it.

           But that is a narrow case, and holding the whole screen back
           for it was far too blunt. Waiting also means the screen keeps
           showing values that are no longer true, which reads exactly
           like the app having failed to sync. So wait only when there is
           something to lose:

             - a change to a document we are not looking at  -> draw it
             - the open document, nobody typing              -> draw it
             - the open document while a field has focus     -> hold,
               and draw it the moment they finish with that field. */
        const say = () => toast(lang === 'th'
          ? `รับข้อมูลจากเครื่องอื่น ${n} รายการ`
          : `${n} update${n === 1 ? '' : 's'} from other devices`);

        if (state.view === 'form') {
          /* Whether the change is to THIS document or another one makes
             no difference here: render() rebuilds the entire screen, so
             any redraw takes the box being typed in with it. The only
             question that matters is whether a field has focus. (A first
             attempt keyed this on which record changed, and the
             mid-typing test caught it destroying the box for an
             unrelated update.) */
          if (isTypingInForm()) {
            pendingRemote = true;
            toast(lang === 'th'
              ? `มีการแก้ไขจากเครื่องอื่น ${n} รายการ — จะแสดงเมื่อพิมพ์เสร็จ`
              : `${n} update${n === 1 ? '' : 's'} from another device — shown when you finish typing`);
            return;
          }
          redrawKeepingPlace();
          say();
          return;
        }
        render();
        say();
      },
    }).then(() => renderCloudBadge());
  }

  /* ---------------- Pinch-to-shrink ----------------

     minimum-scale=1.1 in the viewport tag holds on Android. iOS Safari
     ignores viewport zoom limits entirely — Apple stopped honouring
     user-scalable, maximum-scale and minimum-scale in iOS 10 because
     sites were using them to trap people — so on an iPad a two-finger
     pinch still shrinks the page below the scale it is drawn at and the
     layout comes apart.

     The only lever left on iOS is the gesture events, and they are used
     narrowly here: a pinch that SHRINKS is cancelled, a pinch that
     MAGNIFIES is left alone. Reading a worn serial number off a
     nameplate in a dim plant room is exactly what zoom is for, and
     taking that away would cost more than the layout it protects.

     touch-action: manipulation on the body drops the double-tap-to-zoom
     gesture as well, which is the other way a scale gets stuck. */

  function blockPinchShrink() {
    let opening = 1;
    const shrinking = (e) => typeof e.scale === 'number' && e.scale < 0.995;

    /* gesture* are WebKit-only, which is precisely where this is needed. */
    document.addEventListener('gesturestart', (e) => { opening = e.scale || 1; }, { passive: false });
    document.addEventListener('gesturechange', (e) => { if (shrinking(e)) e.preventDefault(); }, { passive: false });
    document.addEventListener('gestureend',   (e) => { if (shrinking(e)) e.preventDefault(); }, { passive: false });

    /* Chromium on a touch screen honours minimum-scale, so nothing more
       is needed there; this is the belt for engines that do neither.
       Two fingers moving closer together, and only that, is cancelled —
       one finger still scrolls and two fingers spreading still zoom. */
    let start = null;
    const span = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
    document.addEventListener('touchstart', (e) => {
      start = e.touches.length === 2 ? span(e.touches) : null;
    }, { passive: true });
    document.addEventListener('touchmove', (e) => {
      if (e.touches.length !== 2 || start === null) return;
      if (span(e.touches) < start - 8 && e.cancelable) e.preventDefault();
    }, { passive: false });
    document.addEventListener('touchend', () => { start = null; }, { passive: true });
  }

  /* ---------------- Build stamp & update check ----------------

     GitHub Pages serves this page with Cache-Control: max-age=600, and
     phones hold onto that far longer than ten minutes — a tablet can sit
     on yesterday's build for a whole shift. Three separate bug reports
     turned out to be a device looking at an old copy, and neither of us
     could tell, because a stale app looks exactly like a broken one.

     So the app checks its own source for a newer stamp and says so.
     Cheap: one small request, ignored entirely when offline, and
     throttled so switching tabs does not hammer it. */

  const BUILD_ID = '20260829-082312';
  let lastUpdateCheck = 0;

  async function checkForUpdate() {
    if (location.protocol === 'file:') return;          /* offline copy */
    if (Date.now() - lastUpdateCheck < 5 * 60 * 1000) return;
    lastUpdateCheck = Date.now();
    try {
      const res = await fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) return;
      const text = await res.text();
      const m = text.match(/BUILD_ID\s*=\s*'([^']+)'/);
      if (m && m[1] && m[1] !== BUILD_ID) showUpdateBanner();
    } catch (e) { /* no signal — say nothing */ }
  }

  function showUpdateBanner() {
    if ($('#updateBanner')) return;
    const bar = el('div', { class: 'update-banner', id: 'updateBanner' }, [
      el('span', {}, [L({ en: 'A newer version is available.',
                          th: 'มีเวอร์ชันใหม่พร้อมใช้งาน' })]),
      el('button', {
        class: 'btn btn-primary btn-sm',
        onclick: () => {
          /* Cache-busting the URL is what actually gets a phone off a
             stale copy; a plain reload can be served from cache again. */
          const u = new URL(location.href);
          u.searchParams.set('v', Date.now());
          location.replace(u.toString());
        },
      }, [L({ en: 'Update now', th: 'อัปเดตเลย' })]),
      el('button', {
        class: 'btn btn-sm',
        onclick: () => bar.remove(),
      }, [L({ en: 'Later', th: 'ภายหลัง' })]),
    ]);
    document.body.appendChild(bar);
  }

  /* ---------------- Dates ----------------

     Every date in this app is DD/MM/YYYY, on every device.

     `<input type="date">` cannot do that. It renders in the browser's
     own locale, so a Chrome set to en-US shows 08/20/2026 while the
     record beside it prints 20/08/2026 — and no CSS or attribute can
     change it. On a shop floor where one tablet is Thai, one is English
     and one came from a US-configured laptop, the same form shows three
     different formats and 08/09 is genuinely ambiguous.

     So: a text field we control, plus our own small calendar.

     What does NOT change is storage. Records keep the ISO YYYY-MM-DD
     they always held, because that is what sorts correctly, what the
     cloud merge compares, and what every record already on a tablet
     contains. Only the reading and the typing are ours. */

  const MONTH_NAMES = {
    en: ['January','February','March','April','May','June',
         'July','August','September','October','November','December'],
    th: ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
         'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'],
  };
  const DOW_NAMES = {
    en: ['Mo','Tu','We','Th','Fr','Sa','Su'],
    th: ['จ','อ','พ','พฤ','ศ','ส','อา'],
  };

  function isoToDMY(iso) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ''));
    return m ? `${m[3]}/${m[2]}/${m[1]}` : '';
  }

  /* Deliberately forgiving. A technician with gloves on types 2482026 or
     24-8-26; all of it means the same day and none of it should be
     rejected with an empty field and no explanation. */
  function dmyToISO(text) {
    const s = String(text || '').trim();
    if (!s) return '';
    let d, mo, y;
    const parts = s.split(/[^\d]+/).filter(Boolean);
    if (parts.length === 3) {
      [d, mo, y] = parts.map(Number);
    } else {
      const digits = s.replace(/\D/g, '');
      if (digits.length === 8)      { d = +digits.slice(0,2); mo = +digits.slice(2,4); y = +digits.slice(4); }
      else if (digits.length === 6) { d = +digits.slice(0,2); mo = +digits.slice(2,4); y = +digits.slice(4); }
      else return null;
    }
    if (y < 100) y += y < 70 ? 2000 : 1900;
    /* A Buddhist-era year typed out of habit still means the right day. */
    if (y > 2400) y -= 543;
    if (!(d >= 1 && d <= 31 && mo >= 1 && mo <= 12 && y >= 1900 && y <= 2999)) return null;
    const dt = new Date(y, mo - 1, d);
    if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null;
    const p = (n) => String(n).padStart(2, '0');
    return `${y}-${p(mo)}-${p(d)}`;
  }

  let openCal = null;
  function closeCalendar() {
    if (!openCal) return;
    openCal.remove();
    openCal = null;
    document.removeEventListener('mousedown', onCalOutside, true);
    window.removeEventListener('resize', closeCalendar);
    window.removeEventListener('scroll', closeCalendar, true);
  }
  function onCalOutside(e) {
    if (openCal && !openCal.contains(e.target) && !e.target.closest('.date-open')) closeCalendar();
  }

  function openCalendar(anchor, currentISO, commit) {
    closeCalendar();
    let view = currentISO ? new Date(currentISO + 'T00:00:00') : new Date();
    if (isNaN(view)) view = new Date();
    view = new Date(view.getFullYear(), view.getMonth(), 1);

    const cal = el('div', { class: 'datecal' });
    const head = el('div', { class: 'datecal-head' });
    const title = el('button', { class: 'datecal-title', type: 'button' });
    const prev = el('button', { class: 'datecal-nav', type: 'button', text: '‹',
      title: T({ en: 'Previous month', th: 'เดือนก่อน' }) });
    const next = el('button', { class: 'datecal-nav', type: 'button', text: '›',
      title: T({ en: 'Next month', th: 'เดือนถัดไป' }) });
    head.append(prev, title, next);

    const dow = el('div', { class: 'datecal-dow' });
    DOW_NAMES[lang === 'th' ? 'th' : 'en'].forEach((d) => dow.appendChild(el('span', { text: d })));

    const grid = el('div', { class: 'datecal-grid' });
    const foot = el('div', { class: 'datecal-foot' });
    const todayBtn = el('button', { class: 'btn btn-sm', type: 'button',
      text: T({ en: 'Today', th: 'วันนี้' }) });
    const clearBtn = el('button', { class: 'btn btn-sm', type: 'button',
      text: T({ en: 'Clear', th: 'ล้าง' }) });
    foot.append(todayBtn, clearBtn);
    cal.append(head, dow, grid, foot);

    function draw() {
      title.textContent = MONTH_NAMES[lang === 'th' ? 'th' : 'en'][view.getMonth()] + ' ' + view.getFullYear();
      grid.innerHTML = '';
      /* Monday-first: the working week as a Thai factory reads it. */
      const firstDow = (new Date(view.getFullYear(), view.getMonth(), 1).getDay() + 6) % 7;
      const days = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();
      const p = (n) => String(n).padStart(2, '0');
      const todayStr = todayISO();
      for (let i = 0; i < firstDow; i++) grid.appendChild(el('span', { class: 'datecal-pad' }));
      for (let d = 1; d <= days; d++) {
        const iso = `${view.getFullYear()}-${p(view.getMonth() + 1)}-${p(d)}`;
        const b = el('button', { class: 'datecal-day', type: 'button', text: String(d) });
        if (iso === currentISO) b.classList.add('is-sel');
        if (iso === todayStr) b.classList.add('is-today');
        b.addEventListener('click', () => { commit(iso); closeCalendar(); });
        grid.appendChild(b);
      }
    }
    prev.addEventListener('click', () => { view.setMonth(view.getMonth() - 1); draw(); });
    next.addEventListener('click', () => { view.setMonth(view.getMonth() + 1); draw(); });
    title.addEventListener('click', () => { view = new Date(); view.setDate(1); draw(); });
    todayBtn.addEventListener('click', () => { commit(todayISO()); closeCalendar(); });
    clearBtn.addEventListener('click', () => { commit(''); closeCalendar(); });
    draw();

    /* Fixed to the viewport, not the field: the calendar must escape the
       drawer and any scrolling panel that would otherwise clip it. */
    document.body.appendChild(cal);
    placeFloating(cal, anchor.getBoundingClientRect(), { align: 'start', below: true, gap: 6 });
    openCal = cal;

    setTimeout(() => {
      document.addEventListener('mousedown', onCalOutside, true);
      window.addEventListener('resize', closeCalendar);
      window.addEventListener('scroll', closeCalendar, true);
    }, 0);
  }

  /* One date control, used by header fields, table cells and signatures.
     Reads and writes ISO; shows and accepts DD/MM/YYYY. */
  function dateField(opts) {
    const wrap = el('div', { class: 'datefield' + (opts.className ? ' ' + opts.className : '') });
    let iso = opts.value || '';

    const input = el('input', {
      type: 'text',
      class: 'date-text' + (opts.inputClass ? ' ' + opts.inputClass : ''),
      inputmode: 'numeric',
      autocomplete: 'off',
      placeholder: 'dd/mm/yyyy',
      value: isoToDMY(iso),
    });
    input.setAttribute('data-iso', iso);

    const btn = el('button', {
      class: 'date-open', type: 'button',
      title: T({ en: 'Pick a date', th: 'เลือกวันที่' }),
    });
    btn.appendChild(icon('calendar', 16));

    function commit(nextIso) {
      iso = nextIso || '';
      input.value = isoToDMY(iso);
      input.setAttribute('data-iso', iso);
      input.classList.remove('is-bad');
      if (opts.onCommit) opts.onCommit(iso);
    }

    input.addEventListener('input', () => {
      /* Type bare digits and the slashes appear.

         Only a run of BARE digits. Testing the stripped string instead
         treated "1/9/2026" as "192026" and rewrote it to 19/20/26 — a
         single-digit day became impossible to type. Once the field holds
         separators the technician is formatting it themselves, so we
         stay out of the way and let `change` parse it. */
      const raw = input.value;
      if (/^\d{3,8}$/.test(raw)) {
        const d = raw;
        let out = d.slice(0, 2);
        if (d.length > 2) out += '/' + d.slice(2, 4);
        if (d.length > 4) out += '/' + d.slice(4);
        if (out !== raw) {
          const atEnd = input.selectionStart === raw.length;
          input.value = out;
          if (atEnd) input.setSelectionRange(out.length, out.length);
        }
      }
      input.classList.remove('is-bad');
    });

    input.addEventListener('change', () => {
      const parsed = dmyToISO(input.value);
      if (parsed === null) {
        /* Say so rather than silently discarding what was typed. */
        input.classList.add('is-bad');
        return;
      }
      commit(parsed);
    });
    input.addEventListener('blur', () => {
      if (input.classList.contains('is-bad')) { commit(iso); }
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { input.blur(); }
      if (e.key === 'Escape') { commit(iso); input.blur(); }
    });

    btn.addEventListener('click', () => {
      if (openCal) { closeCalendar(); return; }
      openCalendar(wrap, input.getAttribute('data-iso') || '', commit);
    });

    wrap.append(input, btn);
    return wrap;
  }

  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeCalendar(); });

  /* ---------------- Print ----------------

     A form on screen shows its values inside <input>s, which is fine
     because a long value can be scrolled or focused. Paper has neither.
     A machine called "HOUSING INSERTION MACHINE" in a 200px input prints
     as "HOUSING INSERTION MACH" and the rest is simply gone — the report
     goes to the customer with the name cut in half.

     No CSS can wrap an input's value, so before printing we mirror each
     one into a plain <span> that CSS swaps in. Spans wrap, so nothing is
     lost. Rebuilt on every print so it can never show a stale value. */

  function valueForPrint(el) {
    if (el.tagName === 'SELECT') {
      const opt = el.options[el.selectedIndex];
      return opt ? opt.text : '';
    }
    /* Our own date field is a text input that already reads DD/MM/YYYY,
       so it needs no translation. type="date" can still appear in an
       old cached page, so keep handling it. */
    if (el.type === 'date') return el.value ? fmtDate(el.value) : '';
    if (el.type === 'time') return el.value || '';
    return el.value || '';
  }

  function buildPrintValues() {
    const main = $('#main');
    if (!main) return;
    main.querySelectorAll('.print-value').forEach((n) => n.remove());
    main.querySelectorAll('input, select, textarea').forEach((el) => {
      if (el.type === 'checkbox' || el.type === 'radio' || el.type === 'file') return;
      if (el.closest('.no-print')) return;
      const span = document.createElement('span');
      span.className = 'print-value';
      const v = valueForPrint(el);
      span.textContent = v;
      /* An empty field should still print its underline, or the form
         looks like it was never laid out. */
      if (!v) span.classList.add('is-blank');
      if (el.tagName === 'TEXTAREA') span.classList.add('is-block');
      el.parentNode.insertBefore(span, el.nextSibling);
    });
  }

  function wirePrint() {
    /* Chrome, Edge and Firefox fire beforeprint. iOS Safari does not —
       it only flips the print media query — so listen for both. Tablets
       are exactly where this matters most. */
    window.addEventListener('beforeprint', buildPrintValues);
    const mq = window.matchMedia('print');
    const onMedia = (e) => { if (e.matches) buildPrintValues(); };
    if (mq.addEventListener) mq.addEventListener('change', onMedia);
    else if (mq.addListener) mq.addListener(onMedia);
  }

  /* ---------------- Boot ---------------- */

  /* One footer button folds appearance, language and sync away until
     tapped. Toggling a class runs the slide; aria-expanded follows it. */
  function wireSettingsToggle() {
    const btn = $('#footToggle'), panel = $('#footPanel');
    if (!btn || !panel) return;
    btn.addEventListener('click', () => {
      const open = panel.classList.toggle('open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  }

  /* The mark in the sidebar returns to the home menu. */
  function wireBrandHome() {
    const mark = document.querySelector('.sidebar .brand-mark');
    if (!mark) return;
    mark.classList.add('is-link');
    mark.setAttribute('role', 'button');
    mark.setAttribute('tabindex', '0');
    mark.setAttribute('aria-label', 'Home');
    /* The mark goes to the current module's home (Machine Care home or
       Project Phase home); from anywhere else, the main menu. */
    const moduleHome = () => go(state.module === 'project' ? 'projhome' : 'home');
    mark.addEventListener('click', moduleHome);
    mark.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); moduleHome(); } });

    /* Mobile bar's small home shortcut — close the drawer, go to the
       module home. */
    const mini = document.getElementById('homeMini');
    if (mini) mini.addEventListener('click', () => { closeNav(); moduleHome(); });
  }

  /* ---------------- Living background ----------------
     One rAF loop moves the three colour auras: a slow autonomous drift
     (so the scene breathes even when nobody touches it), a parallax that
     leans the auras toward the cursor at three different depths, and a
     soft swell whenever a page transition fires (kicked from animateGo).
     Transform-only — no filters, no layout — so it costs almost nothing.
     Skips entirely under reduced motion, idles while the tab is hidden,
     and on touch screens simply keeps the autonomous drift. */
  /* Touch devices (phones, tablets) have far less GPU headroom than a
     desktop, so a page transition there competes with the live canvas
     and stalls. On those devices only, the background freezes for the
     length of the transition and hands every frame to it. Desktop is
     left exactly as it was — live and smooth. */
  const COARSE = !!(window.matchMedia && window.matchMedia('(pointer:coarse)').matches);
  let bgKick = 0, ambHold = 0;
  function kickAmbient() {
    bgKick = 1;
    if (COARSE) ambHold = performance.now() + 560;
  }

  function startAmbient() {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const orbs = [1, 2, 3].map((n) => document.querySelector('.orb-' + n));
    if (!orbs[0]) return;
    let mx = .5, my = .5, px = .5, py = .5;
    if (window.matchMedia && window.matchMedia('(pointer:fine)').matches) {
      window.addEventListener('pointermove', (e) => {
        mx = e.clientX / window.innerWidth;
        my = e.clientY / window.innerHeight;
      }, { passive: true });
    }

    /* ---- device tilt (phone / tablet) ----
       Angle the device and the whole backdrop floats with it, the same
       parallax the cursor drives on desktop. The first steady reading is
       taken as "level", so it works however the device is held; tilting
       from there moves the scene, and once tilt is feeding in it takes
       over from any touch position. iOS needs a one-time permission
       granted from a tap — requested on the first touch below. */
    let tiltOn = false, gamma0 = null, beta0 = null, calibN = 0;
    function onTilt(e) {
      if (e.gamma == null || e.beta == null) return;
      /* Landscape swaps which axis is left-right; follow the screen. */
      const land = Math.abs(window.orientation || 0) === 90 ||
        (screen.orientation && /landscape/.test(screen.orientation.type || ''));
      let gx = land ? e.beta : e.gamma;     /* left-right tilt  */
      let gy = land ? e.gamma : e.beta;     /* front-back tilt  */
      if (land && (window.orientation === 90)) { gx = -gx; }
      /* Calibrate a neutral pose from the first few readings. */
      if (calibN < 6) { gamma0 = gx; beta0 = gy; calibN++; return; }
      tiltOn = true;
      const R = 34;   /* degrees of tilt that reach the parallax edge */
      const cl = (v) => Math.max(-1, Math.min(1, v));
      mx = .5 + cl((gx - gamma0) / R) * .5;
      my = .5 + cl((gy - beta0) / R) * .5;
    }
    let tiltArmed = false;
    function attachTilt() {
      if (tiltArmed) return;
      tiltArmed = true;
      window.addEventListener('deviceorientation', onTilt, true);
    }
    function armTilt() {
      const DOE = window.DeviceOrientationEvent;
      if (!DOE) return;
      if (typeof DOE.requestPermission === 'function') {
        /* iOS 13+: the motion sensor needs an explicit permission that
           can only be requested from inside a real tap. Keep asking on
           each tap until it is granted (a tap consumed by scrolling or a
           button doesn't always count), then attach and stop asking. */
        const ask = () => {
          if (tiltArmed) { cleanup(); return; }
          DOE.requestPermission().then((s) => {
            if (s === 'granted') { attachTilt(); cleanup(); }
          }).catch(() => {});
        };
        const cleanup = () => {
          window.removeEventListener('touchend', ask, true);
          window.removeEventListener('click', ask, true);
        };
        window.addEventListener('touchend', ask, true);
        window.addEventListener('click', ask, true);
      } else {
        /* Android / older iOS: no permission gate — attach directly. */
        attachTilt();
      }
    }
    armTilt();
    /* Expose a manual enable so a Settings control (or any code) can
       trigger the iOS permission prompt on demand. */
    window.fnEnableMotion = armTilt;
    /* Re-level when the device rotates or the app returns to view. */
    window.addEventListener('orientationchange', () => { calibN = 0; });

    /* How far each aura leans — nearer layers more. */
    const depth = [[64, 46], [42, 32], [26, 20]];

    /* ---- the workshop scene: Wire Grid 3D + Constellation ----
       Drawn on one canvas above the auras. The grid floor yaws and
       pitches with the cursor and dollies forward on every transition
       (bgKick); the constellation drifts, links its nearby points, and
       reaches for the cursor — a tap or click scatters the points. */
    const canvas = document.getElementById('bg3d');
    const bctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
    let W = 0, H = 0, DPRc = 1, pts = [];
    function fitBg() {
      if (!bctx) return;
      DPRc = Math.min(window.devicePixelRatio || 1, 1.5);
      W = canvas.width = Math.max(1, Math.floor(window.innerWidth * DPRc));
      H = canvas.height = Math.max(1, Math.floor(window.innerHeight * DPRc));
      /* The app zooms <html> by --ui-scale, and the canvas lives inside
         that zoom — so its CSS size must be set in LAYOUT px (visual px
         divided by the zoom), or the whole scene paints ~10% larger
         than the screen and everything sits offset from the cursor.
         Same visual-vs-layout conversion as placeFloating(). */
      const s = uiScale();
      canvas.style.width = (window.innerWidth / s) + 'px';
      canvas.style.height = (window.innerHeight / s) + 'px';
      pts = [];
      const n = Math.min(60, Math.max(34, Math.round(window.innerWidth / 24)));
      for (let i = 0; i < n; i++) {
        pts.push({ x: Math.random() * W, y: Math.random() * H,
          vx: (Math.random() - .5) * .2 * DPRc, vy: (Math.random() - .5) * .2 * DPRc, c: i % 3 });
      }
    }
    fitBg();
    window.addEventListener('resize', fitBg);
    window.addEventListener('pointerdown', (e) => {
      if (!bctx) return;
      const cx = e.clientX * DPRc, cy = e.clientY * DPRc;
      for (let i = 0; i < pts.length; i++) {
        const dx = pts[i].x - cx, dy = pts[i].y - cy;
        const d = Math.sqrt(dx * dx + dy * dy) || 1;
        if (d < 260 * DPRc) {
          const f = (1 - d / (260 * DPRc)) * 4 * DPRc;
          pts[i].vx += dx / d * f; pts[i].vy += dy / d * f;
        }
      }
    }, true);

    function drawScene(t) {
      if (!bctx || !W) return;
      const dark = document.documentElement.dataset.theme === 'dark';
      bctx.clearRect(0, 0, W, H);

      /* -- wire grid floor -- */
      const yaw = (px - .5) * .4, pit = (py - .45) * .26;
      const cam = 700 - bgKick * 130;                   /* click = dolly in */
      const gy = 300;                                   /* floor plane, world units */
      const cy2 = Math.cos(yaw), sy2 = Math.sin(yaw), cp2 = Math.cos(pit), sp2 = Math.sin(pit);
      function proj(x, y, z) {
        let x2 = cy2 * x + sy2 * z, z2 = -sy2 * x + cy2 * z;
        let y2 = cp2 * y - sp2 * z2; z2 = sp2 * y + cp2 * z2;
        z2 += cam;
        if (z2 < 60) return null;
        const k = 900 / z2;
        return [W / 2 + x2 * k * DPRc, H * .58 + y2 * k * DPRc];
      }
      const gridA = dark ? .30 : .16;
      const axis = dark ? '0,234,255' : '75,73,255';
      const gline = dark ? '94,129,172' : '96,116,168';
      const zsh = (t * 34) % 80;
      bctx.lineWidth = 1;
      for (let zi = 0; zi < 20; zi++) {
        const z = 150 + zi * 80 - zsh;
        const p1 = proj(-1400, gy, z), p2 = proj(1400, gy, z);
        if (!p1 || !p2) continue;
        const a = Math.max(0, gridA - zi * (gridA / 19));
        bctx.strokeStyle = 'rgba(' + gline + ',' + a.toFixed(3) + ')';
        bctx.beginPath(); bctx.moveTo(p1[0], p1[1]); bctx.lineTo(p2[0], p2[1]); bctx.stroke();
      }
      for (let xi = -12; xi <= 12; xi++) {
        const q1 = proj(xi * 115, gy, 140), q2 = proj(xi * 115, gy, 2100);
        if (!q1 || !q2) continue;
        const a = (gridA * .8) - Math.abs(xi) * (gridA / 16);
        if (a <= 0) continue;
        bctx.strokeStyle = xi === 0
          ? 'rgba(' + axis + ',' + (gridA * 1.1).toFixed(3) + ')'
          : 'rgba(' + gline + ',' + a.toFixed(3) + ')';
        bctx.beginPath(); bctx.moveTo(q1[0], q1[1]); bctx.lineTo(q2[0], q2[1]); bctx.stroke();
      }

      /* -- constellation -- */
      const PC = dark
        ? ['0,234,255', '107,140,217', '160,180,210']
        : ['75,73,255', '0,150,180', '110,130,170'];
      const ptA = dark ? .55 : .4;
      const linkA = dark ? .16 : .11;
      const curA = dark ? .4 : .3;
      const cxp = px * W, cyp = py * H;
      const lim = 110 * DPRc * 110 * DPRc, clim = 180 * DPRc * 180 * DPRc;
      for (let i = 0; i < pts.length; i++) {
        const p = pts[i];
        p.x += p.vx; p.y += p.vy;
        p.vx *= .985; p.vy *= .985;
        p.vx += (Math.random() - .5) * .012 * DPRc;
        p.vy += (Math.random() - .5) * .012 * DPRc;
        if (p.x < -20) p.x = W + 20; if (p.x > W + 20) p.x = -20;
        if (p.y < -20) p.y = H + 20; if (p.y > H + 20) p.y = -20;
      }
      bctx.lineWidth = 1;
      for (let a1 = 0; a1 < pts.length; a1++) {
        for (let b1 = a1 + 1; b1 < pts.length; b1++) {
          const ddx = pts[a1].x - pts[b1].x, ddy = pts[a1].y - pts[b1].y;
          const dd = ddx * ddx + ddy * ddy;
          if (dd < lim) {
            bctx.strokeStyle = 'rgba(' + gline + ',' + ((1 - dd / lim) * linkA).toFixed(3) + ')';
            bctx.beginPath(); bctx.moveTo(pts[a1].x, pts[a1].y); bctx.lineTo(pts[b1].x, pts[b1].y); bctx.stroke();
          }
        }
        const cdx = pts[a1].x - cxp, cdy = pts[a1].y - cyp;
        const cd = cdx * cdx + cdy * cdy;
        if (cd < clim) {
          bctx.strokeStyle = 'rgba(' + axis + ',' + ((1 - cd / clim) * curA).toFixed(3) + ')';
          bctx.lineWidth = 1.2;
          bctx.beginPath(); bctx.moveTo(pts[a1].x, pts[a1].y); bctx.lineTo(cxp, cyp); bctx.stroke();
          bctx.lineWidth = 1;
        }
        bctx.fillStyle = 'rgba(' + PC[pts[a1].c] + ',' + ptA + ')';
        bctx.beginPath(); bctx.arc(pts[a1].x, pts[a1].y, 1.6 * DPRc, 0, 7); bctx.fill();
      }
    }

    const t0 = performance.now();
    let lastScene = 0;
    function loop(now) {
      requestAnimationFrame(loop);
      if (document.hidden) return;
      /* On touch devices, hold the whole backdrop still while a page
         transition plays — this is what stops the multi-second stall. */
      if (COARSE && now < ambHold) return;
      const t = (now - t0) / 1000;
      px += (mx - px) * .05;
      py += (my - py) * .05;
      bgKick *= .95;
      const swell = 1 + bgKick * .07;
      for (let i = 0; i < 3; i++) {
        const o = orbs[i];
        if (!o) continue;
        const wx = Math.sin(t * .10 + i * 2.1) * 26;   /* autonomous drift */
        const wy = Math.cos(t * .085 + i * 1.7) * 20;
        const x = (px - .5) * depth[i][0] + wx;
        const y = (py - .5) * depth[i][1] + wy;
        o.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0) scale(' + swell.toFixed(3) + ')';
      }
      /* Touch devices redraw the scene at ~30fps to leave headroom;
         desktop stays at full rate (the look it already had). */
      if (COARSE) {
        if (now - lastScene >= 33) { lastScene = now; drawScene(t); }
      } else {
        drawScene(t);
      }
    }
    requestAnimationFrame(loop);
  }

  function boot() {
    stampBuild();
    blockPinchShrink();
    wirePrint();
    checkForUpdate();
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) checkForUpdate();
    });
    /* The wordmark is styled markup in index.html — don't overwrite it. */
    applyTheme();
    setupNavDrawer();
    wireSettingsToggle();
    wireBrandHome();
    startAmbient();
    startCloud();
    readHash();
    render();

    window.addEventListener('hashchange', () => {
      if (suppressHashChange) { suppressHashChange = false; return; }
      readHash();
      render();
    });
    window.addEventListener('beforeunload', () => saveDB());
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  /* Expose a little surface for debugging in the console */
  window.FNMachineCare = {
    get db() { return db; },
    save: saveDB,
    /* Exposed so the delete path can be exercised end to end from a
       test rather than by reaching in and splicing the array, which
       would skip the very tombstone the test is meant to check. */
    deleteRecord,
    restoreFromBackup,   /* exposed so a test can drive a force-overwrite restore end to end */
    reset: () => { db = structuredClone(DEFAULT_DB); saveDB(); render(); },
  };
})();

</script>
</body>
</html>
