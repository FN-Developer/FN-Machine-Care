  }

  function viewReqList(root) {
    const all = listableProjects();

    /* People who own or engineer at least one requirement — the choices
       for the "whose list" filter. */
    const peopleSet = new Set();
    all.forEach((p) => projPeopleNames(p).forEach((n) => peopleSet.add(n)));
    const peopleOptions = Array.from(peopleSet).sort((a, b) => a.localeCompare(b));
    if (state.projPerson && !peopleSet.has(state.projPerson)) state.projPerson = null;
    const byPerson = (arr) => state.projPerson ? arr.filter((p) => projPeopleNames(p).has(state.projPerson)) : arr;

    const wonList = byPerson(all.filter((p) => projStage(p) === 'won'));
    const activeList = byPerson(all.filter((p) => projStage(p) !== 'won'));
    const filter = state.projFilter === 'won' ? 'won' : 'active';
    const shown = filter === 'won' ? wonList : activeList;

    root.appendChild(el('div', { class: 'page-head' }, [
      el('div', {}, [
        el('h1', { class: 'page-title' }, [L(UI.nav_req_list)]),
        el('div', { class: 'page-sub' }, [String(shown.length) + ' ', L(filter === 'won' ? { en: 'won', th: 'ได้งาน' } : { en: 'active', th: 'กำลังดำเนินการ' })]),
      ]),
      el('button', { class: 'btn btn-primary no-print', onclick: () => createAndOpenProject() }, [L(UI.nav_req_new)]),
    ]));

    /* Filter tabs: Active vs Won (won lives in its own list). */
    const tab = (key, ic, label, n) => el('button', { class: 'seg-btn' + (filter === key ? ' on' : ''), type: 'button',
      onclick: () => { state.projFilter = key; render(); } },
      [icon(ic, 14), L(label), el('span', { class: 'seg-count', text: String(n) })]);
    const filterSeg = el('div', { class: 'req-sort seg no-print', role: 'group' }, [
      tab('active', 'reqlist', { en: 'Active', th: 'กำลังดำเนินการ' }, activeList.length),
      tab('won', 'won', { en: 'Won', th: 'ได้งาน' }, wonList.length),
    ]);
    /* Sort mode — only meaningful for the grouped Active list. */
    const sortSeg = el('div', { class: 'req-sort seg no-print', role: 'group' }, [
      el('button', { class: 'seg-btn' + (state.projSort === 'status' ? ' on' : ''), type: 'button',
        onclick: () => { state.projSort = 'status'; render(); } }, [icon('feasible', 14), L({ en: 'By status', th: 'ตามสถานะ' })]),
      el('button', { class: 'seg-btn' + (state.projSort === 'date' ? ' on' : ''), type: 'button',
        onclick: () => { state.projSort = 'date'; render(); } }, [icon('clock', 14), L({ en: 'By date', th: 'ตามวันที่' })]),
    ]);
    const demoBtn = projExamplesPresent()
      ? el('button', { class: 'btn btn-sm btn-ghost no-print', onclick: () => clearProjectExamples() }, [L({ en: 'Clear examples', th: 'ลบตัวอย่าง' })])
      : el('button', { class: 'btn btn-sm no-print', onclick: () => seedProjectExamples() }, [L({ en: 'Load examples', th: 'โหลดตัวอย่าง' })]);
    /* "Whose list" — each person can see just their own requirements. */
    const personSel = el('select', { class: 'part-select req-person-filter' });
    personSel.appendChild(el('option', { value: '', text: T({ en: '👤 Everyone', th: '👤 ทุกคน' }) }));
    const me = meName();
    if (me && peopleSet.has(me)) personSel.appendChild(el('option', { value: me, text: T({ en: '👤 My list', th: '👤 รายการของฉัน' }) + ' (' + me + ')' }));
    peopleOptions.forEach((n) => personSel.appendChild(el('option', { value: n, text: n })));
    personSel.value = state.projPerson || '';
    personSel.addEventListener('change', () => { state.projPerson = personSel.value || null; render(); });
    const personWrap = peopleOptions.length ? el('div', { class: 'req-person-filter-wrap' }, [personSel]) : null;

    const leftControls = [filterSeg];
    if (filter === 'active') leftControls.push(sortSeg);
    if (personWrap) leftControls.push(personWrap);
    root.appendChild(el('div', { class: 'req-toolbar' }, [el('div', { class: 'req-tabwrap' }, leftControls), demoBtn]));

    if (!shown.length) {
      root.appendChild(el('div', { class: 'empty' }, [L(filter === 'won'
        ? { en: 'No won projects yet.', th: 'ยังไม่มีโครงการที่ได้งาน' }
        : UI.noProjects)]));
      return;
    }

    /* Won list, and Active-by-date, are flat lists newest-first. */
    if (filter === 'won' || state.projSort === 'date') {
      const items = shown.slice().sort((a, b) => ((b.fields.enquiryDate || '') > (a.fields.enquiryDate || '') ? 1 : -1));
      const list = el('div', { class: 'req-list' });
      items.forEach((p) => list.appendChild(reqCard(p)));
      root.appendChild(list);
      return;
    }

    /* Active, by status: groups ordered begin → final. */
    const groups = {};
    shown.forEach((p) => { const k = projStage(p); (groups[k] = groups[k] || []).push(p); });
    const order = PROJ_STAGES.map((s) => s.key).filter((k) => groups[k] && k !== 'won');
    order.forEach((k) => {
      const items = groups[k].sort((a, b) => ((b.updatedAt || '') > (a.updatedAt || '') ? 1 : -1));
      const cs = cardStatus(items[0]);
      root.appendChild(el('div', { class: 'req-group-head' + (cs.blink ? ' is-blink' : ''), style: `--sc:${cs.color};--blink-dur:${cs.dur || 2.2}s` }, [
        el('span', { class: 'req-group-dot' }),
        el('span', { class: 'req-group-ico' }, [icon(cs.icon, 14)]),
        el('span', { class: 'req-group-name' }, [L(cs.name)]),
        el('span', { class: 'req-group-count', text: String(items.length) }),
      ]));
      const list = el('div', { class: 'req-list' });
      items.forEach((p) => list.appendChild(reqCard(p)));
      root.appendChild(list);
    });
  }

  /* ---- Requirement detail: the gated pipeline ---- */
  function viewReqView(root) {
    const rec = db.records.find((r) => r.id === state.projectId && r.type === 'PROJECT');
    if (!rec) return go('reqlist');
    /* keep older records forward-compatible */
    rec.feasibility = rec.feasibility || { confirmed: false, disc: {} };
    rec.feasibility.disc = rec.feasibility.disc || {};
    if (rec.feasibility.engineer === undefined) rec.feasibility.engineer = '';
    if (rec.feasibility.solutionDate === undefined) rec.feasibility.solutionDate = '';
    if (rec.fields.owner === undefined) rec.fields.owner = '';
    if (rec.fields.needConcept === undefined) rec.fields.needConcept = false;
    if (rec.fields.needQuotation === undefined) rec.fields.needQuotation = false;
    /* A record that predates these flags is already underway: show its full
       pipeline and keep the overview editable, so nothing an older record
       holds can ever become unreachable. Only requirements created new (which
       set started:false in newProject) start gated on the overview. */
    if (rec.started === undefined) rec.started = true;
    if (rec.overviewConfirmed === undefined) rec.overviewConfirmed = false;
    rec.solution = rec.solution || { confirmed: false, files: [] };
    rec.proposal = rec.proposal || { confirmed: false, present: [], scope: [], cost: [], timeline: [] };
    rec.meeting = rec.meeting || { date: '', time: '', end: '', people: [], confirmed: false };
    rec.topics = rec.topics || [];

    const stage = projStage(rec);
    const tInput = (obj, key, ph) => {
      const i = el('input', { type: 'text', value: obj[key] || '', placeholder: ph || '' });
      i.addEventListener('input', () => { obj[key] = i.value; });
      i.addEventListener('change', () => { obj[key] = i.value; touch(rec); });
      return i;
    };
    const tArea = (obj, key, ph) => {
      const i = el('textarea', { placeholder: ph || '', rows: '2' }); i.value = obj[key] || '';
      i.addEventListener('input', () => { obj[key] = i.value; });
      i.addEventListener('change', () => { obj[key] = i.value; touch(rec); });
      return i;
    };
    const dInput = (obj, key, type) => {
      /* Dates use the app's dd/mm/yyyy picker; times stay native HH:MM. */
      if (type === 'date') return dateField({ value: obj[key] || '', onCommit: (iso) => { obj[key] = iso; touch(rec); } });
      const i = el('input', { type: type, value: obj[key] || '' });
      i.addEventListener('change', () => { obj[key] = i.value; touch(rec); });
      return i;
    };
    const fieldWrap = (labelObj, node) => el('div', { class: 'field' }, [el('label', {}, [L(labelObj)]), node]);

    /* Toolbar */
    root.appendChild(el('div', { class: 'toolbar no-print' }, [
      el('div', {}, [
        el('div', { class: 'tb-title' }, [
          el('span', { class: 'tb-ico', style: '--accent:#00c2d6' }, [icon('reqnew', 17)]),
          el('span', { text: rec.docNo }),
        ]),
        el('div', { class: 'tb-sub' }, [stageBadge(rec)]),
      ]),
      el('div', { class: 'btn-row' }, [
        el('button', { class: 'btn', onclick: () => go('reqlist') }, [L({ en: '← Requirements', th: '← รายการ' })]),
        el('button', { class: 'btn btn-danger', onclick: () => { if (confirm(T(UI.confirmDelete))) { tombstoneRecord(rec); go('reqlist'); } } }, [L(UI.delete)]),
      ]),
    ]));

    const shell = el('div', { class: 'form-shell' });

    /* ---- Requirement / Overview (locked once submitted) ---- */
    const reqSec = pipeSection('reqnew', '#00c2d6', UI.req_summary, false);
    const ovWrap = editWrap(rec.overviewConfirmed);
    const grid = el('div', { class: 'field-grid' });
    /* Requirement number — auto-suggested, but you can type your own. */
    const noInput = el('input', { type: 'text', value: rec.docNo || '', placeholder: 'REQ-2026-0024' });
    noInput.addEventListener('input', () => { rec.docNo = noInput.value; });
    noInput.addEventListener('change', () => { rec.docNo = noInput.value.trim() || rec.docNo; touch(rec); render(); });
    grid.appendChild(fieldWrap({ en: 'Requirement No.', th: 'เลขที่ความต้องการ' }, noInput));
    grid.appendChild(fieldWrap(UI.req_customer, tInput(rec.fields, 'customer', 'ABC Manufacturing')));
    grid.appendChild(fieldWrap(UI.req_title, tInput(rec.fields, 'title', T({ en: 'e.g. Auto vision sorter line', th: 'เช่น สายคัดแยกด้วยวิชัน' }))));
    grid.appendChild(fieldWrap(UI.req_contact, tInput(rec.fields, 'contact', '')));
    grid.appendChild(fieldWrap(UI.req_date, dInput(rec.fields, 'enquiryDate', 'date')));
    grid.appendChild(fieldWrap({ en: 'Received by (admin)', th: 'ผู้รับเรื่อง (แอดมิน)' },
      personSelect({ value: rec.fields.owner || '', placeholder: { en: '— who took this? —', th: '— ใครรับเรื่อง? —' },
        onPick: (name) => { rec.fields.owner = name; touch(rec); } })));
    ovWrap.appendChild(grid);

    /* What the customer actually asked us for — the admin ticks these when
       logging the enquiry. They drive the dashboard's per-company demand. */
    const needBox = (key, label, color) => {
      const on = !!rec.fields[key];
      const b = el('button', { class: 'need-check' + (on ? ' on' : ''), type: 'button', style: `--nc:${color}`,
        onclick: () => { rec.fields[key] = !rec.fields[key]; touch(rec); render(); } }, [
        el('span', { class: 'need-box' }, on ? [icon('pdi', 13)] : []),
        el('span', {}, [L(label)]),
      ]);
      return b;
    };
    ovWrap.appendChild(el('div', { class: 'sub-h' }, [L({ en: 'Customer needs', th: 'สิ่งที่ลูกค้าต้องการ' })]));
    ovWrap.appendChild(el('div', { class: 'need-row' }, [
      needBox('needConcept', { en: 'Concept / design', th: 'คอนเซ็ปต์ / ออกแบบ' }, '#bf5af3'),
      needBox('needQuotation', { en: 'Quotation', th: 'ใบเสนอราคา' }, '#00c2d6'),
    ]));

    /* Topics — added and edited through a popup, shown as ready cards.
       Clicking a card reopens the same popup pre-filled (button →
       Update); adding opens it empty (button → Add). */
    const openTopicEditor = (topic) => {
      const isNew = !topic;
      const draft = { title: topic ? topic.title : '', desc: topic ? topic.desc : '', imgs: topic ? topicImgs(topic).slice() : [] };
      const titleIn = el('input', { type: 'text', placeholder: T(UI.req_topic_title) }); titleIn.value = draft.title || '';
      titleIn.addEventListener('input', () => { draft.title = titleIn.value; });
      const descIn = el('textarea', { rows: '5', placeholder: T(UI.req_topic_desc) }); descIn.value = draft.desc || '';
      descIn.addEventListener('input', () => { draft.desc = descIn.value; });
      const imgWrap = el('div', { class: 'topic-edit-img' });
      const renderImg = () => {
        imgWrap.innerHTML = '';
        draft.imgs.forEach((src, i) => {
          imgWrap.appendChild(el('div', { class: 'topic-eimg' }, [
            el('span', { class: 'topic-thumb-lg', style: `background-image:url(${src})`, title: T(UI.preview), onclick: () => openLightbox(draft.imgs, i) }),
            el('button', { class: 'topic-eimg-del', type: 'button', title: T(UI.remove), onclick: (e) => { e.stopPropagation(); draft.imgs.splice(i, 1); renderImg(); } }, ['✕']),
          ]));
        });
        const inp = el('input', { type: 'file', accept: 'image/*', multiple: true, style: 'display:none',
          onchange: (e) => { Array.prototype.forEach.call(e.target.files, (f) => downscaleImage(f, (d) => { draft.imgs.push(d); renderImg(); })); e.target.value = ''; } });
        imgWrap.appendChild(el('button', { class: 'topic-img-add', type: 'button', onclick: () => inp.click() }, [icon('vision', 18), el('span', { text: T(UI.req_topic_img) }), inp]));
      };
      renderImg();
      const body = [
        el('div', { class: 'field' }, [el('label', {}, [L(UI.req_topic_title)]), titleIn]),
        el('div', { class: 'field' }, [el('label', {}, [L(UI.req_topic_desc)]), descIn]),
        el('div', { class: 'field' }, [el('label', {}, [L(UI.req_topic_img)]), imgWrap]),
      ];
      let mref = null;
      if (!isNew) {
        body.push(el('button', { class: 'btn btn-danger btn-sm topic-modal-del', type: 'button',
          onclick: () => { const i = rec.topics.indexOf(topic); if (i >= 0) rec.topics.splice(i, 1); touch(rec); render(); if (mref) mref.close(); } },
          [icon('lost', 14), L(UI.remove)]));
      }
      mref = modal({
        title: isNew ? UI.req_topic_add_title : UI.req_topic_edit_title,
        body,
        confirmLabel: isNew ? UI.add : UI.update,
        onConfirm: () => {
          if (!draft.title.trim() && !draft.desc.trim() && !draft.imgs.length) return false;   /* nothing to save */
          if (isNew) rec.topics.push({ id: uid(), title: draft.title.trim(), desc: draft.desc.trim(), imgs: draft.imgs });
          else { topic.title = draft.title.trim(); topic.desc = draft.desc.trim(); topic.imgs = draft.imgs; topic.img = null; }
          touch(rec); render();
        },
      });
      setTimeout(() => titleIn.focus(), 80);
    };

    ovWrap.appendChild(el('div', { class: 'sub-h' }, [L(UI.req_topics)]));
    const topicWrap = el('div', { class: 'topic-cards' });
    if (!rec.topics.length) topicWrap.appendChild(el('div', { class: 'topic-empty' }, [L(UI.req_topic_empty)]));
    rec.topics.forEach((tp, idx) => {
      const imgs = topicImgs(tp);
      const thumb = imgs.length
        ? el('span', { class: 'topic-card-thumb', style: `background-image:url(${imgs[0]})` },
            imgs.length > 1 ? [el('span', { class: 'topic-card-count', text: '+' + (imgs.length - 1) })] : [])
        : el('span', { class: 'topic-card-noimg' }, [el('span', { class: 'topic-card-idx', text: String(idx + 1) })]);
      const kids = [
        thumb,
        el('div', { class: 'topic-card-body' }, [
          el('div', { class: 'topic-card-title', text: tp.title || T({ en: '(untitled topic)', th: '(หัวข้อไม่มีชื่อ)' }) }),
          tp.desc ? el('div', { class: 'topic-card-desc', text: tp.desc }) : null,
        ]),
      ];
      if (imgs.length) {
        kids.push(el('span', { class: 'topic-card-view', role: 'button', tabindex: '0', title: T(UI.preview),
          onclick: (e) => { e.stopPropagation(); openLightbox(imgs, 0); },
          onkeydown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); openLightbox(imgs, 0); } } },
          [icon('vision', 16)]));
      }
      kids.push(el('span', { class: 'topic-card-edit', title: T({ en: 'Edit', th: 'แก้ไข' }) }, [icon('records', 15)]));
      topicWrap.appendChild(el('button', { class: 'topic-card', type: 'button', onclick: () => openTopicEditor(tp) }, kids));
    });
    ovWrap.appendChild(topicWrap);
    ovWrap.appendChild(el('button', { class: 'btn btn-sm no-print topic-add-btn', onclick: () => openTopicEditor(null) }, [L(UI.req_topic_add)]));
    reqSec.body.appendChild(ovWrap);
    /* Submit locks the overview to read-only; Edit unlocks it again. */
    if (rec.overviewConfirmed) {
      reqSec.body.appendChild(el('div', { class: 'confirmed-chip' }, [
        icon('pdi', 14), L({ en: 'Overview submitted', th: 'บันทึกข้อมูลแล้ว' }),
        el('button', { class: 'reopen', type: 'button', onclick: () => { rec.overviewConfirmed = false; touch(rec); render(); } },
          [icon('records', 13), L({ en: 'Edit', th: 'แก้ไข' })]),
      ]));
    } else {
      reqSec.body.appendChild(el('div', { class: 'confirm-row' }, [
        el('button', { class: 'btn btn-primary', onclick: () => {
          if (!(rec.fields.title || '').trim() && !(rec.fields.customer || '').trim()) {
            toast(T({ en: 'Add a customer or title first', th: 'กรุณากรอกลูกค้าหรือชื่อก่อน' }), true); return;
          }
          rec.overviewConfirmed = true; rec.started = true; touch(rec); render(); toast(T({ en: 'Overview submitted — next steps unlocked', th: 'บันทึกแล้ว — ปลดล็อกขั้นตอนถัดไป' }));
        } }, [icon('pdi', 15), L({ en: 'Submit overview', th: 'บันทึกข้อมูล' })]),
      ]));
    }
    shell.appendChild(reqSec.box);

    /* The rest of the pipeline only appears once the overview is submitted,
       so opening "New Requirement" shows just the name + overview form.
       (After the first submit it stays visible even while re-editing.) */
    if (!rec.started) {
      shell.appendChild(el('div', { class: 'gate-hint' }, [
        icon('feasible', 15),
        L({ en: 'Submit the overview above to unlock Technical Feasibility and the rest of the steps.',
            th: 'กดบันทึกข้อมูลด้านบนเพื่อปลดล็อกขั้นตอนถัดไป' }),
      ]));
      root.appendChild(shell);
      return;
    }

    /* ---- 1. Technical Feasibility ---- */
    const feas = rec.feasibility;
    const fSec = pipeSection('feasible', '#0a84ff', UI.feas_title, false);
    if (stage === 'requirement') markPending(fSec, PENDING.requirement);
    const fBody = editWrap(feas.confirmed);
    fBody.appendChild(el('p', { class: 'sec-hint' }, [L(UI.feas_hint)]));
    /* Who owns the engineering, and when the solution is promised. Both
       surface on the requirement list so the team can plan the schedule. */
    const feasGrid = el('div', { class: 'field-grid' });
    feasGrid.appendChild(fieldWrap({ en: 'Assigned engineer', th: 'วิศวกรผู้รับผิดชอบ' },
      personSelect({ value: feas.engineer || '', placeholder: { en: '— assign an engineer —', th: '— มอบหมายวิศวกร —' },
        onPick: (name) => { feas.engineer = name; touch(rec); render(); } })));
    feasGrid.appendChild(fieldWrap({ en: 'Target solution date', th: 'กำหนดส่งโซลูชัน' },
      dateField({ value: feas.solutionDate || '', onCommit: (iso) => { feas.solutionDate = iso; touch(rec); render(); } })));
    fBody.appendChild(feasGrid);
    /* The big description editor for one discipline. Opened when a
       discipline is ticked, or when its filled preview is clicked. */
    const openDiscEditor = (d, cur) => {
      const ta = el('textarea', { class: 'disc-editor', rows: '8', placeholder: T(UI.feas_idea) });
      ta.value = cur.idea || '';
      modal({
        title: d.label,
        note: UI.feas_idea,
        body: [ta],
        confirmLabel: { en: 'Save', th: 'บันทึก' },
        onConfirm: () => { cur.idea = ta.value.trim(); if (cur.idea) cur.on = true; touch(rec); render(); },
      });
      setTimeout(() => ta.focus(), 80);
    };

    const discGrid = el('div', { class: 'disc-grid' });
    PROJ_DISCIPLINES.forEach((d) => {
      const cur = feas.disc[d.key] || { on: false, idea: '' };
      feas.disc[d.key] = cur;
      const box = el('div', { class: 'disc-item' + (cur.on ? ' on' : '') + (cur.idea ? ' has-idea' : ''), style: `--accent:${d.accent}` });

      /* The check toggles the discipline on/off independently. Turning it
         ON with no idea yet immediately pops up the description field. */
      const check = el('span', { class: 'disc-check', role: 'checkbox', 'aria-checked': cur.on ? 'true' : 'false', tabindex: '0',
        onclick: (e) => { e.stopPropagation(); cur.on = !cur.on; touch(rec); render(); if (cur.on && !cur.idea) openDiscEditor(d, cur); },
        onkeydown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); cur.on = !cur.on; touch(rec); render(); if (cur.on && !cur.idea) openDiscEditor(d, cur); } },
      }, cur.on ? [icon('pdi', 15)] : []);

      /* Clicking the name row: turn on + open the popup, or (already on)
         open the popup to edit. */
      const activate = () => { if (!cur.on) { cur.on = true; touch(rec); render(); } openDiscEditor(d, cur); };
      const head = el('div', { class: 'disc-head', role: 'button', tabindex: '0',
        onclick: activate,
        onkeydown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(); } },
      }, [
        check,
        el('span', { class: 'disc-ico' }, [icon(d.icon, 17)]),
        el('span', { class: 'disc-name' }, [L(d.label)]),
        cur.on ? el('span', { class: 'disc-edit-ico', title: T(UI.preview) }, [icon('records', 14)]) : null,
      ]);
      box.appendChild(head);

      if (cur.on) {
        if (cur.idea) {
          /* Filled: a one-line preview; hover shows a small popover, a
             click opens the big editor. */
          const snippet = cur.idea.length > 240 ? cur.idea.slice(0, 240) + '…' : cur.idea;
          box.appendChild(el('div', { class: 'disc-desc', role: 'button', tabindex: '0', title: T(UI.preview),
            onclick: () => openDiscEditor(d, cur),
            onkeydown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDiscEditor(d, cur); } },
          }, [
            el('span', { class: 'disc-prev-text', text: cur.idea }),
            el('span', { class: 'disc-tip' }, [el('span', { class: 'disc-tip-text', text: snippet })]),
          ]));
        } else {
          box.appendChild(el('button', { class: 'disc-add', type: 'button', onclick: () => openDiscEditor(d, cur) },
            [icon('newform', 14), el('span', { text: T({ en: 'Add design idea', th: 'เพิ่มแนวคิดการออกแบบ' }) })]));
        }
      }
      discGrid.appendChild(box);
    });
    fBody.appendChild(discGrid);
    fSec.body.appendChild(fBody);
    fSec.body.appendChild(confirmRow(rec, feas, UI.feas_confirm, UI.feas_confirmed));
    shell.appendChild(fSec.box);

    /* ---- 2. Solution Design (locked until feasibility) ---- */
    const sol = rec.solution;
    const sSec = pipeSection('solution', '#bf5af3', UI.sol_title, !feas.confirmed);
    if (stage === 'solution') markPending(sSec, PENDING.solution);
    if (feas.confirmed) {
      const sBody = editWrap(sol.confirmed);
      sBody.appendChild(el('p', { class: 'sec-hint' }, [L(UI.sol_hint)]));
      sBody.appendChild(uploadZone(rec, sol.files, !sol.confirmed, null, '.xlsx,.xls,.pdf,image/*,.stl'));
      sSec.body.appendChild(sBody);
      sSec.body.appendChild(confirmRow(rec, sol, UI.sol_confirm, UI.sol_confirmed));
    }
    shell.appendChild(sSec.box);

    /* ---- 3. Proposal (locked until solution) ---- */
    const prop = rec.proposal;
    const pSec = pipeSection('proposal', '#00c2d6', UI.prop_title, !sol.confirmed);
    if (stage === 'proposal') markPending(pSec, PENDING.proposal);
    if (sol.confirmed) {
      const pBody = editWrap(prop.confirmed);
      pBody.appendChild(el('p', { class: 'sec-hint' }, [L(UI.prop_hint)]));
      const ed = !prop.confirmed;
      pBody.appendChild(uploadZone(rec, prop.present, ed, UI.prop_present, ''));
      pBody.appendChild(uploadZone(rec, prop.scope, ed, UI.prop_scope, ''));
      pBody.appendChild(uploadZone(rec, prop.cost, ed, UI.prop_cost, ''));
      pBody.appendChild(uploadZone(rec, prop.timeline, ed, UI.prop_timeline, ''));
      pSec.body.appendChild(pBody);
      pSec.body.appendChild(confirmRow(rec, prop, UI.prop_confirm, UI.prop_confirmed));
    }
    shell.appendChild(pSec.box);

    /* ---- 4. Customer Meeting (locked until proposal) ---- */
    const mt = rec.meeting;
    const mSec = pipeSection('meeting', '#ff9f0a', UI.meet_title, !prop.confirmed);
    if (stage === 'meeting') markPending(mSec, PENDING.meeting);
    if (prop.confirmed) {
      const mBody = editWrap(mt.confirmed);
      mBody.appendChild(el('p', { class: 'sec-hint' }, [L(UI.meet_hint)]));
      const mg = el('div', { class: 'field-grid' });
      mg.appendChild(fieldWrap(UI.meet_date, dInput(mt, 'date', 'date')));
      mg.appendChild(fieldWrap(UI.meet_time, dInput(mt, 'time', 'time')));
      mg.appendChild(fieldWrap(UI.meet_end, dInput(mt, 'end', 'time')));
      mBody.appendChild(mg);
      mBody.appendChild(el('div', { class: 'sub-h' }, [L(UI.meet_people)]));
      mt.people = mt.people || [];
      mBody.appendChild(participantPicker(rec, mt));
      mSec.body.appendChild(mBody);
      if (!mt.confirmed) {
        mSec.body.appendChild(el('div', { class: 'confirm-row' }, [
          el('button', { class: 'btn btn-primary', onclick: () => {
            if (!mt.date) { toast(T({ en: 'Set a meeting date first', th: 'กรุณาระบุวันประชุมก่อน' }), true); return; }
            mt.confirmed = true; touch(rec); render(); toast(T(UI.meet_set));
          } }, [L(UI.meet_confirm)]),
        ]));
      } else {
        mSec.body.appendChild(el('div', { class: 'confirmed-chip' }, [icon('pdi', 14), L(UI.meet_set), el('button', { class: 'reopen', type: 'button', onclick: () => { mt.confirmed = false; touch(rec); render(); } }, [icon('records', 13), L({ en: 'Edit', th: 'แก้ไข' })])]));
      }
    }
    shell.appendChild(mSec.box);

    /* ---- 5. Decision (locked until meeting confirmed) ---- */
    if (mt.confirmed) {
      const dSec = pipeSection('followup', '#ffd60a', { en: 'Decision', th: 'การตัดสินใจ' }, false);
      if (rec.decision === 'pending') {
        dSec.body.appendChild(el('div', { class: 'wait-banner' }, [icon('clock', 18), L(UI.decision_wait)]));
        dSec.body.appendChild(el('div', { class: 'confirm-row' }, [
          el('button', { class: 'btn btn-won', onclick: () => { rec.decision = 'won'; touch(rec); render(); } }, [icon('won', 15), L(UI.mark_won)]),
          el('button', { class: 'btn btn-danger', onclick: () => { rec.decision = 'lost'; touch(rec); render(); } }, [icon('lost', 15), L(UI.mark_lost)]),
        ]));
      } else {
        dSec.body.appendChild(el('div', { class: 'decision-final decision-' + rec.decision }, [
          icon(rec.decision === 'won' ? 'won' : 'lost', 20),
          L(rec.decision === 'won' ? { en: 'Project WON', th: 'ได้งานแล้ว' } : { en: 'Project LOST', th: 'เสียงาน' }),
          el('button', { class: 'reopen', type: 'button', onclick: () => { rec.decision = 'pending'; touch(rec); render(); } }, [L({ en: 'reset', th: 'รีเซ็ต' })]),
        ]));
        if (rec.decision === 'won') dSec.body.appendChild(el('button', { class: 'btn btn-primary no-print', style: 'margin-top:10px', onclick: () => go('kickoff') }, [L({ en: 'Go to Project Kickoff →', th: 'ไปหน้าเริ่มโครงการ →' })]));
      }
      shell.appendChild(dSec.box);
    }

    root.appendChild(shell);
  }

  /* A pipeline section shell: header with icon, a body, and a lock veil
     when the previous stage hasn't been confirmed yet. Returns {box, body}. */
  function pipeSection(iconName, accent, titleObj, locked) {
    const box = el('section', { class: 'section pipe-sec' + (locked ? ' is-locked' : ''), style: `--accent:${accent}` });
    box.appendChild(el('header', {}, [
      el('div', { class: 'section-title' }, [
        el('span', { class: 'pipe-ico' }, [icon(iconName, 18)]),
        el('span', {}, [L(titleObj)]),
      ]),
      locked ? el('span', { class: 'lock-tag' }, [icon('feasible', 14)]) : null,
    ]));
    const body = el('div', { class: 'section-body' });
    if (locked) body.appendChild(el('div', { class: 'lock-hint' }, [L(UI.locked_hint)]));
    box.appendChild(body);
    return { box, body };
  }

  /* Flag the one section the project is currently waiting on: its border
     blinks in the stage's colour (and glows, for the meeting) at the
     stage's speed, with a note telling the user to fill it in. */
  function markPending(sec, pd) {
    sec.box.classList.add('is-pending');
    if (pd.aura) sec.box.classList.add('is-aura');
    sec.box.style.setProperty('--pend', pd.color);
    sec.box.style.setProperty('--blink-dur', (pd.dur || 2) + 's');
    sec.body.insertBefore(
      el('div', { class: 'pend-note' }, [
        icon(pd.icon, 15),
        el('span', {}, [L({ en: 'Please fill this in and confirm to continue.', th: 'กรุณากรอกและกดยืนยันเพื่อไปต่อ' })]),
      ]),
      sec.body.firstChild,
    );
  }

  /* A confirm button that becomes a green confirmed chip (with a reopen
     link to revise). `obj.confirmed` is the gate for the next stage. */

  /* Customer-need badges on a requirement card: what the customer asked
     for, and a tick once we have delivered it (concept = solution sent,
     quotation = proposal sent). */
  function needBadges(p) {
    const f = p.fields || {};
    if (!f.needConcept && !f.needQuotation) return null;
    const badge = (label, color, sent) => el('span', { class: 'need-badge' + (sent ? ' is-sent' : ''), style: `--nc:${color}` }, [
      el('span', { class: 'need-badge-ico' }, [icon(sent ? 'pdi' : 'clock', 11)]),
      el('span', {}, [L(label)]),
    ]);
    const out = [];
    if (f.needConcept) out.push(badge({ en: 'Concept', th: 'คอนเซ็ปต์' }, '#bf5af3', !!(p.solution && p.solution.confirmed)));
    if (f.needQuotation) out.push(badge({ en: 'Quotation', th: 'ใบเสนอราคา' }, '#00c2d6', !!(p.proposal && p.proposal.confirmed)));
    return el('div', { class: 'req-needs' }, out);
  }

  /* ---- Project Phase dashboard metrics ---- */
  function projMetrics(list) {
    const m = { total: list.length, byStage: {}, won: 0, lost: 0, meetingsDone: 0, quotationsSent: 0, conceptsSent: 0, needConcept: 0, needQuotation: 0 };
    PROJ_STAGES.forEach((s) => { m.byStage[s.key] = 0; });
    list.forEach((p) => {
      const st = projStage(p);
      m.byStage[st] = (m.byStage[st] || 0) + 1;
      if (st === 'won') m.won++;
      if (st === 'lost') m.lost++;
      if (p.meeting && p.meeting.confirmed) m.meetingsDone++;
      if (p.proposal && p.proposal.confirmed) m.quotationsSent++;
      if (p.solution && p.solution.confirmed) m.conceptsSent++;
      if (p.fields && p.fields.needConcept) m.needConcept++;
      if (p.fields && p.fields.needQuotation) m.needQuotation++;
    });
    return m;
  }
  function companyMetrics(list) {
    const map = new Map();
    list.forEach((p) => {
      const c = ((p.fields && p.fields.customer) || '').trim() || '—';
      let e = map.get(c);
      if (!e) { e = { company: c, total: 0, reqConcept: 0, reqQuote: 0, conceptSent: 0, quoteSent: 0, conceptDropped: 0, won: 0 }; map.set(c, e); }
      e.total++;
      if (p.fields && p.fields.needConcept) e.reqConcept++;
      if (p.fields && p.fields.needQuotation) e.reqQuote++;
      if (p.solution && p.solution.confirmed) e.conceptSent++;
      if (p.proposal && p.proposal.confirmed) e.quoteSent++;
      if (p.solution && p.solution.confirmed && p.decision === 'lost') e.conceptDropped++;
      if (p.decision === 'won') e.won++;
    });
    return Array.from(map.values()).sort((a, b) => b.total - a.total || b.won - a.won);
  }

  /* Small dependency-free SVG charts, drawn in the app's own colours, with
     a draw-in entrance and a hover preview on every value. */
  function donutEl(segs, bigText, smallLabel, opts) {
    opts = opts || {};
    const shown = segs.filter((s) => s.value > 0);
    const total = shown.reduce((s, x) => s + x.value, 0);
    const r = 42, cx = 60, cy = 60, sw = 16, C = 2 * Math.PI * r;
    let start = 0;
    const arcs = shown.map((s, i) => {
      const len = (s.value / (total || 1)) * C;
      const off = (-start).toFixed(2);
      start += len;
      return `<circle class="donut-arc" data-i="${i}" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${sw}" stroke-dasharray="var(--arcLen) 9999" stroke-dashoffset="${off}" transform="rotate(-90 ${cx} ${cy})" style="--arcLen:${len.toFixed(2)};animation-delay:${(i * 0.12).toFixed(2)}s"/>`;
    }).join('');

    const wrap = el('div', { class: 'chart-donut-wrap' });
    const holder = el('div', { class: 'chart-donut' });
    holder.innerHTML = `<svg viewBox="0 0 120 120" class="donut-svg" role="img">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(140,140,150,0.16)" stroke-width="${sw}"/>
      ${arcs}
      <text x="60" y="58" text-anchor="middle" class="donut-big">${bigText}</text>
      <text x="60" y="76" text-anchor="middle" class="donut-small">${smallLabel}</text>
    </svg>`;
    wrap.appendChild(holder);

    /* Linked legend + shared hover: pointing at a slice or a legend row
       previews that value (and its share) in the centre. */
    const legend = el('div', { class: 'chart-legend' });
    const bigEl = holder.querySelector('.donut-big');
    const smallEl = holder.querySelector('.donut-small');
    const arcEls = holder.querySelectorAll('.donut-arc');
    shown.forEach((s, i) => {
      const pct = Math.round(s.value / (total || 1) * 100);
      const item = el('span', { class: 'cl-item', tabindex: '0' }, [
        el('span', { class: 'cl-dot', style: `background:${s.color}` }),
        el('span', { class: 'cl-label' }, [L(s.label)]),
        el('span', { class: 'cl-val', text: String(s.value) }),
      ]);
      const arc = arcEls[i];
      const enter = () => {
        bigEl.textContent = String(s.value);
        smallEl.textContent = T(s.label) + ' · ' + pct + '%';
        holder.classList.add('is-hot');
        if (arc) arc.classList.add('hot');
        item.classList.add('hot');
      };
      const leave = () => {
        bigEl.textContent = bigText;
        smallEl.textContent = smallLabel;
        holder.classList.remove('is-hot');
        if (arc) arc.classList.remove('hot');
        item.classList.remove('hot');
      };
      [item, arc].forEach((n) => { if (!n) return; n.addEventListener('mouseenter', enter); n.addEventListener('mouseleave', leave); });
      item.addEventListener('focus', enter); item.addEventListener('blur', leave);
      if (opts.onPick) {
        item.classList.add('is-click');
        const pick = () => opts.onPick(s);
        item.addEventListener('click', pick);
        if (arc) { arc.style.cursor = 'pointer'; arc.addEventListener('click', pick); }
      }
      legend.appendChild(item);
    });
    wrap.appendChild(legend);
    return wrap;
  }
  function chartTrunc(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
  function columnsEl(items, opts) {
    opts = opts || {};
    const max = Math.max(1, ...items.map((i) => i.value));
    const base = opts.share ? items.reduce((s, i) => s + i.value, 0) : (items.length ? items[0].value : 0);
    const n = items.length, bw = 46, gap = 24, padX = 16;
    const padTop = 24, plotH = opts.short ? 82 : 150, padBot = opts.short ? 26 : 34;
    const W = padX * 2 + n * bw + (n - 1) * gap, H = padTop + plotH + padBot;
    const bars = items.map((it, i) => {
      const x = padX + i * (bw + gap);
      const h = Math.max(2, (it.value / max) * plotH);
      const y = padTop + plotH - h;
      const pct = base ? Math.round(it.value / base * 100) : 0;
      const lbl = opts.trunc ? chartTrunc(T(it.label), opts.trunc) : T(it.label);
      return `<g class="col-bar${opts.onPick ? ' is-click' : ''}" style="animation-delay:${(i * 0.08).toFixed(2)}s">
        <rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="6" fill="${it.color}"/>
        <text x="${x + bw / 2}" y="${y - 7}" text-anchor="middle" class="col-val">${it.value}</text>
        <text x="${x + bw / 2}" y="${y - 22}" text-anchor="middle" class="col-pct">${pct}%</text>
        <text x="${x + bw / 2}" y="${padTop + plotH + 20}" text-anchor="middle" class="col-lbl">${lbl}</text>
      </g>`;
    }).join('');
    const holder = el('div', { class: 'chart-cols' });
    holder.innerHTML = `<svg viewBox="0 0 ${W} ${H}" class="col-svg" preserveAspectRatio="xMidYMax meet">${bars}</svg>`;
    if (opts.onPick) holder.querySelectorAll('.col-bar').forEach((g, i) => g.addEventListener('click', () => opts.onPick(items[i])));
    return holder;
  }

  const COMPANY_COLORS = ['#0a84ff', '#bf5af3', '#00c2d6', '#ff9f0a', '#30d158', '#ff6b5e', '#5e5ce6', '#ffd60a', '#15e6cf', '#ff453a'];

  /* A labelled count list with a proportional bar behind each row. */
  function summaryCard(title, note, rows, emptyLabel) {
    const card = el('div', { class: 'card summary-card' });
    card.appendChild(el('h3', { class: 'sub-title' }, [L(title)]));
    card.appendChild(el('div', { class: 'summary-note' }, [L(note)]));

    if (!rows.length) {
      card.appendChild(el('div', { class: 'summary-empty' }, [L(emptyLabel)]));
      return card;
    }
    const max = Math.max(...rows.map((r) => r.count));
    const list = el('div', { class: 'summary-list' });
    rows.forEach((r) => {
      list.appendChild(
        el('div', { class: 'summary-row' }, [
          el('span', { class: 'summary-label', text: T(r.label) }),
          el('span', { class: 'summary-meter' }, [
            el('span', { class: 'summary-fill', style: `width:${(r.count / max) * 100}%` }),
          ]),
          el('span', { class: 'summary-count', text: String(r.count) }),
        ])
      );
    });
    card.appendChild(list);
    return card;
  }

  /* ---------------- Bar chart ----------------
     Built from plain elements, not a library: each bar is a real
     button, so it is keyboard reachable and screen-reader readable,
     and a table view sits behind a toggle for anyone who would rather
     read the numbers.

     Series colours were validated with the dataviz palette checker
     (lightness band, chroma, colour-blind separation, contrast) for
     both themes — hence two different pairs rather than one flipped. */

  const SERIES = [
    { key: 'machines', label: { en: 'Machines', th: 'จำนวนเครื่อง' }, varName: '--series-1' },
    { key: 'services', label: { en: 'Service visits', th: 'ครั้งที่เข้าบริการ' }, varName: '--series-2' },
  ];

  function niceCeil(v) {
    if (v <= 5) return Math.max(v, 1);
    const pow = Math.pow(10, Math.floor(Math.log10(v)));
    return Math.ceil(v / (pow / 2)) * (pow / 2);
  }

  /* rows: [{ id, label, sub, values: {machines, services}, onClick }] */
  function barChart(rows, opts) {
    const options = opts || {};
    const series = options.series || SERIES;
    const box = el('div', { class: 'chart' });

    if (!rows.length) {
      box.appendChild(el('div', { class: 'empty' }, [L(options.emptyLabel || UI.noRecords)]));
      return box;
    }

    /* Legend — always present for two or more series */
    if (series.length > 1) {
      const legend = el('div', { class: 'legend' });
      series.forEach((sr) => {
        legend.appendChild(
          el('span', { class: 'legend-item' }, [
            el('span', { class: 'legend-swatch', style: `background:var(${sr.varName})` }),
            L(sr.label),
          ])
        );
      });
      box.appendChild(legend);
    }

    const max = niceCeil(Math.max(1, ...rows.map((r) => Math.max(...series.map((sr) => r.values[sr.key] || 0)))));
    const ticks = 4;

    const plot = el('div', { class: 'chart-plot' });

    /* Recessive gridlines with their value on the axis */
    const grid = el('div', { class: 'chart-grid' });
    for (let i = 0; i <= ticks; i++) {
      const v = Math.round((max / ticks) * i);
      grid.appendChild(
        el('div', { class: 'grid-line', style: `bottom:${(i / ticks) * 100}%` }, [
          el('span', { class: 'grid-label', text: String(v) }),
        ])
      );
    }
    plot.appendChild(grid);

    const tip = chartTip();

    const track = el('div', { class: 'chart-track' });
    rows.forEach((row, gi) => {
      const group = el('button', {
        class: 'bar-group' + (options.onSelect ? ' is-clickable' : ''),
        /* --gi staggers the entrance: each company's bars rise a beat
           after the previous one (capped so long lists don't crawl). */
        style: '--gi:' + Math.min(gi, 12),
        type: 'button',
        'aria-label': `${row.label}: ` + series.map((sr) => `${T(sr.label)} ${row.values[sr.key] || 0}`).join(', '),
        onclick: () => { if (options.onSelect) options.onSelect(row); },
        onmouseenter: (e) => showTip(e, row),
        onmousemove: (e) => showTip(e, row),
        onmouseleave: hideChartTip,
        onfocus: (e) => showTip(e, row),
        onblur: hideChartTip,
      });

      const bars = el('div', { class: 'bars' });
      series.forEach((sr) => {
        const v = row.values[sr.key] || 0;
        const h = max ? (v / max) * 100 : 0;
        bars.appendChild(
          el('span', { class: 'bar-slot' }, [
            el('span', { class: 'bar-value', text: v ? String(v) : '' }),
            el('span', {
              class: 'bar',
              style: `height:${h}%;--bar:var(${sr.varName})`,
            }),
          ])
        );
      });
      group.appendChild(bars);
      group.appendChild(el('span', { class: 'bar-label', text: row.label, title: row.label }));
      if (row.sub) group.appendChild(el('span', { class: 'bar-sub', text: row.sub }));
      track.appendChild(group);
    });

    function showTip(e, row) {
      tip.innerHTML = '';
      tip.appendChild(el('div', { class: 'tip-title', text: row.label }));

            el('span', { class: 'tip-key', text: T(sr.label) }),
            el('span', { class: 'tip-val', text: String(row.values[sr.key] || 0) }),
          ])
        );
      });
      placeChartTip(tip, e.currentTarget.getBoundingClientRect());
    }

    plot.appendChild(track);
    box.appendChild(plot);

    /* Table view — the numbers, for anyone who wants them straight */
    const table = el('div', { class: 'table-wrap chart-table', style: 'display:none;margin-top:14px' });

      el('th', {}, [L(options.dimensionLabel || { en: 'Name', th: 'ชื่อ' })]),

    ])));

        toggle.textContent = shown ? T({ en: 'Show numbers', th: 'ดูเป็นตัวเลข' }) : T({ en: 'Hide numbers', th: 'ซ่อนตัวเลข' });
      },

    });

    box.appendChild(table);

    return box;
  }

  function createAndOpen(type, prefill) {
    const rec = newRecord(type);
    if (prefill) Object.assign(rec.fields, prefill);
    db.records.push(rec);
    saveDB();
    go('form', { recordId: rec.id });
  }

  /* ---------------- View: New form picker ---------------- */

  function viewNewForm(root) {
    root.appendChild(
      el('div', { class: 'page-head' }, [
        el('div', {}, [
          el('h1', { class: 'page-title' }, [L({ en: 'New Form', th: 'สร้างเอกสารใหม่' })]),
          el('div', { class: 'page-sub' }, [
            L({
              en: 'Machine lifecycle: Build → FAT → SAT → Service',
              th: 'วงจรชีวิตเครื่องจักร: ประกอบ → ทดสอบที่โรงงานเรา → ทดสอบที่หน้างาน → บริการ',
            }),
          ]),
        ]),
      ])

  /* ---------------- View: Records ---------------- */

  /* Records filter. Kept outside the view so drilling into a record and
     coming back does not throw away what you narrowed down to. */
  const recFilter = { customer: '', machine: '', type: '', sort: 'date-desc' };

  const SORTS = [
    { key: 'date-desc',  label: { en: 'Date — newest first', th: 'วันที่ — ใหม่สุดก่อน' } },
    { key: 'date-asc',   label: { en: 'Date — oldest first', th: 'วันที่ — เก่าสุดก่อน' } },
    { key: 'doc-asc',    label: { en: 'Document no. — A to Z', th: 'เลขที่เอกสาร — ก-ฮ' } },
    { key: 'doc-desc',   label: { en: 'Document no. — Z to A', th: 'เลขที่เอกสาร — ฮ-ก' } },
    { key: 'machine-asc',label: { en: 'Machine name — A to Z', th: 'ชื่อเครื่องจักร — ก-ฮ' } },
    { key: 'customer-asc',label:{ en: 'Customer — A to Z', th: 'ลูกค้า — ก-ฮ' } },
  ];

  function sortRecords(list, key) {
    const by = (f) => (a, b) => {
      const x = String(f(a) || '').toLowerCase(), y = String(f(b) || '').toLowerCase();
      return x < y ? -1 : x > y ? 1 : 0;
    };
    const copy = list.slice();
    switch (key) {
      case 'date-asc':    return copy.sort(by((r) => primaryDate(r)));
      case 'doc-asc':     return copy.sort(by((r) => r.docNo));
      case 'doc-desc':    return copy.sort(by((r) => r.docNo)).reverse();
      case 'machine-asc': return copy.sort(by((r) => r.fields.machineName || 'zzz'));
      case 'customer-asc':return copy.sort(by((r) => r.fields.customer || 'zzz'));
      default:            return copy.sort(by((r) => primaryDate(r))).reverse();
    }
  }

  function viewRecords(root) {
    root.appendChild(
      el('div', { class: 'page-head' }, [
        el('div', {}, [
          el('h1', { class: 'page-title' }, [L({ en: 'All Records', th: 'เอกสารทั้งหมด' })]),
          el('div', { class: 'page-sub', text: db.records.length + ' total' }),
        ]),
        el('input', {
          class: 'search-input',
          placeholder: T(UI.search),
          value: state.search,
          oninput: (e) => { state.search = e.target.value; refresh(); },
        }),
      ])
    );

    const bar = el('div', { class: 'filter-bar', id: 'recFilterBar' });
    root.appendChild(bar);
    const holder = el('div', { id: 'recordsHolder' });
    root.appendChild(holder);

    drawBar();
    drawList();

    /* The search box is a live input — rebuilding it under the cursor
       would drop focus mid-word, so only the list is redrawn there. */
    function refresh() { drawList(); }
    function refreshAll() { drawBar(); drawList(); }

    /* ---- which options each dropdown should offer ----
       A cascade, and strictly in that order: customer, then their
       machines, then the documents that exist for that machine. Each
       level narrows the one below it and nothing narrows the level
       above.

       The first version filtered every dropdown by every OTHER filter,
       which reads as symmetrical and sounds tidier. It was a trap:
       choosing a machine cut the customer list down to that machine's
       one owner, so there was no way to switch customer again without
       clearing everything. Its own test could not reach the third
       customer and timed out. */
    function optionsFor(field) {
      const seen = new Map();
      db.records.forEach((r) => {
        if (field !== 'customer' && recFilter.customer && r.fields.customer !== recFilter.customer) return;
        if (field === 'type' && recFilter.machine && r.fields.machineName !== recFilter.machine) return;
        const v = field === 'customer' ? r.fields.customer
                : field === 'machine'  ? r.fields.machineName
                : r.type;
        if (!v) return;
        seen.set(v, (seen.get(v) || 0) + 1);
      });
      return [...seen.entries()].sort((a, b) => (a[0] < b[0] ? -1 : 1));
    }

    function passes(r) {
      if (recFilter.customer && r.fields.customer !== recFilter.customer) return false;
      if (recFilter.machine  && r.fields.machineName !== recFilter.machine) return false;
      if (recFilter.type     && r.type !== recFilter.type) return false;
      return true;
    }

    function select(field, labelText, placeholder, opts, render) {
      const sel = el('select', { class: 'filter-select' });
      sel.appendChild(el('option', { value: '', text: T(placeholder) }));
      opts.forEach(([value, count]) => {
        const o = el('option', { value, text: render(value) + '  (' + count + ')' });
        if (recFilter[field] === value) o.selected = true;
        sel.appendChild(o);
      });
      sel.addEventListener('change', () => {
        recFilter[field] = sel.value;
        /* Moving up the cascade can strand what was chosen below it —
           another customer's machine, or a document type that machine
           has none of. Drop the stranded choice rather than leaving the
           technician staring at an empty list they cannot explain. */
        if (field === 'customer' && recFilter.machine) {
          const still = db.records.some((r) =>
            r.fields.machineName === recFilter.machine &&
            (!recFilter.customer || r.fields.customer === recFilter.customer));
          if (!still) recFilter.machine = '';
        }
        if ((field === 'customer' || field === 'machine') && recFilter.type) {
          if (!db.records.some((r) => r.type === recFilter.type
              && (!recFilter.customer || r.fields.customer === recFilter.customer)
              && (!recFilter.machine  || r.fields.machineName === recFilter.machine))) {
            recFilter.type = '';
          }
        }
        refreshAll();
      });
      return el('label', { class: 'filter-field' + (recFilter[field] ? ' is-set' : '') }, [
        el('span', { class: 'filter-label' }, [L(labelText)]),
        sel,
      ]);
    }

    function drawBar() {
      bar.innerHTML = '';

      bar.appendChild(select('customer',
        { en: 'Customer', th: 'ลูกค้า' },
        { en: 'All customers', th: 'ลูกค้าทั้งหมด' },
        optionsFor('customer'), (v) => v));

      bar.appendChild(select('machine',
        { en: 'Machine', th: 'เครื่องจักร' },
        { en: 'All machines', th: 'เครื่องจักรทั้งหมด' },
        optionsFor('machine'), (v) => v));

      bar.appendChild(select('type',
        { en: 'Document', th: 'ประเภทเอกสาร' },
        { en: 'All documents', th: 'เอกสารทุกประเภท' },
        optionsFor('type'),
        (v) => FORM_BY_TYPE[v] ? FORM_BY_TYPE[v].prefix + ' · ' + T(FORM_BY_TYPE[v].name) : v));

      const sortSel = el('select', { class: 'filter-select' });
      SORTS.forEach((s) => {
        const o = el('option', { value: s.key, text: T(s.label) });
        if (recFilter.sort === s.key) o.selected = true;
        sortSel.appendChild(o);
      });
      sortSel.addEventListener('change', () => { recFilter.sort = sortSel.value; drawList(); });
      bar.appendChild(el('label', { class: 'filter-field' }, [
        el('span', { class: 'filter-label' }, [L({ en: 'Sort by', th: 'เรียงตาม' })]),
        sortSel,
      ]));

      const active = !!(recFilter.customer || recFilter.machine || recFilter.type || state.search.trim());
      if (active) {
        bar.appendChild(el('button', {
          class: 'filter-clear',
          onclick: () => {
            recFilter.customer = recFilter.machine = recFilter.type = '';
            state.search = '';
            render();
          },
        }, [L({ en: 'Clear', th: 'ล้างตัวกรอง' })]));
      }
    }

    function currentList() {
      const q = state.search.trim().toLowerCase();
      let list = db.records.filter(passes);
      if (q) {
        list = list.filter((r) => {
          const hay = [r.docNo, r.fields.workNo, r.fields.serialNo, r.fields.customer,
                       r.fields.machineName, T(FORM_BY_TYPE[r.type] ? FORM_BY_TYPE[r.type].name : {})]
            .join(' ').toLowerCase();
          return hay.includes(q);
        });
      }
      return sortRecords(list, recFilter.sort);
    }

    function drawList() {
      const list = currentList();
      holder.innerHTML = '';

      const count = el('div', { class: 'filter-count' });
      if (list.length === db.records.length) {
        count.appendChild(L({ en: `Showing all ${list.length}`, th: `แสดงทั้งหมด ${list.length} รายการ` }));
      } else {
        count.appendChild(L({
          en: `Showing ${list.length} of ${db.records.length}`,
          th: `แสดง ${list.length} จาก ${db.records.length} รายการ`,
        }));
      }
      holder.appendChild(count);

      if (!list.length) {
        holder.appendChild(el('div', { class: 'empty' }, [
          L({ en: 'Nothing matches these filters.', th: 'ไม่พบเอกสารตามตัวกรองนี้' }),
        ]));
      } else {
        holder.appendChild(recordTable(list));
      }
      stampTableLabels(holder);
    }
  }

  function recordTable(list) {
    const wrap = el('div', { class: 'table-wrap' });
    const table = el('table');
    table.appendChild(
      el('thead', {}, el('tr', {}, [
        el('th', { text: 'Doc No.' }),
        el('th', { text: 'Type' }),
        el('th', { text: 'Work No.' }),
        el('th', { text: 'Machine / Customer' }),
        el('th', { text: 'Date' }),
        el('th', { text: 'Progress' }),
        el('th', { text: 'Status' }),
      ]))
    );
    const tbody = el('tbody');
    list.forEach((r) => {
      const def = FORM_BY_TYPE[r.type];
      if (!def) return;
      const p = recordProgress(r);
      const meta = resultMeta(r);
      tbody.appendChild(
        el('tr', { class: 'clickable', onclick: () => go('form', { recordId: r.id }) }, [
          el('td', { html: `<strong>${escapeHTML(r.docNo)}</strong>` }),
          el('td', {}, el('span', { class: 'type-badge', style: `--accent:${def.accent}` }, [icon(def.icon, 14), el('span', { text: def.prefix })])),
          el('td', { text: r.fields.workNo || '—' }),
          el('td', {
            html:
              escapeHTML(r.fields.machineName || '—') +
              `<div style="font-size:12px;color:var(--text-dim)">${escapeHTML(r.fields.customer || '')}</div>`,
          }),
          el('td', { text: fmtDate(primaryDate(r)) }),
          el('td', { html: p.total ? `${p.done}/${p.total}` : '—' }),
          el('td', {}, el('span', { class: 'pill ' + pillClassFor(r), text: meta ? T(meta.label) : T(UI.draft) })),
        ])
      );
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    return wrap;
  }

  function primaryDate(r) {
    const f = r.fields || {};
    /* createdAt has always been a string in practice, but a record that
       arrives missing it (a partial write, an older export, a stub that
       slipped through) must not take the whole Records page down over a
       date. Fall back to updatedAt, then to nothing. */
    return f.inspectionDate || f.serviceDate || f.commissionDate || f.buildDate
      || String(r.createdAt || r.updatedAt || '').slice(0, 10);
  }

  function escapeHTML(s) {
    return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, (c) => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
  }

  /* ---------------- View: Machines ---------------- */

  function viewMachines(root) {
    const all = machineList();

    /* Filters are plain selects on purpose: on a tablet a native
       picker is faster and more reliable than any custom dropdown. */
    const customers = Array.from(new Set(all.map((m) => m.customer || '—'))).sort();
    if (state.filterCustomer && !customers.includes(state.filterCustomer)) state.filterCustomer = null;

    const byCustomer = state.filterCustomer
      ? all.filter((m) => (m.customer || '—') === state.filterCustomer)
      : all;

    if (state.filterMachine && !byCustomer.some((m) => m.key === state.filterMachine)) state.filterMachine = null;

    root.appendChild(
      el('div', { class: 'page-head' }, [
        el('div', {}, [
          el('h1', { class: 'page-title' }, [L({ en: 'Machines', th: 'เครื่องจักร' })]),
          el('div', { class: 'page-sub' }, [
            L({ en: 'Pick a customer, then a machine. Tap any service count to see the visits behind it.',
                th: 'เลือกลูกค้า แล้วเลือกเครื่องจักร แตะที่จำนวนครั้งบริการเพื่อดูรายละเอียดการเข้าบริการ' }),
          ]),
        ]),
      ])
    );

    /* ---- filter bar ---- */
    const bar = el('div', { class: 'filter-bar' });

    const custSel = el('select', {
      class: 'filter-select',
      onchange: (e) => { state.filterCustomer = e.target.value || null; state.filterMachine = null; render(); },
    });
    custSel.appendChild(el('option', { value: '', text: T({ en: 'All customers', th: 'ลูกค้าทั้งหมด' }) }));
    customers.forEach((c) => {
      const count = all.filter((m) => (m.customer || '—') === c).length;
      const o = el('option', { value: c, text: `${c}  (${count})` });
      if (state.filterCustomer === c) o.selected = true;
      custSel.appendChild(o);
    });

    const machSel = el('select', {
      class: 'filter-select',
      onchange: (e) => { state.filterMachine = e.target.value || null; render(); },
    });
    machSel.appendChild(el('option', { value: '', text: T({ en: 'All machines', th: 'เครื่องจักรทั้งหมด' }) }));
    byCustomer.forEach((m) => {
      const o = el('option', { value: m.key, text: `${m.workNo || '—'} · ${m.machineName || m.serialNo || '—'}` });
      if (state.filterMachine === m.key) o.selected = true;
      machSel.appendChild(o);
    });

    bar.appendChild(el('label', { class: 'filter-field' }, [
      el('span', { class: 'filter-label' }, [L({ en: 'Customer', th: 'ลูกค้า' })]), custSel,
    ]));
    bar.appendChild(el('label', { class: 'filter-field' }, [
      el('span', { class: 'filter-label' }, [L({ en: 'Machine', th: 'เครื่องจักร' })]), machSel,
    ]));
    if (state.filterCustomer || state.filterMachine) {
      bar.appendChild(el('button', {
        class: 'btn btn-sm', style: 'align-self:flex-end',
        onclick: () => { state.filterCustomer = null; state.filterMachine = null; render(); },
      }, [L({ en: 'Clear', th: 'ล้างตัวกรอง' })]));
    }
    root.appendChild(bar);

    const shown = state.filterMachine ? byCustomer.filter((m) => m.key === state.filterMachine) : byCustomer;

    if (!shown.length) {
      root.appendChild(el('div', { class: 'empty' }, [
        L({ en: 'No machines match. Fill in Work No. and Serial No. on a form to register one.',
            th: 'ไม่พบเครื่องจักรที่ตรงกับตัวกรอง กรอกเลขที่งานและหมายเลขเครื่องในเอกสารเพื่อลงทะเบียน' }),
      ]));
      return;
    }

    /* One machine chosen — show it in full rather than as a table row */
    if (shown.length === 1 && state.filterMachine) {
      root.appendChild(machineDetailCard(shown[0]));
      return;
    }

    const wrap = el('div', { class: 'table-wrap' });
    const table = el('table');
    table.appendChild(el('thead', {}, el('tr', {}, [
      el('th', {}, [L({ en: 'Work No.', th: 'เลขที่งาน' })]),
      el('th', {}, [L({ en: 'Machine', th: 'เครื่องจักร' })]),
      el('th', {}, [L({ en: 'Customer', th: 'ลูกค้า' })]),
      el('th', {}, [L({ en: 'Records', th: 'เอกสาร' })]),
      el('th', {}, [L({ en: 'Service visits', th: 'ครั้งที่เข้าบริการ' })]),
    ])));

    const tbody = el('tbody');
    shown.forEach((m) => {
      const counts = {};
      m.records.forEach((r) => { counts[r.type] = (counts[r.type] || 0) + 1; });
      const badges = el('div', { style: 'display:flex;gap:5px;flex-wrap:wrap' });
      FORM_TYPES.forEach((def) => {
        if (!counts[def.type]) return;
        badges.appendChild(el('span', { class: 'type-badge', style: `--accent:${def.accent}` },
          [icon(def.icon, 14), el('span', { text: `${def.prefix} ${counts[def.type]}` })]));
      });

      const services = m.records.filter((r) => r.type === 'SERVICE');
      const open = state.openMachine === m.key;

      const row = el('tr', {}, [
        el('td', { class: 'clickable', onclick: () => go('machine', { machineKey: m.key }) },
          el('strong', { text: m.workNo || '—' })),
        el('td', { class: 'clickable', onclick: () => go('machine', { machineKey: m.key }), html:
          `${escapeHTML(m.machineName || '—')}<div style="font-size:12.5px;color:var(--text-dim)">${escapeHTML(m.serialNo || '')}</div>` }),
        el('td', { text: m.customer || '—' }),
        el('td', {}, badges),
        el('td', {}, services.length
          ? el('button', {
              class: 'count-btn' + (open ? ' is-open' : ''),
              'aria-expanded': open ? 'true' : 'false',
              title: T({ en: 'Show these service visits', th: 'ดูรายการเข้าบริการ' }),
              onclick: () => { state.openMachine = open ? null : m.key; render(); },
            }, [
              el('span', { class: 'count-num', text: String(services.length) }),
              el('span', { class: 'count-caret', text: open ? '▾' : '▸' }),
            ])
          : el('span', { style: 'color:var(--text-faint)', text: '0' })),
      ]);
      tbody.appendChild(row);

      if (open && services.length) {
        tbody.appendChild(el('tr', { class: 'detail-row' }, [
          el('td', { colspan: '5' }, [serviceListFor(m, services)]),
        ]));
      }
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    root.appendChild(wrap);
  }

  /* The visits behind a service count — each one opens its report. */
  function serviceListFor(machine, services) {
    const box = el('div', { class: 'service-panel' });
    box.appendChild(el('div', { class: 'service-panel-head' }, [
      el('strong', { text: machine.machineName || machine.workNo || '—' }),
      el('span', { class: 'service-panel-sub', text: [machine.workNo, machine.serialNo].filter(Boolean).join(' · ') }),
    ]));

    const causes = recurringCauses(services);
    if (causes.length) {
      box.appendChild(el('div', { class: 'service-panel-note' }, [

  /* Apply a parsed backup to the database as a FORCE OVERWRITE.
     ────────────────────────────────────────────────────────────
     The backup is treated as the source of truth: every record in it
     overwrites the shared copy on EVERY device, whether or not a newer
     edit exists elsewhere. Nothing is deleted — records the file does not
     mention are left untouched.

     How the overwrite reaches the other tablets: sync decides who wins by
     updatedAt (newest wins). So to make the backup win everywhere, each
     restored record is stamped as freshly updated, right now. That single
     stamp is what lets a year-old backup push itself back over whatever is
     currently in the database. The record's own dates (inspection date,
     created date, …) are NOT touched — only the sync timestamp that
     settles conflicts. Returns the number of records written. */
  function restoreFromBackup(data) {
    if (!data || !Array.isArray(data.records)) throw new Error('bad format');
    const stamp = new Date().toISOString();
    const byId = new Map(db.records.map((r) => [r.id, r]));
    let written = 0;
    data.records.forEach((raw) => {
      /* A backup exported after a cloud round trip is missing the same
         empty containers Firebase dropped — normalise on the way in. */
      const rec = normaliseRecord(raw);
      if (!rec || !rec.id) return;

      rec.updatedAt = stamp;                         // assert authority (newest wins)

      /* A restored record outranks an earlier deletion — clear any
         tombstone so it comes back and stays back instead of being
         re-deleted a second later. */
      if (db.meta.tombstones && db.meta.tombstones[rec.id]) delete db.meta.tombstones[rec.id];

      const mine = byId.get(rec.id);
      if (mine) {
        /* Overwrite in place — an open form may hold this exact object,
           so replacing the reference would orphan its field handlers. */
        Object.keys(mine).forEach((k) => { if (!(k in rec)) delete mine[k]; });
        Object.assign(mine, rec);
      } else {
        db.records.push(rec);
        byId.set(rec.id, rec);
      }
      written++;
    });

    db.meta.peopleSeeded = false;   /* pick up names from the imported records */
    people();
    saveDB();                       // persists locally AND pushes every stamped record up
    return written;
  }

  function importJSON(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data || !Array.isArray(data.records)) throw new Error('bad format');
        const count = data.records.filter((r) => r && r.id).length;
        const warn = lang === 'th'
          ? ('กู้คืน ' + count + ' รายการจากไฟล์นี้ทับข้อมูลบนทุกเครื่อง? '
             + 'รายการที่ชื่อซ้ำจะถูกเขียนทับด้วยข้อมูลในไฟล์ (ไม่มีการลบรายการอื่น)')
          : ('Restore ' + count + ' records from this file and overwrite them on every device? '
             + 'Existing records with the same ID will be replaced by the file’s version. Nothing else is deleted.');
        if (!window.confirm(warn)) { e.target.value = ''; return; }
        const written = restoreFromBackup(data);
        toast((lang === 'th' ? 'กู้คืนแล้ว ' : 'Restored ') + written + (lang === 'th' ? ' รายการ' : ' records'));
        render();
      } catch (err) {
        toast(lang === 'th' ? 'ไฟล์ไม่ถูกต้อง' : 'Invalid backup file', true);
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  }

  function wipeAll() {
    const msg = lang === 'th'
      ? 'ลบข้อมูลทั้งหมดออกจากทุกเครื่องอย่างถาวร? ควรส่งออกไฟล์สำรองก่อน'
      : 'Permanently erase ALL data on EVERY device? Export a backup first.';
    if (!confirm(msg)) return;
    if (!confirm(lang === 'th'
      ? 'ยืนยันอีกครั้ง — ข้อมูลจะถูกลบจากทุกเครื่องและกู้คืนไม่ได้ (ยกเว้นมีไฟล์สำรอง)'
      : 'Confirm again — this erases every record on all tablets and cannot be undone (unless you have a backup file).')) return;

    /* An erase has to travel like a delete, or it does nothing and worse:
       clearing the records here leaves the shared database untouched, and
       the next snapshot pours every record straight back — the erase
       undoes itself, on this tablet too. So erase leaves a tombstone for
       EVERY record (the same marker a single delete makes), which is what
       carries the erase to every device and keeps the records from
       reappearing. A backup file is the only way back, which is why the
       confirmations push toward exporting one first. */
    const stamp = new Date().toISOString();
    db.meta = db.meta || { version: 1, counters: {} };
    db.meta.tombstones = db.meta.tombstones || {};
    db.records.forEach((r) => {
      if (r && r.id) db.meta.tombstones[r.id] = { type: r.type, docNo: r.docNo, updatedAt: stamp };
    });
    db.records = [];
    db.meta.people = [];
    db.meta.peopleSeeded = false;
    saveDB();   // pushes every tombstone up; other tablets drop their records
    toast(lang === 'th' ? 'ลบข้อมูลทั้งหมดแล้ว' : 'All data erased');
    go('dashboard');
  }
