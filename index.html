<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<!-- Exactly the FN-ERP-System zoom lock. The 110% is not in here:
     it comes from `zoom` in the stylesheet, which derives the layout
     box from the viewport rather than asking the browser to derive
     the viewport from a scale. Carrying the scale in this tag is what
     produced the page that panned sideways on an iPhone.

     iOS Safari has ignored user-scalable and the scale bounds since
     iOS 10, so on an iPhone or iPad this tag does not stop a pinch —
     the ERP has the same gap. blockPinchShrink() covers iOS. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="description" content="FN Machine Care — Machine Inspection & Service Management System for F N Technology. Machine build checklist (ASSY), factory acceptance test (FAT), site acceptance test (SAT), and customer service reports (SR).">
<meta name="theme-color" content="#e9edf6">
<title>FN Machine Care — Machine Inspection &amp; Service Management</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='26' fill='%230a84ff'/><text y='68' x='50' font-size='50' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>FN</text></svg>">
<style>
/* =============================================================
   FN MACHINE CARE — visionOS theme
   -------------------------------------------------------------
   The design rule that governs everything here:

       GLASS FOR THE CHROME.  SOLID FOR THE VERDICT.

   Panels, sidebar, toolbar and cards are true frosted glass
   floating over an ambient environment. But PASS / FAIL / N/A —
   and every status that carries a safety consequence — are fully
   opaque and saturated. They punch through the glass like real
   hardware buttons. A technician under factory lighting must
   never squint to tell whether a row passed.
   ============================================================= */

/* ---------------- Tokens: light (default) ---------------- */

:root {
  color-scheme: light;

  /* Environment behind the glass */
  --env-1: #c6d3ea;
  --env-2: #dae2f0;
  --orb-a: rgba(10, 132, 255, .16);
  --orb-b: rgba(191, 90, 243, .10);
  --orb-c: rgba(48, 209, 88, .07);

  /* Glass surfaces — layered by elevation */
  --glass:        rgba(253, 254, 255, .58);
  --glass-raised: rgba(253, 254, 255, .72);
  --glass-bar:    rgba(246, 249, 253, .96);
  --glass-drawer: rgba(244, 247, 252, .96);
  --glass-sunken: rgba(255, 255, 255, .26);
  --glass-hover:  rgba(255, 255, 255, .80);

  /* Edges: a bright specular rim above, a soft shadow below */
  --edge:       rgba(255, 255, 255, .70);
  --edge-quiet: rgba(9, 20, 48, .12);
  --hairline:   rgba(9, 20, 48, .12);
  --hairline-soft: rgba(9, 20, 48, .07);

  --lift-1: 0 1px 2px rgba(12, 24, 56, .06), 0 6px 18px rgba(12, 24, 56, .07);
  --lift-2: 0 2px 6px rgba(12, 24, 56, .08), 0 18px 44px rgba(12, 24, 56, .12);
  --lift-3: 0 8px 20px rgba(12, 24, 56, .12), 0 34px 70px rgba(12, 24, 56, .18);
  --specular: inset 0 1px 0 rgba(255, 255, 255, .9);

  /* Ink */
  --text:       #0d1526;
  --text-dim:   #414c66;
  --text-faint: #5c6780;

  /* Fields sit *under* the glass, so they go slightly darker */
  --field:       rgba(255, 255, 255, .70);
  --field-focus: rgba(255, 255, 255, .96);

  /* Apple system colors — the accent language of visionOS */
  --accent-blue:   #0a84ff;
  --accent-violet: #bf5af3;
  --accent-orange: #ff9f0a;
  --accent-yellow: #ffd60a;
  --accent-red:    #ff453a;
  --accent-green:  #30d158;

  --brand: var(--accent-blue);

  /* Wordmark: base ink, and the light that travels through it */
  /* Chart series — validated with the dataviz palette checker against
     this theme's surface: lightness band, chroma floor, colour-blind
     separation (ΔE 27.8 protan) and 3:1 contrast all pass. Dark mode
     uses its own steps, not a flip of these. */
  --series-1: #1d6fd4;
  --series-2: #c2410c;

  --scroll-thumb:       rgba(9, 20, 48, .26);
  --scroll-thumb-hover: rgba(9, 20, 48, .42);

  --wm-base: #101a2e;
  --wm-hi:   #0a84ff;
  --wm-hi-2: #bf5af3;

  --pass:  #248a3d;
  --fail:  #d70015;
  --na:    #8e8e93;
  --warn:  #a86800;

  /* Solid verdict fills — deliberately opaque */
  --pass-fill: #34c759;
  --fail-fill: #ff3b30;
  --na-fill:   #8e8e93;
  --pass-ink:  #ffffff;
  --fail-ink:  #b3000c;

  --bar-h: 65px;

  --radius-window: 26px;
  --radius-card:   20px;
  --radius-ctl:    13px;
  --radius-pill:   999px;

  --blur: saturate(180%) blur(30px);

  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
          "Segoe UI Variable Text", "Segoe UI", "Noto Sans Thai", "IBM Plex Sans Thai",
          "Leelawadee UI", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Consolas, monospace;
}

/* ---------------- Tokens: dark ---------------- */

:root[data-theme="dark"] {
  color-scheme: dark;

  --env-1: #070a12;
  --env-2: #0e1424;
  --orb-a: rgba(10, 132, 255, .34);
  --orb-b: rgba(191, 90, 243, .26);
  --orb-c: rgba(48, 209, 88, .16);

  --glass:        rgba(30, 36, 52, .62);
  --glass-raised: rgba(40, 47, 66, .74);
  --glass-bar:    rgba(19, 24, 38, .977);
  --glass-drawer: rgba(22, 27, 42, .975);
  --glass-sunken: rgba(16, 21, 34, .52);
  --glass-hover:  rgba(52, 60, 82, .78);

  --edge:       rgba(255, 255, 255, .16);
  --edge-quiet: rgba(255, 255, 255, .08);
  --hairline:   rgba(255, 255, 255, .11);
  --hairline-soft: rgba(255, 255, 255, .06);

  --lift-1: 0 1px 2px rgba(0, 0, 0, .34), 0 6px 18px rgba(0, 0, 0, .34);
  --lift-2: 0 2px 6px rgba(0, 0, 0, .40), 0 18px 44px rgba(0, 0, 0, .46);
  --lift-3: 0 8px 20px rgba(0, 0, 0, .46), 0 34px 70px rgba(0, 0, 0, .56);
  --specular: inset 0 1px 0 rgba(255, 255, 255, .14);

  --text:       #f1f4fb;
  --text-dim:   #b9c1d4;
  --text-faint: #98a2b9;

  --field:       rgba(10, 14, 24, .55);
  --field-focus: rgba(10, 14, 24, .82);

  --series-1: #2f80e0;
  --series-2: #c9702a;

  --scroll-thumb:       rgba(255, 255, 255, .22);
  --scroll-thumb-hover: rgba(255, 255, 255, .38);

  --wm-base: #eef2fb;
  --wm-hi:   #6bb8ff;
  --wm-hi-2: #d59bff;

  --pass: #4ee16f;
  --fail: #ff6961;
  --na:   #98989d;
  --warn: #ffd60a;

  --pass-fill: #30d158;
  --fail-fill: #ff453a;
  --na-fill:   #8e8e93;
  --pass-ink:  #04220d;
  --fail-ink:  #ff9d97;
}

* { box-sizing: border-box; }

/* ---------------- UI scale ----------------
   The app is drawn 10% larger, so at the browser's own 100% it reads
   like 110% and nobody has to reach for Ctrl-+ on a plant-floor tablet.

   `zoom` rather than `transform: scale()`: zoom reflows, so text still
   wraps to the space it actually occupies. A transform would paint a
   1440px layout at 1584px and hang a scrollbar off the side.

   Four things zoom does NOT scale, each handled below:
     1. viewport units — 100vh still means the real viewport, so a
        zoomed 100vh block is 110% of the screen and overflows
     2. media query widths — they test the real viewport, so every
        breakpoint has to be widened by the same factor
     3. the drawer's 84vw cap — same reason as (1)
     4. print — A4 pagination must not be zoomed at all
   Change --ui-scale in one place and all four follow. */
:root { --ui-scale: 1.1; }

html {
  zoom: var(--ui-scale);
}

/* One mechanism, every device — and the reason matters, because the
   alternative was tried and produced the bug it was meant to avoid.

   Scaling through the viewport tag (initial-scale=1.1) asks the browser
   to lay out at deviceWidth / 1.1 and paint it larger. It works, but the
   layout width is then something the browser derives, and getting it
   wrong by one attribute puts part of the page where nobody can reach
   it: pairing it with width=device-width laid out 390px of content in a
   355px window and the whole app panned sideways under the thumb.

   CSS zoom does not touch the viewport at all. The layout box is
   viewport / zoom by construction, so the content cannot be wider than
   the screen no matter what the tag says. `zoom` is a WebKit-born
   property; Safari has honoured it far longer than Chrome has.

   That leaves the viewport tag free to be exactly what FN-ERP-System
   uses — a plain 1.0 lock — rather than carrying the scale as well. */
@media (pointer: coarse) {
  /* Drops double-tap-to-zoom, the other way a scale gets stuck.
     Pinch is handled in blockPinchShrink() so magnifying still works. */
  body { touch-action: manipulation; }
}

html, body {
  margin: 0;
  padding: 0;
  /* Not 100%: a percentage here resolves against the real viewport and is
     then painted 10% taller, hanging a scrollbar off a page with nothing
     to scroll. Divide it back out like every other viewport unit. */
  min-height: calc(100vh / var(--ui-scale));
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
}

body {
  background: linear-gradient(168deg, var(--env-1) 0%, var(--env-2) 100%);
  background-attachment: fixed;
}

button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }

/* Print mirrors of field values — built on demand, hidden on screen. */
.print-value { display: none; }

/* ---------------- Date field & calendar ----------------
   DD/MM/YYYY on every device. A native date input renders in the
   browser's own locale, so this is our own control instead. */

.datefield { position: relative; display: flex; align-items: center; gap: 6px; }
.datefield .date-text { flex: 1 1 auto; min-width: 0; font-variant-numeric: tabular-nums; }
.datefield .date-text.is-bad {
  border-color: var(--fail) !important;
  box-shadow: 0 0 0 3px rgba(255, 69, 58, .16);
}

.date-open {
  flex: 0 0 auto;
  display: inline-flex; align-items: center; justify-content: center;
  width: 34px; height: 34px;
  border: 1px solid var(--hairline);
  border-radius: 9px;
  background: var(--glass-soft);
  color: var(--text-dim);
  cursor: pointer;
  transition: color .18s ease, background .18s ease, transform .12s ease;
}
.date-open:hover { color: var(--accent-blue); background: var(--field-focus); }
.date-open:active { transform: scale(.94); }

.datecal {
  position: fixed;
  z-index: 90;
  width: 268px;
  padding: 12px;
  border-radius: 16px;
  border: 1px solid var(--hairline);
  /* Near-opaque, like the drawer. A calendar is a thing you read digits
     off, and through the frosted panel the fields behind it showed
     through the day grid — 09:00 AM sitting on top of week three. Glass
     for chrome, solid where something has to be read. */
  background: var(--glass-drawer);
  -webkit-backdrop-filter: saturate(180%) blur(30px);
  backdrop-filter: saturate(180%) blur(30px);
  box-shadow: var(--lift-3), var(--specular);
  animation: cal-in .16s cubic-bezier(.22,1,.36,1);
}
@keyframes cal-in { from { opacity: 0; transform: translateY(-5px) scale(.985); } }

.datecal-head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.datecal-title {
  flex: 1; text-align: center; font-weight: 650; font-size: 14px;
  background: none; border: 0; color: var(--text); cursor: pointer; padding: 5px 4px; border-radius: 8px;
}
.datecal-title:hover { background: var(--field-focus); }
.datecal-nav {
  width: 30px; height: 30px; flex: 0 0 auto;
  border: 1px solid var(--hairline); border-radius: 8px;
  background: var(--glass-soft); color: var(--text-dim);
  font-size: 17px; line-height: 1; cursor: pointer;
}
.datecal-nav:hover { color: var(--accent-blue); background: var(--field-focus); }

.datecal-dow, .datecal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.datecal-dow span {
  text-align: center; font-size: 10.5px; font-weight: 600;
  color: var(--text-faint); padding: 3px 0; letter-spacing: .04em;
}
.datecal-day {
  height: 32px; border: 0; border-radius: 9px;
  background: none; color: var(--text);
  font-size: 13px; font-variant-numeric: tabular-nums; cursor: pointer;
  transition: background .14s ease, color .14s ease;
}
.datecal-day:hover { background: var(--field-focus); }
.datecal-pad { height: 32px; }

/* Today is an outline, the chosen day is solid — the same rule the rest
   of the app follows: glass for context, solid for the verdict. */
.datecal-day.is-today { box-shadow: inset 0 0 0 1.5px var(--accent-blue); }
.datecal-day.is-sel {
  background: var(--accent-blue) !important;
  color: #fff; font-weight: 700;
}

.datecal-foot {
  display: flex; gap: 6px; margin-top: 9px;
  padding-top: 9px; border-top: 1px solid var(--hairline-soft);
}
.datecal-foot .btn { flex: 1; }

/* Quiet by design: present on every screen, never competing with the
   document in front of the technician. */
.foot-note .credit {
  display: block;
  margin-top: 5px;
  font-size: 10.5px;
  letter-spacing: .015em;
  color: var(--text-faint);
  opacity: .85;
}

/* Says a newer build exists rather than letting a phone sit on a stale
   copy that looks identical to a broken one. Bottom of the screen, out
   of the way of the sticky bar at the top. */
.update-banner {
  position: fixed;
  left: 50%; bottom: 18px;
  transform: translateX(-50%);
  z-index: 92;
  display: flex;
  align-items: center;
  gap: 12px;
  max-width: calc(100vw - 24px);
  padding: 11px 13px 11px 18px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--edge);
  background: var(--glass-drawer);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  box-shadow: var(--lift-3), var(--specular);
  font-size: 13.5px;
  animation: cal-in .22s cubic-bezier(.22,1,.36,1);
}
.update-banner span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 616px) {
  .update-banner { left: 12px; right: 12px; transform: none; max-width: none; padding-left: 15px; }
  .update-banner span { white-space: normal; }
}
@media print { .update-banner { display: none !important; } }

/* A screen that could not be drawn says so, rather than going blank. */
.fail-card { max-width: 620px; margin: 20px auto; }
.fail-card h2 { margin: 0 0 8px; font-size: 19px; }
.fail-card p { margin: 0 0 14px; color: var(--text-dim); }
.fail-detail {
  margin: 0 0 16px;
  padding: 12px 14px;
  border-radius: 10px;
  background: var(--field);
  border: 1px solid var(--hairline);
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.5;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  color: var(--text-dim);
}

@media (max-width: 616px) { .datecal { width: min(268px, 92vw); } }

:focus-visible {
  outline: 2.5px solid var(--accent-blue);
  outline-offset: 2px;
  border-radius: 6px;
}

.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ---------------- Scrollbars ----------------
   Thin, translucent, and they take the accent when grabbed — the
   scrollbar is part of the glass, not a system leftover. */

* { scrollbar-width: thin; scrollbar-color: var(--scroll-thumb) transparent; }

::-webkit-scrollbar { width: 11px; height: 11px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--scroll-thumb);
  border: 3px solid transparent;
  background-clip: content-box;
  border-radius: 999px;
}
::-webkit-scrollbar-thumb:hover { background: var(--scroll-thumb-hover); background-clip: content-box; }
::-webkit-scrollbar-thumb:active { background: var(--accent-blue); background-clip: content-box; }

.table-wrap::-webkit-scrollbar, .sidebar::-webkit-scrollbar { width: 8px; height: 8px; }
.table-wrap::-webkit-scrollbar-thumb, .sidebar::-webkit-scrollbar-thumb { border-width: 2px; }

/* ---------------- The environment ---------------- */

.ambient {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}
.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(90px);
  will-change: transform;
}
.orb-1 { width: 46vw; height: 46vw; left: -10vw; top: -12vw;   background: var(--orb-a); animation: drift-a 34s ease-in-out infinite; }
.orb-2 { width: 38vw; height: 38vw; right: -8vw; top: 22vh;    background: var(--orb-b); animation: drift-b 42s ease-in-out infinite; }
.orb-3 { width: 34vw; height: 34vw; left: 26vw;  bottom: -14vw; background: var(--orb-c); animation: drift-c 38s ease-in-out infinite; }

@keyframes drift-a { 0%,100% { transform: translate3d(0,0,0) scale(1); } 50% { transform: translate3d(6vw,4vh,0) scale(1.12); } }
@keyframes drift-b { 0%,100% { transform: translate3d(0,0,0) scale(1); } 50% { transform: translate3d(-5vw,6vh,0) scale(1.08); } }
@keyframes drift-c { 0%,100% { transform: translate3d(0,0,0) scale(1); } 50% { transform: translate3d(4vw,-5vh,0) scale(1.15); } }

/* ---------------- Layout ---------------- */

.app {
  /* Deliberately no z-index: a stacking context here would trap the
     drawer beneath the scrim. It already paints above .ambient by
     DOM order. */
  position: relative;
  display: flex;
  min-height: calc(100vh / var(--ui-scale));
  gap: 16px;
  padding: 16px;
}

/* The sidebar is a floating window, not a wall */
.sidebar {
  width: 252px;
  flex: 0 0 252px;
  position: sticky;
  top: 16px;
  height: calc((100vh / var(--ui-scale)) - 32px);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  overscroll-behavior: contain;

  background: var(--glass);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border: 1px solid var(--edge);
  border-radius: var(--radius-window);
  box-shadow: var(--lift-2), var(--specular);
}

.brand { padding: 24px 18px 20px; border-bottom: 1px solid var(--hairline-soft); }
.brand-sub { text-align: center; }
.brand-mark {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 13px;
  white-space: nowrap;
}

/* ---- The mark ----
   A tile with a highlight that orbits its rim, and a wordmark that a
   band of light travels through every few seconds. Both idle slowly:
   this sits on screen all day next to a technician, so the motion has
   to be noticeable once and invisible thereafter. */

.brand-logo {
  position: relative;
  width: 66px; height: 66px;
  flex: 0 0 auto;
  border-radius: 11px;
  background: linear-gradient(140deg, var(--accent-blue), var(--accent-violet));
  display: grid; place-items: center;
  font-size: 14px; font-weight: 700; color: #fff;
  letter-spacing: -.02em;
  box-shadow: 0 8px 22px rgba(10, 132, 255, .40), inset 0 1.5px 0 rgba(255,255,255,.5);
  isolation: isolate;
}
.brand-logo span { position: relative; z-index: 2; }
.brand-logo { border-radius: 20px; font-size: 24px; }

/* Orbiting rim highlight */
.brand-logo::before {
  content: '';
  position: absolute;
  inset: -1px;
  border-radius: inherit;
  padding: 2px;
  background: conic-gradient(from 0deg,
    transparent 0deg, transparent 250deg,
    rgba(255,255,255,.95) 300deg,
    transparent 350deg);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
          mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
          mask-composite: exclude;
  animation: mark-orbit 6s linear infinite;
  z-index: 3;
}
/* Breathing halo */
.brand-logo::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  box-shadow: 0 0 0 0 rgba(10, 132, 255, .55);
  animation: mark-pulse 4.5s ease-in-out infinite;
  z-index: 1;
}

@keyframes mark-orbit { to { transform: rotate(360deg); } }
@keyframes mark-pulse {
  0%, 70%, 100% { box-shadow: 0 0 0 0 rgba(10, 132, 255, .0); }
  85%           { box-shadow: 0 0 14px 2px rgba(10, 132, 255, .38); }
}

/* ---- Wordmark ---- */

.wordmark {
  display: inline-flex;
  align-items: baseline;
  gap: .34em;
  font-size: 18.5px;
  line-height: 1.15;
  white-space: nowrap;

  /* repeat-x matters: with no-repeat, any offset that pushes the
     gradient box past the text leaves those glyphs unpainted — and
     background-clip:text renders unpainted glyphs as nothing at all.
     Both ends of the ramp are --wm-base, so tiling is seamless. */
  background-image: linear-gradient(100deg,
    var(--wm-base) 0%,   var(--wm-base) 36%,
    var(--wm-hi)   46%,  var(--wm-hi-2) 53%,
    var(--wm-base) 64%,  var(--wm-base) 100%);
  background-size: 300% 100%;
  background-position-x: 0%;
  background-repeat: repeat-x;
  -webkit-background-clip: text;
          background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
  animation: wm-sweep 4.2s ease-in-out infinite;
}
/* Heavy, tightly tracked initials against a light, widely tracked name —
   the contrast is what makes it read as a mark rather than a label. */
.wm-fn {
  font-weight: 800;
  letter-spacing: -.045em;
  font-size: 1.06em;
}
.wm-rest {
  font-weight: 500;
  letter-spacing: .015em;
}

/* If the browser can't clip a gradient to text, show plain ink instead
   of nothing at all. */
@supports not ((-webkit-background-clip: text) or (background-clip: text)) {
  .wordmark {
    background: none;
    color: var(--text);
    -webkit-text-fill-color: currentColor;
    animation: none;
  }
}

/* A pause, then one pass of light. The percentages carry the whole feel:
   shortening the cycle alone would just make the light travel faster,
   which reads as frantic. So the idle hold shrinks and the travel window
   widens to match — the pass keeps its old ~2s pace, it simply comes
   round more often. */
@keyframes wm-sweep {
  0%, 48%   { background-position-x: 0%; }
  96%, 100% { background-position-x: 100%; }
}
.brand-sub {
  margin-top: 11px;
  font-size: 12.5px;
  color: var(--text-dim);
  line-height: 1.62;
}

.nav { padding: 12px; display: flex; flex-direction: column; gap: 3px; }
.nav button {
  display: flex; align-items: center; gap: 11px;
  width: 100%;
  padding: 11px 13px;
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--radius-ctl);
  color: var(--text-dim);
  text-align: left;
  cursor: pointer;
  font-size: 14.5px;
  transition: background .18s ease, color .18s ease, transform .18s ease;
}
.nav button:hover {
  background: var(--glass-hover);
  border-color: var(--edge-quiet);
  color: var(--text);
  transform: translateX(2px);
}
.nav button.active {
  background: var(--accent-blue);
  border-color: transparent;
  color: #fff;
  font-weight: 600;
  box-shadow: 0 6px 16px rgba(10, 132, 255, .34), inset 0 1px 0 rgba(255,255,255,.3);
}
.nav button.active:hover { transform: none; background: var(--accent-blue); color: #fff; }
.nav .nav-icon { width: 21px; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; }
.ico { display: block; }
.nav button .ico { opacity: .82; }
.nav button.active .ico { opacity: 1; }

.sidebar-foot { margin-top: auto; padding: 14px; border-top: 1px solid var(--hairline-soft); }

.seg-label {
  font-size: 11px;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--text-faint);
  margin: 4px 0 6px 3px;
  font-weight: 600;
}

/* Segmented control — the visionOS pill */
.seg {
  display: flex;
  gap: 3px;
  padding: 3px;
  margin-bottom: 12px;
  background: var(--glass-sunken);
  border: 1px solid var(--hairline-soft);
  border-radius: var(--radius-ctl);
}
.seg button {
  flex: 1 1 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 7px 3px;
  background: transparent;
  border: none;
  border-radius: 10px;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 11.5px;
  font-weight: 500;
  transition: background .16s ease, color .16s ease, box-shadow .16s ease;
  min-width: 0;
}
.seg button:hover { color: var(--text); background: var(--glass-hover); }
.seg button.active {
  background: var(--glass-raised);
  color: var(--text);
  font-weight: 600;
  box-shadow: var(--lift-1), var(--specular);
}
.seg-icon { font-size: 13px; line-height: 1; }
.seg-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.foot-note { font-size: 12px; color: var(--text-dim); line-height: 1.65; margin-top: 4px; }
.foot-note span { opacity: .75; }

.main { flex: 1; min-width: 0; padding: 8px 10px 90px; max-width: 1180px; }

/* ---------------- Headings ---------------- */

.page-head {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 20px; flex-wrap: wrap;
  margin: 10px 4px 24px;
}
.page-title {
  font-size: 30px;
  font-weight: 600;
  letter-spacing: -.028em;
  margin: 0;
  line-height: 1.15;
}
.page-sub { color: var(--text-dim); font-size: 14.5px; line-height: 1.55; margin-top: 7px; max-width: 68ch; }

.label-en { display: block; }
.label-th { display: block; font-size: 13.5px; color: var(--text-dim); line-height: 1.45; }
body.lang-en .label-th { display: none; }
body.lang-th .label-en { display: none; }
body.lang-th .label-th { font-size: inherit; color: inherit; line-height: inherit; }

/* ---------------- Buttons ---------------- */

.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 10px 17px;
  border-radius: var(--radius-ctl);
  border: 1px solid var(--edge);
  background: var(--glass-raised);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  color: var(--text);
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
  box-shadow: var(--lift-1), var(--specular);
  transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
}
.btn:hover { background: var(--glass-hover); transform: translateY(-1px); box-shadow: var(--lift-2), var(--specular); }
.btn:active { transform: translateY(0) scale(.985); }

.btn-primary {
  background: var(--accent-blue);
  border-color: transparent;
  color: #fff;
  font-weight: 600;
  box-shadow: 0 6px 18px rgba(10, 132, 255, .36), inset 0 1px 0 rgba(255,255,255,.28);
}
.btn-primary:hover { background: #0a84ff; filter: brightness(1.08); }

.btn-danger { color: var(--fail); border-color: color-mix(in srgb, var(--fail) 32%, transparent); }
.btn-danger:hover { background: color-mix(in srgb, var(--fail) 12%, var(--glass-hover)); }

.btn-sm { padding: 7px 13px; font-size: 13px; border-radius: 10px; }
.btn-row { display: flex; gap: 9px; flex-wrap: wrap; }

/* ---------------- Cards & stats ---------------- */

.card {
  background: var(--glass);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border: 1px solid var(--edge);
  border-radius: var(--radius-card);
  padding: 20px;
  box-shadow: var(--lift-1), var(--specular);
}

.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(172px, 1fr));
  gap: 14px;
  margin-bottom: 26px;
}
.stat {
  position: relative;
  overflow: hidden;
  background: var(--glass);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border: 1px solid var(--edge);
  border-radius: var(--radius-card);
  padding: 17px 18px;
  box-shadow: var(--lift-1), var(--specular);
}
/* The accent reads as light spilling in from the left edge */
.stat::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--stat-accent, var(--accent-blue));
}
.stat-value {
  font-size: 32px;
  font-weight: 600;
  line-height: 1.05;
  letter-spacing: -.03em;
  font-variant-numeric: tabular-nums;
}
.stat-label { font-size: 13.5px; color: var(--text-dim); margin-top: 6px; line-height: 1.45; }

/* ---------------- Icon motion ----------------
   Three states, deliberately different in character:

     idle   a slow, small loop — this sits on screen all day, so it
            has to be noticeable once and invisible afterwards
     hover  a livelier, purposeful move that says what the icon does
     press  a quick physical recoil

   Idle loops run only where an icon is a destination the eye rests on
   (the menu, the form cards, the toolbar). Icons inside table rows
   stay still — a list of forty animating badges is a mess, and a cost. */

.ico > * {
  transform-box: fill-box;
  transform-origin: 50% 50%;
  transition: transform .32s cubic-bezier(.22,1,.36,1), opacity .25s ease;
}

.nav .ico > *, .tc-icon .ico > *, .tb-ico .ico > * { will-change: transform; }

/* ---- idle ---- */

@keyframes ico-float   { 0%,100% { transform: translateY(0); }      50% { transform: translateY(-1.2px); } }
@keyframes ico-rock    { 0%,100% { transform: rotate(-7deg); }      50% { transform: rotate(7deg); } }
@keyframes ico-breathe { 0%,100% { transform: scale(1); }           50% { transform: scale(1.07); } }
@keyframes ico-dip     { 0%,70%,100% { transform: translateY(0); }  85% { transform: translateY(1.6px); } }
@keyframes ico-roll    { 0%,100% { transform: translateX(0); }      50% { transform: translateX(1.1px); } }
@keyframes ico-bar     { 0%,100% { transform: scaleY(1); }          50% { transform: scaleY(.72); } }
@keyframes ico-blink   { 0%,100% { opacity: 1; }                    50% { opacity: .35; } }

/* 01 Build — the top plate lifts off the stack */
.nav .ico[data-icon="build"] > :nth-child(1),
.tc-icon .ico[data-icon="build"] > :nth-child(1) { animation: ico-float 3.4s ease-in-out infinite; }

/* 02 FAT — the seal breathes */
.nav .ico[data-icon="pdi"] > :nth-child(1),
.tc-icon .ico[data-icon="pdi"] > :nth-child(1) { animation: ico-breathe 3.6s ease-in-out infinite; }

/* 03 SAT — the truck rolls a little */
.nav .ico[data-icon="delivery"] > *,
.tc-icon .ico[data-icon="delivery"] > * { animation: ico-roll 3.2s ease-in-out infinite; }

/* 04 Service — the wrench rocks like it is being turned */
.nav .ico[data-icon="service"] > :nth-child(1),
.tc-icon .ico[data-icon="service"] > :nth-child(1) { animation: ico-rock 3.8s ease-in-out infinite; transform-origin: 70% 30%; }

/* Menu glyphs */
.nav .ico[data-icon="dashboard"] > :nth-child(3) { animation: ico-bar 2.8s ease-in-out infinite;      transform-origin: 50% 100%; }
.nav .ico[data-icon="dashboard"] > :nth-child(4) { animation: ico-bar 2.8s ease-in-out .18s infinite; transform-origin: 50% 100%; }
.nav .ico[data-icon="dashboard"] > :nth-child(5) { animation: ico-bar 2.8s ease-in-out .36s infinite; transform-origin: 50% 100%; }
.nav .ico[data-icon="records"]   > :nth-child(3) { animation: ico-blink 3.4s ease-in-out infinite; }
.nav .ico[data-icon="newform"]   > :nth-child(1) { animation: ico-breathe 3.4s ease-in-out infinite; }
.nav .ico[data-icon="backup"]    > :nth-child(1),
.nav .ico[data-icon="backup"]    > :nth-child(2) { animation: ico-dip 3s ease-in-out infinite; }

/* The active menu item has arrived — it stops fidgeting */
.nav button.active .ico > * { animation: none !important; }

/* ---- hover: idle stands down, the glyph acts ---- */

.nav button:hover .ico > *,
.type-card:hover .tc-icon .ico > * { animation-play-state: paused; }

/* Build: the stack pulls apart into an exploded view */
.nav button:hover .ico[data-icon="build"] > :nth-child(1),
.type-card:hover .ico[data-icon="build"] > :nth-child(1) { transform: translateY(-2.6px); }
.nav button:hover .ico[data-icon="build"] > :nth-child(3),
.type-card:hover .ico[data-icon="build"] > :nth-child(3) { transform: translateY(1.8px); }

/* FAT: the tick redraws itself */
.ico[data-icon="pdi"] > :nth-child(2) { stroke-dasharray: 1; stroke-dashoffset: 0; }
@keyframes ico-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
.nav button:hover .ico[data-icon="pdi"] > :nth-child(2),
.type-card:hover .ico[data-icon="pdi"] > :nth-child(2) { animation: ico-draw .5s ease-out; }
.nav button:hover .ico[data-icon="pdi"] > :nth-child(1),
.type-card:hover .ico[data-icon="pdi"] > :nth-child(1) { transform: scale(1.1); }

/* SAT: it drives off */
.nav button:hover .ico[data-icon="delivery"] > *,
.type-card:hover .ico[data-icon="delivery"] > * { transform: translateX(2.2px); }

/* Service: a quarter turn, like tightening */
.nav button:hover .ico[data-icon="service"] > :nth-child(1),
.type-card:hover .ico[data-icon="service"] > :nth-child(1) { transform: rotate(-32deg); }

.nav button:hover .ico[data-icon="dashboard"] > :nth-child(3) { transform: scaleY(1.22); transform-origin: 50% 100%; }
.nav button:hover .ico[data-icon="dashboard"] > :nth-child(4) { transform: scaleY(1.15); transform-origin: 50% 100%; }
.nav button:hover .ico[data-icon="dashboard"] > :nth-child(5) { transform: scaleY(1.28); transform-origin: 50% 100%; }
.nav button:hover .ico[data-icon="newform"] > :nth-child(2)   { transform: rotate(90deg); }
.nav button:hover .ico[data-icon="records"] > :nth-child(3)   { opacity: 1; transform: translateX(1.2px); }
.nav button:hover .ico[data-icon="backup"]  > :nth-child(1),
.nav button:hover .ico[data-icon="backup"]  > :nth-child(2)   { transform: translateY(2.4px); }
.nav button:hover .ico[data-icon="machines"] > :nth-child(3)  { transform: translateY(-1.4px); }

/* ---- press: one quick recoil, same for every glyph ---- */

@keyframes ico-press { 0% { transform: scale(1); } 45% { transform: scale(.8); } 100% { transform: scale(1); } }

.nav button:active .ico > *,
.type-card:active .tc-icon .ico > * {
  animation: ico-press .26s cubic-bezier(.3,1.6,.5,1) !important;
}

/* ---------------- Completeness ----------------
   Red pulses only after Submit has been pressed — nagging someone
   about a field they have not reached yet is just noise. Green
   confirms the moment a required field is satisfied. */

@keyframes field-alarm {
  0%, 100% { border-color: var(--fail-fill); box-shadow: 0 0 0 0 color-mix(in srgb, var(--fail-fill) 42%, transparent); }
  50%      { border-color: var(--fail-fill); box-shadow: 0 0 0 5px color-mix(in srgb, var(--fail-fill) 4%, transparent); }
}

.field.is-missing input,
.field.is-missing select,
.field.is-missing textarea,
.field.is-missing .person-select {
  border-color: var(--fail-fill) !important;
  animation: field-alarm 1.15s ease-in-out infinite;
}
.field.is-missing > label { color: var(--fail); font-weight: 600; }

.field.is-ok input,
.field.is-ok select,
.field.is-ok textarea,
.field.is-ok .person-select {
  border-color: color-mix(in srgb, var(--pass-fill) 62%, transparent);
}

/* Unanswered check rows */
.check-row.is-missing {
  border-radius: 10px;
  padding-left: 10px;
  padding-right: 10px;
  animation: field-alarm 1.15s ease-in-out infinite;
  border: 1px solid var(--fail-fill);
}
.check-row.is-missing .check-code { color: var(--fail); font-weight: 700; }

/* Nothing chosen in the result block */
.result-row.is-missing {
  padding: 10px;
  border-radius: var(--radius-ctl);
  border: 1px solid var(--fail-fill);
  animation: field-alarm 1.15s ease-in-out infinite;
}

/* Signature still unnamed */
.sign-card.is-missing { border-color: var(--fail-fill); animation: field-alarm 1.15s ease-in-out infinite; }
.sign-card.is-ok { border-color: color-mix(in srgb, var(--pass-fill) 55%, transparent); }

/* ---------------- Person picker ---------------- */

.person-field { display: flex; flex-direction: column; gap: 5px; }
.person-select {
  width: 100%;
  padding: 10px 13px;
  background: var(--field);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-ctl);
  color: var(--text);
  outline: none;
  cursor: pointer;
}
.person-select:focus {
  background: var(--field-focus);
  border-color: var(--accent-blue);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent-blue) 20%, transparent);
}
.person-note {
  font-size: 12.5px;
  color: var(--accent-blue);
  font-weight: 600;
  padding-left: 3px;
}

/* ---------------- Cloud status ---------------- */

.cloud-badge {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
  padding: 8px 11px;
  font-size: 12px;
  border-radius: var(--radius-ctl);
  background: var(--glass-sunken);
  border: 1px solid var(--hairline-soft);
  color: var(--text-dim);
}
/* The full reason a save was refused, wrapped onto its own lines under
   the badge — legible on a tablet that has no tooltip. */
.cloud-err {
  flex: 1 0 100%;
  font-size: 11px;
  line-height: 1.35;
  color: var(--fail-fill);
  word-break: break-word;
}
.cloud-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex: 0 0 auto;
  background: var(--text-faint);
}
.cloud-badge.is-live  .cloud-dot { background: var(--pass-fill); box-shadow: 0 0 0 3px color-mix(in srgb, var(--pass-fill) 22%, transparent); }
.cloud-badge.is-signin .cloud-dot { background: var(--accent-yellow); }
.cloud-badge.is-error .cloud-dot { background: var(--fail-fill); }
.cloud-badge.is-connecting .cloud-dot { animation: field-alarm 1.4s ease-in-out infinite; background: var(--accent-blue); }
.cloud-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cloud-out {
  border: none;
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 13px;
  padding: 2px 4px;
  border-radius: 6px;
}
.cloud-out:hover { background: var(--glass-hover); color: var(--text); }

/* ---------------- Modal ---------------- */

.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 120;
  display: grid;
  place-items: center;
  padding: 20px;
  background: rgba(6, 10, 20, .5);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  opacity: 0;
  transition: opacity .22s ease;
  overflow-y: auto;
}
.modal-overlay.show { opacity: 1; }

.modal-card {
  width: 100%;
  max-width: 520px;
  padding: 28px 26px 22px;
  background: var(--glass-bar);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border: 1px solid var(--edge);
  border-radius: var(--radius-window);
  box-shadow: var(--lift-3), var(--specular);
  transform: translateY(14px) scale(.98);
  transition: transform .28s cubic-bezier(.22,1,.36,1);
  max-height: calc(92vh / var(--ui-scale));
  overflow-y: auto;
}
.modal-overlay.show .modal-card { transform: none; }

.modal-title { margin: 0 0 6px; font-size: 21px; font-weight: 650; letter-spacing: -.02em; text-align: center; }
.modal-note { margin: 0 0 20px; font-size: 14px; color: var(--text-dim); line-height: 1.6; text-align: center; }
.modal-body { display: flex; flex-direction: column; gap: 14px; }
.modal-foot { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; }
.modal-foot .btn { min-width: 96px; justify-content: center; }
.modal-error {
  background: color-mix(in srgb, var(--fail-fill) 14%, transparent);
  border: 1px solid color-mix(in srgb, var(--fail-fill) 40%, transparent);
  color: var(--fail);
  padding: 10px 13px;
  border-radius: var(--radius-ctl);
  font-size: 13.5px;
}

/* ---------------- Submitted ---------------- */

.submit-mark {
  width: 74px; height: 74px;
  margin: 0 auto 4px;
  border-radius: 50%;
  background: var(--pass-fill);
  display: grid; place-items: center;
  box-shadow: 0 10px 26px color-mix(in srgb, var(--pass-fill) 45%, transparent);
  animation: submit-pop .45s cubic-bezier(.2,1.5,.4,1);
}
@keyframes submit-pop { 0% { transform: scale(.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.submit-tick { color: #fff; font-size: 38px; font-weight: 700; line-height: 1; }

.submit-doc  { text-align: center; font-size: 20px; font-weight: 700; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.submit-form { text-align: center; font-size: 14px; color: var(--text-dim); margin-bottom: 6px; }

.submit-rows {
  display: flex; flex-direction: column; gap: 9px;
  padding: 16px 18px;
  background: var(--glass-sunken);
  border: 1px solid var(--hairline-soft);
  border-radius: var(--radius-ctl);
}
.submit-row { display: flex; justify-content: space-between; gap: 14px; font-size: 14.5px; }
.submit-key { color: var(--text-dim); }
.submit-val { font-weight: 650; text-align: right; }

.submit-shot {
  width: 100%;
  margin-top: 16px;
  border-radius: var(--radius-ctl);
  border: 1px solid var(--hairline);
  display: block;
  box-shadow: var(--lift-1);
}

/* ---------------- Filter bar ----------------
   Native selects: on a tablet the OS picker beats any custom
   dropdown for speed and for gloved thumbs. */

.filter-bar {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  align-items: flex-end;
  margin: 0 4px 20px;
  padding: 16px 18px;
  background: var(--glass);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border: 1px solid var(--edge);
  border-radius: var(--radius-card);
  box-shadow: var(--lift-1), var(--specular);
}
.filter-field { display: flex; flex-direction: column; gap: 6px; flex: 1 1 240px; min-width: 0; }
.filter-label { font-size: 12.5px; color: var(--text-dim); font-weight: 500; }
.filter-select {
  width: 100%;
  padding: 10px 13px;
  background: var(--field);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-ctl);
  color: var(--text);
  outline: none;
  cursor: pointer;
}
.filter-select:focus { background: var(--field-focus); border-color: var(--accent-blue);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent-blue) 20%, transparent); }

/* ---------------- Clickable counts ---------------- */

.count-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 6px 12px;
  border-radius: var(--radius-pill);
  border: 1px solid color-mix(in srgb, var(--series-2) 34%, transparent);
  background: color-mix(in srgb, var(--series-2) 13%, transparent);
  color: var(--series-2);
  font: inherit;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
  transition: background .16s ease, transform .16s ease;
}
.count-btn:hover { background: color-mix(in srgb, var(--series-2) 22%, transparent); transform: translateY(-1px); }
.count-btn:active { transform: scale(.95); }
.count-btn.is-open { background: var(--series-2); color: #fff; border-color: transparent; }
.count-num { font-size: 14.5px; }
.count-caret { font-size: 10px; opacity: .8; }

tr.detail-row > td { padding: 0 0 16px; background: var(--glass-sunken); }
tr.detail-row:hover { background: var(--glass-sunken); }

.service-panel { padding: 16px 16px 4px; }
.service-panel-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.service-panel-sub { font-size: 12.5px; color: var(--text-dim); font-family: var(--font-mono); }
.service-panel-note { font-size: 13.5px; margin-bottom: 13px; }

/* ---------------- Panel ---------------- */

.panel {
  background: var(--glass);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border: 1px solid var(--edge);
  border-radius: var(--radius-window);
  box-shadow: var(--lift-1), var(--specular);
  overflow: hidden;
}
.panel-head {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 16px; flex-wrap: wrap;
  padding: 20px 22px 16px;
  border-bottom: 1px solid var(--hairline-soft);
}
.panel-title { margin: 0; font-size: 19px; font-weight: 650; letter-spacing: -.02em; }
.panel-sub { margin-top: 6px; font-size: 14px; color: var(--text-dim); line-height: 1.6; max-width: 62ch; }
.panel-body { padding: 20px 22px; }
.panel-body + .panel-body { border-top: 1px solid var(--hairline-soft); }
.sub-title { margin: 0 0 6px; font-size: 15px; font-weight: 650; letter-spacing: -.015em; }

/* ---------------- Bar chart ---------------- */

.chart { width: 100%; }

.legend { display: flex; flex-wrap: wrap; gap: 18px; margin-bottom: 18px; }
.legend-item { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--text-dim); }
.legend-swatch { width: 12px; height: 12px; border-radius: 3px; flex: 0 0 auto; }

.chart-plot { position: relative; padding: 22px 0 0 34px; }

.chart-grid { position: absolute; inset: 22px 0 46px 34px; pointer-events: none; }
.grid-line {
  position: absolute; left: 0; right: 0;
  border-top: 1px solid var(--hairline-soft);
}
.grid-label {
  position: absolute; right: 100%; top: -.62em;
  padding-right: 9px;
  font-size: 11.5px;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.chart-track {
  position: relative;
  display: flex;
  align-items: flex-end;
  gap: 10px;
  height: 236px;
  overflow-x: auto;
  overflow-y: hidden;
  padding-bottom: 46px;
}

.bar-group {
  flex: 1 1 0;
  min-width: 68px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: stretch;
  height: 100%;
  padding: 0 2px;
  background: transparent;
  border: none;
  border-radius: 10px;
  cursor: default;
  font: inherit;
  color: inherit;
  position: relative;
}
.bar-group.is-clickable { cursor: pointer; }
.bar-group:hover { background: var(--glass-hover); }
.bar-group:focus-visible { outline: 2.5px solid var(--accent-blue); outline-offset: 1px; }

.bars {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 2px;              /* the 2px surface gap between adjacent fills */
  height: 100%;
  padding-top: 18px;
}
/* A bottom-aligned column, so the value label rides directly on top of
   its bar instead of floating at the top of the plot. */
.bar-slot {
  flex: 1 1 0;
  max-width: 42px;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
}
.bar {
  display: block;
  width: 100%;
  min-height: 2px;
  border-radius: 4px 4px 0 0;   /* rounded data-end, square on the baseline */
  transition: filter .16s ease;
}
.bar-group:hover .bar { filter: brightness(1.08); }
.bar-value {
  font-size: 12px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--text-dim);
  line-height: 1;
  margin-bottom: 5px;
  pointer-events: none;
}

.bar-label {
  position: absolute;
  top: 100%; left: 0; right: 0;
  margin-top: 9px;
  font-size: 12.5px;
  color: var(--text);
  line-height: 1.3;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  text-align: center;
}
.bar-sub {
  position: absolute;
  top: 100%; left: 0; right: 0;
  margin-top: 26px;
  font-size: 11px;
  color: var(--text-faint);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  text-align: center;
}

.chart-tip {
  position: fixed;
  left: 0; top: 0;
  z-index: 88;
  transform: translateY(6px);
  min-width: 158px;
  padding: 10px 13px;
  background: var(--glass-bar);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border: 1px solid var(--edge);
  border-radius: var(--radius-ctl);
  box-shadow: var(--lift-2);
  opacity: 0;
  pointer-events: none;
  transition: opacity .16s ease, transform .16s ease;
  z-index: 5;
}
.chart-tip.show { opacity: 1; transform: translateY(0); }
/* Measured before it is shown: opacity 0 alone still lays out, but the
   transform would skew the numbers we clamp against. */
.chart-tip.measuring { transform: none; }
.tip-title { font-weight: 650; font-size: 13.5px; margin-bottom: 2px; }
.tip-sub { font-size: 11.5px; color: var(--text-faint); margin-bottom: 7px; }
.tip-row { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-top: 4px; }
.tip-key { color: var(--text-dim); flex: 1; }
.tip-val { font-weight: 650; font-variant-numeric: tabular-nums; }

/* ---------------- Summary cards ---------------- */

.summary-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 16px;
  padding: 20px 22px;
  border-top: 1px solid var(--hairline-soft);
}
.summary-card { padding: 18px; }
.summary-note { font-size: 13px; color: var(--text-dim); line-height: 1.55; margin-bottom: 14px; }
.summary-empty { font-size: 13.5px; color: var(--text-faint); padding: 10px 0; }
.summary-list { display: flex; flex-direction: column; gap: 10px; }
.summary-row { display: grid; grid-template-columns: minmax(96px, 40%) 1fr 30px; gap: 12px; align-items: center; }
.summary-label { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.summary-meter {
  height: 8px;
  background: var(--glass-sunken);
  border: 1px solid var(--hairline-soft);
  border-radius: 999px;
  overflow: hidden;
}
.summary-fill { display: block; height: 100%; background: var(--series-2); border-radius: 999px; }
.summary-count { font-size: 13.5px; font-weight: 650; text-align: right; font-variant-numeric: tabular-nums; }

.cause-chip {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 600;
  background: color-mix(in srgb, var(--series-2) 16%, transparent);
  color: var(--series-2);
  border: 1px solid color-mix(in srgb, var(--series-2) 34%, transparent);
}

/* ---------------- New-form stage groups ----------------
   Two questions, not four cards: is the machine still on our floor,
   or already at the customer's? */

.stage-stack { display: flex; flex-direction: column; gap: 26px; }

.stage {
  background: var(--glass-sunken);
  border: 1px solid var(--hairline-soft);
  border-radius: var(--radius-window);
  padding: 18px;
}
.stage-head {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 2px 4px 16px;
}
.stage-dot {
  width: 11px; height: 11px;
  margin-top: 6px;
  flex: 0 0 auto;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent);
}
.stage-title {
  font-size: 16.5px;
  font-weight: 650;
  letter-spacing: -.02em;
}
.stage-title .th { font-size: 14px; color: var(--text-dim); font-weight: 500; letter-spacing: 0; line-height: 1.45; }
.stage-note {
  margin-top: 7px;
  font-size: 14px;
  color: var(--text-dim);
  line-height: 1.62;
  max-width: 58ch;
}
.stage-note .th { color: var(--text-dim); margin-top: 2px; }

.type-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(238px, 1fr));
  gap: 15px;
}
.type-card {
  position: relative;
  overflow: hidden;
  background: var(--glass);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border: 1px solid var(--edge);
  border-radius: var(--radius-card);
  padding: 20px;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  box-shadow: var(--lift-1), var(--specular);
  transition: transform .2s cubic-bezier(.22,1,.36,1), box-shadow .2s ease, background .2s ease;
}
.type-card::before {
  content: '';
  position: absolute;
  left: 0; right: 0; top: 0;
  height: 3px;
  background: var(--accent, var(--accent-blue));
}
.type-card:hover {
  background: var(--glass-hover);
  transform: translateY(-4px) scale(1.012);
  box-shadow: var(--lift-3), var(--specular);
}
.type-card:active { transform: translateY(-1px) scale(.998); }
.type-card .tc-icon { color: var(--accent, var(--accent-blue)); display: flex; }
.type-card .tc-code {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-faint);
  letter-spacing: .1em;
  margin-top: 11px;
}
.type-card .tc-name { font-weight: 600; font-size: 15.5px; margin-top: 4px; letter-spacing: -.015em; }
.type-card .tc-name-th { font-size: 13.5px; color: var(--text-dim); margin-top: 3px; line-height: 1.45; }
/* Plain language under the acronym — nobody should have to guess what
   FAT or SAT stands for. */
.type-card .tc-blurb {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--hairline-soft);
  font-size: 13px;
  line-height: 1.55;
  color: var(--text-dim);
}

/* ---------------- Tables ---------------- */

.table-wrap {
  overflow-x: auto;
  background: var(--glass);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border: 1px solid var(--edge);
  border-radius: var(--radius-card);
  box-shadow: var(--lift-1), var(--specular);
}

table { width: 100%; border-collapse: collapse; font-size: 14px; }
thead th {
  background: var(--glass-sunken);
  text-align: left;
  padding: 12px 14px;
  font-size: 11px;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--text-faint);
  font-weight: 600;
  border-bottom: 1px solid var(--hairline);
  white-space: nowrap;
}
tbody td { padding: 11px 14px; border-bottom: 1px solid var(--hairline-soft); vertical-align: middle; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: var(--glass-hover); }
tbody tr.clickable { cursor: pointer; }

/* ---------------- Form sections ---------------- */

.form-shell { display: flex; flex-direction: column; gap: 16px; }

.section {
  background: var(--glass);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border: 1px solid var(--edge);
  border-radius: var(--radius-card);
  box-shadow: var(--lift-1), var(--specular);
  overflow: hidden;
}
.section > header {
  padding: 15px 19px;
  background: var(--glass-sunken);
  border-bottom: 1px solid var(--hairline-soft);
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.section-title { font-weight: 600; font-size: 15px; letter-spacing: -.015em; }
.section-title .th { font-size: 13.5px; color: var(--text-dim); font-weight: 400; letter-spacing: 0; line-height: 1.45; }
.section-body { padding: 18px 19px; }

.section.critical { border-color: color-mix(in srgb, var(--fail-fill) 34%, var(--edge)); }
.section.critical > header {
  background: color-mix(in srgb, var(--fail-fill) 11%, var(--glass-sunken));
  border-bottom-color: color-mix(in srgb, var(--fail-fill) 24%, transparent);
}

.hint {
  font-size: 13.5px;
  line-height: 1.55;
  color: var(--warn);
  background: color-mix(in srgb, var(--accent-yellow) 16%, transparent);
  border: 1px solid color-mix(in srgb, var(--accent-yellow) 34%, transparent);
  padding: 10px 13px;
  border-radius: var(--radius-ctl);
  margin-bottom: 15px;
}

.section-progress {
  font-size: 12px; color: var(--text-dim);
  display: flex; align-items: center; gap: 9px;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.progress-bar {
  width: 74px; height: 6px;
  background: var(--glass-sunken);
  border: 1px solid var(--hairline-soft);
  border-radius: var(--radius-pill);
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--pass-fill);
  border-radius: var(--radius-pill);
  transition: width .3s cubic-bezier(.22,1,.36,1);
}

/* ---- fields ---- */

.field-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(236px, 1fr)); gap: 14px; }
.field label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 7px; font-weight: 500; line-height: 1.45; }
.field label .req { color: var(--fail); }
.field input, .field select, .field textarea, .cell-input {
  width: 100%;
  padding: 10px 13px;
  background: var(--field);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-ctl);
  color: var(--text);
  outline: none;
  transition: background .16s ease, border-color .16s ease, box-shadow .16s ease;
}
.field input::placeholder, .field textarea::placeholder, .cell-input::placeholder { color: var(--text-faint); }
.field input:focus, .field select:focus, .field textarea:focus, .cell-input:focus {
  background: var(--field-focus);
  border-color: var(--accent-blue);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent-blue) 20%, transparent);
  outline: none;
}
.field textarea { min-height: 98px; resize: vertical; }
.field .unit { font-size: 11.5px; color: var(--text-faint); margin-left: 5px; }
.cell-input { padding: 8px 11px; border-radius: 10px; }

/* ---- checklist rows ---- */

.check-row {
  display: grid;
  grid-template-columns: 62px 1fr auto 208px;
  gap: 13px;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--hairline-soft);
  border-radius: 10px;
  transition: background .16s ease;
}
.check-row:last-child { border-bottom: none; }
.check-code {
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--text-faint);
  font-weight: 500;
  letter-spacing: .04em;
}
.check-label { font-size: 14.5px; line-height: 1.45; }
.check-label .th { font-size: 13.5px; color: var(--text-dim); line-height: 1.45; }

/* --- THE VERDICT CONTROLS — opaque on purpose --- */
.pfn { display: flex; gap: 6px; }
.pfn button {
  min-width: 62px;
  padding: 9px 12px;
  border-radius: 11px;
  border: 1px solid var(--hairline);
  background: var(--field);
  color: var(--text-dim);
  cursor: pointer;
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: .02em;
  transition: transform .14s ease, box-shadow .14s ease, background .14s ease, color .14s ease;
}
.pfn button:hover { background: var(--field-focus); color: var(--text); }
.pfn button:active { transform: scale(.95); }

.pfn button.on[data-v="PASS"],
.pfn button.on[data-v="NORMAL"],
.pfn button.on[data-v="YES"] {
  background: var(--pass-fill); border-color: var(--pass-fill); color: var(--pass-ink);
  box-shadow: 0 4px 14px color-mix(in srgb, var(--pass-fill) 48%, transparent), inset 0 1px 0 rgba(255,255,255,.3);
}
.pfn button.on[data-v="FAIL"],
.pfn button.on[data-v="ABNORMAL"],
.pfn button.on[data-v="NO"] {
  background: var(--fail-fill); border-color: var(--fail-fill); color: #fff;
  box-shadow: 0 4px 14px color-mix(in srgb, var(--fail-fill) 50%, transparent), inset 0 1px 0 rgba(255,255,255,.28);
}
.pfn button.on[data-v="NA"] {
  background: var(--na-fill); border-color: var(--na-fill); color: #fff;
  box-shadow: 0 4px 12px color-mix(in srgb, var(--na-fill) 40%, transparent), inset 0 1px 0 rgba(255,255,255,.22);
}

.check-row.is-fail { background: color-mix(in srgb, var(--fail-fill) 9%, transparent); }

/* ---- measurements & performance ---- */

.measure-row { display: grid; grid-template-columns: 1fr 156px 92px; gap: 13px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--hairline-soft); }
.measure-row:last-child { border-bottom: none; }
.perf-row { display: grid; grid-template-columns: 1fr 138px 156px 96px; gap: 13px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--hairline-soft); }
.perf-row:last-child { border-bottom: none; }
.perf-target { font-size: 13px; color: var(--text-dim); font-variant-numeric: tabular-nums; font-family: var(--font-mono); }

.verdict {
  font-size: 12px; font-weight: 700; letter-spacing: .04em;
  padding: 6px 10px; border-radius: 9px; text-align: center;
}
.verdict.pass { background: var(--pass-fill); color: var(--pass-ink); box-shadow: inset 0 1px 0 rgba(255,255,255,.28); }
.verdict.fail { background: var(--fail-fill); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.24); }
.verdict.none { color: var(--text-faint); }

/* ---- documents / root cause chips ---- */

.doc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(262px, 1fr)); gap: 9px; }
.rc-grid  { display: grid; grid-template-columns: repeat(auto-fit, minmax(182px, 1fr)); gap: 8px; margin-bottom: 16px; }
.doc-item {
  display: flex; align-items: center; gap: 11px;
  padding: 10px 13px;
  background: var(--field);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-ctl);
  cursor: pointer;
  transition: background .16s ease, border-color .16s ease;
}
.doc-item:hover { background: var(--field-focus); }
.doc-item input { width: 19px; height: 19px; accent-color: var(--accent-blue); cursor: pointer; flex: 0 0 auto; }
.doc-item.on {
  border-color: color-mix(in srgb, var(--pass-fill) 55%, transparent);
  background: color-mix(in srgb, var(--pass-fill) 13%, var(--field));
}

/* ---- photos ---- */

.photo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(196px, 1fr)); gap: 14px; }
.photo-slot {
  border: 1px solid var(--hairline);
  border-radius: var(--radius-ctl);
  background: var(--field);
  overflow: hidden;
  display: flex; flex-direction: column;
}
.photo-slot .ps-head { padding: 10px 12px; font-size: 13px; line-height: 1.4; border-bottom: 1px solid var(--hairline-soft); }
.photo-slot .ps-head .th { color: var(--text-dim); font-size: 12px; }
.photo-drop {
  flex: 1; min-height: 136px;
  display: grid; place-items: center;
  cursor: pointer;
  color: var(--text-faint);
  font-size: 12.5px;
  text-align: center;
  padding: 12px;
  transition: background .16s ease, color .16s ease;
}
.photo-drop:hover { background: var(--glass-hover); color: var(--text-dim); }
.photo-slot img { width: 100%; display: block; max-height: 190px; object-fit: cover; }
.photo-actions { display: flex; gap: 7px; padding: 8px; border-top: 1px solid var(--hairline-soft); }

.ba-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.ba-col h4 { margin: 0 0 10px; font-size: 11px; letter-spacing: .1em; color: var(--text-faint); font-weight: 600; }

/* ---- priority ---- */

.priority-row { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 12px; }
.priority-row button {
  padding: 10px 17px;
  border-radius: var(--radius-ctl);
  border: 1px solid var(--hairline);
  background: var(--field);
  color: var(--text-dim);
  cursor: pointer;
  font-weight: 600;
  font-size: 13px;
  transition: transform .14s ease, box-shadow .14s ease;
}
.priority-row button:hover { background: var(--field-focus); }
.priority-row button.on { color: #fff; border-color: transparent; box-shadow: var(--lift-1), inset 0 1px 0 rgba(255,255,255,.26); }

/* ---- result ---- */

.result-row { display: flex; flex-direction: column; gap: 10px; }
.result-row button {
  display: flex; align-items: center; gap: 13px;
  padding: 16px 19px;
  border-radius: var(--radius-ctl);
  border: 1.5px solid var(--hairline);
  background: var(--field);
  color: var(--text-dim);
  cursor: pointer;
  font-weight: 600;
  font-size: 14.5px;
  text-align: left;
  letter-spacing: -.01em;
  transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
}
.result-row button:hover:not(.blocked) { background: var(--field-focus); transform: translateY(-1px); }
.result-row button .dot { width: 15px; height: 15px; border-radius: 50%; flex: 0 0 auto; box-shadow: inset 0 1px 0 rgba(255,255,255,.4); }
.result-row button.on { box-shadow: var(--lift-2), inset 0 1px 0 rgba(255,255,255,.24); }
.result-row button.blocked { opacity: .38; cursor: not-allowed; }

.alert-danger {
  background: color-mix(in srgb, var(--fail-fill) 14%, transparent);
  border: 1px solid color-mix(in srgb, var(--fail-fill) 42%, transparent);
  color: var(--fail);
  padding: 13px 16px;
  border-radius: var(--radius-ctl);
  font-size: 13.5px;
  margin-bottom: 15px;
  font-weight: 500;
}

/* ---- signatures ---- */

.sign-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(268px, 1fr)); gap: 16px; }
.sign-card {
  border: 1px solid var(--hairline);
  border-radius: var(--radius-ctl);
  overflow: hidden;
  background: var(--field);
}
.sign-card h4 { margin: 0; padding: 11px 13px; font-size: 13px; font-weight: 600; border-bottom: 1px solid var(--hairline-soft); }
.sign-card h4 .th { color: var(--text-dim); font-size: 12.5px; font-weight: 400; line-height: 1.4; }
.sign-pad { background: #fff; touch-action: none; display: block; width: 100%; height: 132px; cursor: crosshair; }
.sign-meta { display: grid; grid-template-columns: 1fr 136px; gap: 9px; padding: 10px 11px; }
.sign-foot { display: flex; justify-content: flex-end; padding: 0 11px 10px; }

/* ---- pills & badges ---- */

.pill {
  display: inline-block;
  padding: 4px 11px;
  border-radius: var(--radius-pill);
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: .01em;
  white-space: nowrap;
  border: 1px solid transparent;
}
.pill.draft  { background: var(--glass-sunken); color: var(--text-dim); border-color: var(--hairline); }
.pill.green  { background: var(--pass-fill); color: var(--pass-ink); }
.pill.yellow { background: var(--accent-yellow); color: #3d2f00; }
.pill.red    { background: var(--fail-fill); color: #fff; }

.type-badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 11px;
  border-radius: var(--radius-pill);
  font-size: 11.5px; font-weight: 600;
  background: color-mix(in srgb, var(--accent, var(--accent-blue)) 16%, transparent);
  color: var(--accent, var(--accent-blue));
  border: 1px solid color-mix(in srgb, var(--accent, var(--accent-blue)) 34%, transparent);
}

/* ---- toolbar: a floating glass bar ---- */

.toolbar {
  position: sticky; top: 8px; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  padding: 13px 18px;
  margin-bottom: 18px;
  flex-wrap: wrap;
  background: var(--glass-bar);
  -webkit-backdrop-filter: saturate(180%) blur(40px);
  backdrop-filter: saturate(180%) blur(40px);
  border: 1px solid var(--edge);
  border-radius: var(--radius-card);
  box-shadow: var(--lift-2), var(--specular);
}
.toolbar .tb-title {
  font-weight: 600;
  letter-spacing: -.015em;
  display: flex; align-items: center; gap: 9px;
  font-variant-numeric: tabular-nums;
}
.tb-ico { color: var(--accent, var(--accent-blue)); display: inline-flex; }
.toolbar .tb-sub { font-size: 13px; color: var(--text-dim); line-height: 1.45; }

.search-input {
  width: 100%; max-width: 390px;
  padding: 11px 16px;
  background: var(--glass);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border: 1px solid var(--edge);
  border-radius: var(--radius-pill);
  color: var(--text);
  outline: none;
  box-shadow: var(--lift-1);
}
.search-input:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent-blue) 18%, transparent); }

/* ---------------- Records filter bar ----------------
   Customer, then their machines, then the kind of document, then the
   order. Each dropdown offers only what the other three still allow,
   with a count beside every option, so a choice can never lead to an
   empty screen. */

.filter-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 12px;
  margin: 0 4px 18px;
  padding: 15px 17px;
  background: var(--glass);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border: 1px solid var(--edge);
  border-radius: var(--radius-window);
  box-shadow: var(--lift-1), var(--specular);
}

.filter-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex: 1 1 190px;
  min-width: 0;
}

.filter-label {
  font-size: 10.5px;
  font-weight: 650;
  letter-spacing: .075em;
  text-transform: uppercase;
  color: var(--text-faint);
  padding-left: 2px;
  transition: color .18s ease;
}
/* A set filter says so without shouting — the label picks up the accent
   rather than the control changing shape and shifting the row. */
.filter-field.is-set .filter-label { color: var(--accent-blue); }

.filter-select {
  width: 100%;
  padding: 10px 34px 10px 13px;
  background: var(--field);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-ctl);
  color: var(--text);
  font-size: 14px;
  outline: none;
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
  /* Chevron drawn in the box so it inherits the theme instead of the OS */
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%),
                    linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: right 16px center, right 11px center;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  transition: border-color .18s ease, box-shadow .18s ease, background-color .18s ease;
}
.filter-select:hover { background-color: var(--field-focus); }
.filter-select:focus {
  border-color: var(--accent-blue);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent-blue) 16%, transparent);
}
.filter-field.is-set .filter-select { border-color: color-mix(in srgb, var(--accent-blue) 45%, var(--hairline)); }

.filter-clear {
  flex: 0 0 auto;
  padding: 10px 16px;
  border: 1px solid var(--hairline);
  border-radius: var(--radius-ctl);
  background: var(--glass-soft);
  color: var(--text-dim);
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  transition: color .18s ease, background .18s ease, border-color .18s ease;
}
.filter-clear:hover { color: var(--fail); border-color: color-mix(in srgb, var(--fail) 45%, var(--hairline)); }
.filter-clear:active { transform: scale(.97); }

.filter-count {
  margin: 0 6px 10px;
  font-size: 12.5px;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

/* One filter per row on a phone: four half-width dropdowns side by side
   are unreadable and the labels wrap to two lines. */
@media (max-width: 660px) {
  .filter-bar { gap: 11px; padding: 13px 14px; }
  .filter-field { flex: 1 1 100%; }
  .filter-clear { width: 100%; }
}

@media print { .filter-bar, .filter-count { display: none !important; } }

.empty {
  padding: 52px 22px;
  text-align: center;
  color: var(--text-faint);
  background: var(--glass-sunken);
  border: 1px dashed var(--hairline);
  border-radius: var(--radius-card);
}

/* ---- timeline ---- */

.timeline { position: relative; padding-left: 28px; }
.timeline::before {
  content: ''; position: absolute; left: 7px; top: 8px; bottom: 8px;
  width: 2px; background: var(--hairline); border-radius: 2px;
}
.tl-item { position: relative; margin-bottom: 14px; }
.tl-item::before {
  content: ''; position: absolute; left: -25px; top: 20px;
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--accent, var(--accent-blue));
  box-shadow: 0 0 0 3px var(--env-2), 0 0 12px color-mix(in srgb, var(--accent, var(--accent-blue)) 60%, transparent);
}

/* ---- toast ---- */

.toast {
  position: fixed; bottom: 28px; left: 50%;
  transform: translateX(-50%) translateY(90px);
  background: var(--pass-fill);
  color: var(--pass-ink);
  padding: 12px 24px;
  border-radius: var(--radius-pill);
  font-weight: 600; font-size: 14px;
  box-shadow: var(--lift-3), inset 0 1px 0 rgba(255,255,255,.3);
  opacity: 0;
  transition: transform .28s cubic-bezier(.22,1,.36,1), opacity .22s ease;
  z-index: 100; pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.toast.err { background: var(--fail-fill); color: #fff; }

/* ---------------- Responsive ---------------- */

/* ---------------- Backup lock screen ---------------- */

.lock-wrap { display: flex; justify-content: center; padding-top: 12px; }
.lock-card {
  width: 100%;
  max-width: 420px;
  text-align: center;
  padding: 32px 28px 26px;
  border-radius: var(--radius-window);
}
.lock-icon {
  font-size: 30px;
  width: 62px; height: 62px;
  margin: 0 auto 16px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--glass-sunken);
  border: 1px solid var(--edge);
  box-shadow: var(--specular);
}
.lock-title { margin: 0 0 8px; font-size: 19px; font-weight: 600; letter-spacing: -.02em; }
.lock-sub { margin: 0 0 22px; font-size: 14px; color: var(--text-dim); line-height: 1.6; }
.lock-card .field { text-align: left; }
.lock-btn { width: 100%; justify-content: center; }
.lock-note {
  margin: 18px 0 0;
  font-size: 12.5px;
  line-height: 1.6;
  color: var(--text-dim);
  border-top: 1px solid var(--hairline-soft);
  padding-top: 14px;
}

/* ---------------- Small-screen chrome ----------------
   Hidden on desktop. On tablet and phone this bar owns the menu
   toggle and the app identity, and the sidebar becomes a drawer. */

.mobile-bar { display: none; }
.scrim { display: none; }

/* One button, shaped like a visionOS control: a circular pane of glass
   with a specular rim, that presses in when touched. */
.menu-toggle {
  position: relative;
  display: inline-flex;
  align-items: center; justify-content: center;
  width: 48px; height: 48px;
  flex: 0 0 auto;
  padding: 0;
  border: 1px solid var(--edge);
  border-radius: 50%;
  background: var(--glass-raised);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  color: var(--text);
  cursor: pointer;
  box-shadow:
    var(--lift-2),
    inset 0 1.5px 0 rgba(255, 255, 255, .55),
    inset 0 -2px 4px rgba(10, 20, 45, .06);
  transition: transform .2s cubic-bezier(.22,1,.36,1), background .2s ease, box-shadow .2s ease;
}
.menu-toggle::after {
  /* the halo that answers a press */
  content: '';
  position: absolute; inset: -4px;
  border-radius: 50%;
  box-shadow: 0 0 0 0 rgba(10, 132, 255, .34);
  transition: box-shadow .25s ease;
  pointer-events: none;
}
.menu-toggle:hover { background: var(--glass-hover); transform: scale(1.05); }
.menu-toggle:hover::after { box-shadow: 0 0 0 5px rgba(10, 132, 255, .16); }
.menu-toggle:active { transform: scale(.93); }
:root.nav-open .menu-toggle { background: var(--accent-blue); border-color: transparent; color: #fff; }
:root.nav-open .menu-toggle::after { box-shadow: 0 0 18px 3px rgba(10, 132, 255, .42); }

/* Two bars that fold into a cross — one glyph, one meaning */
.mt-glyph { position: relative; width: 18px; height: 12px; display: block; }
.mt-glyph span {
  position: absolute; left: 0;
  width: 100%; height: 2.2px;
  background: currentColor;
  border-radius: 2px;
  transition: transform .3s cubic-bezier(.22,1,.36,1);
}
.mt-glyph span:nth-child(1) { top: 1px; }
.mt-glyph span:nth-child(2) { top: 8.8px; }

:root.nav-open .mt-glyph span:nth-child(1) { transform: translateY(3.9px) rotate(45deg); }
:root.nav-open .mt-glyph span:nth-child(2) { transform: translateY(-3.9px) rotate(-45deg); }

/* The wordmark floats on its own pane, shrink-wrapped to the text —
   width comes from the glyphs, never from the container. */
.wm-plate {
  display: inline-flex;
  align-items: center;
  width: -moz-fit-content;
  width: fit-content;
  max-width: 100%;
  padding: 7px 15px;
  border-radius: var(--radius-pill);
  background: var(--glass);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border: 1px solid var(--edge);
  box-shadow: var(--lift-1), var(--specular);
  transition: transform .22s cubic-bezier(.22,1,.36,1), box-shadow .22s ease;
}
.wm-plate:hover { transform: translateY(-1px); box-shadow: var(--lift-2), var(--specular); }
.wm-plate-sm { padding: 6px 14px; }

/* ---- Tablet & phone ------------------------------------------
   Navigation becomes a toggle drawer:

     bar     [☰]  FN Machine Care
     drawer  slides in from the left with the full menu,
             appearance and language — all with real labels,
             which the cramped icon strip could never show.

   The drawer, not the bar, is where settings live: it has room
   for bilingual labels, and nothing can be pushed off-screen.

   Width alone is the wrong question. A 1920x1080 PC running Windows
   at 150% display scaling reports a 1280px viewport at 100% browser
   zoom — a plain desktop that a width-only cut would hand the tablet
   layout, hiding the sidebar behind a hamburger for someone holding
   a mouse. Meanwhile an iPad Pro 12.9 in landscape reports 1366px
   and genuinely wants the drawer.

   So ask what is driving the screen, not how wide it is:

     under 1080px            always drawer — no room for a sidebar
     1080–1400 + coarse      drawer — a finger, so a tablet
     1080–1400 + fine        sidebar — a mouse, so a desktop
     over 1400px             always sidebar

   `pointer: coarse` reports the PRIMARY input. A touchscreen laptop
   still says `fine`, so it keeps the sidebar, which is right. */

@media (max-width: 1188px), (max-width: 1540px) and (pointer: coarse) {
  .app { flex-direction: column; padding: 10px; gap: 10px; }

  /* The bar outranks both the scrim and the drawer, so the toggle
     stays tappable while the menu is open — otherwise it morphs
     into a close button nobody can reach. */
  .mobile-bar {
    position: sticky;
    top: 0;
    z-index: 65;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    height: var(--bar-h);
    background: var(--glass-bar);
    -webkit-backdrop-filter: saturate(180%) blur(40px);
    backdrop-filter: saturate(180%) blur(40px);
    border-bottom: 1px solid var(--hairline-soft);
  }

  /* Off-canvas drawer, hung below the bar */
  .sidebar {
    position: fixed;
    top: var(--bar-h); left: 0; bottom: 0;
    z-index: 60;
    width: min(300px, calc(84vw / var(--ui-scale)));
    height: calc(100% - var(--bar-h));
    flex: none;
    border-radius: 0 var(--radius-window) var(--radius-window) 0;
    border-left: none;
    /* Near-opaque: a translucent drawer over a busy dashboard made
       the menu labels genuinely hard to read. */
    background: var(--glass-drawer);
    box-shadow: var(--lift-3), var(--specular);
    transform: translateX(-102%);
    transition: transform .34s cubic-bezier(.22,1,.36,1);
    overflow-y: auto;
    overscroll-behavior: contain;
    visibility: hidden;
  }
  :root.nav-open .sidebar { transform: translateX(0); visibility: visible; }

  /* The bar already carries the identity — no need to repeat it */
  .brand { display: none; }

  .scrim {
    display: block;
    position: fixed;
    top: var(--bar-h); right: 0; bottom: 0; left: 0;
    z-index: 55;
    background: rgba(6, 10, 20, .42);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s ease;
  }
  :root.nav-open .scrim { opacity: 1; pointer-events: auto; }
  :root.nav-open { overflow: hidden; }

  /* Inside the drawer everything gets its full label back */
  .nav { flex-direction: column; padding: 12px; margin-top: 4px; }
  .nav button { padding: 13px; }
  .sidebar-foot { margin-top: auto; }
  .seg-label { display: block; }
  .seg .seg-text { display: inline; }

  .main { padding: 0 2px 80px; }
  .toolbar { top: 4px; }
  .page-title { font-size: 25px; }

  .panel-head, .panel-body, .summary-grid { padding-left: 16px; padding-right: 16px; }
  .chart-track { gap: 8px; }
  .bar-group { min-width: 62px; }
  .check-row { grid-template-columns: 1fr; gap: 9px; }
  .perf-row, .measure-row { grid-template-columns: 1fr; }
  .ba-grid { grid-template-columns: 1fr; }

  /* Verdict buttons stretch full width — thumb targets, not chips */
  .pfn { width: 100%; }
  .pfn button { flex: 1 1 0; min-width: 0; }
}

/* ---------------- Data tables become cards ----------------
   Below 900px a wide table stops being a table. Seven columns squeezed
   into a phone put the date, progress and status off-screen behind a
   sideways scroll, so each row becomes a self-contained card with its
   column headings carried along by data-th (stamped in
   stampTableLabels). 900px catches phones and tablets in portrait;
   a tablet in landscape has the width for real columns and keeps them. */
@media (max-width: 900px) {
  .table-wrap { overflow-x: visible; }
  .table-wrap table { display: block; width: 100%; border-collapse: separate; }
  .table-wrap thead { display: none; }
  .table-wrap tbody { display: block; }

  .table-wrap tbody tr {
    display: block;
    margin: 0 0 10px;
    padding: 13px 15px;
    border: 1px solid var(--hairline);
    border-radius: var(--radius-ctl);
    background: var(--glass-soft);
  }
  .table-wrap tbody tr:last-child { margin-bottom: 0; }
  .table-wrap tbody tr.clickable:active { transform: scale(.995); }

  .table-wrap tbody td {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 14px;
    width: auto;
    padding: 5px 0;
    border: none;
    text-align: right;
  }
  .table-wrap tbody td::before {
    content: attr(data-th);
    flex: 0 0 auto;
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--text-faint);
    white-space: nowrap;
  }

  /* The first cell is the card's title — a document number does not
     need a label above it saying "Doc No." */
  .table-wrap tbody td[data-first] {
    display: block;
    text-align: left;
    padding: 0 0 8px;
    margin-bottom: 6px;
    border-bottom: 1px solid var(--hairline-soft);
    font-size: 16px;
  }
  .table-wrap tbody td[data-first]::before { content: none; }

  .table-wrap tbody td .td-val {
    flex: 1 1 auto;
    min-width: 0;              /* without this a flex item refuses to shrink */
    text-align: right;
    overflow-wrap: anywhere;
  }
  .table-wrap tbody td[data-first] .td-val { text-align: left; }
}

@media (max-width: 660px) {
  .wordmark-sm { font-size: 15px; }
  .field-grid { grid-template-columns: 1fr; }
  .sign-grid { grid-template-columns: 1fr; }
