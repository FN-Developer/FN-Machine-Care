  .photo-grid { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
}

/* Touch devices: every control clears a comfortable tap target */
@media (pointer: coarse) {
  .seg button { min-height: 42px; }
  .nav button { min-height: 48px; }
  .pfn button { min-height: 48px; font-size: 13.5px; }
  .btn { min-height: 42px; }
  .doc-item { min-height: 48px; }
  .result-row button { min-height: 58px; }
  .field input, .field select, .field textarea, .cell-input { min-height: 42px; }
}

/* Glass is expensive on low-end tablets — drop the blur, keep the look */
@media (max-width: 616px) {
  .sidebar, .section, .card, .stat, .type-card, .toolbar, .table-wrap, .btn, .search-input {
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
  .orb { animation: none; }
}

/* iOS zooms the page in whenever a field with a font-size under 16px
   takes focus — and it does NOT zoom back out when the field is done.
   Tap one 15px input and the whole app is left at the wrong scale for
   the rest of the session, which reads exactly like "the scale broke".
   It judges on the computed CSS size, not what the viewport scaling
   makes it look like, so 15px still trips it.

   16px on every control a finger can land in. Nothing else changes:
   the desktop keeps 15px, where no such behaviour exists. */
@media (pointer: coarse) {
  input, select, textarea,
  .cell-input, .filter-select, .search-input, .date-text {
    font-size: 16px;
  }
}

/* ---------------- Print: paper is always light ---------------- */

@media print {
  @page { size: A4; margin: 12mm; }

  /* Paper has its own scale. Zooming here would push a full-page form
     onto two sheets and shrink the margins Chrome reserves for A4. */
  html { zoom: 1; }

  html, body {
    background: #fff !important;
    color: #000 !important;
    font-size: 10.5pt;
  }
  .modal-overlay, .chart-tip, .ambient, .sidebar, .toolbar, .no-print, .nav, .btn,
  .mobile-bar, .scrim, .menu-toggle,
  .photo-actions, .sign-foot { display: none !important; }

  .app { display: block; padding: 0; }
  .main { padding: 0; max-width: none; }

  .print-head { display: block !important; margin-bottom: 9mm; border-bottom: 2px solid #000; padding-bottom: 4mm; }

  /* Blur and translucency do not survive print — flatten everything */
  .section, .card, .stat, .table-wrap, .type-card, .photo-slot, .sign-card, .doc-item {
    background: #fff !important;
    -webkit-backdrop-filter: none !important;
    backdrop-filter: none !important;
    box-shadow: none !important;
    border: 1px solid #999 !important;
    border-radius: 4px !important;
  }

  /* ---- Pagination ----
     `break-inside: avoid` on .section was the reason a printed report ran
     to eight pages with a heading at the top of each and the rest blank.
     A section taller than the space left on the page cannot be kept whole,
     so the printer pushed the WHOLE thing to a fresh page and left the
     remainder empty. On a long checklist that happens over and over.

     Sections must be allowed to flow across a page break. What must stay
     whole is the small stuff — one check row, one signature, one photo —
     where a split genuinely loses meaning. */
  .section, .card { break-inside: auto; page-break-inside: auto; }

  .check-row, .measure-row, .perf-row, .field, .sign-card,
  .photo-slot, .doc-item, .stat, tr {
    break-inside: avoid;
    page-break-inside: avoid;
  }

  /* Never orphan a heading at the foot of a page */
  .section > header, .section-title, thead {
    break-after: avoid;
    page-break-after: avoid;
  }

  /* ---- Paper is not a phone ----
     Print media queries test the PAPER width, and A4 at 96dpi is about
     794px — narrower than the 1188px tablet cut. So every printed report,
     from any device, silently inherited the one-column phone layout:
     each check on four stacked lines, each field full width. That is what
     made the sections tall enough to trigger the pagination problem above.

     A4 has ~186mm of usable width. Give the paper back its columns. */
  .field-grid { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)) !important; }
  .check-row { grid-template-columns: 54px 1fr auto 150px !important; gap: 10px !important; }
  .measure-row { grid-template-columns: 1fr 120px 80px !important; }
  .perf-row { grid-template-columns: 1fr 110px 120px 80px !important; }
  .ba-grid { grid-template-columns: 1fr 1fr !important; }
  /* Paper is 794px wide, which trips the 900px card breakpoint. A
     printed report needs real columns, not a stack of cards. */
  .table-wrap { overflow: visible !important; }
  .table-wrap table { display: table !important; table-layout: auto !important; width: 100% !important; }
  .table-wrap thead { display: table-header-group !important; }
  .table-wrap tbody { display: table-row-group !important; }
  .table-wrap tbody tr { display: table-row !important; margin: 0 !important; padding: 0 !important; border: none !important; background: none !important; }
  .table-wrap tbody td { display: table-cell !important; text-align: left !important; }
  .table-wrap tbody td::before { content: none !important; }
  .table-wrap td, .table-wrap th { white-space: normal !important; word-break: break-word; }
  .pfn { display: flex !important; }
  .pfn button { width: auto !important; flex: 0 0 auto !important; }
  .section { margin-bottom: 5mm; }
  .section > header { background: #eee !important; border-bottom: 1px solid #999 !important; }
  .section-title, .check-label, .field label, .stat-label, .stat-value { color: #000 !important; }
  .label-th, .check-label .th, .section-title .th { color: #444 !important; }

  /* Swap every control for the wrapping span built in buildPrintValues().
     A control cannot wrap its own value; a span can, so nothing is cut. */
  .main input:not([type="checkbox"]):not([type="radio"]),
  .main select,
  .main textarea { display: none !important; }
  .date-open, .datecal { display: none !important; }
  .datefield { display: block !important; }

  .print-value {
    display: inline-block !important;
    width: 100%;
    min-height: 1.35em;
    padding: 2px 0 1px;
    border-bottom: 1px solid #666;
    color: #000 !important;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    line-height: 1.35;
  }

<script>
/* =============================================================
   FN MACHINE CARE — Cloud sync (Firebase Realtime Database)
   -------------------------------------------------------------
   OFF BY DEFAULT. With an empty config below the app behaves
   exactly as it always has: everything on the device, no network,
   no dependency. Paste a config in and it additionally syncs to a
   Realtime Database that every tablet shares.

   ── Where this one points ────────────────────────────────────
   Firebase project  FN-Service-System  (fn.developer26@gmail.com)
   Realtime Database  asia-southeast1 (Singapore)
   This is a DIFFERENT project from FN-ERP-System. The two
   databases share nothing.

   Sign-in  Anonymous — the tablet asks Firebase for a guest identity
            on load. Nobody types anything, which is how the ERP works
            too. The rules require an identity, so a stray crawler with
            no Firebase client gets nothing.

   Be honest about what that does and does not buy you: this page is
   public, so anyone who reads the source can ask for a guest identity
   of their own. The rules below stop a single call from wiping the
   history, but they cannot tell a technician's tablet from a stranger's
   browser. If the service records ever need real protection, switch to
   Email/Password and give each technician an account.

   ── Why the keys below are safe to publish ───────────────────
   A Firebase web config is an address, not a password. It is meant
   to ship inside the page. What actually protects the data is the
   rules file plus requiring a signed-in user — which is why the
   rules in this repo deny all access to anyone who is not.

   NEVER paste a service-account key here. Those ARE secret, they
   bypass every rule, and this file is public.
   ============================================================= */

const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyBgXa0Mx0F90Vnkm_ynD262EiNpZvB9ar4',
  authDomain: 'fn-service-system.firebaseapp.com',
  databaseURL: 'https://fn-service-system-default-rtdb.asia-southeast1.firebasedatabase.app',
  projectId: 'fn-service-system',
  storageBucket: 'fn-service-system.firebasestorage.app',
  messagingSenderId: '1055055351717',
  appId: '1:1055055351717:web:dd640717c9f3223d86a24c',
};

/* Pinned so the app cannot be broken by an upstream release. */
const FIREBASE_SDK = 'https://www.gstatic.com/firebasejs/10.12.5/';

const FNCloud = (function () {
  'use strict';

  const state = {
    enabled: false,
    ready: false,
    signedIn: false,
    user: null,
    status: 'off',      // off | connecting | offline | signin | live | error
    message: '',
  };

  let api = null;                 // the bits of the SDK we use
  let listeners = [];             // told whenever state or data changes
  let pushTimer = null;
  let applyingRemote = false;     // stops a remote update echoing straight back
  let watching = false;           // one set of listeners per sign-in, not one per auth event
  /* What this device has already put on the server, id -> updatedAt.
     Without it, every save re-uploaded all 78 records. */
  const pushed = new Map();
  let pushedPeople = null;
  let seeded = false;             // has this session uploaded what was already on the device?
  let needsReassert = false;      // we hold a record the server has wrongly lost
  let connected = false;          // real socket to the server (.info/connected)
  let connWatched = false;

  function emit() { listeners.forEach((fn) => { try { fn(state); } catch (e) { console.error(e); } }); }
  function onChange(fn) { listeners.push(fn); return () => { listeners = listeners.filter((f) => f !== fn); }; }

  /* Follow the real connection. .info/connected is a local mirror the
     SDK maintains; reading it never touches the network and is not
     governed by the security rules. */
  function watchConnection() {
    if (connWatched) return;
    connWatched = true;
    const { ref, onValue } = api.dbMod;
    onValue(ref(api.db, '.info/connected'), (snap) => {
      connected = snap.val() === true;
      if (!state.signedIn) return;              // auth state drives the rest
      if (connected) {
        setStatus('live');
        /* A save made while offline is still sitting in local storage;
           now that the socket is back, send it. */
        push();
      } else {
        setStatus('connecting', 'Reaching the shared database…');
      }
    });
  }

  function setStatus(status, message) {
    state.status = status;
    state.message = message || '';
    emit();
  }

  function configured() {
    return !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.databaseURL);
  }

  /* ---------- start-up ---------- */

  async function init(hooks) {
    api = Object.assign({ getDB: null, setDB: null, onData: null }, hooks || {});

    if (!configured()) {
      state.enabled = false;
      setStatus('off');
      return false;
    }

    state.enabled = true;
    setStatus('connecting');

    try {
      /* Imported only when cloud mode is on, so the offline build
         stays free of any external dependency. */
      const [appMod, authMod, dbMod] = await Promise.all([
        import(FIREBASE_SDK + 'firebase-app.js'),
        import(FIREBASE_SDK + 'firebase-auth.js'),
        import(FIREBASE_SDK + 'firebase-database.js'),
      ]);

      const app = appMod.initializeApp(FIREBASE_CONFIG);
      api.auth = authMod.getAuth(app);
      api.db = dbMod.getDatabase(app);
      api.authMod = authMod;
      api.dbMod = dbMod;
      state.ready = true;

      /* The truth about the connection, straight from the database.
         .info/connected is true only while this device actually has a
         live socket to the server — it goes false the moment the network
         drops, and back to true when it returns. Being *signed in* does
         not mean *connected*: Firebase restores a saved login from local
         storage with no network at all, and the records on screen come
         from this device's own cache. For weeks the badge said "Synced"
         off the sign-in alone, so a tablet that could not reach the
         database looked exactly like one that could. Now the badge
         follows this, so "Synced" means the shared database is genuinely
         reachable and a save will actually leave the device. */
      watchConnection();

      authMod.onAuthStateChanged(api.auth, (user) => {
        state.signedIn = !!user;
        state.user = user ? { email: user.email, uid: user.uid } : null;
        if (user) {
          /* Only claim "live" once the connection signal agrees. If we
             are signed in but not actually connected, this stays
             "connecting" until the socket comes up. */
          setStatus(connected ? 'live' : 'connecting');
          watch();
        } else {
          watching = false;
          seeded = false;
          pushed.clear();
          pushedPeople = null;
          /* Nobody types anything. The tablet asks Firebase for a guest
             identity and the rules accept it — the same arrangement the
             ERP uses. Anonymous accounts are cleaned up after 30 days,
             so this also runs when an old one expires; the records live
             under /records, not under the account, so nothing is lost. */
          signInGuest();
        }
      });

      return true;
    } catch (err) {
      console.error('[FN cloud] could not start:', err);
      state.ready = false;
      setStatus('offline', 'Could not reach Firebase — working on this device only.');
      return false;
    }
  }

  /* ---------- sign in ---------- */

  let guestTries = 0;

  async function signInGuest() {
    if (!state.ready) return;
    setStatus('connecting');
    try {
      await api.authMod.signInAnonymously(api.auth);
      guestTries = 0;
    } catch (err) {
      console.error('[FN cloud] guest sign-in refused:', err);
      /* Almost always the tablet being off the network. Back off and try
         again rather than sitting there dead — but never block the app,
         which is still perfectly usable on its own storage. */
      if (guestTries < 5) {
        guestTries++;
        setTimeout(signInGuest, Math.min(30000, 2000 * Math.pow(2, guestTries)));
        setStatus('connecting');
      } else {
        setStatus('offline', 'Could not reach the shared database — working on this device only.');
      }
    }
  }

  /* ---------- data ---------- */

  function watch() {
    if (watching) return;
    watching = true;
    const { ref, onValue } = api.dbMod;
    onValue(ref(api.db, 'records'), (snap) => {
      const remote = snap.val() || {};
      applyingRemote = true;
      try {
        const local = api.getDB();
        local.meta = local.meta || {};
        const tombs = local.meta.tombstones = local.meta.tombstones || {};
        const byId = new Map(local.records.map((r) => [r.id, r]));
        let changed = 0;
        let reassert = false;   // we hold something the server needs back

        Object.values(remote).forEach((r) => {
          if (!r || !r.id) return;

          /* A delete marker from another device. */
          if (r.deleted) {
            const held = byId.get(r.id);
            if (held && (held.updatedAt || '') > (r.updatedAt || '')) {
              /* This tablet edited the document AFTER someone else
                 deleted it. The edit is newer, so it stands — throwing
                 away a technician's work without a word is the worse of
                 the two surprises.

                 Forget that we ever sent this record, and ask for a
                 push. Both halves matter: without the first, the record
                 still looks already-uploaded and is skipped; without the
                 second, nothing would send it until the next unrelated
                 save, so it would live on this screen and nowhere else. */
              pushed.delete(r.id);
              reassert = true;
              return;
            }
            const t = tombs[r.id];
            if (!t || (t.updatedAt || '') < (r.updatedAt || '')) {
              tombs[r.id] = { type: r.type, docNo: r.docNo, updatedAt: r.updatedAt || '' };
              changed++;
            }
            if (byId.has(r.id)) { byId.delete(r.id); changed++; }
            pushed.set(r.id, r.updatedAt || '');
            return;
          }

          /* A live record that we believe was deleted. Settled by the
             same last-write-wins rule as any other conflict. */
          const t = tombs[r.id];
          if (t) {
            if ((t.updatedAt || '') >= (r.updatedAt || '')) return;  // the delete is newer — it stays deleted
            delete tombs[r.id];                                      // edited after the delete — it lives again
            changed++;
          }

          const mine = byId.get(r.id);
          /* Last write wins, decided by the record's own timestamp
             rather than by who happened to sync last. */
          if (!mine) {
            byId.set(r.id, r);
            changed++;
          } else if ((r.updatedAt || '') > (mine.updatedAt || '')) {
            /* Fill the EXISTING object rather than swapping in the new
               one. An open form closed over its record when it was
               drawn; replacing the object in the array leaves every
               field handler writing into an orphan that is no longer
               in db.records, so the technician types, the value looks
               accepted, and the next save serialises the replacement
               instead. That is the edit vanishing "back to the
               database". Same object, new contents, handles intact. */
            Object.keys(mine).forEach((k) => { if (!(k in r)) delete mine[k]; });
            Object.assign(mine, r);
            changed++;
          }
          if (r.id) {
            /* Remember it as already-sent so the seed push does not
               immediately write back what we just received. */
            pushed.set(r.id, r.updatedAt || '');
          }
        });

        if (changed) {
          local.records = Array.from(byId.values());
          api.setDB(local);
          if (api.onData) api.onData(changed);
        }
        needsReassert = needsReassert || reassert;
      } finally {
        applyingRemote = false;
      }

      /* Outside the applyingRemote guard on purpose — push() refuses to
         run while a remote update is being applied, which is exactly
         what stops an incoming change from echoing straight back. */
      if (needsReassert) {
        needsReassert = false;
        push();
      }

      /* The first snapshot after signing in is the only safe moment to
         upload what was already sitting on this tablet. Before the merge
         we might overwrite a newer copy from another device; after it,
         every local record is at least as new as the shared one, so
         sending the whole set up can only add.

         Without this, a tablet that had been working offline for a week
         would download everyone else's records and silently keep its own
         to itself until somebody happened to edit one. */
      if (!seeded) {
        seeded = true;
        push();
      }
    }, (err) => {
      console.error('[FN cloud] read refused:', err);
      setStatus('error', 'The database refused this account. Check the rules and that this user exists.');
    });

    onValue(ref(api.db, 'people'), (snap) => {
      const remote = snap.val();
      if (!Array.isArray(remote)) return;
      applyingRemote = true;
      try {
        const local = api.getDB();
        local.meta = local.meta || {};
        const have = new Set((local.meta.people || []).map((p) => p.name.toLowerCase()));
        let added = 0;
        remote.forEach((p) => {
          if (!p || !p.name) return;
          if (have.has(p.name.toLowerCase())) return;
          (local.meta.people = local.meta.people || []).push(p);
          added++;
        });
        if (added) { api.setDB(local); if (api.onData) api.onData(added); }
      } finally {
        applyingRemote = false;
      }
    });
  }

  /* Debounced: a checklist being filled in fires constantly. */
  function push() {
    if (!state.enabled || !state.ready || !state.signedIn || applyingRemote) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(doPush, 900);
  }

  async function doPush() {
    const { ref, set } = api.dbMod;
    const local = api.getDB();

    /* Send only the records whose timestamp has moved.

       The old code wrote EVERY record on EVERY save, which is how an
       edit made on one tablet came back undone. Tablet B saves an
       unrelated form; that save also re-uploads B's copy of the record
       A just edited; if B had not received A's version yet, the server
       silently goes backwards. The more tablets in use, the more often
       it happens — and it looks exactly like the app reloading over
       your work. */
    const dirty = local.records.filter((r) => r && r.id && pushed.get(r.id) !== (r.updatedAt || ''));

    /* Remember what happened, so a save that fails is not invisible.
       A rejected write used to leave nothing but a console line no one on
       a tablet can see; state.lastError now carries the reason to the
       screen. */
    let failures = 0, lastErr = '';

    /* One write per record, not one atomic multi-path update: a
       rejected stale record must not take a good save down with it. */
    for (const r of dirty) {
      try {
        await set(ref(api.db, 'records/' + r.id), r);
        pushed.set(r.id, r.updatedAt || '');
      } catch (err) {
        failures++; lastErr = (err && err.message) || String(err);
        console.warn('[FN cloud] record not written:', r.docNo, lastErr);
      }
    }

    /* Deletions travel the same way — a stub in the record's own slot
       saying it is gone, rather than an empty space that says nothing.
       id, type and docNo are there because the database rules insist
       on them; the fallbacks stop a half-formed marker from being
       permanently unwritable and so permanently unsyncable. */
    const tombs = (local.meta && local.meta.tombstones) || {};
    for (const id of Object.keys(tombs)) {
      const t = tombs[id] || {};
      if (pushed.get(id) === (t.updatedAt || '')) continue;
      try {
        await set(ref(api.db, 'records/' + id), {
          id,
          type: t.type || 'SERVICE',
          docNo: t.docNo || id,
          updatedAt: t.updatedAt || '',
          deleted: true,
        });
        pushed.set(id, t.updatedAt || '');
      } catch (err) {
        failures++; lastErr = (err && err.message) || String(err);
        console.warn('[FN cloud] delete not written:', t.docNo || id, lastErr);
      }
    }

    const people = (local.meta && local.meta.people) || [];
    const peopleKey = JSON.stringify(people);
    if (peopleKey !== pushedPeople) {
      try {
        await set(ref(api.db, 'people'), people);
        pushedPeople = peopleKey;
      } catch (err) {
        failures++; lastErr = (err && err.message) || String(err);
        console.error('[FN cloud] people not written:', lastErr);
      }
    }

    /* Surface the outcome. If the server refused something while we are
       genuinely connected, the technician needs to know their "saved"
       did not actually leave the device — silence here is what made this
       so hard to see. */
    state.lastError = failures ? lastErr : '';
    if (failures && connected) {
      setStatus('error', 'A save was refused by the database: ' + lastErr);
    } else if (connected && state.signedIn) {
      setStatus('live');
    }
  }

  /* Deleting used to mean remove(records/<id>) — which is why a deleted
     document reappeared. A hole in the shared database is indistinguishable
     from a record that was never there, so no other tablet could tell it
     had lost something, and the first one to reconnect uploaded its copy
     back. Deletion now goes through the ordinary push as a marker; see
     doPush(). This is kept only so an old cached build calling it does
     not throw. */
  async function removeRecord() { /* superseded by tombstones */ }

  return {
    init, push, removeRecord, onChange, configured,
    get state() { return state; },
  };
})();

<script>
/* =============================================================
   FN MACHINE CARE — Application
   Machine Inspection & Service Management System
   F N Technology

   No build step, no framework, no server. Everything runs in the
   browser and persists to localStorage. Records are keyed by
   WORK NO + MACHINE SERIAL, so one machine's whole life —
   Build → FAT → SAT → Service — reads as a single history.
   ============================================================= */

(function () {
  'use strict';

  /* ---------------- Storage ---------------- */

  const STORAGE_KEY = 'fn-machine-care.v1';

  const DEFAULT_DB = { records: [], meta: { version: 1, counters: {}, tombstones: {} } };

  /* Firebase does not store empty objects or arrays — it treats them as
     nothing and drops the key. So a record that has been to the cloud and
     back comes home without whichever containers happened to be empty:
     no `photos` if nobody took one, no `measures` on a form that has no
     measurements. The rendering code then reads record.measures[id] on
     undefined, throws, and the WHOLE table renders blank — 76 records and
     an empty screen.

     Every record entering the app goes through here: from localStorage,
     from the cloud, from an imported backup. Cheap, and it means no
     reader anywhere has to guess whether a container survived the trip. */
  const RECORD_CONTAINERS = {
    fields: 'object', checks: 'object', measures: 'object', perf: 'object',
    docs: 'object', photos: 'object', tables: 'object', notes: 'object',
    rootcause: 'object', priority: 'object', signatures: 'object',
  };

  function normaliseRecord(rec) {
    if (!rec || typeof rec !== 'object') return null;
    for (const key in RECORD_CONTAINERS) {
      if (rec[key] === null || typeof rec[key] !== 'object') rec[key] = {};
    }
    const ba = rec.beforeAfter;
    rec.beforeAfter = {
      before: Array.isArray(ba && ba.before) ? ba.before : [],
      after:  Array.isArray(ba && ba.after)  ? ba.after  : [],
    };
    if (rec.result === undefined) rec.result = null;
    /* Every record must carry the timestamps the rest of the app reads
       without checking. A record missing one (a partial write, an older
       backup) is repaired here rather than left to crash a screen. */
    if (!rec.updatedAt) rec.updatedAt = rec.createdAt || '';
    if (!rec.createdAt) rec.createdAt = rec.updatedAt || '';
    return rec;
  }

  function normaliseDB(db) {
    db.records = (db.records || []).map(normaliseRecord).filter(Boolean);
    db.meta = db.meta || { version: 1, counters: {} };
    db.meta.counters = db.meta.counters || {};
    /* id -> { type, docNo, updatedAt } for documents that have been
       deleted. See deleteRecord() for why a deletion has to leave
       something behind rather than just a hole. */
    db.meta.tombstones = db.meta.tombstones || {};
    /* Belt and braces: a delete marker must never be mistaken for a
       document, whichever route it arrived by. */
    db.records = db.records.filter((r) => !r.deleted);
    return db;
  }

  function loadDB() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return structuredClone(DEFAULT_DB);
      const parsed = JSON.parse(raw);
      if (!parsed || !Array.isArray(parsed.records)) return structuredClone(DEFAULT_DB);
      return normaliseDB(parsed);
    } catch (e) {
      console.error('[FN] Could not read saved data:', e);
      return structuredClone(DEFAULT_DB);
    }
  }

  function saveDB() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
      if (typeof FNCloud !== 'undefined') FNCloud.push();
      return true;
    } catch (e) {
      console.error('[FN] Save failed:', e);
      toast(
        lang === 'th'
          ? 'บันทึกไม่สำเร็จ — พื้นที่จัดเก็บอาจเต็ม (รูปภาพใช้พื้นที่มาก)'
          : 'Save failed — storage may be full (photos use a lot of space)',
        true
      );
      return false;
    }
  }

  let db = loadDB();
  /* Thai or English — one at a time. Anyone still carrying the old
     side-by-side setting is moved to Thai, the shop-floor language. */
  let lang = localStorage.getItem('fn-machine-care.lang') || 'th';
  if (lang !== 'en' && lang !== 'th') {
    lang = 'th';
    try { localStorage.setItem('fn-machine-care.lang', lang); } catch (e) { /* private mode */ }
  }

  /* ---------------- Theme ----------------
     'auto' follows the device. On a shop-floor tablet that means the
     app dims itself with the rest of the screen in the evening. */

  let theme = localStorage.getItem('fn-machine-care.theme') || 'auto';
  const darkQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

  function resolvedTheme() {
    if (theme === 'light' || theme === 'dark') return theme;
    return darkQuery && darkQuery.matches ? 'dark' : 'light';
  }

  function applyTheme() {
    const resolved = resolvedTheme();
    /* Theme lives on <html>, language on <body>, so a re-render never
       clobbers the theme. */
    document.documentElement.dataset.theme = resolved;
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', resolved === 'dark' ? '#0a0d16' : '#e9edf6');
  }

  function setTheme(next) {
    theme = next;
    try { localStorage.setItem('fn-machine-care.theme', next); } catch (e) { /* private mode */ }
    applyTheme();
    renderNav();
  }

  if (darkQuery) {
    const onSchemeChange = () => { if (theme === 'auto') { applyTheme(); renderNav(); } };
    if (darkQuery.addEventListener) darkQuery.addEventListener('change', onSchemeChange);
    else if (darkQuery.addListener) darkQuery.addListener(onSchemeChange);
  }

  /* ---------------- Backup access ----------------
     IMPORTANT, and worth being blunt about: this app runs entirely in
     the browser. Anyone who opens the page source or DevTools can get
     past this gate. It exists so a technician cannot wander into
     "Erase all data" by accident — it is NOT security.

     The password is stored as a salted SHA-256 digest so the literal
     string never appears in the repository. To change it, hash your
     new password and replace AUTH.pass below:

         node -e "console.log(require('crypto').createHash('sha256')
           .update('FN-Machine-Care::v1::' + 'YOUR-NEW-PASSWORD')
           .digest('hex'))"
  */

  const AUTH = {
    salt: 'FN-Machine-Care::v1::',
    user: '5e409621f1d736107d867b0d53371347855d87bd229b8d07aef73a5e931b4d88',
    pass: '39518eb18cc07024dd61fd9aa0f4b3b249147433caf90d8646a8189f4af4fb26',
  };

  /* Self-contained SHA-256. crypto.subtle is unavailable when the page
     is opened straight off a USB stick (file://), which is exactly how
     this app is meant to be used on the shop floor. */
  function sha256(msg) {
    const K = [
      0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
      0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
      0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
      0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
      0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
      0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
      0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
      0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
    let H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];

    /* UTF-8 encode */
    const bytes = [];
    for (const ch of unescape(encodeURIComponent(msg))) bytes.push(ch.charCodeAt(0));

    const bitLen = bytes.length * 8;
    bytes.push(0x80);
    while (bytes.length % 64 !== 56) bytes.push(0);
    for (let i = 7; i >= 0; i--) bytes.push((bitLen / Math.pow(2, i * 8)) & 0xff);

    const rotr = (x, n) => (x >>> n) | (x << (32 - n));

    for (let i = 0; i < bytes.length; i += 64) {
      const w = new Array(64);
      for (let t = 0; t < 16; t++) {
        w[t] = (bytes[i + t * 4] << 24) | (bytes[i + t * 4 + 1] << 16) |
               (bytes[i + t * 4 + 2] << 8) | bytes[i + t * 4 + 3];
      }
      for (let t = 16; t < 64; t++) {
        const s0 = rotr(w[t - 15], 7) ^ rotr(w[t - 15], 18) ^ (w[t - 15] >>> 3);
        const s1 = rotr(w[t - 2], 17) ^ rotr(w[t - 2], 19) ^ (w[t - 2] >>> 10);
        w[t] = (w[t - 16] + s0 + w[t - 7] + s1) | 0;
      }
      let [a, b, c, d, e, f2, g, h] = H;
      for (let t = 0; t < 64; t++) {
        const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
        const ch = (e & f2) ^ (~e & g);
        const t1 = (h + S1 + ch + K[t] + w[t]) | 0;
        const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
        const maj = (a & b) ^ (a & c) ^ (b & c);
        const t2 = (S0 + maj) | 0;
        h = g; g = f2; f2 = e; e = (d + t1) | 0;
        d = c; c = b; b = a; a = (t1 + t2) | 0;
      }
      H = H.map((v, idx) => (v + [a, b, c, d, e, f2, g, h][idx]) | 0);
    }
    return H.map((v) => (v >>> 0).toString(16).padStart(8, '0')).join('');
  }

  /* Unlocked for this tab only — closing the tab re-locks. */
  let backupUnlocked = false;
  try { backupUnlocked = sessionStorage.getItem('fn-machine-care.unlocked') === '1'; } catch (e) { /* private mode */ }

  function setUnlocked(v) {
    backupUnlocked = v;
    try {
      if (v) sessionStorage.setItem('fn-machine-care.unlocked', '1');
      else sessionStorage.removeItem('fn-machine-care.unlocked');
    } catch (e) { /* private mode */ }
  }

  function checkCredentials(user, pass) {
    return sha256(AUTH.salt + user.trim()) === AUTH.user &&
           sha256(AUTH.salt + pass) === AUTH.pass;
  }

  /* ---------------- Small helpers ---------------- */

  const $ = (sel, root) => (root || document).querySelector(sel);

  function el(tag, attrs, children) {
    const node = document.createElement(tag);
    if (attrs) {
      for (const k in attrs) {
        const v = attrs[k];
        if (v === null || v === undefined || v === false) continue;
        if (k === 'class') node.className = v;
        else if (k === 'html') node.innerHTML = v;
        else if (k === 'text') node.textContent = v;
        else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
        else node.setAttribute(k, v);
      }
    }
    (Array.isArray(children) ? children : children ? [children] : [])
      .filter((c) => c !== null && c !== undefined && c !== false)
      .forEach((c) => node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c));
    return node;
  }

  /* Line icon from the ICONS table. Stroked in currentColor so it
     inherits whatever the surrounding control is doing. */
  function icon(name, size) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('width', size || 18);
    svg.setAttribute('height', size || 18);
    svg.setAttribute('fill', 'none');
    svg.setAttribute('stroke', 'currentColor');
    svg.setAttribute('stroke-width', '1.7');
    svg.setAttribute('stroke-linecap', 'round');
    svg.setAttribute('stroke-linejoin', 'round');
    svg.setAttribute('aria-hidden', 'true');
    svg.setAttribute('class', 'ico');
    svg.dataset.icon = name;          /* lets the stylesheet animate each glyph */
    svg.innerHTML = ICONS[name] || '';
    return svg;
  }

  /* Bilingual label — renders EN and TH lines; CSS hides one when
     the user picks a single language. */
  function L(obj, cls) {
    if (!obj) return el('span');
    if (typeof obj === 'string') return el('span', { text: obj });
    return el('span', { class: cls || '' }, [
      el('span', { class: 'label-en', text: obj.en || '' }),
      el('span', { class: 'label-th th', text: obj.th || '' }),
    ]);
  }

  /* Plain string in the active language — for titles, toasts, values. */
  function T(obj) {
    if (!obj) return '';
    if (typeof obj === 'string') return obj;
    if (lang === 'th') return obj.th || obj.en || '';
    return obj.en || obj.th || '';
  }

  function todayISO() {
    const d = new Date();
    return [d.getFullYear(), String(d.getMonth() + 1).padStart(2, '0'), String(d.getDate()).padStart(2, '0')].join('-');
  }

  function fmtDate(iso) {
    if (!iso) return '—';
    const parts = String(iso).split('-');
    if (parts.length !== 3) return iso;
    return `${parts[2]}/${parts[1]}/${parts[0]}`;
  }

  function uid() {
    return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  /* Document numbers: FAT-2026-00125 */
  function nextDocNo(formDef) {
    const year = new Date().getFullYear();
    const key = `${formDef.prefix}-${year}`;
    const used = db.records
      .filter((r) => r.docNo && r.docNo.startsWith(key))
      .map((r) => parseInt(r.docNo.slice(key.length + 1), 10))
      .filter((n) => !isNaN(n));
    const next = (used.length ? Math.max(...used) : 0) + 1;
    return `${key}-${String(next).padStart(5, '0')}`;
  }

  let toastTimer = null;
  function toast(msg, isError) {
    const t = $('#toast');
    t.textContent = msg;
    t.className = 'toast show' + (isError ? ' err' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.className = 'toast'; }, 2600);
  }

  /* ---------------- People register ----------------
     Names are picked, not retyped, so "Somchai" is not also stored as
     "somchai" and "S. Somchai" on three different reports. */

  function people() {
    db.meta = db.meta || {};
    if (!Array.isArray(db.meta.people)) db.meta.people = [];
    if (!db.meta.peopleSeeded) seedPeople();
    return db.meta.people;
  }

  /* Names already typed on existing records become selectable straight
     away — importing a backup should not leave the picker empty. Their
     position is blank until someone sets one. */
  function seedPeople() {
    db.meta.peopleSeeded = true;
    const keys = ['inspector', 'projectEngineer', 'engineer', 'technician',
                  'assembler', 'checkedBy', 'customerContact'];
    const found = new Map();
    db.records.forEach((r) => {
      keys.forEach((k) => {
        const name = (r.fields[k] || '').trim();
        if (!name) return;
        const key = name.toLowerCase();
        if (!found.has(key)) found.set(key, { name, position: r.fields[k + '_pos'] || '' });
        else if (!found.get(key).position && r.fields[k + '_pos']) found.get(key).position = r.fields[k + '_pos'];
      });
    });
    found.forEach((p) => {
      if (!db.meta.people.some((x) => x.name.toLowerCase() === p.name.toLowerCase())) db.meta.people.push(p);
    });
    db.meta.people.sort((x, y) => x.name.localeCompare(y.name));
  }

  function addPerson(name, position) {
    const clean = (name || '').trim();
    if (!clean) return null;
    const list = people();
    const found = list.find((p) => p.name.toLowerCase() === clean.toLowerCase());
    if (found) {
      if (position) found.position = position;
      saveDB();
      return found;
    }
    const person = { name: clean, position: position || '' };
    list.push(person);
    list.sort((x, y) => x.name.localeCompare(y.name));
    saveDB();
    return person;
  }

  function findPerson(name) {
    const clean = (name || '').trim().toLowerCase();
    if (!clean) return null;
    return people().find((p) => p.name.toLowerCase() === clean) || null;
  }

  function positionLabel(value) {
    const p = POSITIONS.find((x) => x.value === value);
    return p ? p.label : { en: value || '', th: value || '' };
  }

  /* Someone's position, whether it came from the register or was
     stamped onto the record when it was submitted. */
  function positionOf(rec, key) {
    const stamped = rec.fields[key + '_pos'];
    if (stamped) return T(positionLabel(stamped));
    const p = findPerson(rec.fields[key]);
    return p && p.position ? T(positionLabel(p.position)) : '';
  }

  /* Values already used for a field, for its suggestion list. */
  function suggestionsFor(key) {
    const seen = new Set();
    db.records.forEach((r) => {
      const v = (r.fields[key] || '').trim();
      if (v) seen.add(v);
    });
    return Array.from(seen).sort((x, y) => x.localeCompare(y));
  }

  /* Pick a Work No. that already exists and the rest of the machine's
     identity fills itself in. */
  const IDENTITY_KEYS = ['workNo', 'machineName', 'serialNo', 'customer', 'poNo'];

  function machineMatching(key, value, excludeId) {
    const v = (value || '').trim().toLowerCase();
    if (!v) return null;
    const hits = db.records.filter((r) =>
      r.id !== excludeId &&                                   /* never match the form being filled in */
      (r.fields[key] || '').trim().toLowerCase() === v
    );
    if (!hits.length) return null;
    /* Prefer a record that actually carries the other details, then
       the most recent of those. */
    const score = (r) => IDENTITY_KEYS.filter((k) => (r.fields[k] || '').trim()).length;
    hits.sort((x, y) => score(y) - score(x) || (y.updatedAt > x.updatedAt ? 1 : -1));
    return hits[0];
  }

  /* ---------------- Record model ---------------- */

  function newRecord(type) {
    const def = FORM_BY_TYPE[type];
    return {
      id: uid(),
      type,
      docNo: nextDocNo(def),
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString(),
      status: 'draft',
      fields: { inspectionDate: todayISO(), serviceDate: todayISO(), buildDate: todayISO(), commissionDate: todayISO() },
      checks: {},      // sectionId -> { code: {value, remark} }
      measures: {},    // sectionId -> { key: value }
      perf: {},        // sectionId -> { key: actual }
      docs: {},        // sectionId -> { code: bool }
      photos: {},      // sectionId -> { code|freeIndex: dataURL }
      tables: {},      // sectionId -> [ {col: val} ]
      notes: {},       // sectionId -> string
      rootcause: {},   // sectionId -> { selected: [], text: '' }
      priority: {},    // sectionId -> value
      beforeAfter: { before: [], after: [] },
      result: null,
      signatures: {},  // roleKey -> { data, name, date }
    };
  }

  /* Identity used to group a machine's history */
  function machineKey(r) {
    const w = (r.fields.workNo || '').trim().toUpperCase();
    const s = (r.fields.serialNo || '').trim().toUpperCase();
    return w || s ? `${w}|${s}` : null;
  }

  function machineList() {
    const map = new Map();
    db.records.forEach((r) => {
      const key = machineKey(r);
      if (!key) return;
      if (!map.has(key)) {
        map.set(key, {
          key,
          workNo: r.fields.workNo || '',
          serialNo: r.fields.serialNo || '',
          machineName: r.fields.machineName || '',
          customer: r.fields.customer || '',
          records: [],
        });
      }
      const m = map.get(key);
      m.records.push(r);
      // Latest non-empty descriptive fields win
      if (r.fields.machineName) m.machineName = r.fields.machineName;
      if (r.fields.customer) m.customer = r.fields.customer;
    });
    map.forEach((m) => m.records.sort((a, b) => (b.createdAt > a.createdAt ? 1 : -1)));
    return Array.from(map.values()).sort((a, b) => a.workNo.localeCompare(b.workNo));
  }

  /* ---------------- Service analytics ----------------
     Everything the dashboard charts is derived from the records on
     the fly — there is no separate analytics store to fall out of
     sync with the forms. */

  function serviceRecords(records) {
    return records.filter((r) => r.type === 'SERVICE');
  }

  /* One row per customer: how many machines we have there, and how
     many times we have been called out. */
  function customerStats() {
    const map = new Map();
    db.records.forEach((r) => {
      const name = (r.fields.customer || '').trim();
      const key = name || '—';
      if (!map.has(key)) map.set(key, { customer: key, machines: new Set(), services: 0, records: [] });
      const e = map.get(key);
      const mk = machineKey(r);
      if (mk) e.machines.add(mk);
      if (r.type === 'SERVICE') e.services++;
      e.records.push(r);
    });
    return Array.from(map.values())
      .map((e) => Object.assign(e, { machineCount: e.machines.size }))
      .sort((a, b) => b.services - a.services || b.machineCount - a.machineCount || a.customer.localeCompare(b.customer));
  }

  /* One row per machine inside a customer. */
  function machineStatsFor(customerName) {
    const map = new Map();
    db.records.forEach((r) => {
      if (((r.fields.customer || '').trim() || '—') !== customerName) return;
      const mk = machineKey(r);
      if (!mk) return;
      if (!map.has(mk)) {
        map.set(mk, { key: mk, label: '', workNo: r.fields.workNo || '', serialNo: r.fields.serialNo || '', services: 0, records: [] });
      }
      const e = map.get(mk);
      e.records.push(r);
      if (r.type === 'SERVICE') e.services++;
      if (r.fields.machineName) e.label = r.fields.machineName;
      if (r.fields.workNo) e.workNo = r.fields.workNo;
      if (r.fields.serialNo) e.serialNo = r.fields.serialNo;
    });
    return Array.from(map.values())
      .map((e) => Object.assign(e, { label: e.label || e.workNo || e.serialNo || '—' }))
      .sort((a, b) => b.services - a.services || a.label.localeCompare(b.label));
  }

  /* Lookup tables pulled straight from the service form definition, so
     renaming a category there renames it here too. */
  function serviceTypeOptions() {
    const sec = FORM_BY_TYPE.SERVICE.sections.find((x) => x.type === 'fields');
    const fld = sec && sec.fields.find((x) => x.key === 'serviceType');
    return (fld && fld.options) || [];
  }

  function rootCauseOptions() {
    const sec = FORM_BY_TYPE.SERVICE.sections.find((x) => x.type === 'rootcause');
    return (sec && sec.categories) || [];
  }

  /* How many visits of each kind. */
  function serviceTypeBreakdown(records) {
    const opts = serviceTypeOptions();
    const counts = {};
    serviceRecords(records).forEach((r) => {
      const v = r.fields.serviceType || 'unspecified';
      counts[v] = (counts[v] || 0) + 1;
    });
    const rows = opts
      .map((o) => ({ value: o.value, label: o.label, count: counts[o.value] || 0 }))
      .filter((row) => row.count > 0);
    if (counts.unspecified) {
      rows.push({ value: 'unspecified', label: { en: 'Not specified', th: 'ไม่ได้ระบุ' }, count: counts.unspecified });
    }
    return rows.sort((a, b) => b.count - a.count);
  }

  /* The question a service manager actually asks: what keeps going
     wrong on this machine? Counted from the root-cause categories the
     technicians ticked, not from free text. */
  function recurringCauses(records) {
    const opts = rootCauseOptions();
    const byCode = {};
    opts.forEach((o) => { byCode[o.code] = o.label; });

    const counts = {};
    serviceRecords(records).forEach((r) => {
      const seen = new Set();
      Object.values(r.rootcause || {}).forEach((rc) => {
        (rc.selected || []).forEach((code) => seen.add(code));
      });
      seen.forEach((code) => { counts[code] = (counts[code] || 0) + 1; });
    });

    return Object.keys(counts)
      .map((code) => ({ code, label: byCode[code] || { en: code, th: code }, count: counts[code] }))
      .sort((a, b) => b.count - a.count);
  }

  /* Completion: how many check items have an answer */
  function sectionProgress(record, section) {
    if (section.type !== 'checklist' && section.type !== 'condition') return null;
    const answers = (record.checks && record.checks[section.id]) || {};
    const done = section.items.filter((it) => answers[it.code] && answers[it.code].value).length;
    return { done, total: section.items.length };
  }

  /* Belt as well as braces. normaliseRecord should mean this never fires,
     but a progress number is not worth taking the whole Records table down
     for — one unreadable record should cost one row's percentage, not the
     entire screen. */
  function recordProgress(record) {
    const def = FORM_BY_TYPE[record.type];
    if (!def) return { done: 0, total: 0, pct: 0 };
    let done = 0, total = 0;
    try {
      def.sections.forEach((s) => {
        const p = sectionProgress(record, s);
        if (p) { done += p.done; total += p.total; }
      });
    } catch (e) {
      console.error('[FN] Could not measure progress for', record && record.docNo, e);
      return { done: 0, total: 0, pct: 0 };
    }
    return { done, total, pct: total ? Math.round((done / total) * 100) : 0 };
  }

  /* Safety gate — a failed safety item blocks a READY result */
  function hasSafetyFail(record) {
    const def = FORM_BY_TYPE[record.type];
    if (!def.safetyGate) return false;
    return def.sections.some((s) => {
      if (s.type !== 'checklist' || !s.critical) return false;
      const answers = record.checks[s.id] || {};
      return s.items.some((it) => answers[it.code] && answers[it.code].value === 'FAIL');
    });
  }

  function failedItems(record) {
    const def = FORM_BY_TYPE[record.type];
    const out = [];
    def.sections.forEach((s) => {
      if (s.type !== 'checklist' && s.type !== 'condition') return;
      const answers = record.checks[s.id] || {};
      s.items.forEach((it) => {
        const a = answers[it.code];
        if (a && (a.value === 'FAIL' || a.value === 'ABNORMAL')) {
          out.push({ section: s, item: it, remark: a.remark || '' });
        }
      });
    });
    return out;
  }

  function resultMeta(record) {
    const def = FORM_BY_TYPE[record.type];
    const section = def.sections.find((s) => s.type === 'result');
    if (!section || !record.result) return null;
    return section.options.find((o) => o.value === record.result) || null;
  }

  function pillClassFor(record) {
    if (record.status === 'draft') return 'draft';
    const m = resultMeta(record);
    if (!m) return 'draft';
    if (m.tone === 'good') return 'green';
    if (m.tone === 'warn') return 'yellow';
    return 'red';
  }

  /* ---------------- Navigation drawer (tablet & phone) ----------------
     Desktop keeps the sidebar in place; below 900px it becomes an
     off-canvas drawer opened by the ☰ button. */

  /* Ask the stylesheet, don't duplicate its breakpoint here — the two
     drifted apart the moment the tablet cut moved. The bar is only
     displayed when the drawer layout is active. */
  function navIsDrawer() {
    const bar = document.querySelector('.mobile-bar');
    return !!bar && getComputedStyle(bar).display !== 'none';
  }

  function setNavOpen(open) {
    const root = document.documentElement;
    root.classList.toggle('nav-open', !!open);
    const btn = $('#menuToggle');
    if (btn) btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    /* Keyboard users should not tab into a closed drawer */
    const sidebar = $('#sidebar');
    if (sidebar) sidebar.setAttribute('aria-hidden', open || !navIsDrawer() ? 'false' : 'true');
  }

  function closeNav() {
    if (document.documentElement.classList.contains('nav-open')) setNavOpen(false);
  }

  function setupNavDrawer() {
    const btn = $('#menuToggle');
    const scrim = $('#scrim');

    if (btn) {
      btn.addEventListener('click', () => {
        setNavOpen(!document.documentElement.classList.contains('nav-open'));
      });
    }
    if (scrim) scrim.addEventListener('click', closeNav);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeNav();
    });

    /* Rotating a tablet back to a wide layout must not leave the
       page stuck behind a scrim. */
    window.addEventListener('resize', () => {
      if (!navIsDrawer()) setNavOpen(false);
    });

    setNavOpen(false);
  }

  /* ---------------- Modal ---------------- */

  function modal(opts) {
    const overlay = el('div', { class: 'modal-overlay' });
    const card = el('div', { class: 'modal-card', role: 'dialog', 'aria-modal': 'true' });

    function close() {
      overlay.classList.remove('show');
      document.removeEventListener('keydown', onKey);
      setTimeout(() => overlay.remove(), 220);
    }
    function onKey(e) { if (e.key === 'Escape' && !opts.blocking) close(); }

    if (opts.title) card.appendChild(el('h2', { class: 'modal-title' }, [L(opts.title)]));
    if (opts.note) card.appendChild(el('p', { class: 'modal-note' }, [L(opts.note)]));
    const bodyBox = el('div', { class: 'modal-body' }, opts.body || []);
    card.appendChild(bodyBox);

    const foot = el('div', { class: 'modal-foot' });
    if (opts.onConfirm) {
      foot.appendChild(el('button', { class: 'btn', onclick: close }, [L({ en: 'Cancel', th: 'ยกเลิก' })]));
    }
    foot.appendChild(el('button', {
      class: 'btn btn-primary',
      onclick: () => { if (!opts.onConfirm || opts.onConfirm() !== false) close(); },
    }, [L(opts.confirmLabel || { en: 'OK', th: 'ตกลง' })]));
    card.appendChild(foot);

    overlay.appendChild(card);
    overlay.addEventListener('click', (e) => { if (e.target === overlay && !opts.blocking) close(); });
    document.addEventListener('keydown', onKey);
    document.body.appendChild(overlay);
    requestAnimationFrame(() => overlay.classList.add('show'));
    return { close };
  }

  /* ---------------- Validation ----------------
     A submitted form is a record someone will rely on months later, so
     it has to be complete. Every gap is collected, not just the first,
     and each one is pointed at directly. */

  function validateRecord(rec) {
    const def = FORM_BY_TYPE[rec.type];
    const gaps = [];

    def.sections.forEach((section) => {
      if (section.type === 'fields') {
        section.fields.forEach((f) => {
          if (!f.required) return;
          if (String(rec.fields[f.key] || '').trim()) return;
          gaps.push({ kind: 'field', sectionId: section.id, key: f.key, label: f.label, section: section.title });
        });
      }

      if (section.type === 'checklist' || section.type === 'condition') {
        const answers = rec.checks[section.id] || {};
        section.items.forEach((it) => {
          if (answers[it.code] && answers[it.code].value) return;
          gaps.push({ kind: 'check', sectionId: section.id, key: it.code, label: it.label, section: section.title });
        });
      }

      if (section.type === 'result' && !rec.result) {
        gaps.push({ kind: 'result', sectionId: section.id, key: 'result', label: section.title, section: section.title });
      }

      if (section.type === 'signoff') {
        section.roles.forEach((role) => {
          const sig = rec.signatures[role.key] || {};
          if (String(sig.name || '').trim()) return;
          gaps.push({ kind: 'sign', sectionId: section.id, key: role.key, label: role.label, section: section.title });
        });
      }
    });

    return gaps;
  }

  function focusGap(gap) {
    const section = document.getElementById('sec-' + gap.sectionId);
    if (!section) return;
    let target = null;
    if (gap.kind === 'field') target = section.querySelector(`[data-field="${gap.key}"]`);
    else if (gap.kind === 'check') target = section.querySelector(`[data-code="${gap.key}"]`);
    else if (gap.kind === 'sign') target = section.querySelector(`[data-role="${gap.key}"]`);
    else target = section;
    (target || section).scrollIntoView({ behavior: 'smooth', block: 'center' });
    const input = target && target.querySelector('input, select, textarea, button');
    if (input) setTimeout(() => input.focus({ preventScroll: true }), 400);
  }

  /* ---------------- Submit ---------------- */

  function submitRecord(rec) {
    const gaps = validateRecord(rec);

    if (gaps.length) {
      rec._showErrors = true;
      render();
      setTimeout(() => focusGap(gaps[0]), 60);
      toast(
        lang === 'th'
          ? `ยังกรอกไม่ครบ ${gaps.length} รายการ — ช่องที่ขาดกะพริบสีแดง`
          : `${gaps.length} still to fill — the missing ones are flashing red`,
        true
      );
      return;
    }

    const def = FORM_BY_TYPE[rec.type];
    const byKey = def.submitter;
    const name = (rec.fields[byKey] || '').trim() || '—';
    const position = positionOf(rec, byKey) || '—';
    const now = new Date();

    rec._showErrors = false;
    rec.status = 'submitted';
    rec.submittedAt = now.toISOString();
    rec.submittedBy = { name, position, key: byKey };
    rec.receipt = drawReceipt(rec, def, name, position, now);
    touch(rec);

    showSubmitted(rec, def, name, position, now);
    render();
  }

  function fmtDateTime(d) {
    const p = (n) => String(n).padStart(2, '0');
    return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()}  ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  /* A submission slip drawn on canvas and stored with the record.
     Drawn rather than screenshotted: the page is frosted glass over a
     moving gradient, and no dependency-free DOM capture reproduces
     that. This prints the facts cleanly instead, and always the same. */
  function drawReceipt(rec, def, name, position, when) {
    try {
      const W = 900, H = 560, s = 2;
      const c = el('canvas');
      c.width = W * s; c.height = H * s;
      const g = c.getContext('2d');
      g.scale(s, s);

      g.fillStyle = '#ffffff'; g.fillRect(0, 0, W, H);
      g.fillStyle = '#0a84ff'; g.fillRect(0, 0, W, 8);

      g.fillStyle = '#0d1526';
      g.font = '700 30px "Segoe UI", system-ui, sans-serif';
      g.fillText('FN Machine Care', 46, 74);
      g.fillStyle = '#5c6780';
      g.font = '15px "Segoe UI", system-ui, sans-serif';
      g.fillText('F N Technology — submission record', 46, 100);

      g.fillStyle = '#30d158';
      g.beginPath(); g.arc(W - 84, 74, 26, 0, Math.PI * 2); g.fill();
      g.strokeStyle = '#fff'; g.lineWidth = 4; g.lineCap = 'round'; g.lineJoin = 'round';
      g.beginPath(); g.moveTo(W - 96, 74); g.lineTo(W - 87, 83); g.lineTo(W - 71, 64); g.stroke();

      g.strokeStyle = '#d7dded'; g.lineWidth = 1;
      g.beginPath(); g.moveTo(46, 124); g.lineTo(W - 46, 124); g.stroke();

      const rows = [
        ['Document', `${rec.docNo}   (${def.prefix})`],
        ['Form', def.name.en],
        ['Work No.', rec.fields.workNo || '—'],
        ['Machine', rec.fields.machineName || '—'],
        ['Serial No.', rec.fields.serialNo || '—'],
        ['Customer', rec.fields.customer || '—'],
        ['PO No.', rec.fields.poNo || '—'],
      ];
      let y = 164;
      rows.forEach(([k, v]) => {
        g.fillStyle = '#5c6780';
        g.font = '14px "Segoe UI", system-ui, sans-serif';
        g.fillText(k, 46, y);
        g.fillStyle = '#0d1526';
        g.font = '600 16px "Segoe UI", system-ui, sans-serif';
        g.fillText(String(v).slice(0, 58), 210, y);
        y += 32;
      });

      const meta = resultMeta(rec);
      if (meta) {
        g.fillStyle = meta.color;
        roundRect(g, 46, y - 4, 420, 38, 10); g.fill();
        g.fillStyle = '#ffffff';
        g.font = '700 15px "Segoe UI", system-ui, sans-serif';
        g.fillText(meta.label.en, 62, y + 20);
        y += 56;
      }

      g.strokeStyle = '#d7dded';
      g.beginPath(); g.moveTo(46, y); g.lineTo(W - 46, y); g.stroke();
      y += 30;

      g.fillStyle = '#5c6780'; g.font = '14px "Segoe UI", system-ui, sans-serif';
      g.fillText('Submitted', 46, y);
      g.fillStyle = '#0d1526'; g.font = '600 16px "Segoe UI", system-ui, sans-serif';
      g.fillText(fmtDateTime(when), 210, y);
      y += 30;

      g.fillStyle = '#5c6780'; g.font = '14px "Segoe UI", system-ui, sans-serif';
      g.fillText('By', 46, y);
      g.fillStyle = '#0d1526'; g.font = '600 16px "Segoe UI", system-ui, sans-serif';
      g.fillText(name, 210, y);
      y += 26;
      g.fillStyle = '#5c6780'; g.font = '15px "Segoe UI", system-ui, sans-serif';
      g.fillText(position, 210, y);

      return c.toDataURL('image/png');
    } catch (e) {
      console.error('[FN] Could not draw the submission slip:', e);
      return '';
    }
  }

  function roundRect(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  function showSubmitted(rec, def, name, position, when) {
    const body = [
      el('div', { class: 'submit-mark' }, [
        el('span', { class: 'submit-tick', text: '✓' }),
      ]),
      el('div', { class: 'submit-doc', text: rec.docNo }),
      el('div', { class: 'submit-form', text: T(def.name) }),
      el('div', { class: 'submit-rows' }, [
        submitRow({ en: 'Submitted', th: 'ส่งเมื่อ' }, fmtDateTime(when)),
        submitRow({ en: 'By', th: 'โดย' }, name),
        submitRow({ en: 'Position', th: 'ตำแหน่ง' }, position),
      ]),
    ];

    if (rec.receipt) {
      body.push(el('img', { class: 'submit-shot', src: rec.receipt, alt: 'Submission record' }));
      body.push(el('div', { class: 'btn-row', style: 'justify-content:center;margin-top:12px' }, [
        el('button', {
          class: 'btn btn-sm',
          onclick: () => {
            const a2 = el('a', { href: rec.receipt, download: `${rec.docNo}-submitted.png` });
            document.body.appendChild(a2); a2.click(); a2.remove();
          },
        }, [L({ en: '⬇ Save this slip', th: '⬇ บันทึกสลิปนี้' })]),
      ]));
    }

    modal({
      title: { en: 'Submitted', th: 'ส่งเอกสารแล้ว' },
      note: { en: 'This record is now complete and saved on this device.',
              th: 'เอกสารนี้กรอกครบและบันทึกไว้ในเครื่องนี้แล้ว' },
      body,
      blocking: true,
      confirmLabel: { en: 'OK', th: 'ตกลง' },
    });
  }

  function submitRow(label, value) {
    return el('div', { class: 'submit-row' }, [
      el('span', { class: 'submit-key' }, [L(label)]),
      el('span', { class: 'submit-val', text: value }),
    ]);
  }

  /* ---------------- Router ---------------- */

  const state = { view: 'dashboard', recordId: null, machineKey: null, search: '', customer: null,
                  filterCustomer: null, filterMachine: null, openMachine: null };

  /* The URL hash carries the current view so a tablet refresh — or a
     browser crash mid-inspection — returns to the same form. */
  function writeHash() {
    const parts = [state.view];
    if (state.recordId) parts.push(state.recordId);
    else if (state.machineKey) parts.push(encodeURIComponent(state.machineKey));
    const hash = '#/' + parts.join('/');
    if (window.location.hash !== hash) {
      suppressHashChange = true;
      window.location.hash = hash;
    }
  }

  let suppressHashChange = false;

  function readHash() {
    const raw = (window.location.hash || '').replace(/^#\/?/, '');
    if (!raw) return false;
    const [view, arg] = raw.split('/');
    if (!view) return false;
    state.view = view;
    state.recordId = null;
    state.machineKey = null;
    if (view === 'form' && arg) {
      if (!db.records.some((r) => r.id === arg)) { state.view = 'records'; return true; }
      state.recordId = arg;
    } else if (view === 'machine' && arg) {
      state.machineKey = decodeURIComponent(arg);
    }
    return true;
  }

  function go(view, opts) {
    closeNav();
    if (view !== 'dashboard') state.customer = null;
    state.view = view;
    state.recordId = (opts && opts.recordId) || null;
    state.machineKey = (opts && opts.machineKey) || null;
    writeHash();
    window.scrollTo(0, 0);
    render();
  }

  /* ---------------- Render: shell ---------------- */

  function render() {
    document.body.className = 'lang-' + lang;
    renderNav();
    const main = $('#main');
    main.innerHTML = '';
    const views = {
      dashboard: viewDashboard,
      machines: viewMachines,
      records: viewRecords,
      newform: viewNewForm,
      form: viewForm,
      machine: viewMachine,
      data: viewData,
    };
    /* A blank screen tells a technician nothing and tells me less.
       Twice now a single bad record has taken a whole page down — once
       the Records table, once a form on a phone I could not reproduce.
       If rendering throws, say so on screen, name the document, and
       leave the toolbar's Back button reachable. */
    try {
      (views[state.view] || viewDashboard)(main);
      stampTableLabels(main);
    } catch (err) {
      console.error('[FN] Could not draw this screen:', err);
      renderFailureCard(main, err);
    }
  }

  function renderFailureCard(main, err) {
    const rec = state.recordId && db.records.find((r) => r.id === state.recordId);
    const card = el('div', { class: 'card fail-card' }, [
      el('h2', {}, [L({ en: 'This screen could not be drawn',
                        th: 'ไม่สามารถแสดงหน้านี้ได้' })]),
      el('p', {}, [L({
        en: 'Your work is safe — nothing has been deleted. Please show this message to the developer.',
        th: 'ข้อมูลของคุณยังอยู่ครบ ไม่มีอะไรถูกลบ กรุณาแจ้งข้อความนี้กับผู้พัฒนา',
      })]),
      el('pre', { class: 'fail-detail', text:
        (rec ? rec.docNo + '  (' + rec.type + ')\n' : '') +
        (state.view || '?') + '\n' +
        String((err && err.message) || err) + '\n' +
        String((err && err.stack) || '').split('\n').slice(1, 4).join('\n') }),
      el('div', { class: 'btn-row' }, [
        el('button', { class: 'btn', onclick: () => go('records') },
           [L({ en: 'Back to records', th: 'กลับไปหน้าเอกสาร' })]),
        el('button', { class: 'btn', onclick: () => {
            const t = (rec ? rec.docNo + ' ' : '') + (state.view || '') + ' ' + String((err && err.stack) || err);
            navigator.clipboard && navigator.clipboard.writeText(t);
            toast(T({ en: 'Copied', th: 'คัดลอกแล้ว' }));
          } }, [L({ en: 'Copy details', th: 'คัดลอกรายละเอียด' })]),
      ]),
    ]);
    main.appendChild(card);
  }

  /* ---- data tables on a narrow screen ----
     A seven-column table does not fit a 390px phone. It was rendering
     at 897px inside a 364px box, so a technician saw the document
     number, a type chip, and then the machine name cut off mid-word —
     the date, progress and status, which are the reason to open the
     page at all, sat off-screen behind a sideways scroll nobody thinks
     to try.

     Below 900px each row becomes a card instead. That needs every cell
     to carry its column heading, and rather than thread a label through
     three separate table builders, copy them off the <thead> once here.
     Any table added later gets the same treatment for free. */
  function stampTableLabels(root) {
    root.querySelectorAll('.table-wrap table').forEach((table) => {
      const heads = [...table.querySelectorAll('thead th')].map((th) => th.innerText.trim());
      if (!heads.length) return;
      table.querySelectorAll('tbody tr').forEach((tr) => {
        [...tr.children].forEach((td, i) => {
          const label = heads[i];
          if (label) td.setAttribute('data-th', label);
          if (i === 0) td.setAttribute('data-first', '');
          /* Collect the cell's contents into ONE element. As a card the
             cell is a flex row of [label | value], and a cell holding a
             machine name AND a customer <div> put two separate items on
             the value side with nothing able to shrink — long customer
             names pushed 32px off the right edge of a 390px phone. */
          if (!td.querySelector(':scope > .td-val')) {
            const val = document.createElement('span');
            val.className = 'td-val';
            while (td.firstChild) val.appendChild(td.firstChild);
            td.appendChild(val);
          }
        });
      });
    });
  }

  /* A labelled count list with a proportional bar behind each row. */
  function summaryCard(title, note, rows, emptyLabel) {
    const card = el('div', { class: 'card summary-card' });
    card.appendChild(el('h3', { class: 'sub-title' }, [L(title)]));
    card.appendChild(el('div', { class: 'summary-note' }, [L(note)]));

    if (!rows.length) {
      card.appendChild(el('div', { class: 'summary-empty' }, [L(emptyLabel)]));
      return card;
    }
    const max = Math.max(...rows.map((r) => r.count));
    const list = el('div', { class: 'summary-list' });
    rows.forEach((r) => {
      list.appendChild(
        el('div', { class: 'summary-row' }, [
          el('span', { class: 'summary-label', text: T(r.label) }),
          el('span', { class: 'summary-meter' }, [
            el('span', { class: 'summary-fill', style: `width:${(r.count / max) * 100}%` }),
          ]),
          el('span', { class: 'summary-count', text: String(r.count) }),
        ])
      );
    });
    card.appendChild(list);
    return card;
  }

  /* ---------------- Bar chart ----------------
     Built from plain elements, not a library: each bar is a real
     button, so it is keyboard reachable and screen-reader readable,
     and a table view sits behind a toggle for anyone who would rather
     read the numbers.

     Series colours were validated with the dataviz palette checker
     (lightness band, chroma, colour-blind separation, contrast) for
     both themes — hence two different pairs rather than one flipped. */

  const SERIES = [
    { key: 'machines', label: { en: 'Machines', th: 'จำนวนเครื่อง' }, varName: '--series-1' },
    { key: 'services', label: { en: 'Service visits', th: 'ครั้งที่เข้าบริการ' }, varName: '--series-2' },
  ];

  function niceCeil(v) {
    if (v <= 5) return Math.max(v, 1);
    const pow = Math.pow(10, Math.floor(Math.log10(v)));
    return Math.ceil(v / (pow / 2)) * (pow / 2);
  }

  /* rows: [{ id, label, sub, values: {machines, services}, onClick }] */
  function barChart(rows, opts) {
    const options = opts || {};
    const series = options.series || SERIES;
    const box = el('div', { class: 'chart' });

    if (!rows.length) {
      box.appendChild(el('div', { class: 'empty' }, [L(options.emptyLabel || UI.noRecords)]));
      return box;
    }

    /* Legend — always present for two or more series */
    if (series.length > 1) {
      const legend = el('div', { class: 'legend' });
      series.forEach((sr) => {
        legend.appendChild(
          el('span', { class: 'legend-item' }, [
            el('span', { class: 'legend-swatch', style: `background:var(${sr.varName})` }),
            L(sr.label),
          ])
        );
      });
      box.appendChild(legend);
    }

    const max = niceCeil(Math.max(1, ...rows.map((r) => Math.max(...series.map((sr) => r.values[sr.key] || 0)))));
    const ticks = 4;

    const plot = el('div', { class: 'chart-plot' });

    /* Recessive gridlines with their value on the axis */
    const grid = el('div', { class: 'chart-grid' });
    for (let i = 0; i <= ticks; i++) {
      const v = Math.round((max / ticks) * i);
      grid.appendChild(
        el('div', { class: 'grid-line', style: `bottom:${(i / ticks) * 100}%` }, [
          el('span', { class: 'grid-label', text: String(v) }),
        ])
      );
    }
    plot.appendChild(grid);

    const tip = chartTip();

    const track = el('div', { class: 'chart-track' });
    rows.forEach((row) => {
      const group = el('button', {
        class: 'bar-group' + (options.onSelect ? ' is-clickable' : ''),
        type: 'button',
        'aria-label': `${row.label}: ` + series.map((sr) => `${T(sr.label)} ${row.values[sr.key] || 0}`).join(', '),
        onclick: () => { if (options.onSelect) options.onSelect(row); },
        onmouseenter: (e) => showTip(e, row),
        onmousemove: (e) => showTip(e, row),
        onmouseleave: hideChartTip,
        onfocus: (e) => showTip(e, row),
        onblur: hideChartTip,
      });

      const bars = el('div', { class: 'bars' });
      series.forEach((sr) => {
        const v = row.values[sr.key] || 0;
        const h = max ? (v / max) * 100 : 0;
        bars.appendChild(
          el('span', { class: 'bar-slot' }, [
            el('span', { class: 'bar-value', text: v ? String(v) : '' }),
            el('span', {
              class: 'bar',
              style: `height:${h}%;background:var(${sr.varName})`,
            }),
          ])
        );
      });
      group.appendChild(bars);
      group.appendChild(el('span', { class: 'bar-label', text: row.label, title: row.label }));
      if (row.sub) group.appendChild(el('span', { class: 'bar-sub', text: row.sub }));
      track.appendChild(group);
    });

    function showTip(e, row) {
      tip.innerHTML = '';
      tip.appendChild(el('div', { class: 'tip-title', text: row.label }));
      if (row.sub) tip.appendChild(el('div', { class: 'tip-sub', text: row.sub }));
      series.forEach((sr) => {
        tip.appendChild(
          el('div', { class: 'tip-row' }, [
            el('span', { class: 'legend-swatch', style: `background:var(${sr.varName})` }),
            el('span', { class: 'tip-key', text: T(sr.label) }),
            el('span', { class: 'tip-val', text: String(row.values[sr.key] || 0) }),
          ])
        );
      });
      placeChartTip(tip, e.currentTarget.getBoundingClientRect());
    }

    plot.appendChild(track);
    box.appendChild(plot);

    /* Table view — the numbers, for anyone who wants them straight */
    const table = el('div', { class: 'table-wrap chart-table', style: 'display:none;margin-top:14px' });
    const t = el('table');
    t.appendChild(el('thead', {}, el('tr', {}, [
      el('th', {}, [L(options.dimensionLabel || { en: 'Name', th: 'ชื่อ' })]),
      ...series.map((sr) => el('th', {}, [L(sr.label)])),
    ])));
    const tb = el('tbody');
    rows.forEach((row) => {
      tb.appendChild(el('tr', {}, [
        el('td', { text: row.label + (row.sub ? ' · ' + row.sub : '') }),
        ...series.map((sr) => el('td', { text: String(row.values[sr.key] || 0) })),
      ]));
    });
    t.appendChild(tb);
    table.appendChild(t);

    const toggle = el('button', {
      class: 'btn btn-sm no-print',
      style: 'margin-top:12px',
      onclick: () => {
        const shown = table.style.display !== 'none';
        table.style.display = shown ? 'none' : '';
        toggle.textContent = shown ? T({ en: 'Show numbers', th: 'ดูเป็นตัวเลข' }) : T({ en: 'Hide numbers', th: 'ซ่อนตัวเลข' });
      },
      text: T({ en: 'Show numbers', th: 'ดูเป็นตัวเลข' }),
    });
    box.appendChild(toggle);
    box.appendChild(table);

    return box;
  }

  const recFilter = { customer: '', machine: '', type: '', sort: 'date-desc' };

  const SORTS = [
    { key: 'date-desc',  label: { en: 'Date — newest first', th: 'วันที่ — ใหม่สุดก่อน' } },
    { key: 'date-asc',   label: { en: 'Date — oldest first', th: 'วันที่ — เก่าสุดก่อน' } },
    { key: 'doc-asc',    label: { en: 'Document no. — A to Z', th: 'เลขที่เอกสาร — ก-ฮ' } },
    { key: 'doc-desc',   label: { en: 'Document no. — Z to A', th: 'เลขที่เอกสาร — ฮ-ก' } },
    { key: 'machine-asc',label: { en: 'Machine name — A to Z', th: 'ชื่อเครื่องจักร — ก-ฮ' } },
    { key: 'customer-asc',label:{ en: 'Customer — A to Z', th: 'ลูกค้า — ก-ฮ' } },
  ];

  function sortRecords(list, key) {
    const by = (f) => (a, b) => {
      const x = String(f(a) || '').toLowerCase(), y = String(f(b) || '').toLowerCase();
      return x < y ? -1 : x > y ? 1 : 0;
    };
    const copy = list.slice();
    switch (key) {
      case 'date-asc':    return copy.sort(by((r) => primaryDate(r)));
      case 'doc-asc':     return copy.sort(by((r) => r.docNo));
      case 'doc-desc':    return copy.sort(by((r) => r.docNo)).reverse();
      case 'machine-asc': return copy.sort(by((r) => r.fields.machineName || 'zzz'));
      case 'customer-asc':return copy.sort(by((r) => r.fields.customer || 'zzz'));
      default:            return copy.sort(by((r) => primaryDate(r))).reverse();
    }
  }

  function viewRecords(root) {
