      ])
    );

    const bar = el('div', { class: 'filter-bar', id: 'recFilterBar' });
    root.appendChild(bar);
    const holder = el('div', { id: 'recordsHolder' });
    root.appendChild(holder);

    drawBar();
    drawList();

    /* The search box is a live input — rebuilding it under the cursor
       would drop focus mid-word, so only the list is redrawn there. */
    function refresh() { drawList(); }
    function refreshAll() { drawBar(); drawList(); }

    /* ---- which options each dropdown should offer ----
       A cascade, and strictly in that order: customer, then their
       machines, then the documents that exist for that machine. Each
       level narrows the one below it and nothing narrows the level
       above.

       The first version filtered every dropdown by every OTHER filter,
       which reads as symmetrical and sounds tidier. It was a trap:
       choosing a machine cut the customer list down to that machine's
       one owner, so there was no way to switch customer again without
       clearing everything. Its own test could not reach the third
       customer and timed out. */
    function optionsFor(field) {
      const seen = new Map();
      db.records.forEach((r) => {
        if (field !== 'customer' && recFilter.customer && r.fields.customer !== recFilter.customer) return;
        if (field === 'type' && recFilter.machine && r.fields.machineName !== recFilter.machine) return;
        const v = field === 'customer' ? r.fields.customer
                : field === 'machine'  ? r.fields.machineName
                : r.type;
        if (!v) return;
        seen.set(v, (seen.get(v) || 0) + 1);
      });
      return [...seen.entries()].sort((a, b) => (a[0] < b[0] ? -1 : 1));
    }

    function passes(r) {
      if (recFilter.customer && r.fields.customer !== recFilter.customer) return false;
      if (recFilter.machine  && r.fields.machineName !== recFilter.machine) return false;
      if (recFilter.type     && r.type !== recFilter.type) return false;
      return true;
    }

    function select(field, labelText, placeholder, opts, render) {
      const sel = el('select', { class: 'filter-select' });
      sel.appendChild(el('option', { value: '', text: T(placeholder) }));
      opts.forEach(([value, count]) => {
        const o = el('option', { value, text: render(value) + '  (' + count + ')' });
        if (recFilter[field] === value) o.selected = true;
        sel.appendChild(o);
      });
      sel.addEventListener('change', () => {
        recFilter[field] = sel.value;
        /* Moving up the cascade can strand what was chosen below it —
           another customer's machine, or a document type that machine
           has none of. Drop the stranded choice rather than leaving the
           technician staring at an empty list they cannot explain. */
        if (field === 'customer' && recFilter.machine) {
          const still = db.records.some((r) =>
            r.fields.machineName === recFilter.machine &&
            (!recFilter.customer || r.fields.customer === recFilter.customer));
          if (!still) recFilter.machine = '';
        }
        if ((field === 'customer' || field === 'machine') && recFilter.type) {
          if (!db.records.some((r) => r.type === recFilter.type
              && (!recFilter.customer || r.fields.customer === recFilter.customer)
              && (!recFilter.machine  || r.fields.machineName === recFilter.machine))) {
            recFilter.type = '';
          }
        }
        refreshAll();
      });
      return el('label', { class: 'filter-field' + (recFilter[field] ? ' is-set' : '') }, [
        el('span', { class: 'filter-label' }, [L(labelText)]),
        sel,
      ]);
    }

    function drawBar() {
      bar.innerHTML = '';

      bar.appendChild(select('customer',
        { en: 'Customer', th: 'ลูกค้า' },
        { en: 'All customers', th: 'ลูกค้าทั้งหมด' },
        optionsFor('customer'), (v) => v));

      bar.appendChild(select('machine',
        { en: 'Machine', th: 'เครื่องจักร' },
        { en: 'All machines', th: 'เครื่องจักรทั้งหมด' },
        optionsFor('machine'), (v) => v));

      bar.appendChild(select('type',
        { en: 'Document', th: 'ประเภทเอกสาร' },
        { en: 'All documents', th: 'เอกสารทุกประเภท' },
        optionsFor('type'),
        (v) => FORM_BY_TYPE[v] ? FORM_BY_TYPE[v].prefix + ' · ' + T(FORM_BY_TYPE[v].name) : v));

      const sortSel = el('select', { class: 'filter-select' });
      SORTS.forEach((s) => {
        const o = el('option', { value: s.key, text: T(s.label) });
        if (recFilter.sort === s.key) o.selected = true;
        sortSel.appendChild(o);
      });
      sortSel.addEventListener('change', () => { recFilter.sort = sortSel.value; drawList(); });
      bar.appendChild(el('label', { class: 'filter-field' }, [
        el('span', { class: 'filter-label' }, [L({ en: 'Sort by', th: 'เรียงตาม' })]),
        sortSel,
      ]));

      const active = !!(recFilter.customer || recFilter.machine || recFilter.type || state.search.trim());
      if (active) {
        bar.appendChild(el('button', {
          class: 'filter-clear',
          onclick: () => {
            recFilter.customer = recFilter.machine = recFilter.type = '';
            state.search = '';
            render();
          },
        }, [L({ en: 'Clear', th: 'ล้างตัวกรอง' })]));
      }
    }

    function currentList() {
      const q = state.search.trim().toLowerCase();
      let list = db.records.filter(passes);
      if (q) {
        list = list.filter((r) => {
          const hay = [r.docNo, r.fields.workNo, r.fields.serialNo, r.fields.customer,
                       r.fields.machineName, T(FORM_BY_TYPE[r.type] ? FORM_BY_TYPE[r.type].name : {})]
            .join(' ').toLowerCase();
          return hay.includes(q);
        });
      }
      return sortRecords(list, recFilter.sort);
    }

    function drawList() {
      const list = currentList();
      holder.innerHTML = '';

      const count = el('div', { class: 'filter-count' });
      if (list.length === db.records.length) {
        count.appendChild(L({ en: `Showing all ${list.length}`, th: `แสดงทั้งหมด ${list.length} รายการ` }));
      } else {
        count.appendChild(L({
          en: `Showing ${list.length} of ${db.records.length}`,
          th: `แสดง ${list.length} จาก ${db.records.length} รายการ`,
        }));
      }
      holder.appendChild(count);

      if (!list.length) {
        holder.appendChild(el('div', { class: 'empty' }, [
          L({ en: 'Nothing matches these filters.', th: 'ไม่พบเอกสารตามตัวกรองนี้' }),
        ]));
      } else {
        holder.appendChild(recordTable(list));
      }
      stampTableLabels(holder);
    }
  }

  function recordTable(list) {
    const wrap = el('div', { class: 'table-wrap' });
    const table = el('table');
    table.appendChild(
      el('thead', {}, el('tr', {}, [
        el('th', { text: 'Doc No.' }),
        el('th', { text: 'Type' }),
        el('th', { text: 'Work No.' }),
        el('th', { text: 'Machine / Customer' }),
        el('th', { text: 'Date' }),
        el('th', { text: 'Progress' }),
        el('th', { text: 'Status' }),
      ]))
    );
    const tbody = el('tbody');
    list.forEach((r) => {
      const def = FORM_BY_TYPE[r.type];
      const p = recordProgress(r);
      const meta = resultMeta(r);
      tbody.appendChild(
        el('tr', { class: 'clickable', onclick: () => go('form', { recordId: r.id }) }, [
          el('td', { html: `<strong>${escapeHTML(r.docNo)}</strong>` }),
          el('td', {}, el('span', { class: 'type-badge', style: `--accent:${def.accent}` }, [icon(def.icon, 14), el('span', { text: def.prefix })])),
          el('td', { text: r.fields.workNo || '—' }),
          el('td', {
            html:
              escapeHTML(r.fields.machineName || '—') +
              `<div style="font-size:12px;color:var(--text-dim)">${escapeHTML(r.fields.customer || '')}</div>`,
          }),
          el('td', { text: fmtDate(primaryDate(r)) }),
          el('td', { html: p.total ? `${p.done}/${p.total}` : '—' }),
          el('td', {}, el('span', { class: 'pill ' + pillClassFor(r), text: meta ? T(meta.label) : T(UI.draft) })),
        ])
      );
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    return wrap;
  }

  function primaryDate(r) {
    const f = r.fields || {};
    /* createdAt has always been a string in practice, but a record that
       arrives missing it (a partial write, an older export, a stub that
       slipped through) must not take the whole Records page down over a
       date. Fall back to updatedAt, then to nothing. */
    return f.inspectionDate || f.serviceDate || f.commissionDate || f.buildDate
      || String(r.createdAt || r.updatedAt || '').slice(0, 10);
  }

  function escapeHTML(s) {
    return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, (c) => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
  }

  /* ---------------- View: Machines ---------------- */

  function viewMachines(root) {
    const all = machineList();

    /* Filters are plain selects on purpose: on a tablet a native
       picker is faster and more reliable than any custom dropdown. */
    const customers = Array.from(new Set(all.map((m) => m.customer || '—'))).sort();
    if (state.filterCustomer && !customers.includes(state.filterCustomer)) state.filterCustomer = null;

    const byCustomer = state.filterCustomer
      ? all.filter((m) => (m.customer || '—') === state.filterCustomer)
      : all;

    if (state.filterMachine && !byCustomer.some((m) => m.key === state.filterMachine)) state.filterMachine = null;

    root.appendChild(
      el('div', { class: 'page-head' }, [
        el('div', {}, [
          el('h1', { class: 'page-title' }, [L({ en: 'Machines', th: 'เครื่องจักร' })]),
          el('div', { class: 'page-sub' }, [
            L({ en: 'Pick a customer, then a machine. Tap any service count to see the visits behind it.',
                th: 'เลือกลูกค้า แล้วเลือกเครื่องจักร แตะที่จำนวนครั้งบริการเพื่อดูรายละเอียดการเข้าบริการ' }),
          ]),
        ]),
      ])
    );

    /* ---- filter bar ---- */
    const bar = el('div', { class: 'filter-bar' });

    const custSel = el('select', {
      class: 'filter-select',
      onchange: (e) => { state.filterCustomer = e.target.value || null; state.filterMachine = null; render(); },
    });
    custSel.appendChild(el('option', { value: '', text: T({ en: 'All customers', th: 'ลูกค้าทั้งหมด' }) }));
    customers.forEach((c) => {
      const count = all.filter((m) => (m.customer || '—') === c).length;
      const o = el('option', { value: c, text: `${c}  (${count})` });
      if (state.filterCustomer === c) o.selected = true;
      custSel.appendChild(o);
    });

    const machSel = el('select', {
      class: 'filter-select',
      onchange: (e) => { state.filterMachine = e.target.value || null; render(); },
    });
    machSel.appendChild(el('option', { value: '', text: T({ en: 'All machines', th: 'เครื่องจักรทั้งหมด' }) }));
    byCustomer.forEach((m) => {
      const o = el('option', { value: m.key, text: `${m.workNo || '—'} · ${m.machineName || m.serialNo || '—'}` });
      if (state.filterMachine === m.key) o.selected = true;
      machSel.appendChild(o);
    });

    bar.appendChild(el('label', { class: 'filter-field' }, [
      el('span', { class: 'filter-label' }, [L({ en: 'Customer', th: 'ลูกค้า' })]), custSel,
    ]));
    bar.appendChild(el('label', { class: 'filter-field' }, [
      el('span', { class: 'filter-label' }, [L({ en: 'Machine', th: 'เครื่องจักร' })]), machSel,
    ]));
    if (state.filterCustomer || state.filterMachine) {
      bar.appendChild(el('button', {
        class: 'btn btn-sm', style: 'align-self:flex-end',
        onclick: () => { state.filterCustomer = null; state.filterMachine = null; render(); },
      }, [L({ en: 'Clear', th: 'ล้างตัวกรอง' })]));
    }
    root.appendChild(bar);

    const shown = state.filterMachine ? byCustomer.filter((m) => m.key === state.filterMachine) : byCustomer;

    if (!shown.length) {
      root.appendChild(el('div', { class: 'empty' }, [
        L({ en: 'No machines match. Fill in Work No. and Serial No. on a form to register one.',
            th: 'ไม่พบเครื่องจักรที่ตรงกับตัวกรอง กรอกเลขที่งานและหมายเลขเครื่องในเอกสารเพื่อลงทะเบียน' }),
      ]));
      return;
    }

    /* One machine chosen — show it in full rather than as a table row */
    if (shown.length === 1 && state.filterMachine) {
      root.appendChild(machineDetailCard(shown[0]));
      return;
    }

    const wrap = el('div', { class: 'table-wrap' });
    const table = el('table');
    table.appendChild(el('thead', {}, el('tr', {}, [
      el('th', {}, [L({ en: 'Work No.', th: 'เลขที่งาน' })]),
      el('th', {}, [L({ en: 'Machine', th: 'เครื่องจักร' })]),
      el('th', {}, [L({ en: 'Customer', th: 'ลูกค้า' })]),
      el('th', {}, [L({ en: 'Records', th: 'เอกสาร' })]),
      el('th', {}, [L({ en: 'Service visits', th: 'ครั้งที่เข้าบริการ' })]),
    ])));

    const tbody = el('tbody');
    shown.forEach((m) => {
      const counts = {};
      m.records.forEach((r) => { counts[r.type] = (counts[r.type] || 0) + 1; });
      const badges = el('div', { style: 'display:flex;gap:5px;flex-wrap:wrap' });
      FORM_TYPES.forEach((def) => {
        if (!counts[def.type]) return;
        badges.appendChild(el('span', { class: 'type-badge', style: `--accent:${def.accent}` },
          [icon(def.icon, 14), el('span', { text: `${def.prefix} ${counts[def.type]}` })]));
      });

      const services = m.records.filter((r) => r.type === 'SERVICE');
      const open = state.openMachine === m.key;

      const row = el('tr', {}, [
        el('td', { class: 'clickable', onclick: () => go('machine', { machineKey: m.key }) },
          el('strong', { text: m.workNo || '—' })),
        el('td', { class: 'clickable', onclick: () => go('machine', { machineKey: m.key }), html:
          `${escapeHTML(m.machineName || '—')}<div style="font-size:12.5px;color:var(--text-dim)">${escapeHTML(m.serialNo || '')}</div>` }),
        el('td', { text: m.customer || '—' }),
        el('td', {}, badges),
        el('td', {}, services.length
          ? el('button', {
              class: 'count-btn' + (open ? ' is-open' : ''),
              'aria-expanded': open ? 'true' : 'false',
              title: T({ en: 'Show these service visits', th: 'ดูรายการเข้าบริการ' }),
              onclick: () => { state.openMachine = open ? null : m.key; render(); },
            }, [
              el('span', { class: 'count-num', text: String(services.length) }),
              el('span', { class: 'count-caret', text: open ? '▾' : '▸' }),
            ])
          : el('span', { style: 'color:var(--text-faint)', text: '0' })),
      ]);
      tbody.appendChild(row);

      if (open && services.length) {
        tbody.appendChild(el('tr', { class: 'detail-row' }, [
          el('td', { colspan: '5' }, [serviceListFor(m, services)]),
        ]));
      }
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    root.appendChild(wrap);
  }

  /* The visits behind a service count — each one opens its report. */
  function serviceListFor(machine, services) {
    const box = el('div', { class: 'service-panel' });
    box.appendChild(el('div', { class: 'service-panel-head' }, [
      el('strong', { text: machine.machineName || machine.workNo || '—' }),
      el('span', { class: 'service-panel-sub', text: [machine.workNo, machine.serialNo].filter(Boolean).join(' · ') }),
    ]));

    const causes = recurringCauses(services);
    if (causes.length) {
      box.appendChild(el('div', { class: 'service-panel-note' }, [
        el('span', { style: 'color:var(--text-dim)' }, [L({ en: 'Usual cause:', th: 'สาเหตุที่พบบ่อย:' })]),
        el('span', { class: 'cause-chip', style: 'margin-left:8px', text: T(causes[0].label) }),
        el('span', { style: 'color:var(--text-dim);margin-left:8px', text: `× ${causes[0].count}` }),
      ]));
    }

    const tw = el('div', { class: 'table-wrap' });
    const t = el('table');
    t.appendChild(el('thead', {}, el('tr', {}, [
      el('th', {}, [L({ en: 'Date', th: 'วันที่' })]),
      el('th', { text: 'Doc No.' }),
      el('th', {}, [L({ en: 'Type', th: 'ประเภท' })]),
      el('th', {}, [L({ en: 'Technician', th: 'ช่าง' })]),
      el('th', {}, [L({ en: 'Root cause', th: 'สาเหตุ' })]),
      el('th', {}, [L({ en: 'Result', th: 'ผล' })]),
    ])));
    const tb = el('tbody');
    services.slice().sort((a, b) => (primaryDate(b) > primaryDate(a) ? 1 : -1)).forEach((r) => {
      const meta = resultMeta(r);
      const rc = recurringCauses([r]);
      tb.appendChild(el('tr', { class: 'clickable', onclick: () => go('form', { recordId: r.id }) }, [
        el('td', { text: fmtDate(primaryDate(r)) }),
        el('td', { html: `<strong>${escapeHTML(r.docNo)}</strong>` }),
        el('td', { text: T(serviceTypeLabelFor(r.fields.serviceType)) }),
        el('td', { text: r.fields.technician || '—' }),
        el('td', {}, rc.length
          ? el('span', { class: 'cause-chip', text: T(rc[0].label) })
          : el('span', { style: 'color:var(--text-faint)', text: '—' })),
        el('td', {}, el('span', { class: 'pill ' + pillClassFor(r), text: meta ? T(meta.label) : T(UI.draft) })),
      ]));
    });
    t.appendChild(tb);
    tw.appendChild(t);
    box.appendChild(tw);
    return box;
  }

  function serviceTypeLabelFor(value) {
    const o = serviceTypeOptions().find((x) => x.value === value);
    return o ? o.label : { en: value || '—', th: value || '—' };
  }

  /* Everything about one machine on a single card. */
  function machineDetailCard(m) {
    const services = m.records.filter((r) => r.type === 'SERVICE');
    const panel = el('section', { class: 'panel' });

    panel.appendChild(el('header', { class: 'panel-head' }, [
      el('div', {}, [
        el('h2', { class: 'panel-title', text: m.machineName || m.workNo || '—' }),
        el('div', { class: 'panel-sub', text: [m.workNo, m.serialNo, m.customer].filter(Boolean).join('  ·  ') }),
      ]),
      el('div', { class: 'btn-row' }, [
        el('button', { class: 'btn btn-sm', onclick: () => go('machine', { machineKey: m.key }) },
          [L({ en: 'Full history', th: 'ดูประวัติทั้งหมด' })]),
        el('button', {
          class: 'btn btn-sm btn-primary',
          onclick: () => createAndOpen('SERVICE', {
            workNo: m.workNo, serialNo: m.serialNo, machineName: m.machineName, customer: m.customer,
          }),

      ]),
    ]));

    const counts = {};
    m.records.forEach((r) => { counts[r.type] = (counts[r.type] || 0) + 1; });

      grid.appendChild(el('div', { class: 'stat', style: `--stat-accent:${def.accent}` }, [

    panel.appendChild(body);
    return panel;

  /* ---------------- View: Backup ---------------- */

  function viewData(root) {
    if (!backupUnlocked) return viewDataLocked(root);

    root.appendChild(

  function download(filename, content, mime) {
    const blob = new Blob([content], { type: mime || 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = el('a', { href: url, download: filename });
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }

  function importJSON(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data || !Array.isArray(data.records)) throw new Error('bad format');
        const existing = new Set(db.records.map((r) => r.id));
        let added = 0;
        data.records.forEach((r) => {
          /* A backup exported after a cloud round trip is missing the same
             empty containers Firebase dropped — normalise on the way in. */
          const rec = normaliseRecord(r);
          if (rec && !existing.has(rec.id)) {
            /* Restoring a backup is a deliberate act, so it outranks an
               earlier deletion. Without clearing the marker the record
               would appear, sync, and be deleted again a second later —
               which would look like the import silently failing. */
            if (db.meta.tombstones && db.meta.tombstones[rec.id]) {
              delete db.meta.tombstones[rec.id];
              rec.updatedAt = new Date().toISOString();
            }
            db.records.push(rec);
            added++;
          }
        });
        db.meta.peopleSeeded = false;   /* pick up names from the imported records */
        people();
        saveDB();
        toast((lang === 'th' ? 'นำเข้าแล้ว ' : 'Imported ') + added + (lang === 'th' ? ' รายการ' : ' records'));
        render();
      } catch (err) {
        toast(lang === 'th' ? 'ไฟล์ไม่ถูกต้อง' : 'Invalid backup file', true);
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  }

  function touch(rec) {

  function deleteRecord(rec) {
    if (!confirm(T(UI.confirmDelete))) return;
    /* Leave a marker, not a hole.

       Simply removing the record from the shared database tells the
       other tablets nothing: they are holding a copy that nothing ever
       contradicts, so it stays on their screen — and the next time one
       of them reconnects it uploads that copy again and the document
       comes back from the dead. A tablet that was switched off during
       the delete can only ever learn about it from something that is
       still there when it wakes up.

       So a deletion is a small record of its own — id, type, docNo and
       the moment it happened — which travels like any other change and
       is settled by the same last-write-wins rule. saveDB() pushes it. */
    db.meta.tombstones = db.meta.tombstones || {};
    db.meta.tombstones[rec.id] = {
      type: rec.type,
      docNo: rec.docNo,
      updatedAt: new Date().toISOString(),
    };
    db.records = db.records.filter((r) => r.id !== rec.id);
    saveDB();
    go('records');
  }

  function renderFields(body, rec, def, section) {
    const grid = el('div', { class: 'field-grid' });
    section.fields.forEach((f) => {
      const wrap = el('div', { class: 'field', 'data-field': f.key });
      wrap.appendChild(el('label', {}, [
        L(f.label),
        f.required ? el('span', { class: 'req', text: ' *' }) : null,
        f.unit ? el('span', { class: 'unit', text: '(' + f.unit + ')' }) : null,
      ]));

      let input;

      if (f.type === 'person') {
        input = personField(rec, f, wrap);

      } else if (f.type === 'select') {
        input = el('select', {
          onchange: (e) => { rec.fields[f.key] = e.target.value; touch(rec); markField(wrap, rec, f); },
        });
        input.appendChild(el('option', { value: '', text: '—' }));
        f.options.forEach((o) => {
          const opt = el('option', { value: o.value, text: T(o.label) });
          if (rec.fields[f.key] === o.value) opt.selected = true;
          input.appendChild(opt);
        });

      } else if (f.type === 'date') {
        input = dateField({
          value: rec.fields[f.key] || '',
          onCommit: (iso) => {
            rec.fields[f.key] = iso;
            if (f.identity) autofillIdentity(rec, f.key, iso);
            touch(rec);
            markField(wrap, rec, f);
          },
        });

      } else {
        input = el('input', {
          type: f.type || 'text',
          placeholder: f.placeholder || '',
          value: rec.fields[f.key] || '',
          step: f.type === 'number' ? 'any' : null,
          oninput: (e) => { rec.fields[f.key] = e.target.value; markField(wrap, rec, f); },
          onchange: (e) => {
            rec.fields[f.key] = e.target.value;
            if (f.identity) autofillIdentity(rec, f.key, e.target.value);
            touch(rec);
            markField(wrap, rec, f);
          },
        });

        /* Native suggestion list: it offers what has been typed before
           without preventing a brand-new value. */
        if (f.suggest) {
          const values = suggestionsFor(f.key);
          if (values.length) {
            const listId = 'dl-' + f.key;
            input.setAttribute('list', listId);
            const dl = el('datalist', { id: listId });
            values.forEach((v) => dl.appendChild(el('option', { value: v })));
            wrap.appendChild(dl);
          }
        }
      }

      wrap.appendChild(input);
      markField(wrap, rec, f);
      grid.appendChild(wrap);
    });
    body.appendChild(grid);
  }

        rec.fields[f.key] = v;

        touch(rec);
        refresh();

    const note = el('div', { class: 'person-note' });

      sel.innerHTML = '';

        if ((rec.fields[f.key] || '') === p.name) o.selected = true;
        sel.appendChild(o);
      });
      /* A name typed before this register existed still has to show */
      const current = rec.fields[f.key];
      if (current && !people().some((p) => p.name === current)) {
        const o = el('option', { value: current, text: current });
        o.selected = true;
        sel.appendChild(o);
      }
      sel.appendChild(el('option', { value: '__add', text: T({ en: '+ Add a person…', th: '+ เพิ่มรายชื่อ…' }) }));

      const pos = positionOf(rec, f.key);
      note.textContent = pos ? pos : '';
      note.style.display = pos ? '' : 'none';
    }

    refresh();
    holder.appendChild(sel);
    holder.appendChild(note);
    holder._refresh = refresh;
    return holder;
  }

  /* Choosing one known identity value fills in the rest. */
  function autofillIdentity(rec, key, value) {
    const match = machineMatching(key, value, rec.id);
    if (!match) return;
    let filled = 0;
    IDENTITY_KEYS.forEach((k) => {
      if (k === key) return;
      const from = (match.fields[k] || '').trim();
      if (!from) return;
      if ((rec.fields[k] || '').trim() === from) return;
      rec.fields[k] = from;
      filled++;
    });
    if (filled) {
      touch(rec);
      toast(T({ en: 'Machine details filled in', th: 'เติมข้อมูลเครื่องจักรให้แล้ว' }));
      render();
    }
  }

  /* Green when satisfied, blinking red when the form has been
     submitted and this one is still empty. */
  /* ---- placing floating layers ----
     A popup fixed to the viewport has to reconcile two coordinate
     systems, and mixing them is silent and wrong.

       getBoundingClientRect()  VISUAL px — zoom already applied
       offsetWidth / style.left LAYOUT px — inside the zoomed <html>

     At --ui-scale 1.1 a tooltip clamped with innerWidth still painted
     67px past the right edge of a 1440px screen, because the clamp was
     done in one space and the write landed in the other. Convert once,
     here, and every popup in the app inherits the fix. */
  function uiScale() {
    const z = parseFloat(getComputedStyle(document.documentElement).zoom);
    return z && isFinite(z) && z > 0 ? z : 1;
  }

  function placeFloating(node, anchor, opts) {
    opts = opts || {};
    const s = uiScale();
    const w = node.offsetWidth * s;
    const h = node.offsetHeight * s;
    const gap = opts.gap == null ? 10 : opts.gap;
    const pad = 8;

    let left = opts.align === 'start'
      ? anchor.left
      : anchor.left + anchor.width / 2 - w / 2;
    left = Math.max(pad, Math.min(left, window.innerWidth - w - pad));

    /* Preferred side first, then flip, then clamp — so a popup taller
       than the space on either side still lands fully on screen. */
    let top = opts.below ? anchor.bottom + gap : anchor.top - h - gap;
    if (top < pad) top = anchor.bottom + gap;
    if (top + h > window.innerHeight - pad) top = anchor.top - h - gap;
    top = Math.max(pad, Math.min(top, window.innerHeight - h - pad));

    node.style.left = (left / s) + 'px';
    node.style.top = (top / s) + 'px';
  }

  /* ---- chart tooltip ----
     Lives on <body>, not inside the plot. As a child of the panel it was
     clipped by the panel's own rounded overflow, and the clamp bounded
     its CENTRE — so half of a 158px tooltip still hung over the edge on
     the last bar of the chart. Positioned against the viewport instead,
     measured after it has content, and flipped below the bar when there
     is no room above. */
  let chartTipEl = null;
  function chartTip() {
    if (!chartTipEl || !chartTipEl.isConnected) {
      chartTipEl = el('div', { class: 'chart-tip', role: 'status' });
      document.body.appendChild(chartTipEl);
    }
    return chartTipEl;
  }
  function hideChartTip() { if (chartTipEl) chartTipEl.classList.remove('show'); }
  function placeChartTip(tip, anchor) {
    tip.classList.add('measuring');
    placeFloating(tip, anchor, { gap: 10 });
    tip.classList.remove('measuring');
    tip.classList.add('show');
  }
  window.addEventListener('scroll', hideChartTip, true);
  window.addEventListener('resize', hideChartTip);

  function markField(wrap, rec, f) {
    if (!wrap) return;
    const filled = String(rec.fields[f.key] || '').trim() !== '';
    wrap.classList.toggle('is-ok', !!(f.required && filled));
    wrap.classList.toggle('is-missing', !!(f.required && !filled && rec._showErrors));
  }

  /* ---- checklist / condition ---- */  /* ---- checklist / condition ---- */

  /* ---- performance (target vs actual, auto verdict) ---- */

  function renderPerformance(body, rec, def, section) {
    if (!rec.perf[section.id]) rec.perf[section.id] = {};
    const vals = rec.perf[section.id];

    body.appendChild(
      el('div', { class: 'perf-row', style: 'font-size:11.5px;letter-spacing:.5px;color:var(--text-faint);text-transform:uppercase' }, [
        el('div', { text: 'Test' }),
        el('div', { text: T(UI.target) }),
        el('div', { text: T(UI.actual) }),
        el('div', { text: T(UI.result) }),
      ])
    );

    section.items.forEach((p) => {
      const verdict = el('div', { class: 'verdict none', text: '—' });
      const updateVerdict = () => {
        const v = parseFloat(vals[p.key]);
        const limit = parseFloat(String(p.target).replace(/[^0-9.]/g, ''));
        if (isNaN(v) || isNaN(limit)) {
          verdict.className = 'verdict none';
          verdict.textContent = '—';
          return;
        }
        const ok = p.better === 'lower' ? v <= limit : v >= limit;
        verdict.className = 'verdict ' + (ok ? 'pass' : 'fail');
        verdict.textContent = ok ? T(UI.pass) : T(UI.fail);
      };

      body.appendChild(
        el('div', { class: 'perf-row' }, [
          el('div', {}, [
            el('div', { class: 'label-en', text: p.label.en }),
            el('div', { class: 'label-th th', text: p.label.th }),

            onchange: (e) => { vals[p.key] = e.target.value; updateVerdict(); touch(rec); },

  /* ---- photos ---- */

  function compressImage(file, maxDim, quality) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          const w = Math.round(img.width * scale);
          const h = Math.round(img.height * scale);
          const canvas = el('canvas');
          canvas.width = w;
          canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function photoSlot(rec, store, key, label, onRemove) {
    const slot = el('div', { class: 'photo-slot' });
    if (label) {
      slot.appendChild(el('div', { class: 'ps-head' }, [
        el('div', { class: 'label-en', text: label.en }),
        el('div', { class: 'label-th th', text: label.th }),
      ]));
    }

    const fileInput = el('input', {
      type: 'file',
      accept: 'image/*',
      capture: 'environment',
      style: 'display:none',
      onchange: async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        try {
          store[key] = await compressImage(file, 1200, 0.72);
          touch(rec);
          render();
        } catch (err) {
          toast(lang === 'th' ? 'อ่านรูปไม่สำเร็จ' : 'Could not read image', true);
        }
        e.target.value = '';
      },
    });
    slot.appendChild(fileInput);

    if (store[key]) {
      slot.appendChild(el('img', { src: store[key], alt: label ? label.en : 'photo' }));
      slot.appendChild(
        el('div', { class: 'photo-actions no-print' }, [
          el('button', { class: 'btn btn-sm', onclick: () => fileInput.click() }, [L({ en: 'Replace', th: 'เปลี่ยนรูป' })]),
          el('button', {
            class: 'btn btn-sm btn-danger',
            onclick: () => {
              if (onRemove) onRemove();
              else delete store[key];
              touch(rec);
              render();
            },
          }, [L(UI.remove)]),
        ])
      );
    } else {
      slot.appendChild(
        el('div', { class: 'photo-drop', onclick: () => fileInput.click() }, [
          el('div', {}, [
            el('div', { style: 'font-size:22px', text: '📷' }),
            el('div', { text: lang === 'th' ? 'แตะเพื่อถ่าย / เลือกรูป' : 'Tap to take / choose photo' }),
          ]),
        ])
      );
    }
    return slot;
  }

    if (section.allowFree) {

  /* ---- cost table (auto total) ---- */

  function renderCostTable(body, rec, def, section) {
    if (!rec.tables[section.id]) rec.tables[section.id] = [];
    const rows = rec.tables[section.id];

    const totalCell = el('td', { style: 'font-weight:700;text-align:right' });

      const sum = rows.reduce((acc, r) => acc + (parseFloat(r.qty) || 0) * (parseFloat(r.unitPrice) || 0), 0);
      totalCell.textContent = '฿' + sum.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

        const r = rows[i];
        if (!r) return;
        const line = (parseFloat(r.qty) || 0) * (parseFloat(r.unitPrice) || 0);

      });
    };

    const wrap = el('div', { class: 'table-wrap' });
    const table = el('table');
    table.appendChild(
      el('thead', {}, el('tr', {}, [
        ...section.columns.map((c) => el('th', { style: c.width ? `width:${c.width}` : null }, [L(c.label)])),
        el('th', { style: 'text-align:right' }, [L({ en: 'Total', th: 'รวม' })]),
        el('th', { class: 'no-print', style: 'width:46px' }),
      ]))
    );
    const tbody = el('tbody');
    rows.forEach((row, idx) => {
      tbody.appendChild(
        el('tr', {}, [
          ...section.columns.map((c) =>
            el('td', {}, c.type === 'date'
              ? dateField({
                  inputClass: 'cell-input',
                  value: row[c.key] || '',
                  onCommit: (iso) => { row[c.key] = iso; recalc(); touch(rec); },

                  type: c.type || 'text',
                  step: c.type === 'number' ? 'any' : null,
                  value: row[c.key] || '',

  /* ---- result (with safety gate) ---- */

  function renderResult(body, rec, def, section) {
    const blocked = hasSafetyFail(rec);
    if (blocked) body.appendChild(el('div', { class: 'alert-danger' }, [L(UI.safetyBlock)]));

    const fails = failedItems(rec);
    if (fails.length) {
      const list = el('div', { style: 'margin-bottom:15px;font-size:13px' }, [
        el('div', { style: 'color:var(--text-dim);margin-bottom:7px' }, [
          L({ en: 'Items not passed:', th: 'รายการที่ไม่ผ่าน:' }),
        ]),
      ]);
      fails.forEach((f) => {
        list.appendChild(
          el('div', { style: 'padding:5px 0;border-bottom:1px solid var(--line-soft)' , text:
            `${f.item.code} — ${T(f.item.label)}${f.remark ? '  ·  ' + f.remark : ''}` })
        );
      });
      body.appendChild(list);
    }

    const row = el('div', { class: 'result-row' + (!rec.result && rec._showErrors ? ' is-missing' : '') });
    section.options.forEach((o) => {
      /* A failed safety item blocks only the "all clear" option */
      const isBlocked = blocked && o.tone === 'good';
      const on = rec.result === o.value;
      row.appendChild(
        el('button', {
          class: (on ? 'on ' : '') + (isBlocked ? 'blocked' : ''),
          style: on ? `border-color:${o.color};background:${o.color}22;color:${o.color}` : '',
          onclick: () => {
            if (isBlocked) { toast(T(UI.safetyBlock), true); return; }
            rec.result = on ? null : o.value;
            rec.status = rec.result ? 'completed' : 'draft';
            touch(rec);
            render();
          },
        }, [
          el('span', { class: 'dot', style: `background:${o.color}` }),
          el('span', {}, [
            el('span', { class: 'label-en', text: o.label.en }),
            el('span', { class: 'label-th th', text: o.label.th }),
          ]),
        ])
      );
    });
    body.appendChild(row);
  }

  /* ---- signatures ---- */

  function renderSignoff(body, rec, def, section) {
    const grid = el('div', { class: 'sign-grid' });
    section.roles.forEach((role) => {
      if (!rec.signatures[role.key]) rec.signatures[role.key] = { data: '', name: '', date: '' };
      const sig = rec.signatures[role.key];

      const canvas = el('canvas', { class: 'sign-pad', width: 520, height: 130 });
      const hasName = String(sig.name || '').trim() !== '';
      const card = el('div', {
        class: 'sign-card' + (hasName ? ' is-ok' : (rec._showErrors ? ' is-missing' : '')),
        'data-role': role.key,
      }, [
        el('h4', {}, [
          el('span', { class: 'label-en', text: role.label.en }),
          el('span', { class: 'label-th th', text: ' ' + role.label.th }),
        ]),
        canvas,
        el('div', { class: 'sign-meta' }, [
          el('input', {
            class: 'cell-input',
            placeholder: T(UI.name),
            value: sig.name || '',
            oninput: (e) => {
              sig.name = e.target.value;
              const ok = e.target.value.trim() !== '';
              card.classList.toggle('is-ok', ok);
              card.classList.toggle('is-missing', !ok && !!rec._showErrors);
            },
            onchange: (e) => { sig.name = e.target.value; touch(rec); },
          }),
          dateField({
            inputClass: 'cell-input',
            value: sig.date || '',
            onCommit: (iso) => { sig.date = iso; touch(rec); },
          }),
        ]),
        el('div', { class: 'sign-foot no-print' }, [
          el('button', {
            class: 'btn btn-sm',
            onclick: () => {
              sig.data = '';
              const ctx = canvas.getContext('2d');
              ctx.fillStyle = '#fff';
              ctx.fillRect(0, 0, canvas.width, canvas.height);
              touch(rec);
            },
          }, [L(UI.clear)]),
        ]),
      ]);
      grid.appendChild(card);
      setupSignaturePad(canvas, sig, rec);
    });
    body.appendChild(grid);
  }

  function setupSignaturePad(canvas, sig, rec) {
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#111';

    if (sig.data) {
      const img = new Image();
      img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      img.src = sig.data;
    }

    let drawing = false;

    function pos(e) {
      const rect = canvas.getBoundingClientRect();
      const point = e.touches ? e.touches[0] : e;
      return {
        x: (point.clientX - rect.left) * (canvas.width / rect.width),
        y: (point.clientY - rect.top) * (canvas.height / rect.height),
      };
    }

    function start(e) {
      e.preventDefault();
      drawing = true;
      const p = pos(e);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
    }
    function move(e) {
      if (!drawing) return;
      e.preventDefault();
      const p = pos(e);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }
    function end() {
      if (!drawing) return;
      drawing = false;
      sig.data = canvas.toDataURL('image/png');
      touch(rec);
    }

    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
    canvas.addEventListener('touchstart', start, { passive: false });
    canvas.addEventListener('touchmove', move, { passive: false });
    canvas.addEventListener('touchend', end);
  }

  /* ---------------- Cloud ----------------
     Optional. With no Firebase config the app is exactly what it has
     always been: one device, no network. With a config it also syncs
     to a database every tablet shares — but only for a signed-in user,
     because the app sits on a public URL. */

  function cloudLabel(st) {
    if (st.status === 'live') return { en: 'Synced', th: 'ซิงก์แล้ว' };
    if (st.status === 'connecting') return { en: 'Connecting…', th: 'กำลังเชื่อมต่อ…' };
    if (st.status === 'offline') return { en: 'This device only', th: 'เฉพาะเครื่องนี้' };
    if (st.status === 'error') return { en: 'Sync problem', th: 'ซิงก์มีปัญหา' };
    return { en: 'This device only', th: 'เฉพาะเครื่องนี้' };
  }

  function renderCloudBadge() {
    const host = $('#cloudBadge');
    if (!host) return;
    host.innerHTML = '';
    if (typeof FNCloud === 'undefined' || !FNCloud.configured()) { host.style.display = 'none'; return; }
    host.style.display = '';

    const st = FNCloud.state;
    host.className = 'cloud-badge is-' + st.status;
    host.appendChild(el('span', { class: 'cloud-dot' }));
    host.appendChild(el('span', { class: 'cloud-text', text: T(cloudLabel(st)) }));

    /* A tablet has no hover, so a problem the badge only carries in its
       tooltip is a problem nobody sees. When the database has actually
       refused a save, show the reason in full, on screen, under the
       badge — that is the difference between "it just doesn't sync" and
       a message we can act on. */
    if (st.status === 'error' && st.message) {
      host.appendChild(el('span', { class: 'cloud-err', text: st.message }));
    }

    /* Sign-in is automatic, so the badge is a status light, not a
       control. Nothing here for a technician to press or get wrong. */
    host.title = T(cloudTitle(st));
  }

  function cloudTitle(st) {
    if (st.status === 'live') {
      return { en: 'Records are shared with the other tablets.',
               th: 'ข้อมูลถูกแชร์กับแท็บเล็ตเครื่องอื่นแล้ว' };
    }
    if (st.status === 'connecting') {
      return { en: 'Connecting to the shared database…', th: 'กำลังเชื่อมต่อฐานข้อมูลกลาง…' };
    }
    if (st.status === 'error') {
      return { en: st.message || 'The shared database refused this tablet.',
               th: 'ฐานข้อมูลกลางปฏิเสธเครื่องนี้' };
    }
    return { en: 'No connection. Your work is safe on this tablet and will sync when the signal returns.',
             th: 'ไม่มีการเชื่อมต่อ งานถูกเก็บไว้ในเครื่องนี้และจะซิงก์เมื่อสัญญาณกลับมา' };
  }

  function stampBuild() {
    const note = document.querySelector('.foot-note span');
    if (note) note.textContent = note.textContent.replace(/^v[\d.]+/, 'v1.2 · ' + BUILD_ID);
  }

  /* An update arrived while someone was typing, and is waiting to be
     shown. Held here rather than dropped — the record objects already
     carry the new values, only the screen is behind. */
  let pendingRemote = false;

  function isTypingInForm() {
    const a = document.activeElement;
    if (!a || !a.closest) return false;
    if (!a.closest('.form-shell')) return false;
    return /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
  }

  /* A form can be a long page, and a technician half-way down a
     checklist should not be thrown back to the top just because another
     tablet saved something. */
  function redrawKeepingPlace() {
    const y = window.scrollY;
    render();
    window.scrollTo(0, y);
  }

  /* The moment they leave the field, catch the screen up. */
  document.addEventListener('focusout', () => {
    if (!pendingRemote) return;
    setTimeout(() => {
      /* A blur that just moves to the next box is not "finished" — only
         act once focus has genuinely left the form. */
      if (!pendingRemote || isTypingInForm()) return;
      pendingRemote = false;
      if (state.view === 'form') redrawKeepingPlace(); else render();
      toast(lang === 'th' ? 'แสดงการแก้ไขจากเครื่องอื่นแล้ว' : 'Updates from other devices are now shown');
    }, 150);
  }, true);

  function startCloud() {
    if (typeof FNCloud === 'undefined') return;
    FNCloud.onChange(() => { renderCloudBadge(); });
    FNCloud.init({
      getDB: () => db,
      setDB: (next) => {
        /* Records arriving from the cloud have had their empty containers
           stripped by Firebase. Put them back before anything renders. */
        db = normaliseDB(next);
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); } catch (e) { /* full */ }
      },
      onData: (n) => {
        /* An update has arrived from another device. The only thing that
           must never happen is rebuilding a form under a technician's
           finger: render() replaces the whole screen, so a half-typed
           value and the caret would go with it.

           But that is a narrow case, and holding the whole screen back
           for it was far too blunt. Waiting also means the screen keeps
           showing values that are no longer true, which reads exactly
           like the app having failed to sync. So wait only when there is
           something to lose:

             - a change to a document we are not looking at  -> draw it
             - the open document, nobody typing              -> draw it
             - the open document while a field has focus     -> hold,
               and draw it the moment they finish with that field. */
        const say = () => toast(lang === 'th'
          ? `รับข้อมูลจากเครื่องอื่น ${n} รายการ`
          : `${n} update${n === 1 ? '' : 's'} from other devices`);

        if (state.view === 'form') {
          /* Whether the change is to THIS document or another one makes
             no difference here: render() rebuilds the entire screen, so
             any redraw takes the box being typed in with it. The only
             question that matters is whether a field has focus. (A first
             attempt keyed this on which record changed, and the
             mid-typing test caught it destroying the box for an
             unrelated update.) */
          if (isTypingInForm()) {
            pendingRemote = true;
            toast(lang === 'th'
              ? `มีการแก้ไขจากเครื่องอื่น ${n} รายการ — จะแสดงเมื่อพิมพ์เสร็จ`
              : `${n} update${n === 1 ? '' : 's'} from another device — shown when you finish typing`);
            return;
          }
          redrawKeepingPlace();
          say();
          return;
        }
        render();
        say();
      },
    }).then(() => renderCloudBadge());
  }

  /* ---------------- Pinch-to-shrink ----------------

     minimum-scale=1.1 in the viewport tag holds on Android. iOS Safari
     ignores viewport zoom limits entirely — Apple stopped honouring
     user-scalable, maximum-scale and minimum-scale in iOS 10 because
     sites were using them to trap people — so on an iPad a two-finger
     pinch still shrinks the page below the scale it is drawn at and the
     layout comes apart.

     The only lever left on iOS is the gesture events, and they are used
     narrowly here: a pinch that SHRINKS is cancelled, a pinch that
     MAGNIFIES is left alone. Reading a worn serial number off a
     nameplate in a dim plant room is exactly what zoom is for, and
     taking that away would cost more than the layout it protects.

     touch-action: manipulation on the body drops the double-tap-to-zoom
     gesture as well, which is the other way a scale gets stuck. */

  function blockPinchShrink() {
    let opening = 1;
    const shrinking = (e) => typeof e.scale === 'number' && e.scale < 0.995;

    /* gesture* are WebKit-only, which is precisely where this is needed. */
    document.addEventListener('gesturestart', (e) => { opening = e.scale || 1; }, { passive: false });
    document.addEventListener('gesturechange', (e) => { if (shrinking(e)) e.preventDefault(); }, { passive: false });
    document.addEventListener('gestureend',   (e) => { if (shrinking(e)) e.preventDefault(); }, { passive: false });

    /* Chromium on a touch screen honours minimum-scale, so nothing more
       is needed there; this is the belt for engines that do neither.
       Two fingers moving closer together, and only that, is cancelled —
       one finger still scrolls and two fingers spreading still zoom. */
    let start = null;
    const span = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
    document.addEventListener('touchstart', (e) => {
      start = e.touches.length === 2 ? span(e.touches) : null;
    }, { passive: true });
    document.addEventListener('touchmove', (e) => {
      if (e.touches.length !== 2 || start === null) return;
      if (span(e.touches) < start - 8 && e.cancelable) e.preventDefault();
    }, { passive: false });
    document.addEventListener('touchend', () => { start = null; }, { passive: true });
  }

  /* ---------------- Build stamp & update check ----------------

     GitHub Pages serves this page with Cache-Control: max-age=600, and
     phones hold onto that far longer than ten minutes — a tablet can sit
     on yesterday's build for a whole shift. Three separate bug reports
     turned out to be a device looking at an old copy, and neither of us
     could tell, because a stale app looks exactly like a broken one.

     So the app checks its own source for a newer stamp and says so.
     Cheap: one small request, ignored entirely when offline, and
     throttled so switching tabs does not hammer it. */

  const BUILD_ID = '20260825-025357';
  let lastUpdateCheck = 0;

  async function checkForUpdate() {
    if (location.protocol === 'file:') return;          /* offline copy */
    if (Date.now() - lastUpdateCheck < 5 * 60 * 1000) return;
    lastUpdateCheck = Date.now();
    try {
      const res = await fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) return;
      const text = await res.text();
      const m = text.match(/BUILD_ID\s*=\s*'([^']+)'/);
      if (m && m[1] && m[1] !== BUILD_ID) showUpdateBanner();
    } catch (e) { /* no signal — say nothing */ }
  }

  function showUpdateBanner() {
    if ($('#updateBanner')) return;
    const bar = el('div', { class: 'update-banner', id: 'updateBanner' }, [
      el('span', {}, [L({ en: 'A newer version is available.',
                          th: 'มีเวอร์ชันใหม่พร้อมใช้งาน' })]),
      el('button', {
        class: 'btn btn-primary btn-sm',
        onclick: () => {
          /* Cache-busting the URL is what actually gets a phone off a
             stale copy; a plain reload can be served from cache again. */
          const u = new URL(location.href);
          u.searchParams.set('v', Date.now());
          location.replace(u.toString());
        },
      }, [L({ en: 'Update now', th: 'อัปเดตเลย' })]),
      el('button', {
        class: 'btn btn-sm',
        onclick: () => bar.remove(),
      }, [L({ en: 'Later', th: 'ภายหลัง' })]),
    ]);
    document.body.appendChild(bar);
  }

  /* ---------------- Dates ----------------

     Every date in this app is DD/MM/YYYY, on every device.

     `<input type="date">` cannot do that. It renders in the browser's
     own locale, so a Chrome set to en-US shows 08/20/2026 while the
     record beside it prints 20/08/2026 — and no CSS or attribute can
     change it. On a shop floor where one tablet is Thai, one is English
     and one came from a US-configured laptop, the same form shows three
     different formats and 08/09 is genuinely ambiguous.

     So: a text field we control, plus our own small calendar.

     What does NOT change is storage. Records keep the ISO YYYY-MM-DD
     they always held, because that is what sorts correctly, what the
     cloud merge compares, and what every record already on a tablet
     contains. Only the reading and the typing are ours. */

  const MONTH_NAMES = {
    en: ['January','February','March','April','May','June',
         'July','August','September','October','November','December'],
    th: ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
         'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'],
  };
  const DOW_NAMES = {
    en: ['Mo','Tu','We','Th','Fr','Sa','Su'],
    th: ['จ','อ','พ','พฤ','ศ','ส','อา'],
  };

  function isoToDMY(iso) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ''));
    return m ? `${m[3]}/${m[2]}/${m[1]}` : '';
  }

  /* Deliberately forgiving. A technician with gloves on types 2482026 or
     24-8-26; all of it means the same day and none of it should be
     rejected with an empty field and no explanation. */
  function dmyToISO(text) {
    const s = String(text || '').trim();
    if (!s) return '';
    let d, mo, y;
    const parts = s.split(/[^\d]+/).filter(Boolean);
    if (parts.length === 3) {
      [d, mo, y] = parts.map(Number);
    } else {
      const digits = s.replace(/\D/g, '');
      if (digits.length === 8)      { d = +digits.slice(0,2); mo = +digits.slice(2,4); y = +digits.slice(4); }
      else if (digits.length === 6) { d = +digits.slice(0,2); mo = +digits.slice(2,4); y = +digits.slice(4); }
      else return null;
    }
    if (y < 100) y += y < 70 ? 2000 : 1900;
    /* A Buddhist-era year typed out of habit still means the right day. */
    if (y > 2400) y -= 543;
    if (!(d >= 1 && d <= 31 && mo >= 1 && mo <= 12 && y >= 1900 && y <= 2999)) return null;
    const dt = new Date(y, mo - 1, d);
    if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null;
    const p = (n) => String(n).padStart(2, '0');
    return `${y}-${p(mo)}-${p(d)}`;
  }

  let openCal = null;
  function closeCalendar() {
    if (!openCal) return;
    openCal.remove();
    openCal = null;
    document.removeEventListener('mousedown', onCalOutside, true);
    window.removeEventListener('resize', closeCalendar);
    window.removeEventListener('scroll', closeCalendar, true);
  }
  function onCalOutside(e) {
    if (openCal && !openCal.contains(e.target) && !e.target.closest('.date-open')) closeCalendar();
  }

  function openCalendar(anchor, currentISO, commit) {
    closeCalendar();
    let view = currentISO ? new Date(currentISO + 'T00:00:00') : new Date();
    if (isNaN(view)) view = new Date();
    view = new Date(view.getFullYear(), view.getMonth(), 1);

    const cal = el('div', { class: 'datecal' });
    const head = el('div', { class: 'datecal-head' });
    const title = el('button', { class: 'datecal-title', type: 'button' });
    const prev = el('button', { class: 'datecal-nav', type: 'button', text: '‹',
      title: T({ en: 'Previous month', th: 'เดือนก่อน' }) });
    const next = el('button', { class: 'datecal-nav', type: 'button', text: '›',
      title: T({ en: 'Next month', th: 'เดือนถัดไป' }) });
    head.append(prev, title, next);

    const dow = el('div', { class: 'datecal-dow' });
    DOW_NAMES[lang === 'th' ? 'th' : 'en'].forEach((d) => dow.appendChild(el('span', { text: d })));

    const grid = el('div', { class: 'datecal-grid' });
    const foot = el('div', { class: 'datecal-foot' });
    const todayBtn = el('button', { class: 'btn btn-sm', type: 'button',
      text: T({ en: 'Today', th: 'วันนี้' }) });
    const clearBtn = el('button', { class: 'btn btn-sm', type: 'button',
      text: T({ en: 'Clear', th: 'ล้าง' }) });
    foot.append(todayBtn, clearBtn);
    cal.append(head, dow, grid, foot);

    function draw() {
      title.textContent = MONTH_NAMES[lang === 'th' ? 'th' : 'en'][view.getMonth()] + ' ' + view.getFullYear();
      grid.innerHTML = '';
      /* Monday-first: the working week as a Thai factory reads it. */
      const firstDow = (new Date(view.getFullYear(), view.getMonth(), 1).getDay() + 6) % 7;
      const days = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();
      const p = (n) => String(n).padStart(2, '0');
      const todayStr = todayISO();
      for (let i = 0; i < firstDow; i++) grid.appendChild(el('span', { class: 'datecal-pad' }));
      for (let d = 1; d <= days; d++) {
        const iso = `${view.getFullYear()}-${p(view.getMonth() + 1)}-${p(d)}`;
        const b = el('button', { class: 'datecal-day', type: 'button', text: String(d) });
        if (iso === currentISO) b.classList.add('is-sel');
        if (iso === todayStr) b.classList.add('is-today');
        b.addEventListener('click', () => { commit(iso); closeCalendar(); });
        grid.appendChild(b);
      }
    }
    prev.addEventListener('click', () => { view.setMonth(view.getMonth() - 1); draw(); });
    next.addEventListener('click', () => { view.setMonth(view.getMonth() + 1); draw(); });
    title.addEventListener('click', () => { view = new Date(); view.setDate(1); draw(); });
    todayBtn.addEventListener('click', () => { commit(todayISO()); closeCalendar(); });
    clearBtn.addEventListener('click', () => { commit(''); closeCalendar(); });
    draw();

    /* Fixed to the viewport, not the field: the calendar must escape the
       drawer and any scrolling panel that would otherwise clip it. */
    document.body.appendChild(cal);
    placeFloating(cal, anchor.getBoundingClientRect(), { align: 'start', below: true, gap: 6 });
    openCal = cal;

    setTimeout(() => {
      document.addEventListener('mousedown', onCalOutside, true);
      window.addEventListener('resize', closeCalendar);
      window.addEventListener('scroll', closeCalendar, true);
    }, 0);
  }

  /* One date control, used by header fields, table cells and signatures.
     Reads and writes ISO; shows and accepts DD/MM/YYYY. */
  function dateField(opts) {
    const wrap = el('div', { class: 'datefield' + (opts.className ? ' ' + opts.className : '') });
    let iso = opts.value || '';

    const input = el('input', {
      type: 'text',
      class: 'date-text' + (opts.inputClass ? ' ' + opts.inputClass : ''),
      inputmode: 'numeric',
      autocomplete: 'off',
      placeholder: 'dd/mm/yyyy',
      value: isoToDMY(iso),
    });
    input.setAttribute('data-iso', iso);

    const btn = el('button', {
      class: 'date-open', type: 'button',
      title: T({ en: 'Pick a date', th: 'เลือกวันที่' }),
    });
    btn.appendChild(icon('calendar', 16));

    function commit(nextIso) {
      iso = nextIso || '';
      input.value = isoToDMY(iso);
      input.setAttribute('data-iso', iso);
      input.classList.remove('is-bad');
      if (opts.onCommit) opts.onCommit(iso);
    }

    input.addEventListener('input', () => {
      /* Type bare digits and the slashes appear.

         Only a run of BARE digits. Testing the stripped string instead
         treated "1/9/2026" as "192026" and rewrote it to 19/20/26 — a
         single-digit day became impossible to type. Once the field holds
         separators the technician is formatting it themselves, so we
         stay out of the way and let `change` parse it. */
      const raw = input.value;
      if (/^\d{3,8}$/.test(raw)) {
        const d = raw;
        let out = d.slice(0, 2);
        if (d.length > 2) out += '/' + d.slice(2, 4);
        if (d.length > 4) out += '/' + d.slice(4);
        if (out !== raw) {
          const atEnd = input.selectionStart === raw.length;
          input.value = out;
          if (atEnd) input.setSelectionRange(out.length, out.length);
        }
      }
      input.classList.remove('is-bad');
    });

    input.addEventListener('change', () => {
      const parsed = dmyToISO(input.value);
      if (parsed === null) {
        /* Say so rather than silently discarding what was typed. */
        input.classList.add('is-bad');
        return;
      }
      commit(parsed);
    });
    input.addEventListener('blur', () => {
      if (input.classList.contains('is-bad')) { commit(iso); }
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { input.blur(); }
      if (e.key === 'Escape') { commit(iso); input.blur(); }
    });

    btn.addEventListener('click', () => {
      if (openCal) { closeCalendar(); return; }
      openCalendar(wrap, input.getAttribute('data-iso') || '', commit);
    });

    wrap.append(input, btn);
    return wrap;
  }

  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeCalendar(); });

  /* ---------------- Print ----------------

     A form on screen shows its values inside <input>s, which is fine
     because a long value can be scrolled or focused. Paper has neither.
     A machine called "HOUSING INSERTION MACHINE" in a 200px input prints
     as "HOUSING INSERTION MACH" and the rest is simply gone — the report
     goes to the customer with the name cut in half.

     No CSS can wrap an input's value, so before printing we mirror each
     one into a plain <span> that CSS swaps in. Spans wrap, so nothing is
     lost. Rebuilt on every print so it can never show a stale value. */

  function valueForPrint(el) {
    if (el.tagName === 'SELECT') {
      const opt = el.options[el.selectedIndex];
      return opt ? opt.text : '';
    }
    /* Our own date field is a text input that already reads DD/MM/YYYY,
       so it needs no translation. type="date" can still appear in an
       old cached page, so keep handling it. */
    if (el.type === 'date') return el.value ? fmtDate(el.value) : '';
    if (el.type === 'time') return el.value || '';
    return el.value || '';
  }

  function buildPrintValues() {
    const main = $('#main');
    if (!main) return;
    main.querySelectorAll('.print-value').forEach((n) => n.remove());
    main.querySelectorAll('input, select, textarea').forEach((el) => {
      if (el.type === 'checkbox' || el.type === 'radio' || el.type === 'file') return;
      if (el.closest('.no-print')) return;
      const span = document.createElement('span');
      span.className = 'print-value';
      const v = valueForPrint(el);
      span.textContent = v;
      /* An empty field should still print its underline, or the form
         looks like it was never laid out. */
      if (!v) span.classList.add('is-blank');
      if (el.tagName === 'TEXTAREA') span.classList.add('is-block');
      el.parentNode.insertBefore(span, el.nextSibling);
    });
  }

  function wirePrint() {
    /* Chrome, Edge and Firefox fire beforeprint. iOS Safari does not —
       it only flips the print media query — so listen for both. Tablets
       are exactly where this matters most. */
    window.addEventListener('beforeprint', buildPrintValues);
    const mq = window.matchMedia('print');
    const onMedia = (e) => { if (e.matches) buildPrintValues(); };
    if (mq.addEventListener) mq.addEventListener('change', onMedia);
    else if (mq.addListener) mq.addListener(onMedia);
  }

  /* ---------------- Boot ---------------- */

  function boot() {
    stampBuild();
    blockPinchShrink();
    wirePrint();
    checkForUpdate();
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) checkForUpdate();
    });
    /* The wordmark is styled markup in index.html — don't overwrite it. */
    applyTheme();
    setupNavDrawer();
    startCloud();
    readHash();
    render();

    window.addEventListener('hashchange', () => {
      if (suppressHashChange) { suppressHashChange = false; return; }
      readHash();
      render();
    });
    window.addEventListener('beforeunload', () => saveDB());
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  /* Expose a little surface for debugging in the console */
  window.FNMachineCare = {
    get db() { return db; },
    save: saveDB,
    /* Exposed so the delete path can be exercised end to end from a
       test rather than by reaching in and splicing the array, which
       would skip the very tombstone the test is meant to check. */
    deleteRecord,
    reset: () => { db = structuredClone(DEFAULT_DB); saveDB(); render(); },
  };
})();

</script>
</body>
</html>
