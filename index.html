  function clearRecord(rec) {
    const fresh = newRecord(rec.type);
    rec.fields = fresh.fields;
    rec.checks = {};
    rec.measures = {};
    rec.perf = {};
    rec.docs = {};
    rec.photos = {};
    rec.tables = {};
    rec.notes = {};
    rec.rootcause = {};
    rec.priority = {};
    rec.beforeAfter = { before: [], after: [] };
    rec.result = null;
    rec.signatures = {};
    rec._showErrors = false;
    rec.status = 'draft';
    touch(rec);
  }

  /* Identity used to group a machine's history */
  function machineKey(r) {
    const w = (r.fields.workNo || '').trim().toUpperCase();
    const s = (r.fields.serialNo || '').trim().toUpperCase();
    return w || s ? `${w}|${s}` : null;
  }

  function machineList() {
    const map = new Map();
    db.records.forEach((r) => {
      const key = machineKey(r);
      if (!key) return;
      if (!map.has(key)) {
        map.set(key, {
          key,
          workNo: r.fields.workNo || '',
          serialNo: r.fields.serialNo || '',
          machineName: r.fields.machineName || '',
          customer: r.fields.customer || '',
          records: [],
        });
      }
      const m = map.get(key);
      m.records.push(r);
      // Latest non-empty descriptive fields win
      if (r.fields.machineName) m.machineName = r.fields.machineName;
      if (r.fields.customer) m.customer = r.fields.customer;
    });
    map.forEach((m) => m.records.sort((a, b) => (b.createdAt > a.createdAt ? 1 : -1)));
    return Array.from(map.values()).sort((a, b) => a.workNo.localeCompare(b.workNo));
  }

  /* ---------------- Service analytics ----------------
     Everything the dashboard charts is derived from the records on
     the fly — there is no separate analytics store to fall out of
     sync with the forms. */

  function serviceRecords(records) {
    return records.filter((r) => r.type === 'SERVICE');
  }

  /* One row per customer: how many machines we have there, and how
     many times we have been called out. */
  function customerStats() {
    const map = new Map();
    db.records.forEach((r) => {
      const name = (r.fields.customer || '').trim();
      const key = name || '—';
      if (!map.has(key)) map.set(key, { customer: key, machines: new Set(), services: 0, records: [] });
      const e = map.get(key);
      const mk = machineKey(r);
      if (mk) e.machines.add(mk);
      if (r.type === 'SERVICE') e.services++;
      e.records.push(r);
    });
    return Array.from(map.values())
      .map((e) => Object.assign(e, { machineCount: e.machines.size }))
      .sort((a, b) => b.services - a.services || b.machineCount - a.machineCount || a.customer.localeCompare(b.customer));
  }

  /* One row per machine inside a customer. */
  function machineStatsFor(customerName) {
    const map = new Map();
    db.records.forEach((r) => {
      if (((r.fields.customer || '').trim() || '—') !== customerName) return;
      const mk = machineKey(r);
      if (!mk) return;
      if (!map.has(mk)) {
        map.set(mk, { key: mk, label: '', workNo: r.fields.workNo || '', serialNo: r.fields.serialNo || '', services: 0, records: [] });
      }
      const e = map.get(mk);
      e.records.push(r);
      if (r.type === 'SERVICE') e.services++;
      if (r.fields.machineName) e.label = r.fields.machineName;
      if (r.fields.workNo) e.workNo = r.fields.workNo;
      if (r.fields.serialNo) e.serialNo = r.fields.serialNo;
    });
    return Array.from(map.values())
      .map((e) => Object.assign(e, { label: e.label || e.workNo || e.serialNo || '—' }))
      .sort((a, b) => b.services - a.services || a.label.localeCompare(b.label));
  }

  /* Lookup tables pulled straight from the service form definition, so
     renaming a category there renames it here too. */
  function serviceTypeOptions() {
    const sec = FORM_BY_TYPE.SERVICE.sections.find((x) => x.type === 'fields');
    const fld = sec && sec.fields.find((x) => x.key === 'serviceType');
    return (fld && fld.options) || [];
  }

  function rootCauseOptions() {
    const sec = FORM_BY_TYPE.SERVICE.sections.find((x) => x.type === 'rootcause');
    return (sec && sec.categories) || [];
  }

  /* How many visits of each kind. */
  function serviceTypeBreakdown(records) {
    const opts = serviceTypeOptions();
    const counts = {};
    serviceRecords(records).forEach((r) => {
      const v = r.fields.serviceType || 'unspecified';
      counts[v] = (counts[v] || 0) + 1;
    });
    const rows = opts
      .map((o) => ({ value: o.value, label: o.label, count: counts[o.value] || 0 }))
      .filter((row) => row.count > 0);
    if (counts.unspecified) {
      rows.push({ value: 'unspecified', label: { en: 'Not specified', th: 'ไม่ได้ระบุ' }, count: counts.unspecified });
    }
    return rows.sort((a, b) => b.count - a.count);
  }

  /* The question a service manager actually asks: what keeps going
     wrong on this machine? Counted from the root-cause categories the
     technicians ticked, not from free text. */
  function recurringCauses(records) {
    const opts = rootCauseOptions();
    const byCode = {};
    opts.forEach((o) => { byCode[o.code] = o.label; });

    const counts = {};
    serviceRecords(records).forEach((r) => {
      const seen = new Set();
      Object.values(r.rootcause || {}).forEach((rc) => {
        (rc.selected || []).forEach((code) => seen.add(code));
      });
      seen.forEach((code) => { counts[code] = (counts[code] || 0) + 1; });
    });

    return Object.keys(counts)
      .map((code) => ({ code, label: byCode[code] || { en: code, th: code }, count: counts[code] }))
      .sort((a, b) => b.count - a.count);
  }

  /* Completion: how many check items have an answer */
  function sectionProgress(record, section) {
    if (section.type !== 'checklist' && section.type !== 'condition') return null;
    const answers = (record.checks && record.checks[section.id]) || {};
    const done = section.items.filter((it) => answers[it.code] && answers[it.code].value).length;
    return { done, total: section.items.length };
  }

  /* Belt as well as braces. normaliseRecord should mean this never fires,
     but a progress number is not worth taking the whole Records table down
     for — one unreadable record should cost one row's percentage, not the
     entire screen. */
  function recordProgress(record) {
    const def = FORM_BY_TYPE[record.type];
    if (!def) return { done: 0, total: 0, pct: 0 };
    let done = 0, total = 0;
    try {
      def.sections.forEach((s) => {
        const p = sectionProgress(record, s);
        if (p) { done += p.done; total += p.total; }
      });
    } catch (e) {
      console.error('[FN] Could not measure progress for', record && record.docNo, e);
      return { done: 0, total: 0, pct: 0 };
    }
    return { done, total, pct: total ? Math.round((done / total) * 100) : 0 };
  }

  /* Safety gate — a failed safety item blocks a READY result */
  function hasSafetyFail(record) {
    const def = FORM_BY_TYPE[record.type];
    if (!def || !def.safetyGate) return false;
    return def.sections.some((s) => {
      if (s.type !== 'checklist' || !s.critical) return false;
      const answers = record.checks[s.id] || {};
      return s.items.some((it) => answers[it.code] && answers[it.code].value === 'FAIL');
    });
  }

  function failedItems(record) {
    const def = FORM_BY_TYPE[record.type];
    const out = [];
    if (!def) return out;
    def.sections.forEach((s) => {
      if (s.type !== 'checklist' && s.type !== 'condition') return;
      const answers = record.checks[s.id] || {};
      s.items.forEach((it) => {
        const a = answers[it.code];
        if (a && (a.value === 'FAIL' || a.value === 'ABNORMAL')) {
          out.push({ section: s, item: it, remark: a.remark || '' });
        }
      });
    });
    return out;
  }

  function resultMeta(record) {
    const def = FORM_BY_TYPE[record.type];
    if (!def) return null;
    const section = def.sections.find((s) => s.type === 'result');
    if (!section || !record.result) return null;
    return section.options.find((o) => o.value === record.result) || null;
  }

  function pillClassFor(record) {
    if (record.status === 'draft') return 'draft';
    const m = resultMeta(record);
    if (!m) return 'draft';
    if (m.tone === 'good') return 'green';
    if (m.tone === 'warn') return 'yellow';
    return 'red';
  }

  /* ---------------- Navigation drawer (tablet & phone) ----------------
     Desktop keeps the sidebar in place; below 900px it becomes an
     off-canvas drawer opened by the ☰ button. */

  /* Ask the stylesheet, don't duplicate its breakpoint here — the two
     drifted apart the moment the tablet cut moved. The bar is only
     displayed when the drawer layout is active. */
  function navIsDrawer() {
    const bar = document.querySelector('.mobile-bar');
    return !!bar && getComputedStyle(bar).display !== 'none';
  }

  function setNavOpen(open) {
    const root = document.documentElement;
    root.classList.toggle('nav-open', !!open);
    const btn = $('#menuToggle');
    if (btn) btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    /* Keyboard users should not tab into a closed drawer */
    const sidebar = $('#sidebar');
    if (sidebar) sidebar.setAttribute('aria-hidden', open || !navIsDrawer() ? 'false' : 'true');
  }

  function closeNav() {
    if (document.documentElement.classList.contains('nav-open')) setNavOpen(false);
  }

  function setupNavDrawer() {
    const btn = $('#menuToggle');
    const scrim = $('#scrim');

    if (btn) {
      btn.addEventListener('click', () => {
        setNavOpen(!document.documentElement.classList.contains('nav-open'));
      });
    }
    if (scrim) scrim.addEventListener('click', closeNav);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeNav();
    });

    /* Rotating a tablet back to a wide layout must not leave the
       page stuck behind a scrim. */
    window.addEventListener('resize', () => {
      if (!navIsDrawer()) setNavOpen(false);
    });

    setNavOpen(false);
  }

  /* ---------------- Modal ---------------- */

  function modal(opts) {
    const overlay = el('div', { class: 'modal-overlay' });
    const card = el('div', { class: 'modal-card', role: 'dialog', 'aria-modal': 'true' });

    function close() {
      overlay.classList.remove('show');
      document.removeEventListener('keydown', onKey);
      setTimeout(() => overlay.remove(), 220);
    }
    function onKey(e) { if (e.key === 'Escape' && !opts.blocking) close(); }

    if (opts.title) card.appendChild(el('h2', { class: 'modal-title' }, [L(opts.title)]));
    if (opts.note) card.appendChild(el('p', { class: 'modal-note' }, [L(opts.note)]));
    const bodyBox = el('div', { class: 'modal-body' }, opts.body || []);
    card.appendChild(bodyBox);

    const foot = el('div', { class: 'modal-foot' });
    if (opts.onConfirm) {
      foot.appendChild(el('button', { class: 'btn', onclick: close }, [L({ en: 'Cancel', th: 'ยกเลิก' })]));
    }
    foot.appendChild(el('button', {
      class: 'btn btn-primary',
      onclick: () => { if (!opts.onConfirm || opts.onConfirm() !== false) close(); },
    }, [L(opts.confirmLabel || { en: 'OK', th: 'ตกลง' })]));
    card.appendChild(foot);

    overlay.appendChild(card);
    overlay.addEventListener('click', (e) => { if (e.target === overlay && !opts.blocking) close(); });
    document.addEventListener('keydown', onKey);
    document.body.appendChild(overlay);
    requestAnimationFrame(() => overlay.classList.add('show'));
    return { close };
  }

  /* ---------------- Validation ----------------
     A submitted form is a record someone will rely on months later, so
     it has to be complete. Every gap is collected, not just the first,
     and each one is pointed at directly. */

  function validateRecord(rec) {
    const def = FORM_BY_TYPE[rec.type];
    const gaps = [];

    def.sections.forEach((section) => {
      if (section.type === 'fields') {
        section.fields.forEach((f) => {
          if (!f.required) return;
          if (String(rec.fields[f.key] || '').trim()) return;
          gaps.push({ kind: 'field', sectionId: section.id, key: f.key, label: f.label, section: section.title });
        });
      }

      if (section.type === 'checklist' || section.type === 'condition') {
        const answers = rec.checks[section.id] || {};
        section.items.forEach((it) => {
          if (answers[it.code] && answers[it.code].value) return;
          gaps.push({ kind: 'check', sectionId: section.id, key: it.code, label: it.label, section: section.title });
        });
      }

      if (section.type === 'result' && !rec.result) {
        gaps.push({ kind: 'result', sectionId: section.id, key: 'result', label: section.title, section: section.title });
      }

      if (section.type === 'signoff') {
        section.roles.forEach((role) => {
          const sig = rec.signatures[role.key] || {};
          if (String(sig.name || '').trim()) return;
          gaps.push({ kind: 'sign', sectionId: section.id, key: role.key, label: role.label, section: section.title });
        });
      }
    });

    return gaps;
  }

  function focusGap(gap) {
    const section = document.getElementById('sec-' + gap.sectionId);
    if (!section) return;
    let target = null;
    if (gap.kind === 'field') target = section.querySelector(`[data-field="${gap.key}"]`);
    else if (gap.kind === 'check') target = section.querySelector(`[data-code="${gap.key}"]`);
    else if (gap.kind === 'sign') target = section.querySelector(`[data-role="${gap.key}"]`);
    else target = section;
    (target || section).scrollIntoView({ behavior: 'smooth', block: 'center' });
    const input = target && target.querySelector('input, select, textarea, button');
    if (input) setTimeout(() => input.focus({ preventScroll: true }), 400);
  }

  /* ---------------- Submit ---------------- */

  function submitRecord(rec) {
    const gaps = validateRecord(rec);

    if (gaps.length) {
      rec._showErrors = true;
      render();
      setTimeout(() => focusGap(gaps[0]), 60);
      toast(
        lang === 'th'
          ? `ยังกรอกไม่ครบ ${gaps.length} รายการ — ช่องที่ขาดกะพริบสีแดง`
          : `${gaps.length} still to fill — the missing ones are flashing red`,
        true
      );
      return;
    }

    const def = FORM_BY_TYPE[rec.type];
    const byKey = def.submitter;
    const name = (rec.fields[byKey] || '').trim() || '—';
    const position = positionOf(rec, byKey) || '—';
    const now = new Date();

    rec._showErrors = false;
    rec.status = 'submitted';
    rec.submittedAt = now.toISOString();
    rec.submittedBy = { name, position, key: byKey };
    rec.receipt = drawReceipt(rec, def, name, position, now);
    touch(rec);

    showSubmitted(rec, def, name, position, now);
    render();
  }

  function fmtDateTime(d) {
    const p = (n) => String(n).padStart(2, '0');
    return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()}  ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  /* A submission slip drawn on canvas and stored with the record.
     Drawn rather than screenshotted: the page is frosted glass over a
     moving gradient, and no dependency-free DOM capture reproduces
     that. This prints the facts cleanly instead, and always the same. */
  function drawReceipt(rec, def, name, position, when) {
    try {
      const W = 900, H = 560, s = 2;
      const c = el('canvas');
      c.width = W * s; c.height = H * s;
      const g = c.getContext('2d');
      g.scale(s, s);

      g.fillStyle = '#ffffff'; g.fillRect(0, 0, W, H);
      g.fillStyle = '#0a84ff'; g.fillRect(0, 0, W, 8);

      g.fillStyle = '#0d1526';
      g.font = '700 30px "Segoe UI", system-ui, sans-serif';
      g.fillText('FN Machine Care', 46, 74);
      g.fillStyle = '#5c6780';
      g.font = '15px "Segoe UI", system-ui, sans-serif';
      g.fillText('F N Technology — submission record', 46, 100);

      g.fillStyle = '#30d158';
      g.beginPath(); g.arc(W - 84, 74, 26, 0, Math.PI * 2); g.fill();
      g.strokeStyle = '#fff'; g.lineWidth = 4; g.lineCap = 'round'; g.lineJoin = 'round';
      g.beginPath(); g.moveTo(W - 96, 74); g.lineTo(W - 87, 83); g.lineTo(W - 71, 64); g.stroke();

      g.strokeStyle = '#d7dded'; g.lineWidth = 1;
      g.beginPath(); g.moveTo(46, 124); g.lineTo(W - 46, 124); g.stroke();

      const rows = [
        ['Document', `${rec.docNo}   (${def.prefix})`],
        ['Form', def.name.en],
        ['Work No.', rec.fields.workNo || '—'],
        ['Machine', rec.fields.machineName || '—'],
        ['Serial No.', rec.fields.serialNo || '—'],
        ['Customer', rec.fields.customer || '—'],
        ['PO No.', rec.fields.poNo || '—'],
      ];
      let y = 164;
      rows.forEach(([k, v]) => {
        g.fillStyle = '#5c6780';
        g.font = '14px "Segoe UI", system-ui, sans-serif';
        g.fillText(k, 46, y);
        g.fillStyle = '#0d1526';
        g.font = '600 16px "Segoe UI", system-ui, sans-serif';
        g.fillText(String(v).slice(0, 58), 210, y);
        y += 32;
      });

      const meta = resultMeta(rec);
      if (meta) {
        g.fillStyle = meta.color;
        roundRect(g, 46, y - 4, 420, 38, 10); g.fill();
        g.fillStyle = '#ffffff';
        g.font = '700 15px "Segoe UI", system-ui, sans-serif';
        g.fillText(meta.label.en, 62, y + 20);
        y += 56;
      }

      g.strokeStyle = '#d7dded';
      g.beginPath(); g.moveTo(46, y); g.lineTo(W - 46, y); g.stroke();
      y += 30;

      g.fillStyle = '#5c6780'; g.font = '14px "Segoe UI", system-ui, sans-serif';
      g.fillText('Submitted', 46, y);
      g.fillStyle = '#0d1526'; g.font = '600 16px "Segoe UI", system-ui, sans-serif';
      g.fillText(fmtDateTime(when), 210, y);
      y += 30;

      g.fillStyle = '#5c6780'; g.font = '14px "Segoe UI", system-ui, sans-serif';
      g.fillText('By', 46, y);
      g.fillStyle = '#0d1526'; g.font = '600 16px "Segoe UI", system-ui, sans-serif';
      g.fillText(name, 210, y);
      y += 26;
      g.fillStyle = '#5c6780'; g.font = '15px "Segoe UI", system-ui, sans-serif';
      g.fillText(position, 210, y);

      return c.toDataURL('image/png');
    } catch (e) {
      console.error('[FN] Could not draw the submission slip:', e);
      return '';
    }
  }

  function roundRect(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  function showSubmitted(rec, def, name, position, when) {
    const body = [
      el('div', { class: 'submit-mark' }, [
        el('span', { class: 'submit-tick', text: '✓' }),
      ]),
      el('div', { class: 'submit-doc', text: rec.docNo }),
      el('div', { class: 'submit-form', text: T(def.name) }),
      el('div', { class: 'submit-rows' }, [
        submitRow({ en: 'Submitted', th: 'ส่งเมื่อ' }, fmtDateTime(when)),
        submitRow({ en: 'By', th: 'โดย' }, name),
        submitRow({ en: 'Position', th: 'ตำแหน่ง' }, position),
      ]),
    ];

    if (rec.receipt) {
      body.push(el('img', { class: 'submit-shot', src: rec.receipt, alt: 'Submission record' }));
      body.push(el('div', { class: 'btn-row', style: 'justify-content:center;margin-top:12px' }, [
        el('button', {
          class: 'btn btn-sm',
          onclick: () => {
            const a2 = el('a', { href: rec.receipt, download: `${rec.docNo}-submitted.png` });
            document.body.appendChild(a2); a2.click(); a2.remove();
          },
        }, [L({ en: '⬇ Save this slip', th: '⬇ บันทึกสลิปนี้' })]),
      ]));
    }

    modal({
      title: { en: 'Submitted', th: 'ส่งเอกสารแล้ว' },
      note: { en: 'This record is now complete and saved on this device.',
              th: 'เอกสารนี้กรอกครบและบันทึกไว้ในเครื่องนี้แล้ว' },
      body,
      blocking: true,
      confirmLabel: { en: 'OK', th: 'ตกลง' },
    });
  }

  function submitRow(label, value) {
    return el('div', { class: 'submit-row' }, [
      el('span', { class: 'submit-key' }, [L(label)]),
      el('span', { class: 'submit-val', text: value }),
    ]);
  }

  /* ---------------- Router ---------------- */

  const state = { view: 'main', module: 'main', recordId: null, machineKey: null, projectId: null,
                  search: '', customer: null,
                  filterCustomer: null, filterMachine: null, openMachine: null,
                  projSort: 'status', projFilter: 'active', projPerson: null, dashCompany: null };

  /* Which module each view belongs to — drives the sidebar menu and the
     "back to main menu" behaviour. 'data' (Backup) is shared, so it
     keeps whichever module it was reached from. */
  const CARE_VIEWS = { home: 1, newform: 1, records: 1, machines: 1, dashboard: 1, form: 1, machine: 1 };
  const PROJ_VIEWS = { projhome: 1, reqnew: 1, reqlist: 1, reqview: 1, followup: 1, kickoff: 1, projdash: 1 };
  const MENU_VIEWS = { main: 1, home: 1, projhome: 1 };   /* full-screen menus, no sidebar */
  function moduleOf(view) {
    if (view === 'main') return 'main';
    if (PROJ_VIEWS[view]) return 'project';
    if (CARE_VIEWS[view]) return 'care';
    return null;   /* 'data' → keep current */
  }

  /* The URL hash carries the current view so a tablet refresh — or a
     browser crash mid-inspection — returns to the same form. */
  function writeHash() {
    const parts = [state.view];
    if (state.recordId) parts.push(state.recordId);
    else if (state.machineKey) parts.push(encodeURIComponent(state.machineKey));
    else if (state.projectId) parts.push(state.projectId);
    const hash = '#/' + parts.join('/');
    if (window.location.hash !== hash) {
      suppressHashChange = true;
      window.location.hash = hash;
    }
  }

  let suppressHashChange = false;

  function readHash() {
    const raw = (window.location.hash || '').replace(/^#\/?/, '');
    if (!raw) { state.view = 'main'; state.module = 'main'; return true; }
    const [view, arg] = raw.split('/');
    if (!view) return false;
    state.view = view;
    state.recordId = null;
    state.machineKey = null;
    state.projectId = null;
    if (view === 'form' && arg) {
      if (!db.records.some((r) => r.id === arg)) { state.view = 'records'; return true; }
      state.recordId = arg;
    } else if (view === 'machine' && arg) {
      state.machineKey = decodeURIComponent(arg);
    } else if (view === 'reqview' && arg) {
      if (!db.records.some((r) => r.id === arg && r.type === 'PROJECT')) { state.view = 'reqlist'; }
      else state.projectId = arg;
    }
    const m = moduleOf(state.view);
    if (m) state.module = m;
    return true;
  }

  /* Where each view sits along the menu, so a change knows which way to
     slide. Detail pages (form, machine) belong just after their parent
     list, so opening one reads as going deeper (forward) and leaving it
     as coming back. Home is 0 — home to anywhere slides forward, and
     returning home slides back. */
  const NAV_ORDER = {
    main: -1, home: 0, projhome: 0,
    newform: 1, records: 2, form: 2.4, machines: 3, machine: 3.4, dashboard: 4, data: 5,
    reqnew: 1, reqlist: 2, reqview: 2.4, followup: 3, kickoff: 4, projdash: 5,
  };

  function go(view, opts) {
    closeNav();
    if (view !== 'dashboard') state.customer = null;
    const from = state.view;
    /* Leaving a requirement editor? Discard it if it is still an empty
       draft, so an accidental "New Requirement" never becomes clutter. */
    if (from === 'reqview' && view !== 'reqview' && state.projectId) dropEmptyDraft(state.projectId);
    if (view !== 'projdash') state.dashCompany = null;   /* leave the company drill-down */
    state.view = view;
    state.recordId = (opts && opts.recordId) || null;
    state.machineKey = (opts && opts.machineKey) || null;
    state.projectId = (opts && opts.projectId) || null;
    const m = moduleOf(view);
    if (m) state.module = m;   /* 'data' keeps the current module */
    writeHash();
    window.scrollTo(0, 0);
    animateGo(from, view);
  }

  /* Detail pages opened from inside the content area (a record form, a
     machine's history, a requirement) rather than from the sidebar. */
  const DETAIL_VIEWS = { form: 1, machine: 1, reqview: 1 };
  const VT_CLASSES = ['vt-forward', 'vt-back', 'vt-warp', 'vt-down', 'vt-up', 'vt-glitch'];

  /* Move the content on a navigation. The chosen motion system:
     - home ↔ any page ............ WARP ZOOM (+ energy ring at the click)
     - sidebar menu, moving DOWN .. TILT DROP
     - sidebar menu, moving UP .... ORBIT SWING
     - detail views in content .... SCAN WIPE (directional, with the line)
     View Transitions API where the browser has it, plain enter
     animations where it doesn't, nothing at all under reduced motion. */
  function animateGo(from, to) {
    const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced || from === to) { render(); return; }

    const html = document.documentElement;
    VT_CLASSES.forEach((c) => html.classList.remove(c));

    const fwd = (NAV_ORDER[to] !== undefined ? NAV_ORDER[to] : 9) >= (NAV_ORDER[from] !== undefined ? NAV_ORDER[from] : 0);
    let enterClass;
    if (MENU_VIEWS[from] || MENU_VIEWS[to]) {
      /* Crossing into or out of a full-screen menu (main / module home)
         is the app's Warp Zoom moment. */
      html.classList.add('vt-warp');
      enterClass = 'enter-warp';
      warpRing();
    } else if (DETAIL_VIEWS[from] || DETAIL_VIEWS[to]) {
      html.classList.add(fwd ? 'vt-forward' : 'vt-back');
      enterClass = fwd ? 'enter-fwd' : 'enter-back';
      pageScan();
    } else {
      html.classList.add(fwd ? 'vt-down' : 'vt-up');
      enterClass = fwd ? 'enter-down' : 'enter-up';
    }
    kickAmbient();   /* the background reacts to every transition */

    if (document.startViewTransition) {
      document.startViewTransition(() => { render(); });
    } else {
      render();
      const main = $('#main');
      if (main) {
        main.classList.remove('enter-fwd', 'enter-back', 'enter-warp', 'enter-down', 'enter-up');
        void main.offsetWidth;                 /* restart the animation */
        main.classList.add(enterClass);
      }
    }
  }

  /* Where the user last touched, so the launch ring bursts from the very
     card or pill they pressed rather than an arbitrary centre. */
  let lastTap = null;
  document.addEventListener('pointerdown', (e) => {
    lastTap = { x: e.clientX, y: e.clientY };
  }, true);

  /* The energy ring for home launches/returns — two pulses of light
     exploding outward from the click point. Fixed-position, so convert
     the visual-pixel tap point into layout pixels (see placeFloating). */
  function warpRing() {
    let ring = document.getElementById('warpRing');
    if (!ring) {
      ring = el('div', { class: 'warp-ring no-print', id: 'warpRing' },
        [el('i'), el('i')]);
      document.body.appendChild(ring);
    }
    const s = uiScale();
    const x = lastTap ? lastTap.x : window.innerWidth / 2;
    const y = lastTap ? lastTap.y : window.innerHeight / 2;
    ring.style.left = (x / s) + 'px';
    ring.style.top = (y / s) + 'px';
    ring.classList.remove('go');
    void ring.offsetWidth;
    ring.classList.add('go');
  }

  /* The sweeping scan line, built once and re-armed on each change. It
     starts at the content pane's left edge, so it never sweeps over the
     sidebar — the menu sits still while the light passes the page.
     getBoundingClientRect is in visual px, fixed positioning in layout
     px; divide by the zoom (see placeFloating) so the two agree. */
  function pageScan() {
    let s = document.getElementById('pageScan');
    if (!s) {
      s = el('div', { class: 'page-scan no-print', id: 'pageScan' });
      document.body.appendChild(s);
    }
    const main = $('#main');
    const from = main ? Math.max(0, main.getBoundingClientRect().left) / uiScale() : 0;
    s.style.setProperty('--scan-from', from + 'px');
    s.classList.remove('go');
    void s.offsetWidth;
    s.classList.add('go');
  }

  /* ---------------- Render: shell ---------------- */

  /* Stop callbacks for the home-screen auto-demo cycles (one per group:
     the menu cards and the quick-start pills). Torn down the instant we
     leave the home view — render() wipes #main on every navigation, which
     would otherwise orphan the timers. */
  let homeDemoStops = [];
  function stopHomeDemo() { homeDemoStops.forEach((fn) => fn()); homeDemoStops = []; }

    renderNav();

    const views = {

      newform: viewNewForm,
      form: viewForm,
      machine: viewMachine,
      data: viewData,
      projhome: viewProjHome,
      reqnew: viewReqNew,
      reqlist: viewReqList,
      reqview: viewReqView,
      followup: viewFollowup,
      kickoff: viewKickoff,
      projdash: viewProjDash,
    };
    /* A blank screen tells a technician nothing and tells me less.
       Twice now a single bad record has taken a whole page down — once
       the Records table, once a form on a phone I could not reproduce.
       If rendering throws, say so on screen, name the document, and
       leave the toolbar's Back button reachable. */
    try {
      (views[state.view] || viewDashboard)(main);
      stampTableLabels(main);
    } catch (err) {
      console.error('[FN] Could not draw this screen:', err);
      renderFailureCard(main, err);

  function renderFailureCard(main, err) {
    const rec = state.recordId && db.records.find((r) => r.id === state.recordId);
    const card = el('div', { class: 'card fail-card' }, [
      el('h2', {}, [L({ en: 'This screen could not be drawn',
                        th: 'ไม่สามารถแสดงหน้านี้ได้' })]),
      el('p', {}, [L({
        en: 'Your work is safe — nothing has been deleted. Please show this message to the developer.',
        th: 'ข้อมูลของคุณยังอยู่ครบ ไม่มีอะไรถูกลบ กรุณาแจ้งข้อความนี้กับผู้พัฒนา',
      })]),
      el('pre', { class: 'fail-detail', text:
        (rec ? rec.docNo + '  (' + rec.type + ')\n' : '') +
        (state.view || '?') + '\n' +

        String((err && err.stack) || '').split('\n').slice(1, 4).join('\n') }),

        el('button', { class: 'btn', onclick: () => go('records') },

        el('button', { class: 'btn', onclick: () => {

          } }, [L({ en: 'Copy details', th: 'คัดลอกรายละเอียด' })]),
      ]),
    ]);
    main.appendChild(card);
  }

  /* ---- data tables on a narrow screen ----
     A seven-column table does not fit a 390px phone. It was rendering
     at 897px inside a 364px box, so a technician saw the document
     number, a type chip, and then the machine name cut off mid-word —
     the date, progress and status, which are the reason to open the
     page at all, sat off-screen behind a sideways scroll nobody thinks
     to try.

     Below 900px each row becomes a card instead. That needs every cell
     to carry its column heading, and rather than thread a label through
     three separate table builders, copy them off the <thead> once here.
     Any table added later gets the same treatment for free. */
  function stampTableLabels(root) {
    root.querySelectorAll('.table-wrap table').forEach((table) => {
      const heads = [...table.querySelectorAll('thead th')].map((th) => th.innerText.trim());
      if (!heads.length) return;
      table.querySelectorAll('tbody tr').forEach((tr) => {
        [...tr.children].forEach((td, i) => {
          const label = heads[i];
          if (label) td.setAttribute('data-th', label);
          if (i === 0) td.setAttribute('data-first', '');
          /* Collect the cell's contents into ONE element. As a card the
             cell is a flex row of [label | value], and a cell holding a
             machine name AND a customer <div> put two separate items on
             the value side with nothing able to shrink — long customer
             names pushed 32px off the right edge of a 390px phone. */
          if (!td.querySelector(':scope > .td-val')) {
            const val = document.createElement('span');
            val.className = 'td-val';
            while (td.firstChild) val.appendChild(td.firstChild);
            td.appendChild(val);
          }
        });
      });
    });
  }

  /* Auto-demo: two independent swap-loops on the home screen — the menu
     cards and the quick-start pills. Each walks its group, holding one
     item in its hover state before handing off to the next, forever. A
     real hover pauses that group's walk (and the auto-highlight steps
     aside so the two never show at once); when the cursor leaves, the
     walk resumes from the item AFTER the one that was hovered. */
  function startHomeDemo(homeEl) {
    stopHomeDemo();
    /* Respect a reduced-motion preference — no auto-cycling. */
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    /* Continuous swap — no dark pause. The highlight fades straight from
       one item to the next, so it looks like it's moving along the row. */
    demoCycle(Array.prototype.slice.call(homeEl.querySelectorAll('.home-card')), 2800);
    demoCycle(Array.prototype.slice.call(homeEl.querySelectorAll('.hq-btn')), 2800);
  }

  function demoCycle(items, hold) {
    if (items.length < 2) return;
    const RESUME = 500;   /* brief beat after the cursor leaves */
    let idx = 0;
    let paused = false;
    let timer = null;
    const clearAll = () => items.forEach((c) => c.classList.remove('is-demo'));
    const stop = () => { if (timer) { clearTimeout(timer); timer = null; } };

    function tick() {
      if (paused) return;
      /* Removing .is-demo from the old item and adding it to the new one
         in the same frame lets their CSS opacity/transform transitions
         cross-fade — the highlight slides to the next item, no gap. */
      clearAll();
      items[idx].classList.add('is-demo');
      timer = setTimeout(() => { idx = (idx + 1) % items.length; tick(); }, hold);
    }

    items.forEach((it, i) => {
      /* Real hover: stop this group's walk and get out of its way. */
      it.addEventListener('mouseenter', () => { paused = true; stop(); clearAll(); idx = i; });
      /* Cursor left: resume from the next item along. */
      it.addEventListener('mouseleave', () => {
        paused = false;
        idx = (i + 1) % items.length;
        stop();
        timer = setTimeout(() => { paused = false; tick(); }, RESUME);
      });
    });

    /* Register teardown so leaving the home view kills this loop cleanly. */
    homeDemoStops.push(() => { stop(); clearAll(); });
    /* Hold the first tick until the return transition has landed —
       flipping card classes mid-transition costs frames on a phone. */
    timer = setTimeout(tick, 700);
  }

  /* ============================================================

  /* ---- Project data ---- */
  function projectRecords() { return db.records.filter((r) => r.type === 'PROJECT' && !r.deleted); }

  function newProject() {
    return {
      id: uid(), type: 'PROJECT',
      docNo: nextProjNo(),
      createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(),
      status: 'draft',
      started: false,                   /* gate the pipeline until the overview is submitted */
      overviewConfirmed: false,
      fields: { customer: '', title: '', contact: '', enquiryDate: todayISO(), owner: '', needConcept: false, needQuotation: false },
      topics: [],                       /* [{id, title, desc, img}] */
      feasibility: { confirmed: false, disc: {}, engineer: '', solutionDate: '' },  /* disc: { key:{on,idea} } */
      solution: { confirmed: false, files: [] },
      proposal: { confirmed: false, present: [], scope: [], cost: [], timeline: [] },
      meeting: { date: '', time: '', end: '', people: [], confirmed: false },
      decision: 'pending',              /* pending | won | lost */
      kickoff: { date: '', lead: '', team: [], milestones: [] },
    };
  }

  function nextProjNo() {
    const year = new Date().getFullYear();
    const key = `REQ-${year}`;
    const used = db.records.filter((r) => r.docNo && r.docNo.startsWith(key))
      .map((r) => parseInt(r.docNo.slice(key.length + 1), 10)).filter((n) => !isNaN(n));
    return `${key}-${String((used.length ? Math.max(...used) : 0) + 1).padStart(4, '0')}`;
  }

  function createAndOpenProject() {
    const p = newProject();
    p.fields.owner = meName();   /* logged under whoever is on this device */
    p.draft = true;
    /* Held in memory only — NOT saved or synced yet. It becomes a real,
       persisted requirement the moment the user types anything into it
       (touch → saveDB). Until then, leaving the page just discards it, so
       clicking "New Requirement" and backing out never spams the list. */
    db.records.push(p);
    go('reqview', { projectId: p.id });
  }

  /* Leaving an untouched, empty draft throws it away. If it had already
     been saved/synced (the user typed then cleared everything), it is
     tombstoned so the empty shell does not linger on other devices.
     Deferred out of the navigation frame — mutating db.records inside the
     view transition strands the render — and the list already hides empty
     drafts, so nothing shows in the gap. */
  function dropEmptyDraft(id) {
    const p = db.records.find((r) => r.id === id && r.type === 'PROJECT');
    if (!p || projHasContent(p)) return;
    setTimeout(() => {
      const q = db.records.find((r) => r.id === id && r.type === 'PROJECT');
      if (!q || projHasContent(q)) return;   /* got content in the meantime */
      if (q.updatedAt !== q.createdAt) tombstoneRecord(q);   /* was saved → tombstone */
      else db.records = db.records.filter((r) => r.id !== id);   /* never saved → drop */
    }, 0);
  }

  /* Which stage a project has reached, from its confirmations/decision. */
  function projStage(p) {
    if (p.decision === 'won') return 'won';
    if (p.decision === 'lost') return 'lost';

    if (p.proposal && p.proposal.confirmed) return 'meeting';

  }

  /* ---- Local-only file store (big files that don't sync) ----
     Kept in its own localStorage key so a quota failure here never
     corrupts the synced records. Images under the limit go straight into
     the record and sync; everything else is stored here by id. */
  const LOCAL_FILES_KEY = STORAGE_KEY + '.localfiles';
  const SYNC_IMG_LIMIT = 320 * 1024;   /* images up to ~320KB sync inline */
  function localFilesMap() { try { return JSON.parse(localStorage.getItem(LOCAL_FILES_KEY) || '{}'); } catch (e) { return {}; } }
  function putLocalFile(id, dataURL) {
    const m = localFilesMap(); m[id] = dataURL;
    try { localStorage.setItem(LOCAL_FILES_KEY, JSON.stringify(m)); return true; } catch (e) { return false; }
  }
  function getLocalFile(id) { return localFilesMap()[id] || null; }
  function fileDataURL(f) { return f.data || getLocalFile(f.id) || null; }

  /* Read a File → attach a descriptor to `list`, then re-render. Images
     within the limit are stored inline (synced); larger files are kept
     on this device only. */
  function attachFile(rec, list, file) {
    const reader = new FileReader();
    reader.onload = () => {
      const dataURL = reader.result;
      const isImg = /^image\//.test(file.type);
      const f = { id: uid(), name: file.name, type: file.type || '', size: file.size, kind: isImg ? 'image' : 'file', data: null, synced: false };
      if (isImg && file.size <= SYNC_IMG_LIMIT) {
        f.data = dataURL; f.synced = true;
      } else {
        const ok = putLocalFile(f.id, dataURL);
        f.synced = false;
        if (!ok) { f.tooBig = true; toast(T({ en: 'File too large to store — kept name only', th: 'ไฟล์ใหญ่เกินไป เก็บได้เฉพาะชื่อ' }), true); }
      }
      list.push(f);
      touch(rec);
      render();
    };
    reader.readAsDataURL(file);
  }

  function fileExtLabel(f) {
    const m = (f.name || '').match(/\.([a-z0-9]+)$/i);
    return (m ? m[1] : (f.type.split('/')[1] || 'file')).toUpperCase();
  }
  function humanSize(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; }

  /* One file's preview card. Images show a thumbnail; other files show a
     typed icon; a data URL that exists on this device opens on tap. */
  function filePreview(rec, list, f, editable) {
    const data = fileDataURL(f);
    const open = () => { if (data) { const w = window.open(); if (w) w.document.write(`<iframe src="${data}" style="border:0;position:fixed;inset:0;width:100%;height:100%"></iframe>`); } };
    const thumb = f.kind === 'image' && data
      ? el('span', { class: 'fp-thumb', style: `background-image:url(${data})` })
      : el('span', { class: 'fp-ico' }, [icon(f.kind === 'image' ? 'vision' : 'proposal', 20), el('span', { class: 'fp-ext', text: fileExtLabel(f) })]);
    const kids = [
      thumb,
      el('div', { class: 'fp-meta' }, [
        el('div', { class: 'fp-name', title: f.name, text: f.name }),
        el('div', { class: 'fp-sub', text: humanSize(f.size) + (f.synced ? '' : ' · ' + T(UI.file_local_note)) }),
      ]),
    ];
    if (data) kids.push(el('button', { class: 'fp-open', type: 'button', title: T(UI.preview), onclick: open }, [icon('records', 15)]));
    if (editable) kids.push(el('button', { class: 'fp-del', type: 'button', title: T(UI.remove), onclick: () => { const i = list.indexOf(f); if (i >= 0) list.splice(i, 1); touch(rec); render(); } }, ['✕']));
    return el('div', { class: 'file-card' + (f.synced ? '' : ' is-local') }, kids);
  }

  /* An upload zone: a labelled "attach" button plus the previews. */
  function uploadZone(rec, list, editable, label, accept) {
    const zone = el('div', { class: 'upload-zone' });
    if (label) zone.appendChild(el('div', { class: 'uz-label' }, [L(label)]));
    const grid = el('div', { class: 'file-grid' });
    (list || []).forEach((f) => grid.appendChild(filePreview(rec, list, f, editable)));
    if (editable) {
      const input = el('input', { type: 'file', accept: accept || '', style: 'display:none', multiple: true,
        onchange: (e) => { Array.prototype.forEach.call(e.target.files, (file) => attachFile(rec, list, file)); e.target.value = ''; } });
      grid.appendChild(el('button', { class: 'file-add', type: 'button', onclick: () => input.click() }, [icon('upload', 20), el('span', { text: T(UI.file_add) }), input]));
    }
    zone.appendChild(grid);

  /* A topic's pictures, tolerant of the old single-image field. */
  function topicImgs(tp) {
    if (tp.imgs && tp.imgs.length) return tp.imgs;
    if (tp.img) return [tp.img];
    return [];
  }

  /* Shrink an uploaded image before storing it — topic pictures sync
     inside the record, so keeping them ~1400px / JPEG keeps the record
     small enough for Firestore. Falls back to the raw data on failure. */
  function downscaleImage(file, cb) {
    const rd = new FileReader();
    rd.onload = () => {
      const img = new Image();
      img.onload = () => {
        try {
          const max = 1400;
          let w = img.width, h = img.height;
          if (w > max || h > max) { const s = max / Math.max(w, h); w = Math.round(w * s); h = Math.round(h * s); }
          const c = document.createElement('canvas'); c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          cb(c.toDataURL('image/jpeg', 0.85));
        } catch (e) { cb(rd.result); }
      };
      img.onerror = () => cb(rd.result);
      img.src = rd.result;
    };
    rd.readAsDataURL(file);
  }

  /* Full-screen picture viewer: arrows / swipe to slide, click backdrop
     or ✕ or Escape to close. Reusable for any list of image data URLs. */
  function openLightbox(images, start) {
    if (!images || !images.length) return;
    let idx = start || 0;
    const overlay = el('div', { class: 'lightbox' });
    const imgEl = el('img', { class: 'lb-img', alt: '' });
    const counter = el('div', { class: 'lb-count' });
    const show = () => { imgEl.src = images[idx]; counter.textContent = (idx + 1) + ' / ' + images.length; };
    const prev = () => { idx = (idx - 1 + images.length) % images.length; show(); };
    const next = () => { idx = (idx + 1) % images.length; show(); };
    const onKey = (e) => { if (e.key === 'Escape') close(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === 'ArrowRight') next(); };
    function close() { overlay.classList.remove('show'); document.removeEventListener('keydown', onKey); setTimeout(() => overlay.remove(), 200); }
    const btnPrev = el('button', { class: 'lb-nav lb-prev', 'aria-label': 'Previous', onclick: (e) => { e.stopPropagation(); prev(); } }, ['‹']);
    const btnNext = el('button', { class: 'lb-nav lb-next', 'aria-label': 'Next', onclick: (e) => { e.stopPropagation(); next(); } }, ['›']);
    const stage = el('div', { class: 'lb-stage' }, [imgEl]);
    overlay.appendChild(el('button', { class: 'lb-close', 'aria-label': 'Close', onclick: close }, ['✕']));
    overlay.appendChild(btnPrev);
    overlay.appendChild(btnNext);
    overlay.appendChild(stage);
    overlay.appendChild(counter);
    overlay.addEventListener('click', (e) => { if (e.target === overlay || e.target === stage) close(); });
    let sx = 0;
    overlay.addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; }, { passive: true });
    overlay.addEventListener('touchend', (e) => { const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 40) { if (dx < 0) next(); else prev(); } });
    if (images.length < 2) { btnPrev.style.display = 'none'; btnNext.style.display = 'none'; counter.style.display = 'none'; }
    document.addEventListener('keydown', onKey);
    document.body.appendChild(overlay);
    show();
    requestAnimationFrame(() => overlay.classList.add('show'));
  }

  /* ---- New Requirement (fallback for a direct #/reqnew hash) ---- */
  function viewReqNew(root) {
    /* Not a real page — creating one and opening its pipeline. Defer so
       we never re-enter render() from inside render(). */
    setTimeout(createAndOpenProject, 0);
    root.appendChild(el('div', { class: 'empty' }, [L({ en: 'Creating…', th: 'กำลังสร้าง…' })]));
  }

  /* ---- Requirement list ---- */
  /* Position of a stage in the pipeline, for ordering (begin → final). */
  const STAGE_ORDER = PROJ_STAGES.reduce((a, s, i) => { a[s.key] = i; return a; }, {});

  /* What a project is waiting on next — the form to confirm, its colour,
     an icon and name for the list, and how fast the card blinks. Later,
     more time-sensitive stages carry a higher priority, so they blink
     faster (a smaller duration). */
  const PENDING = {
    requirement: { form: 'feasibility', icon: 'feasible', color: '#ffd60a', dur: 3.2, name: { en: 'Technical Feasibility', th: 'ความเป็นไปได้ทางเทคนิค' } },
    solution:    { form: 'solution',    icon: 'solution', color: '#ff9f0a', dur: 2.5, name: { en: 'Solution Design',      th: 'ออกแบบโซลูชัน' } },
    proposal:    { form: 'proposal',    icon: 'proposal', color: '#00c2d6', dur: 1.9, name: { en: 'Proposal',             th: 'ข้อเสนอ' } },
    meeting:     { form: 'meeting',     icon: 'meeting',  color: '#15e6cf', dur: 1.4, name: { en: 'Customer Meeting',      th: 'นัดประชุมลูกค้า' }, aura: true },
    decision:    { form: 'decision',    icon: 'clock',    color: '#ffd60a', dur: 1.2, name: { en: 'Awaiting decision',     th: 'รอลูกค้าตัดสินใจ' }, waiting: true },
  };
  /* The card's live status: a final outcome (won/lost, no blink), or the
     next pending form (blinks in its colour at its speed). */
  function cardStatus(p) {
    const st = projStage(p);
    if (st === 'won')  return { key: 'won',  color: '#30d158', icon: 'won',  name: { en: 'Won',  th: 'ได้งาน' }, blink: false };
    if (st === 'lost') return { key: 'lost', color: '#ff453a', icon: 'lost', name: { en: 'Lost', th: 'เสียงาน' }, blink: false };
    const pd = PENDING[st] || PENDING.requirement;
    return { key: st, color: pd.color, icon: pd.icon, name: pd.name, dur: pd.dur, aura: pd.aura, waiting: pd.waiting, blink: true };
  }

  /* A project is worth listing only once it holds real content — any
     overview field, a topic, or a confirmed stage. Opening "New
     Requirement" and walking away leaves an empty draft that never
     reaches the list (or the shared database). */
  function projHasContent(p) {
    const f = p.fields || {};
    if ((f.title || '').trim() || (f.customer || '').trim() || (f.contact || '').trim()) return true;
    if ((p.topics || []).length) return true;
    if (p.feasibility && p.feasibility.confirmed) return true;
    if (p.solution && p.solution.confirmed) return true;
    if (p.proposal && p.proposal.confirmed) return true;
    if (p.meeting && p.meeting.confirmed) return true;
    if (p.decision && p.decision !== 'pending') return true;
    if (p.submitted) return true;
    return false;
  }
  function listableProjects() { return projectRecords().filter(projHasContent); }

  function projOwner(p) { return (p.fields && p.fields.owner) || ''; }
  function projEngineer(p) { return (p.feasibility && p.feasibility.engineer) || ''; }
  function projSolutionDate(p) { return (p.feasibility && p.feasibility.solutionDate) || ''; }
  /* Everyone a project is on the hook for — used by the person filter. */
  function projPeopleNames(p) {
    const s = new Set();
    if (projOwner(p)) s.add(projOwner(p));
    if (projEngineer(p)) s.add(projEngineer(p));
    return s;
  }

  /* One requirement = one compact line: status · no · title · customer ·
     needs · people · date. Everything sits on a single row, short height. */
  function reqCard(p) {
    const cs = cardStatus(p);
    const cls = 'req-card req-compact status-' + cs.key + ' ' + (cs.blink ? 'is-blink' : 'is-final') + (cs.aura ? ' is-aura' : '');
    const style = `--sc:${cs.color};--blink-dur:${cs.dur || 2.2}s`;
    const f = p.fields || {};
    const owner = projOwner(p), eng = projEngineer(p);

    /* Customer-need chips with full names, filled once delivered. */
    const needMini = [];
    if (f.needConcept) needMini.push(el('span', { class: 'rc-need' + (p.solution && p.solution.confirmed ? ' sent' : ''), style: '--nc:#bf5af3' }, [L({ en: 'Concept', th: 'คอนเซ็ปต์' })]));
    if (f.needQuotation) needMini.push(el('span', { class: 'rc-need' + (p.proposal && p.proposal.confirmed ? ' sent' : ''), style: '--nc:#00c2d6' }, [L({ en: 'Quotation', th: 'ใบเสนอราคา' })]));
    const needsEl = needMini.length ? el('span', { class: 'rc-needs' }, needMini) : null;

    /* People — admin then engineer; engineer's border runs on a loop. */
    const person = (cls2, color, ic, roleLabel, name) => el('span', { class: 'rc-person ' + cls2, style: `--role:${color}`, title: T(roleLabel) + ': ' + name }, [
      el('span', { class: 'rc-person-ico' }, [icon(ic, 11)]), el('span', { class: 'rc-person-name', text: name }),
    ]);
    const people = [];
    if (owner) people.push(person('is-admin', '#5e5ce6', 'reqnew', { en: 'Admin', th: 'แอดมิน' }, owner));
    if (eng) people.push(person('is-eng', '#0a84ff', 'feasible', { en: 'Engineer', th: 'วิศวกร' }, eng));
    const peopleEl = people.length ? el('span', { class: 'rc-people' }, people) : null;

    /* The date that matters now, by status: send-solution or meet-customer.
       Its colour and blink follow how close it is to today (see
       dateUrgency); a delivered milestone is calm. */
    const stage = projStage(p), mtg = p.meeting || {}, solDate = projSolutionDate(p);
    let dateEl = null, dateLabel = null, dateValue = null, dateOverdue = false;
    let targetISO = null, dateIcon = null, pending = false;
    if (mtg.date && (mtg.confirmed || stage === 'meeting' || stage === 'decision')) {
      targetISO = mtg.date; dateIcon = 'meeting'; pending = p.decision === 'pending';
      dateLabel = { en: 'Meet customer', th: 'นัดพบลูกค้า' };
      dateValue = fmtDate(mtg.date) + (mtg.time ? '  ' + mtg.time : '');
    } else if (solDate) {
      targetISO = solDate; dateIcon = 'solution'; pending = !(p.solution && p.solution.confirmed);
      dateLabel = { en: 'Send solution to customer', th: 'ส่งโซลูชันให้ลูกค้า' };
      dateValue = fmtDate(solDate);
    }
    if (targetISO) {
      const u = dateUrgency(targetISO, pending);
      dateOverdue = u.late;
      dateEl = el('span', { class: 'rc-date' + (u.blink ? ' blink-' + u.blink : ''), style: `--dc:${u.color}`, title: T(dateLabel) }, [
        icon(u.late ? 'clock' : dateIcon, 12),
        u.late ? el('span', { class: 'rc-date-late' }, [L({ en: 'LATE', th: 'เลย' })]) : null,
        el('span', { text: fmtDate(targetISO) }),
      ]);
    }

    /* Hover preview — the full detail of what the compact line squeezes,
       so nothing is lost to truncation before the user clicks in. */
    const pop = reqPreview(p, cs, { owner, eng, needConcept: f.needConcept, needQuotation: f.needQuotation,
      conceptSent: !!(p.solution && p.solution.confirmed), quoteSent: !!(p.proposal && p.proposal.confirmed),
      dateLabel, dateValue, dateOverdue });

    return el('button', { class: cls, style, onclick: () => go('reqview', { projectId: p.id }) }, [
      el('span', { class: 'rc-status' }, [el('span', { class: 'rc-status-ico' }, [icon(cs.icon, 15)]), el('span', { class: 'rc-status-name' }, [L(cs.name)])]),
      el('span', { class: 'rc-no', text: p.docNo }),
      el('span', { class: 'rc-title', text: p.fields.title || T({ en: '(untitled requirement)', th: '(ยังไม่ตั้งชื่อ)' }) }),
      el('span', { class: 'rc-cust', text: p.fields.customer || '—' }),
      el('span', { class: 'rc-spring' }),
      needsEl,
      peopleEl,
      dateEl,
      pop,
    ]);
  }

  /* The little card that appears on hovering a requirement row. */
  function reqPreview(p, cs, d) {
    const row = (labelObj, node) => node ? el('div', { class: 'rp-row' }, [el('span', { class: 'rp-k' }, [L(labelObj)]), el('span', { class: 'rp-v' }, [node])]) : null;

    if (d.needQuotation) needChips.push(el('span', { class: 'rc-need' + (d.quoteSent ? ' sent' : ''), style: '--nc:#00c2d6' }, [L({ en: 'Quotation', th: 'ใบเสนอราคา' }), d.quoteSent ? ' ✓' : '']));

        row({ en: 'Enquiry date', th: 'วันที่สอบถาม' }, txt(fmtDate(p.fields.enquiryDate))),
