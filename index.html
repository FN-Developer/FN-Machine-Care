<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<!-- Exactly the FN-ERP-System zoom lock. The 110% is not in here:
     it comes from `zoom` in the stylesheet, which derives the layout
     box from the viewport rather than asking the browser to derive
     the viewport from a scale. Carrying the scale in this tag is what
     produced the page that panned sideways on an iPhone.

     iOS Safari has ignored user-scalable and the scale bounds since
     iOS 10, so on an iPhone or iPad this tag does not stop a pinch —
     the ERP has the same gap. blockPinchShrink() covers iOS. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="description" content="FN Machine Care — Machine Inspection & Service Management System for F N Technology. Machine build checklist (ASSY), factory acceptance test (FAT), site acceptance test (SAT), and customer service reports (SR).">
<meta name="theme-color" content="#0a0d16">
<title>FN Machine Care — Machine Inspection &amp; Service Management</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='26' fill='%230906d7'/><text y='68' x='50' font-size='50' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>FN</text></svg>">
<style>
/* =============================================================
   FN MACHINE CARE — visionOS theme
   -------------------------------------------------------------
   The design rule that governs everything here:

       GLASS FOR THE CHROME.  SOLID FOR THE VERDICT.

   Panels, sidebar, toolbar and cards are true frosted glass
   floating over an ambient environment. But PASS / FAIL / N/A —
   and every status that carries a safety consequence — are fully
   opaque and saturated. They punch through the glass like real
   hardware buttons. A technician under factory lighting must
   never squint to tell whether a row passed.
   ============================================================= */

/* ---------------- Tokens: light (default) ---------------- */

:root {
  color-scheme: light;

  /* Environment behind the glass */
  --env-1: #c6d3ea;
  --env-2: #dae2f0;
  --orb-a: rgba(10, 132, 255, .16);
  --orb-b: rgba(191, 90, 243, .10);
  --orb-c: rgba(48, 209, 88, .07);

  /* Glass surfaces — layered by elevation */
  --glass:        rgba(253, 254, 255, .58);
  --glass-raised: rgba(253, 254, 255, .72);
  --glass-bar:    rgba(246, 249, 253, .96);
  --glass-drawer: rgba(244, 247, 252, .96);
  --glass-sunken: rgba(255, 255, 255, .26);
  --glass-hover:  rgba(255, 255, 255, .80);

  /* Edges: a bright specular rim above, a soft shadow below */
  --edge:       rgba(255, 255, 255, .70);
  --edge-quiet: rgba(9, 20, 48, .12);
  --hairline:   rgba(9, 20, 48, .12);
  --hairline-soft: rgba(9, 20, 48, .07);

  --lift-1: 0 1px 2px rgba(12, 24, 56, .06), 0 6px 18px rgba(12, 24, 56, .07);
  --lift-2: 0 2px 6px rgba(12, 24, 56, .08), 0 18px 44px rgba(12, 24, 56, .12);
  --lift-3: 0 8px 20px rgba(12, 24, 56, .12), 0 34px 70px rgba(12, 24, 56, .18);
  --specular: inset 0 1px 0 rgba(255, 255, 255, .9);

  /* Ink */
  --text:       #0d1526;
  --text-dim:   #414c66;
  --text-faint: #5c6780;

  /* Fields sit *under* the glass, so they go slightly darker */
  --field:       rgba(255, 255, 255, .70);
  --field-focus: rgba(255, 255, 255, .96);

  /* Apple system colors — the accent language of visionOS */
  --accent-blue:   #0a84ff;
  --accent-violet: #bf5af3;
  --accent-orange: #ff9f0a;
  --accent-yellow: #ffd60a;
  --accent-red:    #ff453a;
  --accent-green:  #30d158;

  --brand: var(--accent-blue);

  /* Wordmark: base ink, and the light that travels through it */
  /* Chart series — validated with the dataviz palette checker against
     this theme's surface: lightness band, chroma floor, colour-blind
     separation (ΔE 27.8 protan) and 3:1 contrast all pass. Dark mode
     uses its own steps, not a flip of these. */
  --series-1: #1d6fd4;
  --series-2: #c2410c;

  --scroll-thumb:       rgba(9, 20, 48, .26);
  --scroll-thumb-hover: rgba(9, 20, 48, .42);

  --wm-base: #101a2e;
  --wm-hi:   #1560ff;
  --wm-hi-2: #2fa34a;

  /* FN-ERP-System brand tone — its logo is a blue→indigo tile with a
     cyan→green light band running through it. Machine Care borrows the
     same colours so the two apps read as one family. */
  --erp-blue:   #0906d7;
  --erp-indigo: #4b49ff;
  --erp-cyan:   #00eaff;
  --erp-green:  #77e947;

  /* "F N Technology" runs a colour band through the letters. On a light
     surface the vivid cyan/green would wash out, so the ramp is deepened
     here; dark mode swaps in the bright ERP version below. */
  --ft-1: #0906d7;
  --ft-2: #4b49ff;
  --ft-3: #0093b0;
  --ft-4: #2f8f3a;

  --pass:  #248a3d;
  --fail:  #d70015;
  --na:    #8e8e93;
  --warn:  #a86800;

  /* Solid verdict fills — deliberately opaque */
  --pass-fill: #34c759;
  --fail-fill: #ff3b30;
  --na-fill:   #8e8e93;
  --pass-ink:  #ffffff;
  --fail-ink:  #b3000c;

  --bar-h: 65px;

  --radius-window: 26px;
  --radius-card:   20px;
  --radius-ctl:    13px;
  --radius-pill:   999px;

  --blur: saturate(180%) blur(30px);

  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
          "Segoe UI Variable Text", "Segoe UI", "Noto Sans Thai", "IBM Plex Sans Thai",
          "Leelawadee UI", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Consolas, monospace;
}

/* ---------------- Tokens: dark ---------------- */

:root[data-theme="dark"] {
  color-scheme: dark;

  --env-1: #070a12;
  --env-2: #0e1424;
  --orb-a: rgba(10, 132, 255, .34);
  --orb-b: rgba(191, 90, 243, .26);
  --orb-c: rgba(48, 209, 88, .16);

  --glass:        rgba(30, 36, 52, .62);
  --glass-raised: rgba(40, 47, 66, .74);
  --glass-bar:    rgba(19, 24, 38, .977);
  --glass-drawer: rgba(22, 27, 42, .975);
  --glass-sunken: rgba(16, 21, 34, .52);
  --glass-hover:  rgba(52, 60, 82, .78);

  --edge:       rgba(255, 255, 255, .16);
  --edge-quiet: rgba(255, 255, 255, .08);
  --hairline:   rgba(255, 255, 255, .11);
  --hairline-soft: rgba(255, 255, 255, .06);

  --lift-1: 0 1px 2px rgba(0, 0, 0, .34), 0 6px 18px rgba(0, 0, 0, .34);
  --lift-2: 0 2px 6px rgba(0, 0, 0, .40), 0 18px 44px rgba(0, 0, 0, .46);
  --lift-3: 0 8px 20px rgba(0, 0, 0, .46), 0 34px 70px rgba(0, 0, 0, .56);
  --specular: inset 0 1px 0 rgba(255, 255, 255, .14);

  --text:       #f1f4fb;
  --text-dim:   #b9c1d4;
  --text-faint: #98a2b9;

  --field:       rgba(10, 14, 24, .55);
  --field-focus: rgba(10, 14, 24, .82);

  --series-1: #2f80e0;
  --series-2: #c9702a;

  --scroll-thumb:       rgba(255, 255, 255, .22);
  --scroll-thumb-hover: rgba(255, 255, 255, .38);

  --wm-base: #eef2fb;
  --wm-hi:   #00eaff;
  --wm-hi-2: #77e947;

  /* Dark surface: the vivid ERP colours pop, so run them at full strength. */
  --ft-1: #6f8bff;
  --ft-2: #00eaff;
  --ft-3: #77e947;
  --ft-4: #a9b8ff;

  --pass: #4ee16f;
  --fail: #ff6961;
  --na:   #98989d;
  --warn: #ffd60a;

  --pass-fill: #30d158;
  --fail-fill: #ff453a;
  --na-fill:   #8e8e93;
  --pass-ink:  #04220d;
  --fail-ink:  #ff9d97;
}

* { box-sizing: border-box; }

/* ---------------- UI scale ----------------
   The app is drawn 10% larger, so at the browser's own 100% it reads
   like 110% and nobody has to reach for Ctrl-+ on a plant-floor tablet.

   `zoom` rather than `transform: scale()`: zoom reflows, so text still
   wraps to the space it actually occupies. A transform would paint a
   1440px layout at 1584px and hang a scrollbar off the side.

   Four things zoom does NOT scale, each handled below:
     1. viewport units — 100vh still means the real viewport, so a
        zoomed 100vh block is 110% of the screen and overflows
     2. media query widths — they test the real viewport, so every
        breakpoint has to be widened by the same factor
     3. the drawer's 84vw cap — same reason as (1)
     4. print — A4 pagination must not be zoomed at all
   Change --ui-scale in one place and all four follow. */
:root { --ui-scale: 1.1; }

html {
  zoom: var(--ui-scale);
}

/* One mechanism, every device — and the reason matters, because the
   alternative was tried and produced the bug it was meant to avoid.

   Scaling through the viewport tag (initial-scale=1.1) asks the browser
   to lay out at deviceWidth / 1.1 and paint it larger. It works, but the
   layout width is then something the browser derives, and getting it
   wrong by one attribute puts part of the page where nobody can reach
   it: pairing it with width=device-width laid out 390px of content in a
   355px window and the whole app panned sideways under the thumb.

   CSS zoom does not touch the viewport at all. The layout box is
   viewport / zoom by construction, so the content cannot be wider than
   the screen no matter what the tag says. `zoom` is a WebKit-born
   property; Safari has honoured it far longer than Chrome has.

   That leaves the viewport tag free to be exactly what FN-ERP-System
   uses — a plain 1.0 lock — rather than carrying the scale as well. */
@media (pointer: coarse) {
  /* Drops double-tap-to-zoom, the other way a scale gets stuck.
     Pinch is handled in blockPinchShrink() so magnifying still works. */
  body { touch-action: manipulation; }
}

html, body {
  margin: 0;
  padding: 0;
  /* Not 100%: a percentage here resolves against the real viewport and is
     then painted 10% taller, hanging a scrollbar off a page with nothing
     to scroll. Divide it back out like every other viewport unit. */
  min-height: calc(100vh / var(--ui-scale));
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
}

body {
  background: linear-gradient(168deg, var(--env-1) 0%, var(--env-2) 100%);
  background-attachment: fixed;
}

button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }

/* Print mirrors of field values — built on demand, hidden on screen. */
.print-value { display: none; }

/* ---------------- Date field & calendar ----------------
   DD/MM/YYYY on every device. A native date input renders in the
   browser's own locale, so this is our own control instead. */

.datefield { position: relative; display: flex; align-items: center; gap: 6px; }
.datefield .date-text { flex: 1 1 auto; min-width: 0; font-variant-numeric: tabular-nums; }
.datefield .date-text.is-bad {
  border-color: var(--fail) !important;
  box-shadow: 0 0 0 3px rgba(255, 69, 58, .16);
}

.date-open {
  flex: 0 0 auto;
  display: inline-flex; align-items: center; justify-content: center;
  width: 34px; height: 34px;
  border: 1px solid var(--hairline);
  border-radius: 9px;
  background: var(--glass-soft);
  color: var(--text-dim);
  cursor: pointer;
  transition: color .18s ease, background .18s ease, transform .12s ease;
}
.date-open:hover { color: var(--accent-blue); background: var(--field-focus); }
.date-open:active { transform: scale(.94); }

.datecal {
  position: fixed;
  z-index: 90;
  width: 268px;
  padding: 12px;
  border-radius: 16px;
  border: 1px solid var(--hairline);
  /* Near-opaque, like the drawer. A calendar is a thing you read digits
     off, and through the frosted panel the fields behind it showed
     through the day grid — 09:00 AM sitting on top of week three. Glass
     for chrome, solid where something has to be read. */
  background: var(--glass-drawer);
  -webkit-backdrop-filter: saturate(180%) blur(30px);
  backdrop-filter: saturate(180%) blur(30px);
  box-shadow: var(--lift-3), var(--specular);
  animation: cal-in .16s cubic-bezier(.22,1,.36,1);
}
@keyframes cal-in { from { opacity: 0; transform: translateY(-5px) scale(.985); } }

.datecal-head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.datecal-title {
  flex: 1; text-align: center; font-weight: 650; font-size: 14px;
  background: none; border: 0; color: var(--text); cursor: pointer; padding: 5px 4px; border-radius: 8px;
}
.datecal-title:hover { background: var(--field-focus); }
.datecal-nav {
  width: 30px; height: 30px; flex: 0 0 auto;
  border: 1px solid var(--hairline); border-radius: 8px;
  background: var(--glass-soft); color: var(--text-dim);
  font-size: 17px; line-height: 1; cursor: pointer;
}
.datecal-nav:hover { color: var(--accent-blue); background: var(--field-focus); }

.datecal-dow, .datecal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.datecal-dow span {
  text-align: center; font-size: 10.5px; font-weight: 600;
  color: var(--text-faint); padding: 3px 0; letter-spacing: .04em;
}
.datecal-day {
  height: 32px; border: 0; border-radius: 9px;
  background: none; color: var(--text);
  font-size: 13px; font-variant-numeric: tabular-nums; cursor: pointer;
  transition: background .14s ease, color .14s ease;
}
.datecal-day:hover { background: var(--field-focus); }
.datecal-pad { height: 32px; }

/* Today is an outline, the chosen day is solid — the same rule the rest
   of the app follows: glass for context, solid for the verdict. */
.datecal-day.is-today { box-shadow: inset 0 0 0 1.5px var(--accent-blue); }
.datecal-day.is-sel {
  background: var(--accent-blue) !important;
  color: #fff; font-weight: 700;
}

.datecal-foot {
  display: flex; gap: 6px; margin-top: 9px;
  padding-top: 9px; border-top: 1px solid var(--hairline-soft);
}
.datecal-foot .btn { flex: 1; }

/* Quiet by design: present on every screen, never competing with the
   document in front of the technician. */
.foot-note .credit {
  display: block;
  margin-top: 5px;
  font-size: 10.5px;
  letter-spacing: .015em;
  color: var(--text-faint);
  opacity: .85;
}

/* Says a newer build exists rather than letting a phone sit on a stale
   copy that looks identical to a broken one. Bottom of the screen, out
   of the way of the sticky bar at the top. */
.update-banner {
  position: fixed;
  left: 50%; bottom: 18px;
  transform: translateX(-50%);
  z-index: 92;
  display: flex;
  align-items: center;
  gap: 12px;
  max-width: calc(100vw - 24px);
  padding: 11px 13px 11px 18px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--edge);
  background: var(--glass-drawer);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  box-shadow: var(--lift-3), var(--specular);
  font-size: 13.5px;
  animation: cal-in .22s cubic-bezier(.22,1,.36,1);
}
.update-banner span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 616px) {
  .update-banner { left: 12px; right: 12px; transform: none; max-width: none; padding-left: 15px; }
  .update-banner span { white-space: normal; }
}
@media print { .update-banner { display: none !important; } }

/* A screen that could not be drawn says so, rather than going blank. */
.fail-card { max-width: 620px; margin: 20px auto; }
.fail-card h2 { margin: 0 0 8px; font-size: 19px; }
.fail-card p { margin: 0 0 14px; color: var(--text-dim); }
.fail-detail {
  margin: 0 0 16px;
  padding: 12px 14px;
  border-radius: 10px;
  background: var(--field);
  border: 1px solid var(--hairline);
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.5;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  color: var(--text-dim);
}

@media (max-width: 616px) { .datecal { width: min(268px, 92vw); } }

:focus-visible {
  outline: 2.5px solid var(--accent-blue);
  outline-offset: 2px;
  border-radius: 6px;
}

.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ---------------- Scrollbars ----------------
   Thin, translucent, and they take the accent when grabbed — the
   scrollbar is part of the glass, not a system leftover. */

* { scrollbar-width: thin; scrollbar-color: var(--scroll-thumb) transparent; }

::-webkit-scrollbar { width: 11px; height: 11px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--scroll-thumb);
  border: 3px solid transparent;
  background-clip: content-box;
  border-radius: 999px;
}
::-webkit-scrollbar-thumb:hover { background: var(--scroll-thumb-hover); background-clip: content-box; }
::-webkit-scrollbar-thumb:active { background: var(--accent-blue); background-clip: content-box; }

.table-wrap::-webkit-scrollbar, .sidebar::-webkit-scrollbar { width: 8px; height: 8px; }
.table-wrap::-webkit-scrollbar-thumb, .sidebar::-webkit-scrollbar-thumb { border-width: 2px; }

/* ---------------- The environment ---------------- */

.ambient {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}
.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(90px);
  will-change: transform;
}
.orb-1 { width: 46vw; height: 46vw; left: -10vw; top: -12vw;   background: var(--orb-a); animation: drift-a 34s ease-in-out infinite; }
.orb-2 { width: 38vw; height: 38vw; right: -8vw; top: 22vh;    background: var(--orb-b); animation: drift-b 42s ease-in-out infinite; }
.orb-3 { width: 34vw; height: 34vw; left: 26vw;  bottom: -14vw; background: var(--orb-c); animation: drift-c 38s ease-in-out infinite; }

@keyframes drift-a { 0%,100% { transform: translate3d(0,0,0) scale(1); } 50% { transform: translate3d(6vw,4vh,0) scale(1.12); } }
@keyframes drift-b { 0%,100% { transform: translate3d(0,0,0) scale(1); } 50% { transform: translate3d(-5vw,6vh,0) scale(1.08); } }
@keyframes drift-c { 0%,100% { transform: translate3d(0,0,0) scale(1); } 50% { transform: translate3d(4vw,-5vh,0) scale(1.15); } }

/* ---------------- Layout ---------------- */

.app {
  /* Deliberately no z-index: a stacking context here would trap the
     drawer beneath the scrim. It already paints above .ambient by
     DOM order. */
  position: relative;
  display: flex;
  min-height: calc(100vh / var(--ui-scale));
  gap: 16px;
  padding: 16px;
}

/* The sidebar is a floating window, not a wall */
.sidebar {
  width: 252px;
  flex: 0 0 252px;
  position: sticky;
  top: 16px;
  height: calc((100vh / var(--ui-scale)) - 32px);
  display: flex;
  flex-direction: column;
  /* The shell itself never scrolls: the brand stays at the top and the
     footer (theme, language, sync) stays pinned at the bottom. Only the
     nav in the middle flexes, so on a normal window nothing scrolls at
     all — and on a very short one only the nav gives, with its scrollbar
     hidden so the menu never shows a rail. */
  overflow: hidden;
  overscroll-behavior: contain;

  background: var(--glass);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border: 1px solid var(--edge);
  border-radius: var(--radius-window);
  box-shadow: var(--lift-2), var(--specular);
}
.sidebar::-webkit-scrollbar { width: 0; height: 0; display: none; }

.brand { padding: 20px 18px 16px; border-bottom: 1px solid var(--hairline-soft); }
.brand-sub { text-align: center; }
.brand-mark {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  white-space: nowrap;
}

/* ---- The mark ----
   A tile with a highlight that orbits its rim, and a wordmark that a
   band of light travels through every few seconds. Both idle slowly:
   this sits on screen all day next to a technician, so the motion has
   to be noticeable once and invisible thereafter. */

.brand-logo {
  position: relative;
  width: 66px; height: 66px;
  flex: 0 0 auto;
  border-radius: 11px;
  /* ERP tone: a blue→indigo tile with a cyan→green light band that RUNS
     vertically through it. Three background layers — the base gradient,
     the moving band (340% tall, slid by mark-run), and a solid fallback
     underneath so the tile is never bare mid-slide. */
  background:
    linear-gradient(145deg, var(--erp-blue), var(--erp-indigo)),
    linear-gradient(0deg,
      transparent 28%,
      rgba(0, 234, 255, .5) 38%,
      var(--erp-cyan) 46%,
      var(--erp-green) 54%,
      rgba(119, 233, 71, .5) 62%,
      transparent 72%),
    linear-gradient(var(--erp-blue), var(--erp-blue));
  background-size: 100% 100%, 100% 340%, 100% 100%;
  background-position: 0 0, 0 -240%, 0 0;
  animation: mark-run 4s linear infinite;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; color: #fff;
  letter-spacing: -.02em;
  box-shadow: 0 12px 30px rgba(9, 6, 215, .48), inset 0 1.5px 0 rgba(255, 255, 255, .5);
  isolation: isolate;
}
/* The band slides from above the tile to below it, so the cyan→green light
   sweeps down through the mark on a loop — the ERP's signature motion. */
@keyframes mark-run {
  0%   { background-position: 0 0, 0 -240%, 0 0; }
  100% { background-position: 0 0, 0 100%, 0 0; }
}
.brand-logo span { position: relative; z-index: 2; }
/* Match the ERP mark inside the tile: F white, N green, sitting side by
   side on one baseline. Each letter runs the ERP's glitch loop — a quick
   chromatic-aberration flicker (cyan/magenta split, a skew and a couple of
   clip-path slices) that fires in the first heartbeat of the cycle and
   then rests, so it catches the eye once and settles. steps(1) keeps the
   flicker hard-edged rather than smoothly tweened. */
.brand-logo .lf,
.brand-logo .ln {
  display: inline-block;
  position: relative;
  z-index: 2;
  transform-origin: center center;
  backface-visibility: hidden;
  will-change: transform, clip-path;
}
.brand-logo .lf { color: #fff; animation: glitchF 5s steps(1) infinite; }
.brand-logo .ln { color: var(--erp-green); animation: glitchN 6.5s steps(1) 1.6s infinite; }

@keyframes glitchF {
  0%, 4%, 100% { transform: translate(0, 0); text-shadow: none; clip-path: none; opacity: 1; }
  0.6% { transform: translate(-3px, 1px) skewX(-8deg); text-shadow: #00eaff -3px 0, #ff2bd6 3px 0; clip-path: inset(0 0 62%); }
  1.4% { transform: translate(3px, -1px);              text-shadow: #00eaff 3px 0, #ff2bd6 -3px 0; clip-path: inset(58% 0 8%); }
  2.2% { transform: translate(-2px, 0) skewX(6deg);    text-shadow: #00eaff -2px 0, #ff2bd6 2px 0; clip-path: inset(28% 0 40%); opacity: .85; }
  3.2% { transform: translate(2px, 1px);               text-shadow: #00eaff 2px 0, #ff2bd6 -2px 0; clip-path: none; }
}
@keyframes glitchN {
  0%, 4%, 100% { transform: translate(0, 0); text-shadow: none; clip-path: none; opacity: 1; }
  0.6% { transform: translate(3px, 1px) skewX(8deg);   text-shadow: #00eaff 3px 0, #ff2bd6 -3px 0; clip-path: inset(0 0 60%); }
  1.4% { transform: translate(-3px, -1px);             text-shadow: #00eaff -3px 0, #ff2bd6 3px 0; clip-path: inset(55% 0 10%); opacity: .82; }
  2.2% { transform: translate(2px, 0) skewX(-6deg);    text-shadow: #00eaff 2px 0, #ff2bd6 -2px 0; clip-path: inset(30% 0 38%); }
  3.2% { transform: translate(-1px, 1px);              text-shadow: #00eaff -1px 0, #ff2bd6 1px 0; clip-path: none; }
}
.brand-logo { border-radius: 20px; font-size: 24px; }

/* Orbiting rim highlight */
.brand-logo::before {
  content: '';
  position: absolute;
  inset: -1px;
  border-radius: inherit;
  padding: 2px;
  background: conic-gradient(from 0deg,
    transparent 0deg, transparent 250deg,
    rgba(255,255,255,.95) 300deg,
    transparent 350deg);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
          mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
          mask-composite: exclude;
  animation: mark-orbit 6s linear infinite;
  z-index: 3;
}
/* Breathing halo */
.brand-logo::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  box-shadow: 0 0 0 0 rgba(9, 6, 215, .55);
  animation: mark-pulse 4.5s ease-in-out infinite;
  z-index: 1;
}

@keyframes mark-orbit { to { transform: rotate(360deg); } }
@keyframes mark-pulse {
  0%, 70%, 100% { box-shadow: 0 0 0 0 rgba(9, 6, 215, .0); }
  85%           { box-shadow: 0 0 16px 3px rgba(0, 234, 255, .40); }
}

/* ---- Wordmark ---- */

.wordmark {
  display: inline-flex;
  align-items: baseline;
  gap: .34em;
  font-size: 18.5px;
  line-height: 1.15;
  white-space: nowrap;

  /* repeat-x matters: with no-repeat, any offset that pushes the
     gradient box past the text leaves those glyphs unpainted — and
     background-clip:text renders unpainted glyphs as nothing at all.
     Both ends of the ramp are --wm-base, so tiling is seamless. */
  background-image: linear-gradient(100deg,
    var(--wm-base) 0%,   var(--wm-base) 36%,
    var(--wm-hi)   46%,  var(--wm-hi-2) 53%,
    var(--wm-base) 64%,  var(--wm-base) 100%);
  background-size: 300% 100%;
  background-position-x: 0%;
  background-repeat: repeat-x;
  -webkit-background-clip: text;
          background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
  animation: wm-sweep 4.2s ease-in-out infinite;
}
/* Heavy, tightly tracked initials against a light, widely tracked name —
   the contrast is what makes it read as a mark rather than a label. */
.wm-fn {
  font-weight: 800;
  letter-spacing: -.045em;
  font-size: 1.06em;
}
.wm-rest {
  font-weight: 500;
  letter-spacing: .015em;
}

/* If the browser can't clip a gradient to text, show plain ink instead
   of nothing at all. */
@supports not ((-webkit-background-clip: text) or (background-clip: text)) {
  .wordmark {
    background: none;
    color: var(--text);
    -webkit-text-fill-color: currentColor;
    animation: none;
  }
}

/* A pause, then one pass of light. The percentages carry the whole feel:
   shortening the cycle alone would just make the light travel faster,
   which reads as frantic. So the idle hold shrinks and the travel window
   widens to match — the pass keeps its old ~2s pace, it simply comes
   round more often. */
@keyframes wm-sweep {
  0%, 48%   { background-position-x: 0%; }
  96%, 100% { background-position-x: 100%; }
}
.brand-sub {
  margin-top: 7px;
  font-size: 11.5px;
  color: var(--text-dim);
  line-height: 1.42;
}
/* "F N Technology" — the colour RUNS through the letters: a flowing ERP
   ramp (blue → indigo → cyan → green → blue) clipped to the text and slid
   sideways forever. The ramp colours come from --ft-* which are deepened
   for a light surface and vivid for a dark one, so it stays legible in
   both themes. Ends on the same colour it starts, so the loop is seamless. */
.brand-sub strong {
  font-weight: 800;
  letter-spacing: .05em;
  background-image: linear-gradient(100deg,
    var(--ft-1) 0%, var(--ft-2) 25%, var(--ft-3) 50%, var(--ft-4) 75%, var(--ft-1) 100%);
  background-size: 300% 100%;
  background-repeat: repeat-x;
  background-position-x: 0%;
  -webkit-background-clip: text;
          background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
  animation: ft-run 5s linear infinite;
}
@keyframes ft-run {
  from { background-position-x: 0%; }
  to   { background-position-x: 100%; }
}
/* No gradient-text support → plain readable ink, no animation. */
@supports not ((-webkit-background-clip: text) or (background-clip: text)) {
  .brand-sub strong {
    background: none;
    color: var(--text);
    -webkit-text-fill-color: currentColor;
    animation: none;
  }
}
/* Respect a reduced-motion preference: keep the colours, stop the run. */
@media (prefers-reduced-motion: reduce) {
  .brand-logo,
  .brand-logo .lf,
  .brand-logo .ln,
  .brand-sub strong { animation: none; }
}

.nav {
  padding: 10px;
  display: flex; flex-direction: column; gap: 6px;
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.nav::-webkit-scrollbar { width: 0; height: 0; display: none; }
.nav button {
  display: flex; align-items: center; gap: 11px;
  width: 100%;
  padding: 10px 13px;
  /* Every item now reads as a button at rest — a faint fill and a hairline
     edge — instead of plain text. Deliberately quiet: this is the second
     tier below New Form, which keeps the colour, glow and motion. */
  background: var(--glass-sunken);
  border: 1px solid var(--hairline-soft);
  border-radius: var(--radius-ctl);
  color: var(--text-dim);
  text-align: left;
  cursor: pointer;
  font-size: 14.5px;
  transition: background .18s ease, color .18s ease, transform .18s ease, border-color .18s ease;
}
.nav button:hover {
  background: var(--glass-hover);
  border-color: var(--edge-quiet);
  color: var(--text);
  transform: translateX(2px);
}
.nav button.active {
  background: var(--accent-blue);
  border-color: transparent;
  color: #fff;
  font-weight: 600;
  box-shadow: 0 6px 16px rgba(10, 132, 255, .34), inset 0 1px 0 rgba(255,255,255,.3);
}
.nav button.active:hover { transform: none; background: var(--accent-blue); color: #fff; }
.nav .nav-icon { width: 21px; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; }
.ico { display: block; }
.nav button .ico { opacity: .82; }

/* ---- Icons idle, never quite still ----
   Every icon breathes on a slow loop — a small scale so it feels alive
   without pulling the eye off the text. transform only, so it stays cheap
   to run. Reduced-motion turns it all off below. */
.ico {
  transform-origin: center center;
  animation: ico-breathe 3.6s ease-in-out infinite;
  will-change: transform;
}
@keyframes ico-breathe {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.09); }
}
/* Nav icons get a touch more character — a gentle bob — and each starts a
   beat after the one above, so the column ripples instead of pulsing as
   one block. */
.nav .nav-icon .ico { animation: nav-ico-bob 3.2s ease-in-out infinite; }
@keyframes nav-ico-bob {
  0%, 100% { transform: translateY(0) scale(1); }
  50%      { transform: translateY(-2px) scale(1.08); }
}
.nav button:nth-of-type(1) .ico { animation-delay: 0s; }
.nav button:nth-of-type(2) .ico { animation-delay: .25s; }
.nav button:nth-of-type(3) .ico { animation-delay: .5s; }
.nav button:nth-of-type(4) .ico { animation-delay: .75s; }
.nav button:nth-of-type(5) .ico { animation-delay: 1s; }
.nav button:nth-of-type(6) .ico { animation-delay: 1.25s; }
/* Topic hover on the left menu: each icon animates to its own subject on
   hover — the same vocabulary as the home cards, so the whole app speaks
   one language. (Keyframes t-* are defined in the home section.) */
.nav button.t-home:hover      .nav-icon .ico { animation: t-rise .6s cubic-bezier(.3,1.5,.5,1); }
.nav button.t-newform:hover   .nav-icon .ico { animation: t-create .6s ease; }
.nav button.t-records:hover   .nav-icon .ico { animation: t-flip .7s ease; }
.nav button.t-machines:hover  .nav-icon .ico { animation: t-machine .55s ease-in-out infinite; }
.nav button.t-dashboard:hover .nav-icon .ico { animation: t-rise .7s cubic-bezier(.3,1.5,.5,1); }
.nav button.t-data:hover      .nav-icon .ico { animation: t-save 1s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) {
  .ico, .nav .nav-icon .ico,
  .nav button:hover .nav-icon .ico { animation: none; }
}

/* ---- New Form: the primary action, always alive ----
   A highlight that idles on a loop so the eye lands on it first — an
   ERP-coloured band of light sweeping across the button, with a short
   rest between passes. It lives on the button's own ::after, not on a
   :hover rule, so it keeps running in every state: idle, hover, and after
   the button is selected. A faint resting tint marks it as the primary
   action even before the light passes. */
.nav button.nav-cta {
  position: relative;
  overflow: hidden;
  isolation: isolate;
  /* An always-on glow that breathes between the ERP cyan and green — the
     steady half of the idle animation, so there is life even between
     shine passes. It runs in every state because it is on the button
     itself, not a :hover rule; when the button is selected it simply
     glows around the blue fill. */
  animation: cta-glow 2.8s ease-in-out infinite;
}
.nav button.nav-cta:not(.active) {
  background: color-mix(in srgb, var(--erp-indigo) 14%, transparent);
  border-color: color-mix(in srgb, var(--erp-cyan) 40%, transparent);
  color: var(--text);
}
.nav button.nav-cta:not(.active):hover {
  background: color-mix(in srgb, var(--erp-indigo) 24%, transparent);
  transform: translateX(2px);
}
@keyframes cta-glow {
  0%, 100% { box-shadow: 0 0 0 1px color-mix(in srgb, var(--erp-cyan) 32%, transparent),
                         0 0 12px -3px color-mix(in srgb, var(--erp-cyan) 60%, transparent); }
  50%      { box-shadow: 0 0 0 1px color-mix(in srgb, var(--erp-green) 42%, transparent),
                         0 0 16px -2px color-mix(in srgb, var(--erp-green) 65%, transparent); }
}
/* Keep the icon and label crisply above the moving light. */
.nav button.nav-cta > * { position: relative; z-index: 1; }
/* The sweeping band of light — a continuous, gentle pass across the
   button, above the fill and below the label. Screen-blended so it reads
   as light on both the pale resting tint and the blue selected fill. */
.nav button.nav-cta::after {
  content: '';
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background: linear-gradient(100deg,
    transparent 38%,
    color-mix(in srgb, var(--erp-cyan) 60%, transparent) 46%,
    rgba(255, 255, 255, .82) 50%,
    color-mix(in srgb, var(--erp-green) 60%, transparent) 54%,
    transparent 62%);
  background-size: 220% 100%;
  background-repeat: no-repeat;
  mix-blend-mode: screen;
  animation: cta-shine 4.5s linear infinite;
}
@keyframes cta-shine {
  from { background-position: 150% 0; }
  to   { background-position: -70% 0; }
}
/* On hover the highlight takes the WHOLE button: an ERP colour ramp that
   flows edge to edge across the entire surface (not just the passing
   band), fading in on hover and out when the pointer leaves. Lives on
   ::before, under the label, so the text stays readable over it. */
.nav button.nav-cta::before {
  content: '';
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background: linear-gradient(100deg,
    color-mix(in srgb, var(--erp-blue)   70%, transparent),
    color-mix(in srgb, var(--erp-cyan)   70%, transparent),
    color-mix(in srgb, var(--erp-green)  70%, transparent),
    color-mix(in srgb, var(--erp-indigo) 70%, transparent),
    color-mix(in srgb, var(--erp-blue)   70%, transparent));
  background-size: 300% 100%;
  mix-blend-mode: screen;
  opacity: 0;
  transition: opacity .22s ease;
  animation: cta-flow 3s linear infinite;
}
.nav button.nav-cta:hover::before { opacity: .6; }
@keyframes cta-flow {
  from { background-position: 0 0; }
  to   { background-position: 300% 0; }
}
@media (prefers-reduced-motion: reduce) {
  .nav button.nav-cta,
  .nav button.nav-cta::after,
  .nav button.nav-cta::before { animation: none; }
  .nav button.nav-cta::after { opacity: 0; }
}

/* Running border on New Form (the left-menu button): on hover a bright arc
   travels around its edge on a loop. A conic gradient clipped to a thin
   ring by the mask; its start angle (--run-a) is animated so the lit arc
   chases the border. */
@property --run-a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
.nav button.nav-cta .nav-run {
  position: absolute; inset: 0; z-index: 4;
  border-radius: inherit;
  padding: 1.8px;
  pointer-events: none;
  opacity: 0;
  transition: opacity .2s ease;
  background: conic-gradient(from var(--run-a),
    transparent 0deg, transparent 36deg,
    color-mix(in srgb, var(--erp-cyan) 70%, transparent) 80deg,
    #ffffff 200deg,
    color-mix(in srgb, var(--erp-green) 70%, transparent) 320deg,
    transparent 360deg);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
          mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
          mask-composite: exclude;
}
.nav button.nav-cta:hover .nav-run { opacity: 1; animation: nav-run 1.1s linear infinite; }
@keyframes nav-run { to { --run-a: 360deg; } }
@media (prefers-reduced-motion: reduce) {
  .nav button.nav-cta:hover .nav-run { animation: none; opacity: 0; }
}

.nav button.active .ico { opacity: 1; }

.sidebar-foot { margin-top: auto; padding: 10px 14px 12px; border-top: 1px solid var(--hairline-soft); }

/* ---- One button for appearance, language and sync ----
   Collapsed by default: a single settings button carrying a live sync
   dot, so status is visible without opening anything. Click and the panel
   slides open (visionOS ease); click again and it folds away. */
.foot-toggle {
  display: flex; align-items: center; gap: 10px;
  width: 100%;
  padding: 10px 12px;
  background: var(--glass-sunken);
  border: 1px solid var(--hairline-soft);
  border-radius: var(--radius-ctl);
  color: var(--text-dim);
  cursor: pointer;
  font-size: 13.5px; font-weight: 500;
  transition: background .18s ease, border-color .18s ease, color .18s ease;
}
.foot-toggle:hover { background: var(--glass-hover); border-color: var(--edge-quiet); color: var(--text); }
.ft-ico { font-size: 15px; line-height: 1; }
.ft-label { flex: 1; text-align: left; white-space: nowrap; }
.ft-sync {
  width: 9px; height: 9px; border-radius: 50%;
  flex: 0 0 auto;
  background: var(--text-faint);
}
.ft-sync.is-live { background: var(--pass-fill); box-shadow: 0 0 0 3px color-mix(in srgb, var(--pass-fill) 22%, transparent); }
.ft-sync.is-unsent { background: var(--accent-yellow); animation: field-alarm 1.4s ease-in-out infinite; }
.ft-sync.is-error { background: var(--fail-fill); }
.ft-sync.is-connecting { background: var(--accent-blue); animation: field-alarm 1.4s ease-in-out infinite; }
.ft-caret { font-size: 13px; transition: transform .26s ease; opacity: .7; }
.foot-toggle[aria-expanded="true"] .ft-caret { transform: rotate(180deg); }

.foot-panel {
  overflow: hidden;
  max-height: 0;
  opacity: 0;
  transition: max-height .3s cubic-bezier(.4,.14,.3,1), opacity .24s ease, margin-top .3s ease;
}
.foot-panel.open { max-height: 340px; opacity: 1; margin-top: 9px; }
.foot-panel-inner { padding-top: 2px; }
.foot-panel .cloud-badge { margin-bottom: 0; }

/* ---------------- Home menu ----------------
   The mark in the middle, one card per section. Cards rest calm and, on
   hover, lift with visionOS depth and extend a small preview of what is
   inside. The home menu is its own full screen — the sidebar and mobile
   bar are hidden, and the block is centred on the page. */
:root.view-home .sidebar,
:root.view-home .mobile-bar { display: none !important; }
:root.view-home .main { max-width: none; padding: 0; display: flex; }
:root.view-home .app { gap: 0; }
.home {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 26px;
  width: 100%;
  max-width: 1040px;
  margin: 0 auto;
  min-height: calc((100vh / var(--ui-scale)) - 40px);
  padding: 30px 24px;
}
.home-hero { display: flex; flex-direction: column; align-items: center; gap: 13px; text-align: center; }
.home-logo { width: 104px; height: 104px; border-radius: 28px; font-size: 40px; }
.home-wordmark { font-size: 28px; }
.home-tag { font-size: 14px; color: var(--text-dim); }

.home-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 18px;
  width: 100%;
}

/* ---- New Form: the hero (number one) ---- */
.home-primary {
  position: relative;
  width: 100%;
  border-radius: 24px;
  padding: 24px 26px;
  overflow: hidden;
  isolation: isolate;
  background: linear-gradient(135deg,
    color-mix(in srgb, var(--erp-blue) 24%, var(--glass)),
    color-mix(in srgb, var(--erp-indigo) 15%, var(--glass)));
  border: 1.5px solid color-mix(in srgb, var(--erp-cyan) 42%, var(--edge));
  box-shadow: var(--lift-2), 0 0 34px -8px color-mix(in srgb, var(--erp-cyan) 45%, transparent), var(--specular);
}
.hp-shine {
  position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background: linear-gradient(100deg, transparent 40%,
    color-mix(in srgb, var(--erp-cyan) 24%, transparent) 48%,
    rgba(255, 255, 255, .3) 50%,
    color-mix(in srgb, var(--erp-green) 24%, transparent) 52%, transparent 60%);
  background-size: 220% 100%; mix-blend-mode: screen;
  animation: cta-shine 5s linear infinite;
}
.hp-deco { position: absolute; right: -20px; bottom: -34px; z-index: 0; color: var(--erp-indigo); opacity: .12; pointer-events: none; }
.home-primary:hover .hp-deco { animation: t-create 1.6s ease-in-out infinite; }
.hp-head { position: relative; z-index: 1; display: flex; align-items: center; gap: 18px; cursor: pointer; }
.hp-icon {
  width: 62px; height: 62px; flex: 0 0 auto;
  display: grid; place-items: center; border-radius: 18px; color: #fff;
  background: linear-gradient(145deg, var(--erp-blue), var(--erp-indigo));
  box-shadow: 0 10px 22px -5px color-mix(in srgb, var(--erp-blue) 60%, transparent);
}
.home-primary:hover .hp-icon { animation: t-create .6s ease; }
.hp-text { flex: 1; min-width: 0; }
.hp-badge {
  display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase;
  color: var(--erp-cyan); background: color-mix(in srgb, var(--erp-cyan) 16%, transparent);
  border: 1px solid color-mix(in srgb, var(--erp-cyan) 42%, transparent);
  padding: 3px 9px; border-radius: 999px; margin-bottom: 7px;
}
.hp-title { font-size: 27px; font-weight: 750; line-height: 1.08; }
.hp-sub { font-size: 14px; color: var(--text-dim); margin-top: 4px; }
.hp-arrow { font-size: 26px; color: var(--erp-cyan); flex: 0 0 auto; transition: transform .25s ease; }
.hp-head:hover .hp-arrow { transform: translateX(5px); }
.hp-quick {
  position: relative; z-index: 1;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  margin-top: 18px; padding-top: 16px;
  border-top: 1px solid color-mix(in srgb, var(--erp-cyan) 20%, var(--hairline-soft));
}
.hp-quick-lab { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-faint); font-weight: 700; }
.hp-pills { display: flex; flex-wrap: wrap; gap: 8px; }
.hp-pill {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 14px; border-radius: 11px; cursor: pointer;
  background: var(--glass); border: 1px solid color-mix(in srgb, var(--accent) 34%, var(--edge));
  color: var(--text); font-weight: 700; font-size: 13px;
  transition: transform .18s ease, background .18s ease, border-color .18s ease;
}
.hp-pill:hover { transform: translateY(-2px); background: color-mix(in srgb, var(--accent) 15%, var(--glass)); border-color: color-mix(in srgb, var(--accent) 30%, var(--edge)); }
.hp-pill-ico { color: var(--accent); display: inline-flex; position: relative; z-index: 1; }
.hp-pill > span { position: relative; z-index: 1; }

/* Running border: on hover a bright arc travels around the pill's edge on
   a loop. The conic gradient is clipped to a thin ring by the mask, and
   its start angle (--pill-a) is animated so the lit arc chases the border. */
@property --pill-a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
.hp-pill::before {
  content: '';
  position: absolute; inset: 0;
  border-radius: inherit;
  padding: 1.7px;
  background: conic-gradient(from var(--pill-a),
    transparent 0deg, transparent 250deg,
    color-mix(in srgb, var(--accent) 65%, transparent) 298deg,
    #ffffff 330deg,
    color-mix(in srgb, var(--accent) 65%, transparent) 356deg,
    transparent 360deg);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
          mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
          mask-composite: exclude;
  opacity: 0;
  transition: opacity .2s ease;
  pointer-events: none;
