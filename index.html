<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<!-- Exactly the FN-ERP-System zoom lock. The 110% is not in here:
     it comes from `zoom` in the stylesheet, which derives the layout
     box from the viewport rather than asking the browser to derive
     the viewport from a scale. Carrying the scale in this tag is what
     produced the page that panned sideways on an iPhone.

     iOS Safari has ignored user-scalable and the scale bounds since
     iOS 10, so on an iPhone or iPad this tag does not stop a pinch —
     the ERP has the same gap. blockPinchShrink() covers iOS. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="description" content="FN Machine Care — Machine Inspection & Service Management System for F N Technology. Machine build checklist (ASSY), factory acceptance test (FAT), site acceptance test (SAT), and customer service reports (SR).">
<meta name="theme-color" content="#0a0d16">
<title>FN Machine Care — Machine Inspection &amp; Service Management</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='26' fill='%230906d7'/><text y='68' x='50' font-size='50' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>FN</text></svg>">
<style>
/* =============================================================
   FN MACHINE CARE — visionOS theme
   -------------------------------------------------------------
   The design rule that governs everything here:

       GLASS FOR THE CHROME.  SOLID FOR THE VERDICT.

   Panels, sidebar, toolbar and cards are true frosted glass
   floating over an ambient environment. But PASS / FAIL / N/A —
   and every status that carries a safety consequence — are fully
   opaque and saturated. They punch through the glass like real
   hardware buttons. A technician under factory lighting must
   never squint to tell whether a row passed.
   ============================================================= */

/* ---------------- Tokens: light (default) ---------------- */

:root {
  color-scheme: light;

  /* Environment behind the glass — the app's own cool light, coloured
     with the ERP brand: indigo, cyan and green auras on pale blue. */
  --env-1: #c6d3ea;
  --env-2: #dae2f0;
  --orb-a: rgba(75, 73, 255, .26);    /* ERP indigo */
  --orb-b: rgba(0, 194, 214, .20);    /* ERP cyan   */
  --orb-c: rgba(88, 200, 96, .16);    /* ERP green  */

  /* Glass surfaces — layered by elevation */
  --glass:        rgba(253, 254, 255, .58);
  --glass-raised: rgba(253, 254, 255, .72);
  --glass-bar:    rgba(246, 249, 253, .96);
  --glass-drawer: rgba(244, 247, 252, .96);
  --glass-sunken: rgba(255, 255, 255, .26);
  --glass-hover:  rgba(255, 255, 255, .80);

  /* Edges: a bright specular rim above, a soft shadow below */
  --edge:       rgba(255, 255, 255, .70);
  --edge-quiet: rgba(9, 20, 48, .12);
  --hairline:   rgba(9, 20, 48, .12);
  --hairline-soft: rgba(9, 20, 48, .07);

  --lift-1: 0 1px 2px rgba(12, 24, 56, .06), 0 6px 18px rgba(12, 24, 56, .07);
  --lift-2: 0 2px 6px rgba(12, 24, 56, .08), 0 18px 44px rgba(12, 24, 56, .12);
  --lift-3: 0 8px 20px rgba(12, 24, 56, .12), 0 34px 70px rgba(12, 24, 56, .18);
  --specular: inset 0 1px 0 rgba(255, 255, 255, .9);

  /* Ink */
  --text:       #0d1526;
  --text-dim:   #414c66;
  --text-faint: #5c6780;

  /* Fields sit *under* the glass, so they go slightly darker */
  --field:       rgba(255, 255, 255, .70);
  --field-focus: rgba(255, 255, 255, .96);

  /* Apple system colors — the accent language of visionOS */
  --accent-blue:   #0a84ff;
  --accent-violet: #bf5af3;
  --accent-orange: #ff9f0a;
  --accent-yellow: #ffd60a;
  --accent-red:    #ff453a;
  --accent-green:  #30d158;

  --brand: var(--accent-blue);

  /* Wordmark: base ink, and the light that travels through it */
  /* Chart series — validated with the dataviz palette checker against
     this theme's surface: lightness band, chroma floor, colour-blind
     separation (ΔE 27.8 protan) and 3:1 contrast all pass. Dark mode
     uses its own steps, not a flip of these. */
  --series-1: #1d6fd4;
  --series-2: #c2410c;

  --scroll-thumb:       rgba(9, 20, 48, .26);
  --scroll-thumb-hover: rgba(9, 20, 48, .42);

  --wm-base: #101a2e;
  --wm-hi:   #1560ff;
  --wm-hi-2: #2fa34a;

  /* FN-ERP-System brand tone — its logo is a blue→indigo tile with a
     cyan→green light band running through it. Machine Care borrows the
     same colours so the two apps read as one family. */
  --erp-blue:   #0906d7;
  --erp-indigo: #4b49ff;
  --erp-cyan:   #00eaff;
  --erp-green:  #77e947;

  /* "F N Technology" runs a colour band through the letters. On a light
     surface the vivid cyan/green would wash out, so the ramp is deepened
     here; dark mode swaps in the bright ERP version below. */
  --ft-1: #0906d7;
  --ft-2: #4b49ff;
  --ft-3: #0093b0;
  --ft-4: #2f8f3a;

  --pass:  #248a3d;
  --fail:  #d70015;
  --na:    #8e8e93;
  --warn:  #a86800;

  /* Solid verdict fills — deliberately opaque */
  --pass-fill: #34c759;
  --fail-fill: #ff3b30;
  --na-fill:   #8e8e93;
  --pass-ink:  #ffffff;
  --fail-ink:  #b3000c;

  --bar-h: 65px;

  --radius-window: 26px;
  --radius-card:   20px;
  --radius-ctl:    13px;
  --radius-pill:   999px;

  --blur: saturate(180%) blur(30px);

  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
          "Segoe UI Variable Text", "Segoe UI", "Noto Sans Thai", "IBM Plex Sans Thai",
          "Leelawadee UI", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Consolas, monospace;
}

/* ---------------- Tokens: dark ---------------- */

:root[data-theme="dark"] {
  color-scheme: dark;

  --env-1: #070a12;
  --env-2: #0e1424;
  --orb-a: rgba(10, 132, 255, .44);
  --orb-b: rgba(191, 90, 243, .34);
  --orb-c: rgba(48, 209, 88, .22);

  --glass:        rgba(30, 36, 52, .62);
  --glass-raised: rgba(40, 47, 66, .74);
  --glass-bar:    rgba(19, 24, 38, .977);
  --glass-drawer: rgba(22, 27, 42, .975);
  --glass-sunken: rgba(16, 21, 34, .52);
  --glass-hover:  rgba(52, 60, 82, .78);

  --edge:       rgba(255, 255, 255, .16);
  --edge-quiet: rgba(255, 255, 255, .08);
  --hairline:   rgba(255, 255, 255, .11);
  --hairline-soft: rgba(255, 255, 255, .06);

  --lift-1: 0 1px 2px rgba(0, 0, 0, .34), 0 6px 18px rgba(0, 0, 0, .34);
  --lift-2: 0 2px 6px rgba(0, 0, 0, .40), 0 18px 44px rgba(0, 0, 0, .46);
  --lift-3: 0 8px 20px rgba(0, 0, 0, .46), 0 34px 70px rgba(0, 0, 0, .56);
  --specular: inset 0 1px 0 rgba(255, 255, 255, .14);

  --text:       #f1f4fb;
  --text-dim:   #b9c1d4;
  --text-faint: #98a2b9;

  --field:       rgba(10, 14, 24, .55);
  --field-focus: rgba(10, 14, 24, .82);

  --series-1: #2f80e0;
  --series-2: #c9702a;

  --scroll-thumb:       rgba(255, 255, 255, .22);
  --scroll-thumb-hover: rgba(255, 255, 255, .38);

  --wm-base: #eef2fb;
  --wm-hi:   #00eaff;
  --wm-hi-2: #77e947;

  /* Dark surface: the vivid ERP colours pop, so run them at full strength. */
  --ft-1: #6f8bff;
  --ft-2: #00eaff;
  --ft-3: #77e947;
  --ft-4: #a9b8ff;

  --pass: #4ee16f;
  --fail: #ff6961;
  --na:   #98989d;
  --warn: #ffd60a;

  --pass-fill: #30d158;
  --fail-fill: #ff453a;
  --na-fill:   #8e8e93;
  --pass-ink:  #04220d;
  --fail-ink:  #ff9d97;
}

* { box-sizing: border-box; }

/* ---------------- UI scale ----------------
   The app is drawn 10% larger, so at the browser's own 100% it reads
   like 110% and nobody has to reach for Ctrl-+ on a plant-floor tablet.

   `zoom` rather than `transform: scale()`: zoom reflows, so text still
   wraps to the space it actually occupies. A transform would paint a
   1440px layout at 1584px and hang a scrollbar off the side.

   Four things zoom does NOT scale, each handled below:
     1. viewport units — 100vh still means the real viewport, so a
        zoomed 100vh block is 110% of the screen and overflows
     2. media query widths — they test the real viewport, so every
        breakpoint has to be widened by the same factor
     3. the drawer's 84vw cap — same reason as (1)
     4. print — A4 pagination must not be zoomed at all
   Change --ui-scale in one place and all four follow. */
:root { --ui-scale: 1.1; }

html {
  zoom: var(--ui-scale);
}

/* One mechanism, every device — and the reason matters, because the
   alternative was tried and produced the bug it was meant to avoid.

   Scaling through the viewport tag (initial-scale=1.1) asks the browser
   to lay out at deviceWidth / 1.1 and paint it larger. It works, but the
   layout width is then something the browser derives, and getting it
   wrong by one attribute puts part of the page where nobody can reach
   it: pairing it with width=device-width laid out 390px of content in a
   355px window and the whole app panned sideways under the thumb.

   CSS zoom does not touch the viewport at all. The layout box is
   viewport / zoom by construction, so the content cannot be wider than
   the screen no matter what the tag says. `zoom` is a WebKit-born
   property; Safari has honoured it far longer than Chrome has.

   That leaves the viewport tag free to be exactly what FN-ERP-System
   uses — a plain 1.0 lock — rather than carrying the scale as well. */
@media (pointer: coarse) {
  /* Drops double-tap-to-zoom, the other way a scale gets stuck.
     Pinch is handled in blockPinchShrink() so magnifying still works. */
  body { touch-action: manipulation; }
}

html, body {
  margin: 0;
  padding: 0;
  /* Not 100%: a percentage here resolves against the real viewport and is
     then painted 10% taller, hanging a scrollbar off a page with nothing
     to scroll. Divide it back out like every other viewport unit. */
  min-height: calc(100vh / var(--ui-scale));
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
}

body {
  background: linear-gradient(168deg, var(--env-1) 0%, var(--env-2) 100%);
  background-attachment: fixed;
}

button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }

/* Print mirrors of field values — built on demand, hidden on screen. */
.print-value { display: none; }

/* ---------------- Date field & calendar ----------------
   DD/MM/YYYY on every device. A native date input renders in the
   browser's own locale, so this is our own control instead. */

.datefield { position: relative; display: flex; align-items: center; gap: 6px; }
.datefield .date-text { flex: 1 1 auto; min-width: 0; font-variant-numeric: tabular-nums; }
.datefield .date-text.is-bad {
  border-color: var(--fail) !important;
  box-shadow: 0 0 0 3px rgba(255, 69, 58, .16);
}

.date-open {
  flex: 0 0 auto;
  display: inline-flex; align-items: center; justify-content: center;
  width: 34px; height: 34px;
  border: 1px solid var(--hairline);
  border-radius: 9px;
  background: var(--glass-soft);
  color: var(--text-dim);
  cursor: pointer;
  transition: color .18s ease, background .18s ease, transform .12s ease;
}
.date-open:hover { color: var(--accent-blue); background: var(--field-focus); }
.date-open:active { transform: scale(.94); }

.datecal {
  position: fixed;
  z-index: 90;
  width: 268px;
  padding: 12px;
  border-radius: 16px;
  border: 1px solid var(--hairline);
  /* Near-opaque, like the drawer. A calendar is a thing you read digits
     off, and through the frosted panel the fields behind it showed
     through the day grid — 09:00 AM sitting on top of week three. Glass
     for chrome, solid where something has to be read. */
  background: var(--glass-drawer);
  -webkit-backdrop-filter: saturate(180%) blur(30px);
  backdrop-filter: saturate(180%) blur(30px);
  box-shadow: var(--lift-3), var(--specular);
  animation: cal-in .16s cubic-bezier(.22,1,.36,1);
}
@keyframes cal-in { from { opacity: 0; transform: translateY(-5px) scale(.985); } }

.datecal-head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.datecal-title {
  flex: 1; text-align: center; font-weight: 650; font-size: 14px;
  background: none; border: 0; color: var(--text); cursor: pointer; padding: 5px 4px; border-radius: 8px;
}
.datecal-title:hover { background: var(--field-focus); }
.datecal-nav {
  width: 30px; height: 30px; flex: 0 0 auto;
  border: 1px solid var(--hairline); border-radius: 8px;
  background: var(--glass-soft); color: var(--text-dim);
  font-size: 17px; line-height: 1; cursor: pointer;
}
.datecal-nav:hover { color: var(--accent-blue); background: var(--field-focus); }

.datecal-dow, .datecal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.datecal-dow span {
  text-align: center; font-size: 10.5px; font-weight: 600;
  color: var(--text-faint); padding: 3px 0; letter-spacing: .04em;
}
.datecal-day {
  height: 32px; border: 0; border-radius: 9px;
  background: none; color: var(--text);
  font-size: 13px; font-variant-numeric: tabular-nums; cursor: pointer;
  transition: background .14s ease, color .14s ease;
}
.datecal-day:hover { background: var(--field-focus); }
.datecal-pad { height: 32px; }

/* Today is an outline, the chosen day is solid — the same rule the rest
   of the app follows: glass for context, solid for the verdict. */
.datecal-day.is-today { box-shadow: inset 0 0 0 1.5px var(--accent-blue); }
.datecal-day.is-sel {
  background: var(--accent-blue) !important;
  color: #fff; font-weight: 700;
}

.datecal-foot {
  display: flex; gap: 6px; margin-top: 9px;
  padding-top: 9px; border-top: 1px solid var(--hairline-soft);
}
.datecal-foot .btn { flex: 1; }

/* Quiet by design: present on every screen, never competing with the
   document in front of the technician. */
.foot-note .credit {
  display: block;
  margin-top: 5px;
  font-size: 10.5px;
  letter-spacing: .015em;
  color: var(--text-faint);
  opacity: .85;
}

/* Says a newer build exists rather than letting a phone sit on a stale
   copy that looks identical to a broken one. Bottom of the screen, out
   of the way of the sticky bar at the top. */
.update-banner {
  position: fixed;
  left: 50%; bottom: 18px;
  transform: translateX(-50%);
  z-index: 92;
  display: flex;
  align-items: center;
  gap: 12px;
  max-width: calc(100vw - 24px);
  padding: 11px 13px 11px 18px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--edge);
  background: var(--glass-drawer);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  box-shadow: var(--lift-3), var(--specular);
  font-size: 13.5px;
  animation: cal-in .22s cubic-bezier(.22,1,.36,1);
}
.update-banner span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 616px) {
  .update-banner { left: 12px; right: 12px; transform: none; max-width: none; padding-left: 15px; }
  .update-banner span { white-space: normal; }
}
@media print { .update-banner { display: none !important; } }

/* A screen that could not be drawn says so, rather than going blank. */
.fail-card { max-width: 620px; margin: 20px auto; }
.fail-card h2 { margin: 0 0 8px; font-size: 19px; }
.fail-card p { margin: 0 0 14px; color: var(--text-dim); }
.fail-detail {
  margin: 0 0 16px;
  padding: 12px 14px;
  border-radius: 10px;
  background: var(--field);
  border: 1px solid var(--hairline);
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.5;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  color: var(--text-dim);
}

@media (max-width: 616px) { .datecal { width: min(268px, 92vw); } }

:focus-visible {
  outline: 2.5px solid var(--accent-blue);
  outline-offset: 2px;
  border-radius: 6px;
}

.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ---------------- Scrollbars ----------------
   Thin, translucent, and they take the accent when grabbed — the
   scrollbar is part of the glass, not a system leftover. */

* { scrollbar-width: thin; scrollbar-color: var(--scroll-thumb) transparent; }

::-webkit-scrollbar { width: 11px; height: 11px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--scroll-thumb);
  border: 3px solid transparent;
  background-clip: content-box;
  border-radius: 999px;
}
::-webkit-scrollbar-thumb:hover { background: var(--scroll-thumb-hover); background-clip: content-box; }
::-webkit-scrollbar-thumb:active { background: var(--accent-blue); background-clip: content-box; }

.table-wrap::-webkit-scrollbar, .sidebar::-webkit-scrollbar { width: 8px; height: 8px; }
.table-wrap::-webkit-scrollbar-thumb, .sidebar::-webkit-scrollbar-thumb { border-width: 2px; }

/* ---------------- The environment ---------------- */

.ambient {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}
/* The auras. Previously each orb was a solid disc pushed through
   filter: blur(90px) — three enormous blur passes re-run by the GPU on
   every frame of their drift, which is what made the whole app feel
   heavy. A radial-gradient IS the blurred look, painted once and then
   only moved by transform, which costs nothing. Their motion (a slow
   autonomous drift + cursor parallax + a pulse on page transitions)
   lives in one rAF loop in app.js — see startAmbient(). */
.orb {
  position: absolute;
  border-radius: 50%;
  will-change: transform;
}
#bg3d { position: absolute; inset: 0; width: 100%; height: 100%; }
.orb-1 { width: 58vw; height: 58vw; left: -14vw; top: -16vw;   background: radial-gradient(closest-side, var(--orb-a), transparent 72%); }
.orb-2 { width: 48vw; height: 48vw; right: -10vw; top: 18vh;   background: radial-gradient(closest-side, var(--orb-b), transparent 72%); }
.orb-3 { width: 44vw; height: 44vw; left: 24vw;  bottom: -16vw; background: radial-gradient(closest-side, var(--orb-c), transparent 72%); }


/* ---------------- Layout ---------------- */

.app {
  /* Deliberately no z-index: a stacking context here would trap the
     drawer beneath the scrim. It already paints above .ambient by
     DOM order. */
  position: relative;
  display: flex;
  min-height: calc(100vh / var(--ui-scale));
  gap: 16px;
  padding: 16px;
}

/* The sidebar is a floating window, not a wall */
.sidebar {
  width: 252px;
  flex: 0 0 252px;
  position: sticky;
  top: 16px;
  height: calc((100vh / var(--ui-scale)) - 32px);
  display: flex;
  flex-direction: column;
  /* The shell itself never scrolls: the brand stays at the top and the
     footer (theme, language, sync) stays pinned at the bottom. Only the
     nav in the middle flexes, so on a normal window nothing scrolls at
     all — and on a very short one only the nav gives, with its scrollbar
     hidden so the menu never shows a rail. */
  overflow: hidden;
  overscroll-behavior: contain;

  background: var(--glass);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border: 1px solid var(--edge);
  border-radius: var(--radius-window);
  box-shadow: var(--lift-2), var(--specular);
}
.sidebar::-webkit-scrollbar { width: 0; height: 0; display: none; }

.brand { padding: 20px 18px 16px; border-bottom: 1px solid var(--hairline-soft); }
.brand-sub { text-align: center; }
.brand-mark {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  white-space: nowrap;
}

/* ---- The mark ----
   A tile with a highlight that orbits its rim, and a wordmark that a
   band of light travels through every few seconds. Both idle slowly:
   this sits on screen all day next to a technician, so the motion has
   to be noticeable once and invisible thereafter. */

.brand-logo {
  position: relative;
  width: 66px; height: 66px;
  flex: 0 0 auto;
  border-radius: 11px;
  /* ERP tone: a blue→indigo tile with a cyan→green light band that RUNS
     vertically through it. Three background layers — the base gradient,
     the moving band (340% tall, slid by mark-run), and a solid fallback
     underneath so the tile is never bare mid-slide. */
  background:
    linear-gradient(145deg, var(--erp-blue), var(--erp-indigo)),
    linear-gradient(0deg,
      transparent 28%,
      rgba(0, 234, 255, .5) 38%,
      var(--erp-cyan) 46%,
      var(--erp-green) 54%,
      rgba(119, 233, 71, .5) 62%,
      transparent 72%),
    linear-gradient(var(--erp-blue), var(--erp-blue));
  background-size: 100% 100%, 100% 340%, 100% 100%;
  background-position: 0 0, 0 -240%, 0 0;
  animation: mark-run 4s linear infinite;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; color: #fff;
  letter-spacing: -.02em;
  box-shadow: 0 12px 30px rgba(9, 6, 215, .48), inset 0 1.5px 0 rgba(255, 255, 255, .5);
  isolation: isolate;
}
/* The band slides from above the tile to below it, so the cyan→green light
   sweeps down through the mark on a loop — the ERP's signature motion. */
@keyframes mark-run {
  0%   { background-position: 0 0, 0 -240%, 0 0; }
  100% { background-position: 0 0, 0 100%, 0 0; }
}
.brand-logo span { position: relative; z-index: 2; }
/* Match the ERP mark inside the tile: F white, N green, sitting side by
   side on one baseline. Each letter runs the ERP's glitch loop — a quick
   chromatic-aberration flicker (cyan/magenta split, a skew and a couple of
   clip-path slices) that fires in the first heartbeat of the cycle and
   then rests, so it catches the eye once and settles. steps(1) keeps the
   flicker hard-edged rather than smoothly tweened. */
.brand-logo .lf,
.brand-logo .ln {
  display: inline-block;
  position: relative;
  z-index: 2;
  transform-origin: center center;
  backface-visibility: hidden;
  will-change: transform, clip-path;
}
.brand-logo .lf { color: #fff; animation: glitchF 5s steps(1) infinite; }
.brand-logo .ln { color: var(--erp-green); animation: glitchN 6.5s steps(1) 1.6s infinite; }

@keyframes glitchF {
  0%, 4%, 100% { transform: translate(0, 0); text-shadow: none; clip-path: none; opacity: 1; }
  0.6% { transform: translate(-3px, 1px) skewX(-8deg); text-shadow: #00eaff -3px 0, #ff2bd6 3px 0; clip-path: inset(0 0 62%); }
  1.4% { transform: translate(3px, -1px);              text-shadow: #00eaff 3px 0, #ff2bd6 -3px 0; clip-path: inset(58% 0 8%); }
  2.2% { transform: translate(-2px, 0) skewX(6deg);    text-shadow: #00eaff -2px 0, #ff2bd6 2px 0; clip-path: inset(28% 0 40%); opacity: .85; }
  3.2% { transform: translate(2px, 1px);               text-shadow: #00eaff 2px 0, #ff2bd6 -2px 0; clip-path: none; }
}
@keyframes glitchN {
  0%, 4%, 100% { transform: translate(0, 0); text-shadow: none; clip-path: none; opacity: 1; }
  0.6% { transform: translate(3px, 1px) skewX(8deg);   text-shadow: #00eaff 3px 0, #ff2bd6 -3px 0; clip-path: inset(0 0 60%); }
  1.4% { transform: translate(-3px, -1px);             text-shadow: #00eaff -3px 0, #ff2bd6 3px 0; clip-path: inset(55% 0 10%); opacity: .82; }
  2.2% { transform: translate(2px, 0) skewX(-6deg);    text-shadow: #00eaff 2px 0, #ff2bd6 -2px 0; clip-path: inset(30% 0 38%); }
  3.2% { transform: translate(-1px, 1px);              text-shadow: #00eaff -1px 0, #ff2bd6 1px 0; clip-path: none; }
}
.brand-logo { border-radius: 20px; font-size: 24px; }

/* Orbiting rim highlight */
.brand-logo::before {
  content: '';
  position: absolute;
  inset: -1px;
  border-radius: inherit;
  padding: 2px;
  background: conic-gradient(from 0deg,
    transparent 0deg, transparent 250deg,
    rgba(255,255,255,.95) 300deg,
    transparent 350deg);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
          mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
          mask-composite: exclude;
  animation: mark-orbit 6s linear infinite;
  z-index: 3;
}
/* Breathing halo */
.brand-logo::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  box-shadow: 0 0 0 0 rgba(9, 6, 215, .55);
  animation: mark-pulse 4.5s ease-in-out infinite;
  z-index: 1;
}

@keyframes mark-orbit { to { transform: rotate(360deg); } }
@keyframes mark-pulse {
  0%, 70%, 100% { box-shadow: 0 0 0 0 rgba(9, 6, 215, .0); }
  85%           { box-shadow: 0 0 16px 3px rgba(0, 234, 255, .40); }
}

/* ---- Wordmark ---- */

.wordmark {
  display: inline-flex;
  align-items: baseline;
  gap: .34em;
  font-size: 18.5px;
  line-height: 1.15;
  white-space: nowrap;

  /* repeat-x matters: with no-repeat, any offset that pushes the
     gradient box past the text leaves those glyphs unpainted — and
     background-clip:text renders unpainted glyphs as nothing at all.
     Both ends of the ramp are --wm-base, so tiling is seamless. */
  background-image: linear-gradient(100deg,
    var(--wm-base) 0%,   var(--wm-base) 36%,
    var(--wm-hi)   46%,  var(--wm-hi-2) 53%,
    var(--wm-base) 64%,  var(--wm-base) 100%);
  background-size: 300% 100%;
  background-position-x: 0%;
  background-repeat: repeat-x;
  -webkit-background-clip: text;
          background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
  animation: wm-sweep 4.2s ease-in-out infinite;
}
/* Heavy, tightly tracked initials against a light, widely tracked name —
   the contrast is what makes it read as a mark rather than a label. */
.wm-fn {
  font-weight: 800;
  letter-spacing: -.045em;
  font-size: 1.06em;
}
.wm-rest {
  font-weight: 500;
  letter-spacing: .015em;
}

/* If the browser can't clip a gradient to text, show plain ink instead
   of nothing at all. */
@supports not ((-webkit-background-clip: text) or (background-clip: text)) {
  .wordmark {
    background: none;
    color: var(--text);
    -webkit-text-fill-color: currentColor;
    animation: none;
  }
}

/* A pause, then one pass of light. The percentages carry the whole feel:
   shortening the cycle alone would just make the light travel faster,
   which reads as frantic. So the idle hold shrinks and the travel window
   widens to match — the pass keeps its old ~2s pace, it simply comes
   round more often. */
@keyframes wm-sweep {
  0%, 48%   { background-position-x: 0%; }
  96%, 100% { background-position-x: 100%; }
}
.brand-sub {
  margin-top: 7px;
  font-size: 11.5px;
  color: var(--text-dim);
  line-height: 1.42;
}
/* "F N Technology" — the colour RUNS through the letters: a flowing ERP
   ramp (blue → indigo → cyan → green → blue) clipped to the text and slid
   sideways forever. The ramp colours come from --ft-* which are deepened
   for a light surface and vivid for a dark one, so it stays legible in
   both themes. Ends on the same colour it starts, so the loop is seamless. */
.brand-sub strong {
  font-weight: 800;
  letter-spacing: .05em;
  background-image: linear-gradient(100deg,
    var(--ft-1) 0%, var(--ft-2) 25%, var(--ft-3) 50%, var(--ft-4) 75%, var(--ft-1) 100%);
  background-size: 300% 100%;
  background-repeat: repeat-x;
  background-position-x: 0%;
  -webkit-background-clip: text;
          background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
  animation: ft-run 5s linear infinite;
}
@keyframes ft-run {
  from { background-position-x: 0%; }
  to   { background-position-x: 100%; }
}
/* No gradient-text support → plain readable ink, no animation. */
@supports not ((-webkit-background-clip: text) or (background-clip: text)) {
  .brand-sub strong {
    background: none;
    color: var(--text);
    -webkit-text-fill-color: currentColor;
    animation: none;
  }
}
/* Respect a reduced-motion preference: keep the colours, stop the run. */
@media (prefers-reduced-motion: reduce) {
  .brand-logo,
  .brand-logo .lf,
  .brand-logo .ln,
  .brand-sub strong { animation: none; }
}

.nav {
  padding: 10px;
  display: flex; flex-direction: column; gap: 6px;
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.nav::-webkit-scrollbar { width: 0; height: 0; display: none; }
.nav button {
  display: flex; align-items: center; gap: 11px;
  width: 100%;
  padding: 10px 13px;
  /* Every item now reads as a button at rest — a faint fill and a hairline
     edge — instead of plain text. Deliberately quiet: this is the second
     tier below New Form, which keeps the colour, glow and motion. */
  background: var(--glass-sunken);
  border: 1px solid var(--hairline-soft);
  border-radius: var(--radius-ctl);
  color: var(--text-dim);
  text-align: left;
  cursor: pointer;
  font-size: 14.5px;
  transition: background .18s ease, color .18s ease, transform .18s ease, border-color .18s ease;
}
.nav button:hover {
  background: var(--glass-hover);
  border-color: var(--edge-quiet);
  color: var(--text);
  transform: translateX(2px);
}
.nav button.active {
  background: var(--accent-blue);
  border-color: transparent;
  color: #fff;
  font-weight: 600;
  box-shadow: 0 6px 16px rgba(10, 132, 255, .34), inset 0 1px 0 rgba(255,255,255,.3);
}
.nav button.active:hover { transform: none; background: var(--accent-blue); color: #fff; }
.nav .nav-icon { width: 21px; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; }
.ico { display: block; }
.nav button .ico { opacity: .82; }
/* Each menu item's icon wears its own colour when idle; the active item
   (blue pill, white text) keeps a white icon so it stays legible. */
.nav button:not(.active) .nav-icon .ico { color: var(--nav-accent, currentColor); opacity: 1; }
.nav button.active .nav-icon .ico { color: #fff; }

/* ---- Icons idle, never quite still ----
   Every icon breathes on a slow loop — a small scale so it feels alive
   without pulling the eye off the text. transform only, so it stays cheap
   to run. Reduced-motion turns it all off below. */
.ico {
  transform-origin: center center;
  animation: ico-breathe 3.6s ease-in-out infinite;
  will-change: transform;
}
@keyframes ico-breathe {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.09); }
}
/* Nav icons get a touch more character — a gentle bob — and each starts a
   beat after the one above, so the column ripples instead of pulsing as
   one block. */
.nav .nav-icon .ico { animation: nav-ico-bob 3.2s ease-in-out infinite; }
@keyframes nav-ico-bob {
  0%, 100% { transform: translateY(0) scale(1); }
  50%      { transform: translateY(-2px) scale(1.08); }
}
.nav button:nth-of-type(1) .ico { animation-delay: 0s; }
.nav button:nth-of-type(2) .ico { animation-delay: .25s; }
.nav button:nth-of-type(3) .ico { animation-delay: .5s; }
.nav button:nth-of-type(4) .ico { animation-delay: .75s; }
.nav button:nth-of-type(5) .ico { animation-delay: 1s; }
.nav button:nth-of-type(6) .ico { animation-delay: 1.25s; }
/* Topic hover on the left menu: each icon animates to its own subject on
   hover — the same vocabulary as the home cards, so the whole app speaks
   one language. (Keyframes t-* are defined in the home section.) */
.nav button.t-home:hover      .nav-icon .ico { animation: t-rise .6s cubic-bezier(.3,1.5,.5,1); }
.nav button.t-newform:hover   .nav-icon .ico { animation: t-create .6s ease; }
.nav button.t-records:hover   .nav-icon .ico { animation: t-flip .7s ease; }
.nav button.t-machines:hover  .nav-icon .ico { animation: t-machine .55s ease-in-out infinite; }
.nav button.t-dashboard:hover .nav-icon .ico { animation: t-rise .7s cubic-bezier(.3,1.5,.5,1); }
.nav button.t-data:hover      .nav-icon .ico { animation: t-save 1s ease-in-out infinite; }

/* ---- Project Phase menu: each icon loops its own idle animation on
   hover, on topic. New Requirement writes, the list flips, follow-up
   waves its flag, kickoff launches, Main menu rises. ---- */
.nav button.t-reqnew:hover   .nav-icon .ico { animation: t-create .6s ease; }
.nav button.t-reqlist:hover  .nav-icon .ico { animation: t-flip .7s ease; }
.nav button.t-followup:hover .nav-icon .ico { animation: t-flag 1.1s ease-in-out infinite; }
.nav button.t-kickoff:hover  .nav-icon .ico { animation: t-launch 1s ease-in-out infinite; }
.nav button.t-main:hover     .nav-icon .ico { animation: t-rise .6s cubic-bezier(.3,1.5,.5,1); }
@keyframes t-flag {
  0%, 100% { transform: rotate(0) translateX(0); }
  25% { transform: rotate(-4deg) translateX(-1px); }
  60% { transform: rotate(5deg) translateX(1px); }
}
@keyframes t-launch {
  0%, 100% { transform: translateY(0) rotate(0); }
  30% { transform: translateY(-3px) rotate(-6deg); }
  55% { transform: translateY(-4.5px) rotate(2deg); }
}

/* Project home cards — same topic hover on the icon and the watermark */
.home-card.t-care:hover     .hc-icon { animation: t-rise .7s cubic-bezier(.3,1.5,.5,1); }
.home-card.t-phase:hover    .hc-icon { animation: t-flip .7s ease; }
.home-card.t-reqnew:hover   .hc-icon { animation: t-create .6s ease; }
.home-card.t-reqlist:hover  .hc-icon { animation: t-flip .7s ease; }
.home-card.t-followup:hover .hc-icon { animation: t-flag 1.1s ease-in-out infinite; }
.home-card.t-kickoff:hover  .hc-icon { animation: t-launch 1s ease-in-out infinite; }
.home-card.t-data:hover     .hc-icon { animation: t-save 1s ease-in-out infinite; }
.home-card.t-care:hover      .hc-deco { animation: t-rise 1.8s ease-in-out infinite; }
.home-card.t-phase:hover     .hc-deco { animation: t-flip 1.8s ease-in-out infinite; }
.home-card.t-reqnew:hover    .hc-deco { animation: t-create 1.6s ease-in-out infinite; }
.home-card.t-reqlist:hover   .hc-deco { animation: t-flip 1.8s ease-in-out infinite; }
.home-card.t-followup:hover  .hc-deco { animation: t-flag 1.8s ease-in-out infinite; }
.home-card.t-kickoff:hover   .hc-deco { animation: t-launch 1.6s ease-in-out infinite; }
/* and while the auto-demo highlights them (matches the care cards) */
.home-card.t-reqnew.is-demo  .hc-icon { animation: t-create .6s ease; }
.home-card.t-reqlist.is-demo .hc-icon { animation: t-flip .7s ease; }
.home-card.t-followup.is-demo .hc-icon { animation: t-flag 1.1s ease-in-out infinite; }
.home-card.t-kickoff.is-demo .hc-icon { animation: t-launch 1s ease-in-out infinite; }
.home-card.t-care.is-demo    .hc-icon { animation: t-rise .7s cubic-bezier(.3,1.5,.5,1); }
.home-card.t-phase.is-demo   .hc-icon { animation: t-flip .7s ease; }

@media (prefers-reduced-motion: reduce) {
  .ico, .nav .nav-icon .ico,
  .nav button:hover .nav-icon .ico { animation: none; }
  .home-card.t-followup:hover .hc-icon, .home-card.t-kickoff:hover .hc-icon,
  .home-card [class*="is-demo"] .hc-icon { animation: none; }
}

/* ---- New Form: the primary action, always alive ----
   A highlight that idles on a loop so the eye lands on it first — an
   ERP-coloured band of light sweeping across the button, with a short
   rest between passes. It lives on the button's own ::after, not on a
   :hover rule, so it keeps running in every state: idle, hover, and after
   the button is selected. A faint resting tint marks it as the primary
   action even before the light passes. */
.nav button.nav-cta {
  position: relative;
  overflow: hidden;
  isolation: isolate;
  /* An always-on glow that breathes between the ERP cyan and green — the
     steady half of the idle animation, so there is life even between
     shine passes. It runs in every state because it is on the button
     itself, not a :hover rule; when the button is selected it simply
     glows around the blue fill. */
  animation: cta-glow 2.8s ease-in-out infinite;
}
.nav button.nav-cta:not(.active) {
  background: color-mix(in srgb, var(--erp-indigo) 14%, transparent);
  border-color: color-mix(in srgb, var(--erp-cyan) 40%, transparent);
  color: var(--text);
}
.nav button.nav-cta:not(.active):hover {
  background: color-mix(in srgb, var(--erp-indigo) 24%, transparent);
  transform: translateX(2px);
}
@keyframes cta-glow {
  0%, 100% { box-shadow: 0 0 0 1px color-mix(in srgb, var(--erp-cyan) 32%, transparent),
                         0 0 12px -3px color-mix(in srgb, var(--erp-cyan) 60%, transparent); }
  50%      { box-shadow: 0 0 0 1px color-mix(in srgb, var(--erp-green) 42%, transparent),
                         0 0 16px -2px color-mix(in srgb, var(--erp-green) 65%, transparent); }
}
/* Keep the icon and label crisply above the moving light. */
.nav button.nav-cta > * { position: relative; z-index: 1; }
/* The sweeping band of light — a continuous, gentle pass across the
   button, above the fill and below the label. Screen-blended so it reads
   as light on both the pale resting tint and the blue selected fill. */
.nav button.nav-cta::after {
  content: '';
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background: linear-gradient(100deg,
    transparent 38%,
    color-mix(in srgb, var(--erp-cyan) 60%, transparent) 46%,
    rgba(255, 255, 255, .82) 50%,
    color-mix(in srgb, var(--erp-green) 60%, transparent) 54%,
    transparent 62%);
  background-size: 220% 100%;
  background-repeat: no-repeat;
  mix-blend-mode: screen;
  animation: cta-shine 4.5s linear infinite;
}
@keyframes cta-shine {
  from { background-position: 150% 0; }
  to   { background-position: -70% 0; }
}
/* On hover the highlight takes the WHOLE button: an ERP colour ramp that
   flows edge to edge across the entire surface (not just the passing
   band), fading in on hover and out when the pointer leaves. Lives on
   ::before, under the label, so the text stays readable over it. */
.nav button.nav-cta::before {
  content: '';
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background: linear-gradient(100deg,
    color-mix(in srgb, var(--erp-blue)   70%, transparent),
    color-mix(in srgb, var(--erp-cyan)   70%, transparent),
    color-mix(in srgb, var(--erp-green)  70%, transparent),
    color-mix(in srgb, var(--erp-indigo) 70%, transparent),
    color-mix(in srgb, var(--erp-blue)   70%, transparent));
  background-size: 300% 100%;
  mix-blend-mode: screen;
  opacity: 0;
  transition: opacity .22s ease;
  animation: cta-flow 3s linear infinite;
}
.nav button.nav-cta:hover::before { opacity: .6; }
@keyframes cta-flow {
  from { background-position: 0 0; }
  to   { background-position: 300% 0; }
}
@media (prefers-reduced-motion: reduce) {
  .nav button.nav-cta,
  .nav button.nav-cta::after,
  .nav button.nav-cta::before { animation: none; }
  .nav button.nav-cta::after { opacity: 0; }
}

/* Running border on New Form (the left-menu button): on hover a bright arc
   travels around its edge on a loop. A conic gradient clipped to a thin
   ring by the mask; its start angle (--run-a) is animated so the lit arc
   chases the border. */
@property --run-a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
.nav button.nav-cta .nav-run {
  position: absolute; inset: 0; z-index: 4;
  border-radius: inherit;
  padding: 1.8px;
  pointer-events: none;
  opacity: 0;
  transition: opacity .2s ease;
  background: conic-gradient(from var(--run-a),
    transparent 0deg, transparent 36deg,
    color-mix(in srgb, var(--erp-cyan) 70%, transparent) 80deg,
    #ffffff 200deg,
    color-mix(in srgb, var(--erp-green) 70%, transparent) 320deg,
    transparent 360deg);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
          mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
          mask-composite: exclude;
}
.nav button.nav-cta:hover .nav-run { opacity: 1; animation: nav-run 1.1s linear infinite; }
@keyframes nav-run { to { --run-a: 360deg; } }
@media (prefers-reduced-motion: reduce) {
  .nav button.nav-cta:hover .nav-run { animation: none; opacity: 0; }
}

.nav button.active .ico { opacity: 1; }

.sidebar-foot { margin-top: auto; padding: 10px 14px 12px; border-top: 1px solid var(--hairline-soft); }

/* ---- One button for appearance, language and sync ----
   Collapsed by default: a single settings button carrying a live sync
   dot, so status is visible without opening anything. Click and the panel
   slides open (visionOS ease); click again and it folds away. */
.foot-toggle {
  display: flex; align-items: center; gap: 10px;
  width: 100%;
  padding: 10px 12px;
  background: var(--glass-sunken);
  border: 1px solid var(--hairline-soft);
  border-radius: var(--radius-ctl);
  color: var(--text-dim);
  cursor: pointer;
  font-size: 13.5px; font-weight: 500;
  transition: background .18s ease, border-color .18s ease, color .18s ease;
}
.foot-toggle:hover { background: var(--glass-hover); border-color: var(--edge-quiet); color: var(--text); }
.ft-ico { font-size: 15px; line-height: 1; }
.ft-label { flex: 1; text-align: left; white-space: nowrap; }
.ft-sync {
  width: 9px; height: 9px; border-radius: 50%;
  flex: 0 0 auto;
  background: var(--text-faint);
}
.ft-sync.is-live { background: var(--pass-fill); box-shadow: 0 0 0 3px color-mix(in srgb, var(--pass-fill) 22%, transparent); }
.ft-sync.is-unsent { background: var(--accent-yellow); animation: field-alarm 1.4s ease-in-out infinite; }
.ft-sync.is-error { background: var(--fail-fill); }
.ft-sync.is-connecting { background: var(--accent-blue); animation: field-alarm 1.4s ease-in-out infinite; }
.ft-caret { font-size: 13px; transition: transform .26s ease; opacity: .7; }
.foot-toggle[aria-expanded="true"] .ft-caret { transform: rotate(180deg); }

.foot-panel {
  overflow: hidden;
  max-height: 0;
  opacity: 0;
  transition: max-height .3s cubic-bezier(.4,.14,.3,1), opacity .24s ease, margin-top .3s ease;
}
.foot-panel.open { max-height: 340px; opacity: 1; margin-top: 9px; }
.foot-panel-inner { padding-top: 2px; }
.foot-panel .cloud-badge { margin-bottom: 0; }

/* ---------------- Home menu ----------------
   The mark in the middle, one card per section. Cards rest calm and, on
   hover, lift with visionOS depth and extend a small preview of what is
   inside. The home menu is its own full screen — the sidebar and mobile
   bar are hidden, and the block is centred on the page. */
:root.view-home .sidebar,
:root.view-home .mobile-bar { display: none !important; }
:root.view-home .main { max-width: none; padding: 0; display: flex; }
:root.view-home .app { gap: 0; }
.home {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 26px;
  width: 100%;
  max-width: 1040px;
  margin: 0 auto;
  min-height: calc((100vh / var(--ui-scale)) - 40px);
  padding: 30px 24px;
}
.home-hero { display: flex; flex-direction: column; align-items: center; gap: 13px; text-align: center; }
.home-logo { width: 104px; height: 104px; border-radius: 28px; font-size: 40px; }
.home-wordmark { font-size: 28px; }
.home-tag { font-size: 14px; color: var(--text-dim); }

.home-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 18px;
  width: 100%;
}

/* ---- New Form: the hero (number one) ---- */
.home-primary {
  position: relative;
  width: 100%;
  border-radius: 24px;
  padding: 24px 26px;
  overflow: hidden;
  isolation: isolate;
  background: linear-gradient(135deg,
    color-mix(in srgb, var(--erp-blue) 24%, var(--glass)),
    color-mix(in srgb, var(--erp-indigo) 15%, var(--glass)));
  border: 1.5px solid color-mix(in srgb, var(--erp-cyan) 42%, var(--edge));
  box-shadow: var(--lift-2), 0 0 34px -8px color-mix(in srgb, var(--erp-cyan) 45%, transparent), var(--specular);
}
.hp-shine {
  position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background: linear-gradient(100deg, transparent 40%,
    color-mix(in srgb, var(--erp-cyan) 24%, transparent) 48%,
    rgba(255, 255, 255, .3) 50%,
    color-mix(in srgb, var(--erp-green) 24%, transparent) 52%, transparent 60%);
  background-size: 220% 100%; mix-blend-mode: screen;
  animation: cta-shine 5s linear infinite;
}
.hp-deco { position: absolute; right: -20px; bottom: -34px; z-index: 0; color: var(--erp-indigo); opacity: .12; pointer-events: none; }
.home-primary:hover .hp-deco { animation: t-create 1.6s ease-in-out infinite; }

/* Running border: on hover a bright arc travels around the pill's edge on
   a loop. The conic gradient is clipped to a thin ring by the mask, and

@property --pill-a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
.hp-pill::before {
  content: '';
  position: absolute; inset: 0;
  border-radius: inherit;
  padding: 1.7px;
  background: conic-gradient(from var(--pill-a),
    transparent 0deg, transparent 250deg,
    color-mix(in srgb, var(--accent) 65%, transparent) 298deg,

    transparent 360deg);

          mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);

/* ---- Secondary sections: smaller, quieter than the hero ---- */
.home-sec { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; width: 100%; }
.sec-card { padding: 15px 16px; }
.sec-card .hc-icon { width: 40px; height: 40px; }
.sec-card .hc-title { font-size: 14.5px; }
.sec-card .hc-sub { font-size: 11.5px; }
.sec-card .hc-deco { bottom: -8px; right: -4px; }
/* Bottom-row popups open UPWARD so they never fall off the page. */
.sec-card .hc-pop { top: auto; bottom: calc(100% - 12px); padding-top: 0; padding-bottom: 12px; transform-origin: bottom center; }
@media (max-width: 720px) { .home-sec { grid-template-columns: repeat(2, 1fr); } }
.home-card {
  position: relative;
  text-align: left;
  padding: 22px;
  border-radius: 20px;
  background: var(--glass);
  border: 1px solid var(--edge);
  box-shadow: var(--lift-1), var(--specular);
  color: var(--text);
  cursor: pointer;
  overflow: visible;
  /* Longer transition so the auto-swap crossfade reads as the highlight
     sliding from one card to the next (real hover feels the same). */
  transition: transform .5s cubic-bezier(.34,1.1,.4,1), box-shadow .5s ease, border-color .45s ease;
}
.home-card:hover { z-index: 5; }
.home-card:hover {
  transform: translateY(-5px) scale(1.02);
  box-shadow: var(--lift-2), 0 0 0 1px color-mix(in srgb, var(--accent, var(--erp-indigo)) 30%, transparent), var(--specular);
  border-color: color-mix(in srgb, var(--accent, var(--erp-indigo)) 45%, var(--edge));
}
.home-card:focus-visible { outline: 2.5px solid var(--accent, var(--erp-indigo)); outline-offset: 2px; }
.hc-top { display: flex; align-items: center; gap: 14px; }
.hc-icon {
  width: 48px; height: 48px; flex: 0 0 auto;
  display: grid; place-items: center;
  border-radius: 14px;
  background: color-mix(in srgb, var(--accent, var(--erp-indigo)) 16%, transparent);
  color: var(--accent, var(--erp-indigo));
}
.hc-icon { position: relative; }
.hc-titles { flex: 1; min-width: 0; }
.hc-title { font-weight: 650; font-size: 17.5px; }
.hc-sub { font-size: 13px; color: var(--text-dim); margin-top: 2px; }
.hc-arrow { color: var(--text-faint); font-size: 20px; flex: 0 0 auto; transition: transform .25s ease, color .25s ease; }
.home-card:hover .hc-arrow { transform: translateX(3px); color: var(--accent, var(--erp-indigo)); }
/* ---- The extend, now a popup with a small visualization ----
   Hidden until hover, then it pops out just below the card as a floating
   frosted panel and shows a tiny, live picture of what is inside. */
.hc-pop {
  position: absolute;
  left: 10px; right: 10px;
  top: calc(100% - 12px);
  z-index: 20;
  padding-top: 12px;
  opacity: 0;
  transform: translateY(-8px) scale(.97);

}
.home-card:hover .hc-pop { opacity: 1; transform: translateY(0) scale(1); }
.hc-pop-inner {
  /* Fully opaque: the drawer glass stacked over the solid environment
     colour. A translucent pane here let the card underneath bleed
     through the popup and made both unreadable. */
  background: linear-gradient(var(--glass-drawer), var(--glass-drawer)), var(--env-2);
  border: 1px solid var(--edge);
  border-radius: 16px;
  box-shadow: var(--lift-3, var(--lift-2)), var(--specular);

}
.viz-head { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 9px; }

.viz-bars { display: flex; flex-direction: column; gap: 7px; }
.viz-row { display: flex; align-items: center; gap: 8px; }
.viz-lab { flex: 0 0 44px; font-size: 11px; font-weight: 700; color: var(--text-dim); }
.viz-track { flex: 1; height: 8px; border-radius: 999px; background: color-mix(in srgb, var(--text-faint) 24%, transparent); overflow: hidden; }
.viz-fill { display: block; height: 100%; border-radius: 999px; transform-origin: left center; }
.home-card:hover .viz-fill { animation: viz-grow .55s cubic-bezier(.3,1,.4,1) both; }
@keyframes viz-grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.viz-val { flex: 0 0 auto; font-size: 11px; font-weight: 700; color: var(--text); min-width: 15px; text-align: right; }

.viz-check { width: 15px; height: 15px; border-radius: 5px; border: 2px solid var(--accent, var(--erp-indigo)); flex: 0 0 auto; position: relative; }
.viz-check::after { content: ''; position: absolute; left: 3.5px; top: 0; width: 4px; height: 8px; border: solid var(--accent, var(--erp-indigo)); border-width: 0 2px 2px 0; transform: rotate(45deg); }

.viz-form-code {

}

.viz-pbar {
  --bar: var(--erp-indigo);

  transform-origin: bottom center;

/* The running gradient — a bright band travels up the bar forever. */
.viz-pbar::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg,
    transparent 0 6%,
    rgba(255, 255, 255, .6) 12%,

@keyframes t-create { 0% { transform: rotate(0) scale(1); } 45% { transform: rotate(90deg) scale(1.14); } 100% { transform: rotate(0) scale(1); } }

/* A big faint copy of the card's own icon fades in behind the content on
   hover and drifts to its topic — a gear turns, data rises, a download

.hc-top { position: relative; z-index: 1; }

.home-card.t-records:hover  .hc-deco { animation: t-flip 1.8s ease-in-out infinite; }
.home-card.t-machines:hover .hc-deco { animation: t-machine .7s ease-in-out infinite; }
.home-card.t-dashboard:hover .hc-deco { animation: t-rise 1.8s ease-in-out infinite; }
.home-card.t-data:hover     .hc-deco { animation: t-save 1.6s ease-in-out infinite; }

.home-card.t-data.is-demo     .hc-icon { animation: t-save 1s ease-in-out infinite; }
.home-card.t-newform.is-demo  .hc-deco { animation: t-create 1.6s ease-in-out infinite; }
.home-card.t-records.is-demo  .hc-deco { animation: t-flip 1.8s ease-in-out infinite; }
.home-card.t-machines.is-demo .hc-deco { animation: t-machine .7s ease-in-out infinite; }
.home-card.t-dashboard.is-demo .hc-deco { animation: t-rise 1.8s ease-in-out infinite; }

@media (prefers-reduced-motion: reduce) {

/* ---------------- Screen transitions ----------------
   Changing menu slides the content across like a sheet being pinned to
   a drafting table: the old page drifts out with a slight fade, the new
   one wipes in from a clipped edge, direction-aware (forward through
   the menu = left, back = right). Works from the home menu to any page
   and back, because the name lives on #main, which every view shares.
   Uses the View Transitions API; browsers without it get a plain enter
   animation via .enter-fwd/.enter-back. A cyan scan line sweeps the
   viewport on every change (see .page-scan). */
.main { view-transition-name: screen; }

/* Keep the rest of the page (sidebar, background) rock-still during the
   transition — only the content pane moves. Also prevents any flash from
   the root snapshot. */
::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }

@media (prefers-reduced-motion: no-preference) {
  ::view-transition-old(screen),
  ::view-transition-new(screen) {
    animation-duration: .44s;
    animation-timing-function: cubic-bezier(.35, 0, .15, 1);
    /* Promote the snapshots to their own compositor layers up front so
       the first animation frame doesn't pay a layerization stall. */
    will-change: transform, opacity, filter;
    backface-visibility: hidden;
  }
  html.vt-forward::view-transition-old(screen) { animation-name: pg-out-l; }
  html.vt-forward::view-transition-new(screen) { animation-name: pg-in-r; }
  html.vt-back::view-transition-old(screen)    { animation-name: pg-out-r; }
  html.vt-back::view-transition-new(screen)    { animation-name: pg-in-l; }
}
@keyframes pg-out-l { to { opacity: 0; transform: translateX(-24px) scale(.992); filter: brightness(1.12); } }
@keyframes pg-out-r { to { opacity: 0; transform: translateX(24px)  scale(.992); filter: brightness(1.12); } }
@keyframes pg-in-r {
  from { opacity: 0; transform: translateX(28px) scale(.995); clip-path: inset(0 0 0 55%); filter: brightness(1.2); }
  60%  { clip-path: inset(0); }
  to   { opacity: 1; transform: none; clip-path: inset(0); filter: none; }
}
@keyframes pg-in-l {
  from { opacity: 0; transform: translateX(-28px) scale(.995); clip-path: inset(0 55% 0 0); filter: brightness(1.2); }
  60%  { clip-path: inset(0); }
  to   { opacity: 1; transform: none; clip-path: inset(0); filter: none; }
}

/* ---- The chosen motion system ----
   WARP ZOOM  (home ↔ any page): fly through the old screen — it blows
     up past the camera while the new one races up from a point — plus
     the energy ring from the click.
   TILT DROP  (menu, moving DOWN the list): the new page falls in from
     above with a small tilt and settles level.
   ORBIT SWING (menu, moving UP the list): the new page swings in along
     an arc, like a sheet on a pivot.
   (Scan Wipe stays for detail pages opened from the content area, and
   Glitch Step runs on theme changes — defined further below.)
   Filters stay small on purpose: big blurs on full-screen snapshots are
   what make phones drop frames. */
@media (prefers-reduced-motion: no-preference) {
  html.vt-warp::view-transition-old(screen) { animation-name: warp-out; animation-duration: .4s; animation-timing-function: cubic-bezier(.5,0,.9,.4); }
  html.vt-warp::view-transition-new(screen) { animation-name: warp-in;  animation-duration: .55s; animation-timing-function: cubic-bezier(.1,.6,.2,1); }
  html.vt-down::view-transition-old(screen) { animation-name: tilt-out; }
  html.vt-down::view-transition-new(screen) { animation-name: tilt-in; animation-duration: .55s; animation-timing-function: cubic-bezier(.3,1.3,.4,1); }
  html.vt-up::view-transition-old(screen)   { animation-name: orbit-out; }
  html.vt-up::view-transition-new(screen)   { animation-name: orbit-in; animation-duration: .55s; animation-timing-function: cubic-bezier(.25,1,.35,1); }
}
@keyframes warp-out {
  to { opacity: 0; transform: scale(1.55); filter: blur(5px) brightness(1.35); }
}
@keyframes warp-in {
  from { opacity: 0; transform: scale(.62); filter: blur(5px) brightness(1.2); }
  60%  { opacity: 1; }
  to   { opacity: 1; transform: none; filter: none; }
}
@keyframes tilt-out {
  to { opacity: 0; transform: translateY(34px) rotate(1.2deg); }
}
@keyframes tilt-in {
  from { opacity: 0; transform: translateY(-64px) rotate(-2.4deg); }
  to   { opacity: 1; transform: none; }
}
@keyframes orbit-out {
  to { opacity: 0; transform: rotate(-4deg) translateX(-56px) scale(.96); }
}
@keyframes orbit-in {
  from { opacity: 0; transform: rotate(5deg) translateX(62px) scale(.94); }
  60%  { opacity: 1; }
  to   { opacity: 1; transform: none; }
}
/* Fallback enter animations for browsers without the API. */
.main.enter-warp { animation: warp-in .55s cubic-bezier(.1,.6,.2,1) both; }
.main.enter-down { animation: tilt-in .55s cubic-bezier(.3,1.3,.4,1) both; }
.main.enter-up   { animation: orbit-in .55s cubic-bezier(.25,1,.35,1) both; }

/* ---- Touch devices: lighter, blur-free transitions ----
   A full-screen blur() on a View Transition snapshot is one of the most
   expensive things a phone GPU can do — it is what made page changes
   stall for a beat. On touch devices the transitions keep their motion
   (scale, slide, fade) but drop every blur, and run a touch shorter.
   Redefining the keyframes here overrides the desktop ones for coarse
   pointers only; desktop is untouched. */
@media (pointer: coarse) and (prefers-reduced-motion: no-preference) {
  ::view-transition-old(screen), ::view-transition-new(screen) { animation-duration: .34s; }
  html.vt-warp::view-transition-old(screen) { animation-duration: .3s; }
  html.vt-warp::view-transition-new(screen) { animation-duration: .38s; }
  html.vt-down::view-transition-new(screen),
  html.vt-up::view-transition-new(screen)   { animation-duration: .4s; }

  @keyframes warp-out { to { opacity: 0; transform: scale(1.4); } }
  @keyframes warp-in  { from { opacity: 0; transform: scale(.7); } 60% { opacity: 1; } to { opacity: 1; transform: none; } }
  /* the scan-wipe / slide pair, minus their brightness/clip work */
  @keyframes pg-in-r { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
  @keyframes pg-in-l { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }
  @keyframes pg-out-l { to { opacity: 0; transform: translateX(-18px); } }
  @keyframes pg-out-r { to { opacity: 0; transform: translateX(18px); } }
}

/* ---- Glitch Step on theme change ----
   Switching Light/Dark/Auto jump-cuts between the two looks with a
   stepped engineer's glitch. It animates the ROOT pair (the whole page
   recolours), so the screen pair is silenced for this one. */
@media (prefers-reduced-motion: no-preference) {
  html.vt-glitch::view-transition-old(root) { animation: th-glout .28s steps(3, end) both; }
  html.vt-glitch::view-transition-new(root) { animation: th-glin .42s steps(5, end) both; }
  html.vt-glitch::view-transition-old(screen),
  html.vt-glitch::view-transition-new(screen) { animation: none; }
}
@keyframes th-glout {
  0%   { opacity: 1; }
  40%  { opacity: .7; transform: translateX(-7px) skewX(-1.5deg); filter: hue-rotate(18deg) brightness(1.2); }
  100% { opacity: 0; transform: translateX(8px); filter: brightness(1.6); }
}
@keyframes th-glin {
  0%   { opacity: 0; transform: translateX(10px); clip-path: inset(0 0 60% 0); filter: brightness(1.4); }
  30%  { opacity: 1; transform: translateX(-6px); clip-path: inset(26% 0 12% 0); }
  60%  { transform: translateX(3px); clip-path: inset(0); filter: brightness(1.1); }
  100% { opacity: 1; transform: none; clip-path: inset(0); filter: none; }
}

/* The energy ring: two concentric pulses that explode outward from the
   click point when leaving or entering home. Pure light — no layout. */
.warp-ring { position: fixed; z-index: 85; pointer-events: none; }
.warp-ring i {
  position: absolute; left: 0; top: 0; width: 44px; height: 44px;
  margin: -22px 0 0 -22px; border-radius: 50%;
  will-change: transform, opacity;
  border: 2px solid color-mix(in srgb, var(--accent-blue) 80%, #fff);
  box-shadow:
    0 0 24px 2px color-mix(in srgb, var(--accent-blue) 60%, transparent),
    inset 0 0 14px color-mix(in srgb, var(--accent-blue) 45%, transparent);
  opacity: 0;
}
.warp-ring i:nth-child(2) {
  border-width: 1px;
  border-color: color-mix(in srgb, var(--erp-cyan, #00eaff) 85%, #fff);
  box-shadow: 0 0 18px 1px color-mix(in srgb, var(--erp-cyan, #00eaff) 55%, transparent);
}
.warp-ring.go i           { animation: ring-burst .6s cubic-bezier(.2,.65,.25,1) both; }
.warp-ring.go i:nth-child(2) { animation-duration: .75s; animation-delay: .08s; }
@keyframes ring-burst {
  0%   { opacity: .95; transform: scale(.15); }
  100% { opacity: 0;   transform: scale(14); }
}
@media (prefers-reduced-motion: reduce) {
  .warp-ring { display: none; }
  .main.enter-launch, .main.enter-return { animation: none; }
}
/* Fallback for browsers without the View Transitions API. */
.main.enter-fwd  { animation: pg-in-r .44s cubic-bezier(.35,0,.15,1) both; }
.main.enter-back { animation: pg-in-l .44s cubic-bezier(.35,0,.15,1) both; }

/* The scan line: a thin lit edge that sweeps left-to-right on every menu
   change — the instrument touch. It starts at the CONTENT pane's left
   edge (--scan-from, set in JS from #main's position), so it never
   crosses the sidebar; z-index 55 keeps it under the mobile drawer (60)
   and mobile bar (65) as well. */
.page-scan {
  position: fixed; top: 0; bottom: 0; left: 0; width: 2px;
  z-index: 55; pointer-events: none; opacity: 0;
  background: linear-gradient(180deg, transparent, var(--accent-blue), transparent);
  box-shadow: 0 0 16px 1px color-mix(in srgb, var(--accent-blue) 55%, transparent);
  /* Animate transform, never `left`: left relayouts the page every
     frame, transform rides the compositor at a clean 60/120fps. */
  transform: translateX(var(--scan-from, 0px));
  will-change: transform, opacity;
}
.page-scan.go { animation: page-scan .5s cubic-bezier(.3,0,.2,1); }
@keyframes page-scan {
  0%   { transform: translateX(var(--scan-from, 0px)); opacity: .9; }
  100% { transform: translateX(100vw); opacity: .9; }
}

@media (prefers-reduced-motion: reduce) {
  .page-scan { display: none; }
  .main.enter-fwd, .main.enter-back { animation: none; }
}

.seg-label {
  font-size: 11px;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--text-faint);
  margin: 2px 0 5px 3px;
  font-weight: 600;
}

/* Segmented control — the visionOS pill */
.seg {
  display: flex;
  gap: 3px;
  padding: 3px;
  margin-bottom: 9px;
  background: var(--glass-sunken);
  border: 1px solid var(--hairline-soft);
  border-radius: var(--radius-ctl);
}
.seg button {
  flex: 1 1 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 7px 3px;
  background: transparent;
  border: none;
  border-radius: 10px;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 11.5px;
  font-weight: 500;
  transition: background .16s ease, color .16s ease, box-shadow .16s ease;
  min-width: 0;
}
.seg button:hover { color: var(--text); background: var(--glass-hover); }
.seg button.active {
  background: var(--glass-raised);
  color: var(--text);
  font-weight: 600;
  box-shadow: var(--lift-1), var(--specular);
}
.seg-icon { font-size: 13px; line-height: 1; }
.seg-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.foot-note { font-size: 11px; color: var(--text-dim); line-height: 1.5; margin-top: 2px; }
.foot-note span { opacity: .75; }

.main { flex: 1; min-width: 0; padding: 8px 10px 90px; max-width: 1180px; }

/* ---------------- Headings ---------------- */

.page-head {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 20px; flex-wrap: wrap;
  margin: 10px 4px 24px;
}
.page-title {
  font-size: 30px;
  font-weight: 600;
  letter-spacing: -.028em;
  margin: 0;
  line-height: 1.15;
}
.page-sub { color: var(--text-dim); font-size: 14.5px; line-height: 1.55; margin-top: 7px; max-width: 68ch; }

.label-en { display: block; }
.label-th { display: block; font-size: 13.5px; color: var(--text-dim); line-height: 1.45; }
body.lang-en .label-th { display: none; }
body.lang-th .label-en { display: none; }
body.lang-th .label-th { font-size: inherit; color: inherit; line-height: inherit; }

/* ---------------- Buttons ---------------- */

.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 10px 17px;
  border-radius: var(--radius-ctl);
  border: 1px solid var(--edge);
  background: var(--glass-raised);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  color: var(--text);
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
  box-shadow: var(--lift-1), var(--specular);
  transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
}
.btn:hover { background: var(--glass-hover); transform: translateY(-1px); box-shadow: var(--lift-2), var(--specular); }
.btn:active { transform: translateY(0) scale(.985); }

.btn-primary {
  background: var(--accent-blue);
  border-color: transparent;
  color: #fff;
  font-weight: 600;
  box-shadow: 0 6px 18px rgba(10, 132, 255, .36), inset 0 1px 0 rgba(255,255,255,.28);
}
.btn-primary:hover { background: #0a84ff; filter: brightness(1.08); }

.btn-danger { color: var(--fail); border-color: color-mix(in srgb, var(--fail) 32%, transparent); }
.btn-danger:hover { background: color-mix(in srgb, var(--fail) 12%, var(--glass-hover)); }

.btn-sm { padding: 7px 13px; font-size: 13px; border-radius: 10px; }
.btn-row { display: flex; gap: 9px; flex-wrap: wrap; }

/* ---------------- Cards & stats ---------------- */

.card {
  background: var(--glass);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border: 1px solid var(--edge);
  border-radius: var(--radius-card);
  padding: 20px;
  box-shadow: var(--lift-1), var(--specular);
}

.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(172px, 1fr));
  gap: 14px;
  margin-bottom: 26px;
}
.stat {
  position: relative;
  overflow: hidden;
  background: var(--glass);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border: 1px solid var(--edge);
  border-radius: var(--radius-card);
  padding: 17px 18px;
  box-shadow: var(--lift-1), var(--specular);
}
/* The accent reads as light spilling in from the left edge */
.stat::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--stat-accent, var(--accent-blue));
}
.stat-value {
  font-size: 32px;
  font-weight: 600;
  line-height: 1.05;
  letter-spacing: -.03em;
  font-variant-numeric: tabular-nums;
}
.stat-label { font-size: 13.5px; color: var(--text-dim); margin-top: 6px; line-height: 1.45; }

/* ---------------- Icon motion ----------------
   Three states, deliberately different in character:

     idle   a slow, small loop — this sits on screen all day, so it
            has to be noticeable once and invisible afterwards
     hover  a livelier, purposeful move that says what the icon does
     press  a quick physical recoil

   Idle loops run only where an icon is a destination the eye rests on
   (the menu, the form cards, the toolbar). Icons inside table rows
   stay still — a list of forty animating badges is a mess, and a cost. */

.ico > * {
  transform-box: fill-box;
  transform-origin: 50% 50%;
  transition: transform .32s cubic-bezier(.22,1,.36,1), opacity .25s ease;
}

.nav .ico > *, .tc-icon .ico > *, .tb-ico .ico > * { will-change: transform; }

/* ---- idle ---- */

@keyframes ico-float   { 0%,100% { transform: translateY(0); }      50% { transform: translateY(-1.2px); } }
@keyframes ico-rock    { 0%,100% { transform: rotate(-7deg); }      50% { transform: rotate(7deg); } }
@keyframes ico-breathe { 0%,100% { transform: scale(1); }           50% { transform: scale(1.07); } }
@keyframes ico-dip     { 0%,70%,100% { transform: translateY(0); }  85% { transform: translateY(1.6px); } }
@keyframes ico-roll    { 0%,100% { transform: translateX(0); }      50% { transform: translateX(1.1px); } }
@keyframes ico-bar     { 0%,100% { transform: scaleY(1); }          50% { transform: scaleY(.72); } }
@keyframes ico-blink   { 0%,100% { opacity: 1; }                    50% { opacity: .35; } }

/* 01 Build — the top plate lifts off the stack */
.nav .ico[data-icon="build"] > :nth-child(1),
.tc-icon .ico[data-icon="build"] > :nth-child(1) { animation: ico-float 3.4s ease-in-out infinite; }

/* 02 FAT — the seal breathes */
.nav .ico[data-icon="pdi"] > :nth-child(1),
.tc-icon .ico[data-icon="pdi"] > :nth-child(1) { animation: ico-breathe 3.6s ease-in-out infinite; }

/* 03 SAT — the truck rolls a little */
.nav .ico[data-icon="delivery"] > *,
.tc-icon .ico[data-icon="delivery"] > * { animation: ico-roll 3.2s ease-in-out infinite; }

/* 04 Service — the wrench rocks like it is being turned */
.nav .ico[data-icon="service"] > :nth-child(1),
.tc-icon .ico[data-icon="service"] > :nth-child(1) { animation: ico-rock 3.8s ease-in-out infinite; transform-origin: 70% 30%; }

/* Menu glyphs */
.nav .ico[data-icon="dashboard"] > :nth-child(3) { animation: ico-bar 2.8s ease-in-out infinite;      transform-origin: 50% 100%; }
.nav .ico[data-icon="dashboard"] > :nth-child(4) { animation: ico-bar 2.8s ease-in-out .18s infinite; transform-origin: 50% 100%; }
.nav .ico[data-icon="dashboard"] > :nth-child(5) { animation: ico-bar 2.8s ease-in-out .36s infinite; transform-origin: 50% 100%; }
.nav .ico[data-icon="records"]   > :nth-child(3) { animation: ico-blink 3.4s ease-in-out infinite; }
.nav .ico[data-icon="newform"]   > :nth-child(1) { animation: ico-breathe 3.4s ease-in-out infinite; }
.nav .ico[data-icon="backup"]    > :nth-child(1),
.nav .ico[data-icon="backup"]    > :nth-child(2) { animation: ico-dip 3s ease-in-out infinite; }

/* The active menu item has arrived — it stops fidgeting */
.nav button.active .ico > * { animation: none !important; }

/* ---- hover: idle stands down, the glyph acts ---- */

.nav button:hover .ico > *,
.type-card:hover .tc-icon .ico > * { animation-play-state: paused; }

/* Build: the stack pulls apart into an exploded view */
.nav button:hover .ico[data-icon="build"] > :nth-child(1),
.type-card:hover .ico[data-icon="build"] > :nth-child(1) { transform: translateY(-2.6px); }
.nav button:hover .ico[data-icon="build"] > :nth-child(3),
.type-card:hover .ico[data-icon="build"] > :nth-child(3) { transform: translateY(1.8px); }

/* FAT: the tick redraws itself */
.ico[data-icon="pdi"] > :nth-child(2) { stroke-dasharray: 1; stroke-dashoffset: 0; }
@keyframes ico-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
.nav button:hover .ico[data-icon="pdi"] > :nth-child(2),
.type-card:hover .ico[data-icon="pdi"] > :nth-child(2) { animation: ico-draw .5s ease-out; }
.nav button:hover .ico[data-icon="pdi"] > :nth-child(1),
.type-card:hover .ico[data-icon="pdi"] > :nth-child(1) { transform: scale(1.1); }

/* SAT: it drives off */
.nav button:hover .ico[data-icon="delivery"] > *,
.type-card:hover .ico[data-icon="delivery"] > * { transform: translateX(2.2px); }

/* Service: a quarter turn, like tightening */
.nav button:hover .ico[data-icon="service"] > :nth-child(1),
.type-card:hover .ico[data-icon="service"] > :nth-child(1) { transform: rotate(-32deg); }

.nav button:hover .ico[data-icon="dashboard"] > :nth-child(3) { transform: scaleY(1.22); transform-origin: 50% 100%; }
.nav button:hover .ico[data-icon="dashboard"] > :nth-child(4) { transform: scaleY(1.15); transform-origin: 50% 100%; }
.nav button:hover .ico[data-icon="dashboard"] > :nth-child(5) { transform: scaleY(1.28); transform-origin: 50% 100%; }
.nav button:hover .ico[data-icon="newform"] > :nth-child(2)   { transform: rotate(90deg); }
.nav button:hover .ico[data-icon="records"] > :nth-child(3)   { opacity: 1; transform: translateX(1.2px); }
.nav button:hover .ico[data-icon="backup"]  > :nth-child(1),
.nav button:hover .ico[data-icon="backup"]  > :nth-child(2)   { transform: translateY(2.4px); }
.nav button:hover .ico[data-icon="machines"] > :nth-child(3)  { transform: translateY(-1.4px); }

/* ---- press: one quick recoil, same for every glyph ---- */

@keyframes ico-press { 0% { transform: scale(1); } 45% { transform: scale(.8); } 100% { transform: scale(1); } }

.nav button:active .ico > *,
.type-card:active .tc-icon .ico > * {
  animation: ico-press .26s cubic-bezier(.3,1.6,.5,1) !important;
}

/* ---------------- Completeness ----------------
   Red pulses only after Submit has been pressed — nagging someone
   about a field they have not reached yet is just noise. Green
   confirms the moment a required field is satisfied. */

@keyframes field-alarm {
  0%, 100% { border-color: var(--fail-fill); box-shadow: 0 0 0 0 color-mix(in srgb, var(--fail-fill) 42%, transparent); }
  50%      { border-color: var(--fail-fill); box-shadow: 0 0 0 5px color-mix(in srgb, var(--fail-fill) 4%, transparent); }
}

.field.is-missing input,
.field.is-missing select,
.field.is-missing textarea,
.field.is-missing .person-select {
  border-color: var(--fail-fill) !important;
  animation: field-alarm 1.15s ease-in-out infinite;
}
.field.is-missing > label { color: var(--fail); font-weight: 600; }

.field.is-ok input,
.field.is-ok select,
.field.is-ok textarea,
.field.is-ok .person-select {
  border-color: color-mix(in srgb, var(--pass-fill) 62%, transparent);
}

/* Unanswered check rows */
.check-row.is-missing {
  border-radius: 10px;
  padding-left: 10px;
  padding-right: 10px;
  animation: field-alarm 1.15s ease-in-out infinite;
  border: 1px solid var(--fail-fill);
}
.check-row.is-missing .check-code { color: var(--fail); font-weight: 700; }

/* Nothing chosen in the result block */
.result-row.is-missing {
  padding: 10px;
  border-radius: var(--radius-ctl);
  border: 1px solid var(--fail-fill);
  animation: field-alarm 1.15s ease-in-out infinite;
}

/* Signature still unnamed */
.sign-card.is-missing { border-color: var(--fail-fill); animation: field-alarm 1.15s ease-in-out infinite; }
.sign-card.is-ok { border-color: color-mix(in srgb, var(--pass-fill) 55%, transparent); }

/* ---------------- Person picker ---------------- */

.person-field { display: flex; flex-direction: column; gap: 5px; }
.person-select {
  width: 100%;
  padding: 10px 13px;
  background: var(--field);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-ctl);
  color: var(--text);
  outline: none;
  cursor: pointer;
}
.person-select:focus {
  background: var(--field-focus);
  border-color: var(--accent-blue);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent-blue) 20%, transparent);
}
.person-note {
  font-size: 12.5px;
  color: var(--accent-blue);
  font-weight: 600;
  padding-left: 3px;
}

/* ---------------- Cloud status ---------------- */

.cloud-badge {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
  padding: 8px 11px;
  font-size: 12px;
  border-radius: var(--radius-ctl);
  background: var(--glass-sunken);
  border: 1px solid var(--hairline-soft);
  color: var(--text-dim);
}
/* The full reason a save was refused, wrapped onto its own lines under
   the badge — legible on a tablet that has no tooltip. */
.cloud-err {
  flex: 1 0 100%;
  font-size: 11px;
  line-height: 1.35;
  color: var(--fail-fill);
  word-break: break-word;
}
.cloud-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex: 0 0 auto;
  background: var(--text-faint);
}
.cloud-badge.is-live  .cloud-dot { background: var(--pass-fill); box-shadow: 0 0 0 3px color-mix(in srgb, var(--pass-fill) 22%, transparent); }
.cloud-badge.is-signin .cloud-dot { background: var(--accent-yellow); }
.cloud-badge.is-error .cloud-dot { background: var(--fail-fill); }
/* Saved here but not confirmed uploaded — amber and pulsing so a
   technician notices it is still working, not done. */
.cloud-badge.is-unsent .cloud-dot { background: var(--accent-yellow); animation: field-alarm 1.4s ease-in-out infinite; }
.cloud-badge.is-unsent .cloud-err { color: var(--accent-yellow); }
.cloud-badge.is-connecting .cloud-dot { animation: field-alarm 1.4s ease-in-out infinite; background: var(--accent-blue); }
.cloud-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cloud-out {
  border: none;
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 13px;
  padding: 2px 4px;
  border-radius: 6px;
}
.cloud-out:hover { background: var(--glass-hover); color: var(--text); }

/* ---------------- Modal ---------------- */

.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 120;
  display: grid;
  place-items: center;
  padding: 20px;
  background: rgba(6, 10, 20, .5);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  opacity: 0;
  transition: opacity .22s ease;
  overflow-y: auto;
}
.modal-overlay.show { opacity: 1; }

.modal-card {
  width: 100%;
  max-width: 520px;
  padding: 28px 26px 22px;
  background: var(--glass-bar);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border: 1px solid var(--edge);
  border-radius: var(--radius-window);
  box-shadow: var(--lift-3), var(--specular);
  transform: translateY(14px) scale(.98);
  transition: transform .28s cubic-bezier(.22,1,.36,1);
  max-height: calc(92vh / var(--ui-scale));
  overflow-y: auto;
}
.modal-overlay.show .modal-card { transform: none; }

.modal-title { margin: 0 0 6px; font-size: 21px; font-weight: 650; letter-spacing: -.02em; text-align: center; }
.modal-note { margin: 0 0 20px; font-size: 14px; color: var(--text-dim); line-height: 1.6; text-align: center; }
.modal-body { display: flex; flex-direction: column; gap: 14px; }
.modal-foot { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; }
.modal-foot .btn { min-width: 96px; justify-content: center; }
.modal-error {
  background: color-mix(in srgb, var(--fail-fill) 14%, transparent);
  border: 1px solid color-mix(in srgb, var(--fail-fill) 40%, transparent);
  color: var(--fail);
  padding: 10px 13px;
  border-radius: var(--radius-ctl);
  font-size: 13.5px;
}

/* ---------------- Submitted ---------------- */

.submit-mark {
  width: 74px; height: 74px;
  margin: 0 auto 4px;
  border-radius: 50%;
  background: var(--pass-fill);
  display: grid; place-items: center;
  box-shadow: 0 10px 26px color-mix(in srgb, var(--pass-fill) 45%, transparent);
  animation: submit-pop .45s cubic-bezier(.2,1.5,.4,1);
}
@keyframes submit-pop { 0% { transform: scale(.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.submit-tick { color: #fff; font-size: 38px; font-weight: 700; line-height: 1; }

.submit-doc  { text-align: center; font-size: 20px; font-weight: 700; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.submit-form { text-align: center; font-size: 14px; color: var(--text-dim); margin-bottom: 6px; }

.submit-rows {
  display: flex; flex-direction: column; gap: 9px;
  padding: 16px 18px;
  background: var(--glass-sunken);
  border: 1px solid var(--hairline-soft);
  border-radius: var(--radius-ctl);
}
.submit-row { display: flex; justify-content: space-between; gap: 14px; font-size: 14.5px; }
.submit-key { color: var(--text-dim); }
.submit-val { font-weight: 650; text-align: right; }

.submit-shot {
  width: 100%;
  margin-top: 16px;
  border-radius: var(--radius-ctl);
  border: 1px solid var(--hairline);
  display: block;
  box-shadow: var(--lift-1);
}

/* ---------------- Filter bar ----------------
   Native selects: on a tablet the OS picker beats any custom
   dropdown for speed and for gloved thumbs. */

.filter-bar {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  align-items: flex-end;
  margin: 0 4px 20px;
  padding: 16px 18px;
  background: var(--glass);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border: 1px solid var(--edge);
  border-radius: var(--radius-card);
  box-shadow: var(--lift-1), var(--specular);
}
.filter-field { display: flex; flex-direction: column; gap: 6px; flex: 1 1 240px; min-width: 0; }
.filter-label { font-size: 12.5px; color: var(--text-dim); font-weight: 500; }
.filter-select {
  width: 100%;
  padding: 10px 13px;
  background: var(--field);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-ctl);
  color: var(--text);
  outline: none;
  cursor: pointer;
}
.filter-select:focus { background: var(--field-focus); border-color: var(--accent-blue);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent-blue) 20%, transparent); }

/* ---------------- Clickable counts ---------------- */

.count-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 6px 12px;
  border-radius: var(--radius-pill);
  border: 1px solid color-mix(in srgb, var(--series-2) 34%, transparent);
  background: color-mix(in srgb, var(--series-2) 13%, transparent);
  color: var(--series-2);
  font: inherit;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
  transition: background .16s ease, transform .16s ease;
}
.count-btn:hover { background: color-mix(in srgb, var(--series-2) 22%, transparent); transform: translateY(-1px); }
.count-btn:active { transform: scale(.95); }
.count-btn.is-open { background: var(--series-2); color: #fff; border-color: transparent; }
.count-num { font-size: 14.5px; }
.count-caret { font-size: 10px; opacity: .8; }

tr.detail-row > td { padding: 0 0 16px; background: var(--glass-sunken); }
