<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FN Machine Care — redirecting</title>
<script>
  /* Any unknown path under this site lands here. Send it to the app.
     Handles wrong case, missing trailing slash, and stale bookmarks. */
  (function () {
    var base = location.pathname.indexOf('/FN-Machine-Care') === 0 ? '/FN-Machine-Care/' : '/';
    if (location.pathname !== base) location.replace(base);
  })();
</script>
<style>
  body { margin:0; background:#0f1420; color:#e8edf7;
         font-family:"Segoe UI","Noto Sans Thai",system-ui,sans-serif;

  a { color:#2f81f7; }
  .box { padding:24px; }
  .logo { width:56px; height:56px; border-radius:14px; margin:0 auto 16px;
          background:linear-gradient(135deg,#2f81f7,#7c3aed); display:grid;
          place-items:center; font-weight:800; font-size:20px; color:#fff; }
</style>
</head>

  <div class="box">
